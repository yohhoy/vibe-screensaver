// ---- ユーティリティ ----
const { lerp, smoothstep } = THREE.MathUtils;
const ease = (t) => t * t * (3 - 2 * t);

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return [c, c.getContext('2d')];
}

function makeFilledCanvas(w, h, color) {
  const [c, ctx] = makeCanvas(w, h);
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, w, h);
  return [c, ctx];
}

// x = 0..w（step おき）の曲線をパスにする
function traceCurve(ctx, w, step, yAt) {
  ctx.beginPath();
  for (let x = 0; x <= w; x += step) {
    if (x === 0) ctx.moveTo(x, yAt(x)); else ctx.lineTo(x, yAt(x));
  }
}

// 位相を進めて、重み付きの波を足し合わせる（灯りの揺らぎ）。位相は 0..2π に収める
function advanceWave(phases, rates, weights, dt) {
  let wave = 0;
  phases.forEach((p, i) => {
    phases[i] = (p + dt * rates[i]) % TAU;
    wave += weights[i] * Math.sin(phases[i]);
  });
  return wave;
}

// 土壁を w×h（m）貼る UV。貼り始めの位置をランダムに選ぶ。uMax・vMax は貼り始めの上限
function earthUv(w, h, uMax = 1 - w / EARTH_TILE, vMax = 1 - h / EARTH_TILE) {
  const u = rand(0, uMax), v = rand(0, vMax);
  return [u, v, u + w / EARTH_TILE, v + h / EARTH_TILE];
}

// 面に古びを付ける（薄いしみと、上下の黄ばみ）。stain はしみの濃さの倍率、edge は上下の黄ばみを描くか（短い周期で繰り返す面では継ぎ目になるので描かない）
function ageSurface(ctx, w, h, amount = 1, { stain = 1, edge = true } = {}) {
  for (let i = 0; i < 16 * amount; i++) {
    const x = rand(0, w), y = rand(0, h), r = rand(0.03, 0.16) * w;
    const g = ctx.createRadialGradient(x, y, r * 0.2, x, y, r);
    g.addColorStop(0, `rgba(84,64,36,${rand(0.05, 0.16) * stain})`);
    g.addColorStop(0.8, `rgba(84,64,36,${rand(0.02, 0.05) * stain})`);
    g.addColorStop(1, 'rgba(84,64,36,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  if (!edge) return;
  const yellowing = ctx.createLinearGradient(0, 0, 0, h);
  yellowing.addColorStop(0, 'rgba(70,55,30,0.14)');
  yellowing.addColorStop(0.45, 'rgba(70,55,30,0)');
  yellowing.addColorStop(1, 'rgba(60,48,30,0.2)');
  ctx.fillStyle = yellowing;
  ctx.fillRect(0, 0, w, h);
}

renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.Fog(CORRIDOR_FOG_COLOR, 1e3, 1e4);   // 廊下の奥の暗がり。距離は updateFog で変える（部屋にいるあいだは届かない距離に置く）
const camera = new THREE.PerspectiveCamera(V_FOV, innerWidth / innerHeight, 0.05, 30);
camera.rotation.order = 'YXZ';

// 周辺減光。カメラの前に四隅ほど濃い黒の板を置く
// テクスチャの不透明度には中心からの距離（四隅で 1）を入れる。濃さは材質の不透明度、暗い範囲は vignetteEdges で決める
const vignetteEdges = new THREE.Vector2(...VIGNETTE_EDGES);
function makeVignette() {
  const [c, ctx] = makeCanvas(256, 256);
  const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128 * Math.SQRT2);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,1)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 256);
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthTest: false, depthWrite: false }),
  );
  mesh.material.onBeforeCompile = (shader) => {
    shader.uniforms.uVignetteEdges = { value: vignetteEdges };
    shader.fragmentShader = 'uniform vec2 uVignetteEdges;\n' + shader.fragmentShader.replace('#include <opaque_fragment>',
      'diffuseColor.a = opacity * smoothstep(uVignetteEdges.x, uVignetteEdges.y, sampledDiffuseColor.a);\n#include <opaque_fragment>');
  };
  mesh.renderOrder = 1000;
  mesh.position.z = -VIGNETTE_DIST;
  return mesh;
}
const vignette = makeVignette();
camera.add(vignette);
scene.add(camera);

// 縦長の画面では縦の画角を広げ、横の見え幅を確保する
function fitCamera() {
  const aspect = innerWidth / innerHeight;
  const minV = THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(MIN_H_FOV / 2)) / aspect));
  camera.aspect = aspect;
  camera.fov = Math.max(V_FOV, minV);
  camera.updateProjectionMatrix();
  const height = 2 * VIGNETTE_DIST * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  vignette.scale.set(height * aspect, height, 1);
}
fitCamera();

// 全画面の描画先の色の形式は compactHdrFormat（common.js）で選ぶ。不透明度は使わない
// マルチサンプルにするのはシーンを描く描画先だけ
const sceneSamples = renderer.getPixelRatio() < MSAA_OFF_PIXEL_RATIO ? MSAA_SAMPLES : 0;
const sceneTarget = new THREE.WebGLRenderTarget(1, 1,
  { type: THREE.HalfFloatType, ...compactHdrFormat(renderer, sceneSamples), samples: sceneSamples });
function updateSceneTargetSize() {
  const pr = renderer.getPixelRatio();
  sceneTarget.setSize(Math.round(innerWidth * pr), Math.round(innerHeight * pr));
}
updateSceneTargetSize();

const composer = new EffectComposer(renderer,
  new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, ...compactHdrFormat(renderer), depthBuffer: false }));
composer.setPixelRatio(renderer.getPixelRatio());
composer.setSize(innerWidth, innerHeight);
composer.addPass(new TexturePass(sceneTarget.texture));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), BLOOM_STRENGTH, BLOOM_RADIUS, BLOOM_THRESHOLD);
// composer が渡す大きさより粗く描く
const setBloomSize = bloom.setSize.bind(bloom);
bloom.setSize = (width, height) => setBloomSize(width * BLOOM_SCALE, height * BLOOM_SCALE);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---- テクスチャ ----
const anisotropy = Math.min(MAX_ANISOTROPY, renderer.capabilities.getMaxAnisotropy());

function toTexture(canvas, repeat = true) {
  const t = new THREE.CanvasTexture(canvas);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = anisotropy;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

// 畳表。イ草の茎（縦方向）の上に、経糸（横方向）の細い線を重ねる
function makeTatamiTexture() {
  const [w, h] = IS_TOUCH ? [1024, 512] : [2048, 1024];
  const [c, ctx] = makeCanvas(w, h);
  const stalkW = w / TATAMI_STALKS;
  for (let i = 0; i <= TATAMI_STALKS; i++) {
    const v = 0.85 * rand(0.86, 1.1) * (Math.random() < 0.07 ? 0.76 : 1);   // ときどき濃い茎が混じる
    const hue = rand(-1, 1);                                                // 正で緑寄り、負で赤寄り
    ctx.fillStyle = `rgb(${166 * v},${(164 + hue * 6) * v},${(94 - hue * 7) * v})`;
    ctx.fillRect(i * stalkW, 0, stalkW + 1, h);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.14)';
  for (let j = 0; j < TATAMI_ROWS; j++) ctx.fillRect(0, j * h / TATAMI_ROWS, w, 2);
  ageSurface(ctx, w, h, 0.12);   // 新しい畳なので、古びは少しだけ
  return toTexture(c);
}

// 砂粒のある土壁（むらは古びのしみで出す）。色は材質の色で付けるので、白に近く描く
function makeEarthTexture() {
  const [c, ctx] = makeFilledCanvas(1024, 1024, '#e4e0d8');
  for (let i = 0; i < 26000; i++) {
    const v = rand(70, 255);
    ctx.fillStyle = `rgba(${v},${v * 0.95},${v * 0.85},${rand(0.15, 0.45)})`;
    ctx.fillRect(rand(0, 1024), rand(0, 1024), rand(0.8, 2.4), rand(0.8, 2.4));
  }
  ageSurface(ctx, 1024, 1024, 1.2);
  return toTexture(c);
}

// 木目（横方向）のテクスチャ。左右につながるよう、揺れは幅で一周する波にする。age は古びの量（0 で付けない）
function makeGrainTexture(h, base, count, alphaRange, age = 0) {
  const w = 1024;
  const [c, ctx] = makeFilledCanvas(w, h, base);
  for (let i = 0; i < count; i++) {
    const y0 = rand(0, h), amp = rand(2, 14);
    const n = randInt(3) + 1, phase = rand(0, TAU);
    ctx.strokeStyle = `rgba(52,34,18,${rand(...alphaRange)})`;
    ctx.lineWidth = rand(0.6, 2.6);
    traceCurve(ctx, w, 16, (x) => y0 + amp * Math.sin(TAU * n * x / w + phase));
    ctx.stroke();
  }
  if (age > 0) ageSurface(ctx, w, h, age);
  return toTexture(c);
}

// 和紙の繊維と黄ばみ
function makeWashiTexture() {
  const [c, ctx] = makeFilledCanvas(512, 512, '#f2ece0');
  for (let i = 0; i < 420; i++) {
    const x = rand(0, 512), y = rand(0, 512), a = rand(0, TAU), len = rand(8, 46);
    ctx.strokeStyle = `rgba(150,130,100,${rand(0.05, 0.16)})`;
    ctx.lineWidth = rand(0.4, 1);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + rand(-14, 14), y + rand(-14, 14), x + Math.cos(a) * len, y + Math.sin(a) * len);
    ctx.stroke();
  }
  ageSurface(ctx, 512, 512, 0.2, { stain: 0.4, edge: false });
  return toTexture(c);
}

// 青海波を上の段から順に描く（下の段が上の段の下半分を隠す）。rings は輪の半径の割合
function drawSeigaiha(ctx, w, y0, rows, { r, paper, ink, width, rings }) {
  ctx.strokeStyle = ink;
  ctx.lineWidth = width;
  for (let row = 0; row < rows; row++) {
    const y = y0 + row * r * 0.5;
    for (let x = (row % 2) * r - r; x < w + r; x += r * 2) {
      ctx.fillStyle = paper;
      ctx.beginPath();
      ctx.arc(x, y, r, Math.PI, TAU);
      ctx.fill();
      for (const ring of rings) {
        ctx.beginPath();
        ctx.arc(x, y, r * ring, Math.PI, TAU);
        ctx.stroke();
      }
    }
  }
}

// 壺の絵付け。白地に淡い青で、下側に青海波（太い線がつぶれないよう、輪の間隔を広げる）、上部に 2 重線
function makePotTexture() {
  const w = 1024, h = 512;
  const white = '#f2f0e8', blue = '#6f88ab';
  const [c, ctx] = makeFilledCanvas(w, h, white);
  const r = w / 16;
  drawSeigaiha(ctx, w, h * 0.5 + r, 8, { r, paper: white, ink: blue, width: 21, rings: [1, 0.55, 0.12] });
  // 上部の 2 重線
  ctx.fillStyle = blue;
  ctx.fillRect(0, h * 0.13, w, 36);
  ctx.fillRect(0, h * 0.26, w, 36);
  return toTexture(c);
}

// 霞の幕。全体にうっすら不透明で、濃いところと薄いところがゆるくむらになる（流しても継ぎ目が出ないよう、はみ出す分は反対側にも描く）
function makeHazeTexture() {
  const size = 256;
  const [c, ctx] = makeFilledCanvas(size, size, 'rgba(255,255,255,0.6)');
  for (let i = 0; i < 36; i++) {
    const x = rand(0, size), y = rand(0, size), r = rand(30, 80);
    ctx.globalCompositeOperation = i % 2 ? 'source-over' : 'destination-out';
    for (const ox of [-size, 0, size]) {
      for (const oy of [-size, 0, size]) {
        const g = ctx.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, r);
        g.addColorStop(0, 'rgba(255,255,255,0.28)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.fillRect(x + ox - r, y + oy - r, r * 2, r * 2);
      }
    }
  }
  return toTexture(c);
}

// 行灯のにじみ・芯・光だまりに使う、中心が明るい丸
function makeGlowTexture() {
  const [c, ctx] = makeCanvas(128, 128);
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.4, 'rgba(255,255,255,0.35)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 128, 128);
  return toTexture(c, false);
}

// ---- 襖絵 ----
// 墨の山並み。奥から手前へ、裾が霞に溶ける
function drawMountains(ctx, w, h, x0 = 0, y0 = 0) {
  for (let layer = 0; layer < 5; layer++) {
    const t = layer / 4;
    const top = lerp(...MOUNTAIN_TOP, t) * h;
    const a = rand(0, TAU), b = rand(0, TAU);
    ctx.beginPath();
    ctx.moveTo(x0, y0 + h);
    for (let x = 0; x <= w; x += 8) {
      const u = x / w;
      const ridge = top - (Math.sin(u * 7 + a) * 0.07 + Math.sin(u * 17 + b) * 0.03 + Math.abs(Math.sin(u * 3.1 + a)) * 0.1) * h;
      ctx.lineTo(x0 + x, y0 + ridge);
    }
    ctx.lineTo(x0 + w, y0 + h);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, y0 + top - 0.18 * h, 0, y0 + Math.min(top + 0.32 * h, h));   // 裾は絵の下端までに消す
    const v = lerp(120, 34, t);
    g.addColorStop(0, `rgba(${v},${v},${v},${lerp(0.5, 0.92, t)})`);
    g.addColorStop(1, `rgba(${v},${v},${v},0)`);
    ctx.fillStyle = g;
    ctx.fill();
  }
}

const FUSUMA_PAINTERS = [
  // 雲母の淡い柄（花菱）
  (ctx, w, h) => {
    ctx.fillStyle = '#c5bda9';
    ctx.fillRect(0, 0, w, h);
    const step = w / 16;
    ctx.fillStyle = 'rgba(236,230,210,0.42)';
    for (let row = 0; row * step * 0.7 < h + step; row++) {
      for (let x = (row % 2) * step * 0.5; x < w + step; x += step) {
        const y = row * step * 0.7;
        for (let p = 0; p < 4; p++) {
          const a = p * TAU / 4;
          ctx.beginPath();
          ctx.ellipse(x + Math.cos(a) * step * 0.17, y + Math.sin(a) * step * 0.17, step * 0.15, step * 0.085, a, 0, TAU);
          ctx.fill();
        }
      }
    }
  },
  // 青海波（白地に淡い藍色）
  Object.assign((ctx, w, h) => {
    ctx.fillStyle = '#e6e8ec';
    ctx.fillRect(0, 0, w, h);
    const r = w / 22;
    const top = SEIGAIHA_TOP * h;   // いちばん上の波の頂がこの高さに来る（波の輪郭がそのまま柄の上端になる）
    drawSeigaiha(ctx, w, top + r, Math.ceil((h - top + r) / (r * 0.5)), { r, paper: '#e6e8ec', ink: 'rgba(52,96,178,0.9)', width: 3, rings: [1, 0.76, 0.52, 0.28] });
  }, { colorFix: SEIGAIHA_COLOR_FIX, stain: 0.35 }),   // 白地ではしみが目立つので薄くする
  // 金地の雲（すやり霞）
  (ctx, w, h) => {
    ctx.fillStyle = '#7f6c3e';
    ctx.fillRect(0, 0, w, h);
    // 映る時間が短いので、離れても分かるよう雲を大きく描く
    for (let i = 0; i < 5; i++) {
      const y = rand(0.02, 0.8) * h, bh = rand(0.14, 0.24) * h;
      const x = rand(-0.25, 0.55) * w, bw = rand(0.5, 0.95) * w;
      ctx.fillStyle = pick(['rgba(206,176,108,0.78)', 'rgba(164,136,80,0.7)']);
      // 長さの違う帯を上下にずらして重ね、段のある霞の形にする
      ctx.beginPath();
      ctx.roundRect(x, y + bh * 0.3, bw, bh * 0.4, bh * 0.2);
      ctx.roundRect(x + bw * 0.22, y, bw * 0.55, bh * 0.4, bh * 0.2);
      ctx.roundRect(x + bw * 0.08, y + bh * 0.6, bw * 0.6, bh * 0.4, bh * 0.2);
      ctx.fill();
    }
  },
  // 墨の山水
  (ctx, w, h) => { ctx.fillStyle = '#c8c2b2'; ctx.fillRect(0, 0, w, h); drawMountains(ctx, w, h); },
  // 墨のぼかし（裾が暗い）
  (ctx, w, h) => {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#c2bcad');
    g.addColorStop(0.55, '#a29d90');
    g.addColorStop(1, '#2d2c2a');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  },
];

function makeFusumaTextures() {
  return FUSUMA_PAINTERS.map((paint) => {
    const [c, ctx] = makeCanvas(...ART_SIZE);
    paint(ctx, c.width, c.height);
    ageSurface(ctx, c.width, c.height, 0.7, { stain: paint.stain ?? 1 });
    const texture = toTexture(c, false);
    texture.userData.colorFix = paint.colorFix;   // 柄ごとの材質の色の補正（無ければ undefined）
    return texture;
  });
}

// 表装（布の地）の上に、墨の山水を描く
function makeScrollTexture() {
  const w = 360, h = 1024;
  const [c, ctx] = makeFilledCanvas(w, h, '#54402d');

// ---- 部屋の計画 ----
function randomDoorKind() {
  return Math.random() < 0.5 ? { kind: 'fusuma' } : { kind: 'shoji', layout: pick(SHOJI_LAYOUTS) };
}

function randomWall(kind) {
  return kind === 'shoji' ? { kind, layout: pick(SHOJI_LAYOUTS) } : { kind };
}

// 出口の向きを選ぶ。正面が EXIT_STRAIGHT、残りを左右で等分する
function pickExit() {
  if (Math.random() < EXIT_STRAIGHT) return 0;
  return Math.random() < 0.5 ? 1 : 3;
}

// 行灯を置く四隅を選ぶ（部屋の座標の [x, z] の並び）。進行方向（出口）の側の 2 隅に置くのは多くても 1 個
function pickAndons(exit) {
  const isExitSide = ([sx, sz]) => -WALL_SIN[exit] * sx - WALL_COS[exit] * sz > 0;
  let corners = [[1, 1], [1, -1], [-1, 1], [-1, -1]];
  const pos = H - ANDON_INSET;
  const result = [];
  for (let n = randInt(ANDON_MAX + 1); n > 0; n--) {
    const corner = pick(corners);
    corners = corners.filter((c) => c !== corner && !(isExitSide(corner) && isExitSide(c)));
    result.push([corner[0] * pos, corner[1] * pos]);
  }
  return result;
}

// 部屋の中心から出口の面までの距離
const exitDist = (plan) => (plan.corridor ? CORRIDOR_HALF : H);

// 廊下の区画の番号（-CORRIDOR_BAYS から）を、sides の添字にする
const corridorIndex = (n) => n + CORRIDOR_BAYS;

// CORRIDOR_EXIT_WEIGHTS の重みで、出口の区画の番号を選ぶ
function pickExitBay() {
  const entries = Object.entries(CORRIDOR_EXIT_WEIGHTS);
  let r = Math.random() * entries.reduce((sum, [, w]) => sum + w, 0);
  for (const [bay, w] of entries) {
    r -= w;
    if (r < 0) return Number(bay);
  }
  return CORRIDOR_LAST_BAY;
}

// 廊下の中身を決める。両側には、入ってきた障子と同じ割り付けの障子と、板張りの壁が混ざって並ぶ
function planCorridor(previous) {
  const shoji = { kind: 'shoji', layout: previous.walls[previous.exit].layout };
  const walkDir = randSign();   // 歩く向き（+1 で +x）
  const exit = Math.random() < 0.5 ? 0 : ENTRY_WALL;   // 歩き終えたあとに入る側の壁
  // 片側ごとの、各区画が障子かどうか（壁の番号と corridorIndex で引く）
  const makeSide = () => Array.from({ length: CORRIDOR_BAY_COUNT }, () => Math.random() < CORRIDOR_SHOJI_CHANCE);
  const sides = [];
  sides[0] = makeSide();
  sides[ENTRY_WALL] = makeSide();
  const exitBay = pickExitBay();
  sides[ENTRY_WALL][corridorIndex(0)] = true;   // 入ってきた障子の区画
  sides[exit][corridorIndex(exitBay)] = true;   // 出口の区画は必ず障子にする
  return {
    corridor: true,
    walls: [shoji, shoji, shoji, shoji],
    sides,
    walkDir,
    walkWall: walkDir > 0 ? 1 : 3,        // 廊下に出たあとに向く壁
    walkDist: exitBay * ROOM,
    exit,
    exitBay,
    exitX: walkDir * exitBay * ROOM,
    earth: pick(EARTH_COLORS),
    edge: pick(EDGE_COLORS),
    ceiling: pick(CEILING_COLORS),
    fusuma: previous.fusuma,
    andons: [],
    roll: 0,
    lampSide: randSign(),                 // 吊り行灯を寄せる側（z の符号）。乱数の列がずれないよう最後に引く
  };
}

// 部屋の中身を決める。previous は前の部屋の計画（最初の部屋では null）
function planRoom(previous) {
  const entry = previous ? previous.walls[previous.exit] : randomDoorKind();   // 入口の建具は前の部屋の出口
  const others = [0, 1, 3];
  const walls = [];
  walls[ENTRY_WALL] = { kind: entry.kind, layout: entry.layout };
  // 先に出口を決め、その面を必ず建具にする（行き止まりにならない）
  const exit = pickExit();
  const turning = exit !== 0;
  // 曲がる部屋では、中央で止まって向きを変えるあいだ正面から眺められるよう、床の間を正面に置く
  const tokoWall = Math.random() < (turning ? TOKO_CHANCE.turn : TOKO_CHANCE.straight) ? (turning ? 0 : pick(others.filter((i) => i !== exit))) : -1;
  for (const i of others) {
    if (i === exit) walls[i] = randomDoorKind();
    else if (i === tokoWall) walls[i] = { kind: 'toko', side: randSign() };
    else walls[i] = randomWall(pick(WALL_KINDS));
  }
  // 畳の回る向きと竿縁の向き。床の間があるときは床差しを避ける向きにする
  const toko = tokoWall >= 0 ? walls[tokoWall] : null;
  const plan = {
    walls,
    exit,
    exitX: 0,
    tatamiTurn: toko ? -toko.side : randSign(),
    saoAlongX: toko ? tokoWall % 2 === 0 : Math.random() < 0.5,
    earth: pick(EARTH_COLORS),
    edge: pick(EDGE_COLORS),
    ceiling: pick(CEILING_COLORS),
    fusuma: pick(textures.fusuma.filter((t) => t !== previous?.fusuma)),   // 前の部屋とは必ず違う柄にする
    andons: pickAndons(exit),
    roll: 0,   // 前の部屋から見た、この部屋の傾き
  };
  // 重力と廊下は 1 つの乱数で決める（廊下の抽選で、ほかの乱数の順番をずらさないため）
  const fate = Math.random();
  if (fate < GRAVITY_CHANCE) plan.roll = pick(GRAVITY_ROLLS);
  else if (fate < GRAVITY_CHANCE + CORRIDOR_CHANCE && previous && !previous.corridor && entry.kind === 'shoji') return planCorridor(previous);
  return plan;
}


// ---- 部屋の組み立て ----
const aoAt = (d) => 1 - AO_STRENGTH * Math.exp(-Math.max(0, d) / AO_RADIUS);   // 面と面の境からの距離 d での暗さ
const lampZ = (plan) => plan.lampSide * LAMP_Z;   // 吊り行灯の z

// 頂点の色に陰影を焼き込みながら、材質ごとに頂点を集める。
// 面の座標は「壁の座標」で渡す（setWall で選んだ壁が x 軸に沿って z = -H にあり、部屋は +z 側にある）
class RoomBuilder {
  constructor(plan) {
    this.plan = plan;
    this.buckets = new Map();
    this.target = 'static';   // 'static' | 'entry' | 'left' | 'right'（入れる先のグループ）
    this.shojiWalls = plan.walls.flatMap((w, i) => (w.kind === 'shoji' ? [i] : []));
    // 頂点を明るくする灯り [x, y, z, 量]。廊下は区画の両端の吊り行灯
    this.lights = plan.corridor
      ? [-H, H].map((x) => [x, LAMP_TOP - LAMP_H / 2, lampZ(plan), LAMP_LIGHT])
      : plan.andons.map(([x, z]) => [x, ANDON_H * 0.6, z, ANDON_LIGHT]);
    this.setWall(0);
  }

  // ox・oz は、壁の座標のまま足すずれ（廊下の壁の位置に使う）
  setWall(i, ox = 0, oz = 0) {
    this.c = WALL_COS[i];
    this.s = WALL_SIN[i];
    this.ox = ox;
    this.oz = oz;
  }

  // fn が足す頂点を、部屋に入れずに取り出す（stamp で何度も置く）
  capture(fn) {
    const saved = this.buckets;
    this.buckets = new Map();
    fn();
    const parts = [...this.buckets.values()];
    this.buckets = saved;
    return parts;
  }

  // capture した頂点を x だけずらして置く。target を渡すと、入れる先のグループをそれに揃える
  stamp(parts, x, target = null) {
    const restTarget = this.target;
    for (const p of parts) {
      this.target = target ?? p.target;
      const m = this.bucket(p.key);
      const base = m.count;
      for (let i = 0; i < p.position.length; i += 3) m.position.push(p.position[i] + x, p.position[i + 1], p.position[i + 2]);
      for (const v of p.uv) m.uv.push(v);
      for (const v of p.color) m.color.push(v);
      for (const v of p.index) m.index.push(base + v);
      m.count += p.count;
    }
    this.target = restTarget;
  }

  bucket(key) {
    const id = `${this.target}/${key}`;
    let m = this.buckets.get(id);
    if (!m) {
      m = { target: this.target, key, position: [], uv: [], color: [], index: [], count: 0 };
      this.buckets.set(id, m);
    }
    return m;
  }

  // 行灯の光がその点を明るくする量
  andonGlow(x, y, z) {
    let glow = 0;
    for (const [ax, ay, az, light] of this.lights) {
      const ddx = x - ax, ddy = y - ay, ddz = z - az;
      glow += light * Math.exp(-(ddx * ddx + ddy * ddy * 0.6 + ddz * ddz) / (2 * ANDON_RADIUS * ANDON_RADIUS));
    }
    return glow;
  }

  // 部屋の中の位置と面の向きから、その点の明るさを決める
  shade(x, y, z, nx, ny, nz) {
    const corridor = this.plan.corridor;   // 廊下は奥へ続いて見えるよう、進行方向（x）には変えない
    const dx = corridor ? Infinity : H - Math.abs(x), dz = (corridor ? CORRIDOR_HALF : H) - Math.abs(z);
    const ao = aoAt;
    const glow = this.andonGlow(x, y, z);
    let k = LIGHT_BASE * (ny > 0.5 ? FACE_UP : ny < -0.5 ? FACE_DOWN : FACE_SIDE);
    k *= lerp(1, TOP_DIM, smoothstep(y, 0.1, CEIL_H));
    if (!corridor) k *= 1 - RADIAL_DIM * Math.hypot(x, z) / (H * Math.SQRT2);
    const out = corridor ? 0 : Math.max(-dx, -dz, 0);
    if (out > 0.09) {
      k *= lerp(1, RECESS_DIM, smoothstep(out, 0.09, TOKO_D));   // 床の間の奥
      return k + glow;
    }
    if (Math.abs(nx) < 0.5) k *= ao(dx);
    if (Math.abs(nz) < 0.5) k *= ao(dz);
    if (ny < 0.5) k *= ao(y);
    if (ny > -0.5) k *= ao(CEIL_H - y);
    if (Math.abs(ny) < 0.5 && Math.min(dx, dz) < 0.1 && y < WALL_TOP) {
      k *= 1 - KAMOI_SHADOW * smoothstep(y, KAMOI_H - 0.35, KAMOI_H);   // 鴨居・長押の下
    }
    if (ny > 0.5) {
      // 障子の面までの距離で明るくする（廊下は両側が障子）
      const dists = corridor ? [dz] : this.shojiWalls.map((i) => H + WALL_SIN[i] * x + WALL_COS[i] * z);
      for (const d of dists) k *= 1 + SHOJI_GLOW * Math.exp(-Math.max(0, d) / 0.7);
    }
    return k + glow;
  }

  // u×v の単位法線を部屋の向きに回す
  roomNormal(u, v) {
    const n = new THREE.Vector3(...u).cross(new THREE.Vector3(...v)).normalize();
    return [n.x * this.c + n.z * this.s, n.y, -n.x * this.s + n.z * this.c];
  }

  pushColor(m, k) {
    const t = smoothstep(k, 0.03, 0.42);
    m.color.push(k * lerp(SHADOW[0], WARM[0], t), k * lerp(SHADOW[1], WARM[1], t), k * lerp(SHADOW[2], WARM[2], t));
  }

  // 平行四辺形。o は角、u・v は辺（u×v が表の向き）。nu・nv は分割数、uv は [u0, v0, u1, v1]、swap は u と v を入れ替える、lit は kFn の明るさに足す行灯の光の割合
  quad(key, o, u, v, { nu = 1, nv = 1, uv = [0, 0, 1, 1], swap = false, tone = 1, kFn = null, lit = 0 } = {}) {
    const m = this.bucket(key);
    const { c, s, ox, oz } = this;
    const [rnx, ny, rnz] = this.roomNormal(u, v);
    for (let j = 0; j <= nv; j++) {
      for (let i = 0; i <= nu; i++) {
        const a = i / nu, b = j / nv;
        const lx = o[0] + u[0] * a + v[0] * b;
        const y = o[1] + u[1] * a + v[1] * b;
        const lz = o[2] + u[2] * a + v[2] * b;
        const x = (lx + ox) * c + (lz + oz) * s, z = -(lx + ox) * s + (lz + oz) * c;
        m.position.push(x, y, z);
        const ta = swap ? b : a, tb = swap ? a : b;
        m.uv.push(uv[0] + (uv[2] - uv[0]) * ta, uv[1] + (uv[3] - uv[1]) * tb);
        this.pushColor(m, tone * (kFn ? kFn(lx, y, lz) + lit * this.andonGlow(x, y, z) : this.shade(x, y, z, rnx, ny, rnz)));
      }
    }
    const base = m.count;
    for (let j = 0; j < nv; j++) {
      for (let i = 0; i < nu; i++) {
        const p = base + j * (nu + 1) + i;
        const q = p + nu + 1;
        m.index.push(p, p + 1, q + 1, p, q + 1, q);
      }
    }
    m.count += (nu + 1) * (nv + 1);
  }

  // 4 点の面（反時計回りが表）。c === d なら三角形になる
  face(key, a, b, c, d, tone = 1, uvs = [[0, 0], [1, 0], [1, 1], [0, 1]]) {
    const m = this.bucket(key);
    const { c: cos, s: sin, ox, oz } = this;
    const e1 = [c[0] - a[0], c[1] - a[1], c[2] - a[2]], e2 = [d[0] - b[0], d[1] - b[1], d[2] - b[2]];
    const [rnx, ny, rnz] = this.roomNormal(e1, e2);
    const pts = [a, b, c, d];
    for (let i = 0; i < 4; i++) {
      const [lx, y, lz] = pts[i];
      const x = (lx + ox) * cos + (lz + oz) * sin, z = -(lx + ox) * sin + (lz + oz) * cos;
      m.position.push(x, y, z);
      m.uv.push(...uvs[i]);
      this.pushColor(m, tone * this.shade(x, y, z, rnx, ny, rnz));
    }
    const p = m.count;
    m.index.push(p, p + 1, p + 2, p, p + 2, p + 3);
    m.count += 4;
  }

  // 箱。長い辺を木目（u）の向きにする。tile はテクスチャ 1 枚の幅・高さ（m）
  box(key, [x0, y0, z0], [x1, y1, z1], { tile = WOOD_TILE, tone = 1, skip = '' } = {}) {
    const dx = x1 - x0, dy = y1 - y0, dz = z1 - z0;
    const faces = [
      ['+z', [x0, y0, z1], [dx, 0, 0], [0, dy, 0]],
      ['-z', [x1, y0, z0], [-dx, 0, 0], [0, dy, 0]],
      ['+x', [x1, y0, z1], [0, 0, -dz], [0, dy, 0]],
      ['-x', [x0, y0, z0], [0, 0, dz], [0, dy, 0]],
      ['+y', [x0, y1, z1], [dx, 0, 0], [0, 0, -dz]],
      ['-y', [x0, y0, z0], [dx, 0, 0], [0, 0, dz]],
    ];
    const u0 = Math.random(), v0 = Math.random();
    for (const [name, o, u, v] of faces) {
      if (skip.includes(name)) continue;
      const lu = Math.hypot(...u), lv = Math.hypot(...v);
      const swap = lv > lu;
      const [long, short] = swap ? [lv, lu] : [lu, lv];
      this.quad(key, o, u, v, {
        nu: Math.max(1, Math.ceil(lu / 0.2)), nv: Math.max(1, Math.ceil(lv / 0.2)),
        uv: [u0, v0, u0 + long / tile[0], v0 + short / tile[1]], swap, tone,
      });
    }
  }

  // 回転体。profile は [半径, 高さ] の並び。wrap なら、テクスチャを周囲に 1 周、高さいっぱいに貼る
  lathe(key, cx, cz, profile, segments = 14, tone = 1, wrap = false) {
    const at = (r, y, a) => [cx + r * Math.cos(a), y, cz + r * Math.sin(a)];
    const yMin = profile[0][1], ySpan = (profile.at(-1)[1] - yMin) || 1;
    for (let j = 0; j + 1 < profile.length; j++) {
      for (let i = 0; i < segments; i++) {
        const a0 = i / segments * TAU, a1 = (i + 1) / segments * TAU;
        const [r0, y0] = profile[j], [r1, y1] = profile[j + 1];
        const u0 = i / segments, u1 = (i + 1) / segments, v0 = (y0 - yMin) / ySpan, v1 = (y1 - yMin) / ySpan;
        const uvs = wrap ? [[u0, v0], [u0, v1], [u1, v1], [u1, v0]] : undefined;
        this.face(key, at(r0, y0, a0), at(r1, y1, a0), at(r1, y1, a1), at(r0, y0, a1), tone, uvs);
      }
    }
  }

  // z の位置に置く、+z を向いた円盤（引手）
  disc(key, cx, cy, z, r, tone = 1, segments = 12) {
    for (let i = 0; i < segments; i++) {
      const a0 = i / segments * TAU, a1 = (i + 1) / segments * TAU;
      const p0 = [cx + Math.cos(a0) * r, cy + Math.sin(a0) * r, z];
      const p1 = [cx + Math.cos(a1) * r, cy + Math.sin(a1) * r, z];
      this.face(key, [cx, cy, z], p0, p1, p1, tone);
    }
  }
}

function buildFloor(b) {
  const cell = KEN / 2;
  const turn = b.plan.tatamiTurn;
  // 土台（畳の合わせ目から見える暗い面）
  b.quad('base', [-H, -0.012, H], [ROOM, 0, 0], [0, 0, -ROOM]);
  // 卍形: [列, 行, 列数, 行数]。turn が -1 なら左右に反転する
  const MATS = [[0, 0, 2, 1], [2, 0, 1, 2], [1, 2, 2, 1], [0, 1, 1, 2], [1, 1, 1, 1]];
  const seam = 0.0035, edge = 0.03;
  for (const [col, row, cols, rows] of MATS) {
    let x0 = -H + col * cell, x1 = x0 + cols * cell;
    if (turn < 0) [x0, x1] = [-x1, -x0];
    const z0 = -H + row * cell + seam, z1 = -H + (row + rows) * cell - seam;
    x0 += seam;
    x1 -= seam;
    const alongX = cols >= rows;
    const tone = (alongX ? 1.0 : 0.9) * rand(0.95, 1.05);
    const len = alongX ? x1 - x0 : z1 - z0, d = (alongX ? z1 - z0 : x1 - x0) - edge * 2;
    const nu = Math.ceil(len / 0.13), u = alongX ? [len, 0, 0] : [0, 0, -len];
    const across = (t) => (alongX ? [0, 0, -t] : [-t, 0, 0]);   // 長辺に直交する向き
    const corner = (t) => (alongX ? [x0, 0, z1 - t] : [x1 - t, 0, z1]);
    b.quad('tatami', corner(edge), u, across(d), { nu, nv: Math.ceil(d / 0.13), uv: [0, 0, Math.max(cols, rows) >= 2 ? 1 : 0.5, 1], tone });
    b.quad('edge', corner(0), u, across(edge), { nu });
    b.quad('edge', corner(d + edge), u, across(edge), { nu });
  }
}

function buildCeiling(b) {
  const along = b.plan.saoAlongX;   // 竿縁が x に沿うか
  const seam = 0.002;
  const pt = (a, y, c) => (along ? [a, y, c] : [c, y, a]);
  const s = along ? 1 : -1;
  b.quad('base', pt(-H, CEIL_H + 0.004, s * H), pt(0, 0, -s * ROOM), pt(ROOM, 0, 0));
  const bw = ROOM / CEILING_BOARDS;
  for (let i = 0; i < CEILING_BOARDS; i++) {
    const u0 = Math.random(), v0 = Math.random();
    const opts = { nu: 18, nv: 3, tone: rand(0.82, 1.1), uv: [u0, v0, u0 + ROOM / CEILING_TILE, v0 + (bw - seam * 2) / CEILING_TILE] };
    const c0 = -H + i * bw + seam, width = bw - seam * 2;
    b.quad('ceiling', pt(c0, CEIL_H, s * H), pt(0, 0, -s * ROOM), pt(width, 0, 0), opts);
  }
  const hw = 0.016, depth = 0.038;
  for (let i = 0; i < SAO_COUNT; i++) {
    const c = -H + (i + 0.5) * ROOM / SAO_COUNT;
    b.box('wood', pt(-H, CEIL_H - depth, c - hw), pt(H, CEIL_H, c + hw), { skip: '+y' });
  }
}

function buildPosts(b) {
  for (let i = 0; i < 4; i++) {
    b.setWall(i);
    b.box('wood', [-H, 0, -H], [-H + POST_W, CEIL_H, -H + POST_W], { tone: 0.92, skip: '+y-y' });
  }
}

// 引手。丸い金具と、中の暗いくぼみ
function addHandle(b, x, front) {
  b.disc('metal', x, 0.78, front + 0.0008, 0.034);
  b.disc('lacquer', x, 0.78, front + 0.0014, 0.021, 0.6);
}

// 襖 1 枚（x0..x1）。front は表面の z
function addFusumaPanel(b, x0, x1, front, handleX) {
  const f = 0.02, bottom = 0.01, top = KAMOI_H;
  const back = front - PANEL_T;
  const artW = x1 - x0 - f * 2, artH = top - bottom - f * 2;
  const us = (x) => (x + P) / (2 * P);
  b.quad('fusuma', [x0 + f, bottom + f, front - 0.003], [artW, 0, 0], [0, artH, 0], {
    nu: 6, nv: 12, uv: [us(x0 + f), (bottom + f) / top, us(x1 - f), (top - f) / top],
  });
  b.box('lacquer', [x0, bottom, back], [x0 + f, top, front], { skip: '+y-y' });
  b.box('lacquer', [x1 - f, bottom, back], [x1, top, front], { skip: '+y-y' });
  b.box('lacquer', [x0 + f, bottom, back], [x1 - f, bottom + f, front], { skip: '-y' });
  b.box('lacquer', [x0 + f, top - f, back], [x1 - f, top, front], { skip: '+y' });
  addHandle(b, handleX, front - 0.003);
}

// 障子 1 枚
function addShojiPanel(b, x0, x1, front, layout) {
  const f = 0.028, bottom = 0.01, top = KAMOI_H;
  const back = front - PANEL_T;
  const koshi = layout.koshi ? layout.koshi : bottom + f;
  const paperZ = front - 0.016;
  const paperK = (x, y) => PAPER_K * (0.86 + 0.14 * Math.sin(Math.PI * y / KAMOI_H)) * (1 - 0.08 * y / KAMOI_H);
  const w = x1 - x0 - f * 2, h = top - f - koshi;
  const u0 = Math.random(), v0 = Math.random();
  b.quad('paper', [x0 + f, koshi, paperZ], [w, 0, 0], [0, h, 0], { nu: 6, nv: 8, uv: [u0, v0, u0 + w, v0 + h], kFn: paperK, lit: ANDON_ON_SHOJI });
  b.box('wood', [x0, bottom, back], [x0 + f, top, front], { skip: '+y-y', tone: 1.15 });
  b.box('wood', [x1 - f, bottom, back], [x1, top, front], { skip: '+y-y', tone: 1.15 });
  b.box('wood', [x0 + f, top - f, back], [x1 - f, top, front], { skip: '+y', tone: 1.15 });
  if (layout.koshi) b.box('wood', [x0 + f, bottom, back], [x1 - f, layout.koshi, front - 0.004], { skip: '-y', tone: 1.05 });
  else b.box('wood', [x0 + f, bottom, back], [x1 - f, bottom + f, front], { skip: '-y', tone: 1.15 });
  const hw = 0.0045, z0 = paperZ, z1 = front - 0.002;
  for (let i = 1; i <= layout.v; i++) {
    const x = x0 + f + w * i / (layout.v + 1);
    b.box('wood', [x - hw, koshi, z0], [x + hw, top - f, z1], { skip: '-z+y-y', tone: 1.1 });
  }
  for (let i = 1; i <= layout.h; i++) {
    const y = koshi + h * i / (layout.h + 1);
    b.box('wood', [x0 + f, y - hw, z0], [x1 - f, y + hw, z1], { skip: '-z-x+x', tone: 1.1 });
  }
}

function addDoorWall(b, wall, isExit) {
  const panel = (x0, x1, front, handleX) => {
    if (wall.kind === 'fusuma') addFusumaPanel(b, x0, x1, front, handleX);
    else addShojiPanel(b, x0, x1, front, wall.layout);
  };
  const restTarget = b.target;
  // 小壁・鴨居・敷居
  const w = ROOM, y = WALL_TOP, h = CEIL_H - y;
  b.quad('earth', [-H, y, -H], [w, 0, 0], [0, h, 0], { nu: 22, nv: 4, uv: earthUv(w, h) });
  b.box('wood', [-P, KAMOI_H, -H - WALL_T], [P, KAMOI_H + KAMOI_T, -H + 0.008], { skip: '+y-z' });
  b.box('sill', [-P, -0.012, -H - WALL_T], [P, 0.007, -H + 0.006], { skip: '-y-z', tone: b.plan.corridor ? CORRIDOR_SILL_TONE : 1 });
  // 外側の 2 枚（奥の溝）と中央の 2 枚（手前の溝）
  panel(-P, -PANEL_W, BACK_TRACK, -P + 0.09);
  panel(PANEL_W, P, BACK_TRACK, P - 0.09);
  if (isExit) b.target = 'left';
  panel(-PANEL_W, 0, FRONT_TRACK, -0.09);
  if (isExit) b.target = 'right';
  panel(0, PANEL_W, FRONT_TRACK, 0.09);
  b.target = restTarget;
}

function addPlainWall(b) {
  const w = ROOM, h = CEIL_H;
  b.quad('earth', [-H, 0, -H], [w, 0, 0], [0, h, 0], { nu: 22, nv: 18, uv: earthUv(w, h) });
  b.box('wood', [-H, 0, -H], [H, 0.04, -H + 0.01], { skip: '-y-z' });
}

// 床の間・床脇のくぼみ（奥と両側の土壁、天井）
function addRecess(b, x0, x1, yBottom, yTop) {
  const zB = -H - TOKO_D, w = x1 - x0, h = yTop - yBottom;
  const uv = (a, c) => earthUv(a, c, 0.4, 0.4);
  b.quad('earth', [x0, yBottom, zB], [w, 0, 0], [0, h, 0], { nu: 10, nv: 10, uv: uv(w, h) });
  b.quad('earth', [x0, yBottom, -H], [0, 0, -TOKO_D], [0, h, 0], { nu: 5, nv: 10, uv: uv(TOKO_D, h) });
  b.quad('earth', [x1, yBottom, zB], [0, 0, TOKO_D], [0, h, 0], { nu: 5, nv: 10, uv: uv(TOKO_D, h) });
  b.quad('wood', [x0, yTop, -H], [w, 0, 0], [0, 0, -TOKO_D], { nu: 6, nv: 3, tone: 0.8, uv: [0, 0, 1, 2] });
}

// 掛け軸の前に置く壺
function addPot(b, cx, cz) {
  const y = TOKO_FLOOR;
  const profile = [[0.075, 0], [0.105, 0.03], [0.137, 0.11], [0.143, 0.16], [0.122, 0.24], [0.08, 0.29], [0.058, 0.315], [0.072, 0.34]]
    .map(([r, h]) => [r, y + h]);
  b.lathe('pot', cx, cz, profile, 28, POT_TONE, true);
  b.lathe('lacquer', cx, cz, [[0.066, y + 0.34], [0, y + 0.335]], 16, 2);   // 口の中
}

function addTokonoma(b, wall) {
  const s = wall.side;
  const [x0, x1] = s > 0 ? [H - KEN, H] : [-H, -H + KEN];    // 床の間
  const [w0, w1] = s > 0 ? [-H, H - KEN] : [-H + KEN, H];    // 床脇
  const post = s > 0 ? x0 : x1;
  const zB = -H - TOKO_D;

  // 床の間
  addRecess(b, x0, x1, TOKO_FLOOR, TOKO_CEIL);
  const wtop = OTOSHI_Y + 0.05;
  const smallWallUv = (w, h) => earthUv(w, h, 0.3, 0.4);
  b.quad('earth', [x0, wtop, -H], [x1 - x0, 0, 0], [0, CEIL_H - wtop, 0], { nu: 12, nv: 3, uv: smallWallUv(x1 - x0, CEIL_H - wtop) });
  b.box('lacquer', [x0, 0, -H - 0.05], [x1, TOKO_FLOOR, -H + 0.004], { skip: '-y' });
  b.quad('sill', [x0, TOKO_FLOOR, -H - 0.05], [x1 - x0, 0, 0], [0, 0, -(TOKO_D - 0.05)], { nu: 8, nv: 4, uv: [0, 0, 1.4, 0.6] });
  b.box('wood', [x0, OTOSHI_Y, -H - 0.03], [x1, wtop, -H + 0.01], { skip: '+y-z', tone: 0.9 });

  // 掛け軸（床の間の中央）
  const cx = (x0 + x1) / 2;
  const sw = 0.2, sy0 = 0.42, sy1 = 1.88, sz = zB + 0.012;
  b.quad('scroll', [cx - sw, sy0, sz], [sw * 2, 0, 0], [0, sy1 - sy0, 0], { nv: 8 });
  b.box('lacquer', [cx - sw - 0.018, sy0 - 0.014, sz - 0.002], [cx + sw + 0.018, sy0 + 0.006, sz + 0.016]);
  b.box('wood', [cx - sw - 0.006, sy1 - 0.008, sz - 0.002], [cx + sw + 0.006, sy1 + 0.012, sz + 0.01]);
  b.box('base', [cx - 0.003, sy1 + 0.012, zB + 0.012], [cx + 0.003, 2.05, zB + 0.018], { skip: '-z' });

  addPot(b, cx, zB + TOKO_D * 0.45);

  // 床脇
  const wm = (w0 + w1) / 2;
  addRecess(b, w0, w1, 0.02, KAMOI_H + KAMOI_T);
  const wy = KAMOI_H + KAMOI_T;
  b.quad('sill', [w0, 0.02, -H], [w1 - w0, 0, 0], [0, 0, -TOKO_D], { uv: [0, 0, 0.6, 0.6], nu: 4, nv: 4 });
  b.box('wood', [w0, KAMOI_H, -H - 0.06], [w1, wy, -H + 0.008], { skip: '+y-z' });
  b.quad('earth', [w0, WALL_TOP, -H], [w1 - w0, 0, 0], [0, CEIL_H - WALL_TOP, 0], { nu: 6, nv: 4, uv: smallWallUv(w1 - w0, CEIL_H - WALL_TOP) });
  b.box('wood', [w0, wy, -H], [w1, WALL_TOP, -H + 0.045], { tone: 0.95, skip: '-z' });   // 長押（床の間の前では切るので、床脇の前だけ）
  // 地袋（下の戸棚）
  const fz = -H - 0.28, fy0 = 0.02, fy1 = 0.42, fw = (w1 - w0) / 2;
  b.box('lacquer', [w0, fy1, zB], [w1, fy1 + 0.024, fz + 0.006], { skip: '-y-z' });
  for (const [a0, a1] of [[w0, w0 + fw], [w0 + fw, w1]]) {
    const inset = 0.004;   // 戸のあいだに細い隙間を残す
    b.quad('fusuma', [a0 + inset, fy0 + inset, fz], [a1 - a0 - inset * 2, 0, 0], [0, fy1 - fy0 - inset * 2, 0], { uv: [0.1, 0.12, 0.42, 0.42], nv: 3 });
    b.disc('metal', (a0 + a1) / 2 + (a0 < wm ? 0.11 : -0.11), (fy0 + fy1) / 2, fz + 0.001, 0.02);
  }
  // 違い棚
  const shelfZ1 = -H - 0.24;
  const yL = 1.0, yR = 1.2, t = 0.024;
  b.box('sill', [w0, yL, zB], [wm + 0.07, yL + t, shelfZ1], { skip: '-z', tone: 0.95 });
  b.box('sill', [wm - 0.07, yR, zB], [w1, yR + t, shelfZ1], { skip: '-z', tone: 0.95 });
  b.box('wood', [wm - 0.012, yL + t, shelfZ1 - 0.04], [wm + 0.012, yR, shelfZ1 - 0.016], { skip: '+y-y-z' });

  // 床柱（丸太）
  const r = 0.055;
  const profile = [];
  for (let y = 0; y <= CEIL_H + 0.001; y += CEIL_H / 12) profile.push([r * (1 + 0.04 * Math.sin(y * 7 + rand(0, 0.4))), y]);
  b.lathe('log', post, -H - 0.005, profile, 16, 1.25);
}

function addWall(b, i, isExit) {
  const wall = b.plan.walls[i];
  b.setWall(i);
  if (i === ENTRY_WALL) b.target = 'entry';
  if (wall.kind === 'toko') addTokonoma(b, wall);
  else if (wall.kind === 'plain') addPlainWall(b);
  else addDoorWall(b, wall, isExit);
  // 長押（床の間の壁は床脇の前だけ）と廻り縁
  addWallTrim(b, wall.kind !== 'toko');
  b.target = 'static';
}

function addWallTrim(b, withNageshi) {
  if (withNageshi) b.box('wood', [-H, KAMOI_H + KAMOI_T, -H], [H, WALL_TOP, -H + 0.045], { skip: '-z', tone: 0.95 });
  b.box('wood', [-H, CEIL_H - 0.05, -H], [H, CEIL_H, -H + 0.05], { skip: '+y-z', tone: 0.9 });
}

// 廊下の 1 区画ぶんの床（板張り）と天井
function addCorridorFloorAndCeiling(b) {
  const hw = CORRIDOR_HALF, seam = 0.003;
  // 幅方向に n 枚の板を並べる。dir は v の向き（-1 が床、1 が天井）
  const boards = (key, n, y, dir, toneMax, [tileU, tileV], toneK = 1) => {
    const pitch = hw * 2 / n, w = pitch - seam * 2;
    for (let i = 0; i < n; i++) {
      const tone = rand(0.82, toneMax) * toneK, u = Math.random(), v = Math.random();
      b.quad(key, [-H, y, -hw + (i + (dir < 0 ? 1 : 0)) * pitch + dir * seam], [ROOM, 0, 0], [0, 0, dir * w],
        { nu: 10, nv: 3, tone, uv: [u, v, u + ROOM / tileU, v + w / tileV] });
    }
  };
  b.setWall(0);
  b.quad('base', [-H, -0.012, hw], [ROOM, 0, 0], [0, 0, -hw * 2]);
  b.quad('base', [-H, CEIL_H + 0.004, -hw], [ROOM, 0, 0], [0, 0, hw * 2]);
  // 床板は敷居と同じ材質にする（材質を増やすと three.js の UUID の分だけ Math.random を引き、部屋の乱数の列がずれる）。敷居との差は頂点の色で付ける
  boards('sill', CORRIDOR_BOARDS, 0, -1, 1.08, WOOD_TILE, CORRIDOR_FLOOR_TONE);
  boards('ceiling', CORRIDOR_CEILING_BOARDS, CEIL_H, 1, 1.1, [CEILING_TILE, CEILING_TILE]);
  // 竿縁は幅方向に渡す
  const saoHw = 0.016, depth = 0.038;
  for (const x of [-ROOM / 4, ROOM / 4]) b.box('wood', [x - saoHw, CEIL_H - depth, -hw], [x + saoHw, CEIL_H, hw], { skip: '+y' });
}

// 廊下の片側の 1 区画（障子 4 枚と柱・鴨居・長押）。中央の 2 枚は left・right に入れておき、出口の区画でだけ動かす
function addCorridorWall(b, i) {
  b.setWall(i, 0, H - CORRIDOR_HALF);
  addDoorWall(b, b.plan.walls[i], true);
  addCorridorTrim(b);
}

// 廊下の片側の 1 区画（板張りの壁）。縦に板を並べ、長押より上は障子の区画と同じ土壁にする
function addCorridorPlainWall(b, i) {
  b.setWall(i, 0, H - CORRIDOR_HALF);
  const y = WALL_TOP, top = CEIL_H - y, seam = 0.002;
  b.quad('earth', [-H, y, -H], [ROOM, 0, 0], [0, top, 0], { nu: 22, nv: 4, uv: earthUv(ROOM, top) });
  b.quad('base', [-H, 0, -H - 0.004], [ROOM, 0, 0], [0, y, 0]);   // 板の合わせ目から見える暗い面
  const bw = P * 2 / CORRIDOR_WALL_BOARDS;
  for (let j = 0; j < CORRIDOR_WALL_BOARDS; j++) {
    const u = Math.random(), v = Math.random();
    b.quad('sill', [-P + j * bw + seam, 0, -H], [bw - seam * 2, 0, 0], [0, y, 0], {
      nu: 1, nv: 8, swap: true, tone: rand(0.5, 0.72), uv: [u, v, u + y / WOOD_TILE[0], v + bw / WOOD_TILE[1]],
    });
  }
  b.box('wood', [-H, 0, -H], [H, 0.04, -H + 0.01], { skip: '-y-z' });   // 畳寄せ
  addCorridorTrim(b);
}

// 区画の長押・廻り縁と、区画の境の柱
function addCorridorTrim(b) {
  addWallTrim(b, true);
  for (const x of [-H, H - POST_W]) b.box('wood', [x, 0, -H], [x + POST_W, CEIL_H, -H + POST_W], { tone: 0.92, skip: '+y-y' });
  b.setWall(0);
}

// 廊下。種類ごとに 1 区画を作って並べる（区画ごとに作るより組み立てが軽い）
function buildCorridor(b) {
  const { plan } = b;
  const floorAndCeiling = b.capture(() => addCorridorFloorAndCeiling(b));
  const lamps = [0, 1].map((i) => b.capture(() => addCorridorLamp(b, i)));   // 揺らぎが揃わないよう、区画ごとに交互に使う
  const walls = [0, ENTRY_WALL].map((i) => ({
    i,
    shoji: b.capture(() => addCorridorWall(b, i)),
    plain: b.capture(() => addCorridorPlainWall(b, i)),
  }));
  // 番号 n の区画は、歩く向きへ n 区画進んだ位置
  const first = -CORRIDOR_BAYS, last = CORRIDOR_LAST_BAY + CORRIDOR_BAYS;
  for (let n = first; n <= last; n++) {
    const x = n * plan.walkDir * ROOM;
    b.stamp(floorAndCeiling, x, 'static');
    b.stamp(lamps[corridorIndex(n) % 2], x, 'static');
    for (const { i, shoji, plain } of walls) {
      if (!plan.sides[i][corridorIndex(n)]) b.stamp(plain, x, 'static');
      else if (i === ENTRY_WALL && n === 0) b.stamp(shoji, x, 'entry');
      else if (i === plan.exit && n === plan.exitBay) b.stamp(shoji, x);   // 出口の区画だけ、中央の 2 枚を動かせるようにする
      else b.stamp(shoji, x, 'static');
    }
  }
}

const LANTERN_CORNERS = [[1, 1], [1, -1], [-1, 1], [-1, -1]];

// 行灯の枠の 4 辺（高さ y から厚さ th）
function addLanternRim(b, cx, cz, r, t, y, th, skip) {
  b.box('wood', [cx - r, y, cz + r - t], [cx + r, y + th, cz + r + t], { skip });
  b.box('wood', [cx - r, y, cz - r - t], [cx + r, y + th, cz - r + t], { skip });
  b.box('wood', [cx + r - t, y, cz - r], [cx + r + t, y + th, cz + r], { skip });
  b.box('wood', [cx - r - t, y, cz - r], [cx - r + t, y + th, cz + r], { skip });
}

// 行灯の四方の和紙（中ほどが明るい）
function addLanternPaper(b, cx, cz, r, y0, h, index, tone = 1) {
  const paperK = (x, y) => ANDON_PAPER_K * (0.72 + 0.5 * Math.sin(Math.PI * (y - y0) / h));
  const u0 = Math.random(), v0 = Math.random();
  const opts = { nu: 2, nv: 8, kFn: paperK, tone, uv: [u0, v0, u0 + 0.26, v0 + 0.5] };
  const w = r * 2;
  for (const [px, pz, ux, uz] of [[-r, r, w, 0], [r, -r, -w, 0], [r, r, 0, -w], [-r, -r, 0, w]]) {
    b.quad(`andonPaper${index}`, [cx + px, y0, cz + pz], [ux, 0, uz], [0, h, 0], opts);
  }
}

// 廊下の吊り行灯。区画の境（部屋の間隔ごと）に下げる。下から見上げるので、底は光で埋める
function addCorridorLamp(b, index) {
  b.setWall(0);
  const cx = H, cz = lampZ(b.plan), r = LAMP_W / 2, t = 0.006;
  const y1 = LAMP_TOP, y0 = y1 - LAMP_H;
  for (const [sx, sz] of LANTERN_CORNERS) {
    const x = cx + sx * r, z = cz + sz * r;
    b.box('wood', [x - t, y0 - 0.012, z - t], [x + t, y1, z + t], { skip: '+y', tone: 1.1 });
  }
  addLanternRim(b, cx, cz, r, t, y0 - 0.012, 0.012, '');
  b.box('wood', [cx - r - t, y1, cz - r - t], [cx + r + t, y1 + 0.012, cz + r + t], { tone: 1.1 });   // 天板
  b.box('wood', [cx - 0.003, y1 + 0.012, cz - 0.003], [cx + 0.003, CEIL_H, cz + 0.003], { skip: '+y-y' });   // 吊り紐
  addLanternPaper(b, cx, cz, r, y0, LAMP_H, index, LAMP_TONE);
  b.quad(`andonFlame${index}`, [cx - r, y0 + 0.02, cz - r], [r * 2, 0, 0], [0, 0, r * 2], { kFn: () => ANDON_PAPER_K, tone: LAMP_TONE });
}

// 行灯。木の枠に和紙を張った箱で、上は開いている
function addAndon(b, cx, cz, index) {
  b.setWall(0);
  const r = ANDON_W / 2, t = 0.009;
  const y0 = 0.09, y1 = ANDON_H - 0.02;
  const h = y1 - y0;
  // 脚と台
  for (const [sx, sz] of LANTERN_CORNERS) {
    const x = cx + sx * r, z = cz + sz * r;
    b.box('wood', [x - t, 0, z - t], [x + t, ANDON_H, z + t], { skip: '-y', tone: 1.1 });
  }
  b.box('wood', [cx - r - t, y0 - 0.02, cz - r - t], [cx + r + t, y0, cz + r + t], { skip: '-y', tone: 1.1 });
  // 上端の枠
  addLanternRim(b, cx, cz, r, t, y1, 0.014, '-y');
  // 和紙。上から見える内側は光で埋める
  addLanternPaper(b, cx, cz, r, y0, h, index);
  b.quad(`andonFlame${index}`, [cx - r, y1 - 0.04, cz + r], [r * 2, 0, 0], [0, 0, -r * 2], { kFn: () => ANDON_PAPER_K });
}

const paperColorFix = new THREE.Color().setRGB(...PAPER_COLOR_FIX);
const POOL_GEOMETRY = new THREE.PlaneGeometry(1, 1);
const HAZE_GEOMETRY = new THREE.PlaneGeometry(PANEL_W * 2, KAMOI_H);
const hazeTextures = HAZE_FLOW.map(() => textures.haze.clone());

// 再利用する 1 部屋。材質は部屋ごとに持ち、選んだ色・テクスチャを当てる
class Room {
  constructor() {
    this.group = new THREE.Group();
    this.group.rotation.order = 'YXZ';
    this.groups = {};
    for (const name of ['static', 'entry', 'left', 'right']) {
      this.groups[name] = new THREE.Group();
      this.group.add(this.groups[name]);
    }
    scene.add(this.group);
    const mat = (map, color) => new THREE.MeshBasicMaterial({ map: map ?? null, vertexColors: true, color });
    this.materials = {
      tatami: mat(textures.tatami, 0xffffff),
      edge: mat(null, 0xffffff),
      base: mat(null, 0x0d0a08),
      earth: mat(textures.earth, 0xffffff),
      wood: mat(textures.wood, 0x5b4029),
      sill: mat(textures.wood, 0x8b6b47),
      ceiling: mat(textures.ceiling, 0xffffff),
      lacquer: mat(null, 0x15110f),
      metal: mat(null, 0x806c40),
      paper: mat(textures.washi, PAPER_COLOR),
      fusuma: mat(textures.fusuma[0], 0xffffff),
      scroll: mat(textures.scroll, 0xffffff),
      log: mat(null, 0x6a5038),
      pot: mat(textures.pot, 0xffffff),
    };
    // 壺は暖色の灯りを打ち消して、白と青に見せる
    this.materials.pot.color.setRGB(...POT_COLOR_FIX);
    // 行灯ごとの材質（蝋燭の揺らぎを別々に当てる）。にじみ・芯・光だまりは加算で重ねる
    const glowSprite = (color, opacity) => new THREE.SpriteMaterial({
      map: textures.glow, color, opacity, blending: THREE.AdditiveBlending, depthWrite: false,
    });
    this.andonParts = [];
    for (let i = 0; i < ANDON_MAX; i++) {
      this.materials[`andonPaper${i}`] = mat(textures.washi, ANDON_PAPER_COLOR);
      this.materials[`andonFlame${i}`] = mat(null, ANDON_FLAME_COLOR);
      this.materials[`andonGlow${i}`] = glowSprite(ANDON_GLOW_COLOR, ANDON_GLOW_OPACITY);
      this.materials[`andonCore${i}`] = glowSprite(ANDON_CORE_COLOR, ANDON_CORE_OPACITY);
      this.materials[`andonPool${i}`] = new THREE.MeshBasicMaterial({
        map: textures.glow, color: ANDON_GLOW_COLOR, transparent: true, opacity: ANDON_POOL_OPACITY,
        blending: THREE.AdditiveBlending, depthWrite: false,
      });
      const glow = new THREE.Sprite(this.materials[`andonGlow${i}`]);
      glow.scale.setScalar(ANDON_GLOW_SIZE);
      const core = new THREE.Sprite(this.materials[`andonCore${i}`]);
      core.scale.set(ANDON_CORE_SIZE, ANDON_CORE_SIZE * 1.5, 1);
      const pool = new THREE.Mesh(POOL_GEOMETRY, this.materials[`andonPool${i}`]);
      pool.rotation.x = -Math.PI / 2;
      pool.scale.setScalar(ANDON_POOL_SIZE);
      this.group.add(glow, core, pool);
      this.andonParts.push({ glow, core, pool });
    }
    // 開いた建具の先に掛ける霞の幕（2 枚を別々に流す）
    this.hazeLayers = hazeTextures.map((map) => {
      const mesh = new THREE.Mesh(HAZE_GEOMETRY, new THREE.MeshBasicMaterial({
        map, color: HAZE_COLOR, transparent: true, opacity: 0, depthWrite: false,
      }));
      mesh.visible = false;
      this.group.add(mesh);
      return mesh;
    });
    this.baseColors = {};
    for (const key in this.materials) this.baseColors[key] = this.materials[key].color.clone();
    this.plan = null;
  }

  build(plan) {
    this.plan = plan;
    for (const g of Object.values(this.groups)) {
      for (const mesh of [...g.children]) {
        mesh.geometry.dispose();
        g.remove(mesh);
      }
      g.position.set(0, 0, 0);
    }
    this.baseColors.earth.set(plan.earth);
    this.baseColors.edge.set(plan.edge);
    this.baseColors.ceiling.set(plan.ceiling);
    this.baseColors.paper.set(PAPER_COLOR).multiply(paperColorFix).multiplyScalar(plan.corridor ? CORRIDOR_PAPER : 1);
    this.materials.fusuma.map = plan.fusuma;
    this.baseColors.fusuma.setRGB(...(plan.fusuma.userData.colorFix ?? [1, 1, 1]));

    const b = new RoomBuilder(plan);
    if (plan.corridor) {
      buildCorridor(b);
    } else {
      buildFloor(b);
      buildCeiling(b);
      buildPosts(b);
      for (let i = 0; i < 4; i++) addWall(b, i, i === plan.exit);
      plan.andons.forEach(([x, z], i) => addAndon(b, x, z, i));
    }
    // 霞は出口の建具のすぐ向こうに置く（建具が開くと見える）
    const hazeDist = exitDist(plan) + 0.09;
    for (const haze of this.hazeLayers) {
      haze.position.set(plan.exitX - WALL_SIN[plan.exit] * hazeDist, KAMOI_H / 2, -WALL_COS[plan.exit] * hazeDist);
      haze.rotation.y = WALL_YAW[plan.exit];
    }
    this.setHaze(0);
    this.andonParts.forEach(({ glow, core, pool }, i) => {
      const at = plan.andons[i];
      glow.visible = core.visible = pool.visible = !!at;
      if (at) pool.position.set(at[0], 0.004, at[1]);
    });
    // 廊下の吊り行灯のにじみ。最初の廊下で作る（three.js の UUID で乱数の列がずれないよう、それまでは作らない）
    if (plan.corridor) {
      this.lampGlows ??= Array.from({ length: CORRIDOR_BAY_COUNT }, (_, i) => {
        const glow = new THREE.Sprite(this.materials[`andonGlow${i % 2}`]);
        glow.scale.setScalar(LAMP_GLOW_SIZE);
        this.group.add(glow);
        return glow;
      });
    }
    this.lampGlows?.forEach((glow, i) => {
      glow.visible = !!plan.corridor;
      if (plan.corridor) glow.position.set((i - CORRIDOR_BAYS) * plan.walkDir * ROOM + H, LAMP_TOP - LAMP_H / 2, lampZ(plan));
    });
    for (const m of b.buckets.values()) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(m.position, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(m.uv, 2));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(m.color, 3));
      geo.setIndex(m.index);
      this.groups[m.target].add(new THREE.Mesh(geo, this.materials[m.key]));
    }
  }

  // 霞の濃さを当てる（2 枚を重ねたときに opacity の濃さになるようにする）
  setHaze(opacity) {
    const layer = 1 - Math.sqrt(1 - opacity);
    for (const haze of this.hazeLayers) {
      haze.material.opacity = layer;
      haze.visible = opacity > 0;
    }
  }

  // 部屋全体の明るさの倍率を当てる。行灯の材質には蝋燭の揺らぎも掛ける（名前の末尾が行灯の番号）
  setBrightness(value) {
    const dim = this.plan.corridor ? CORRIDOR_DIM : 1;
    for (const key in this.materials) {
      const isLantern = key.startsWith('andon');   // 灯りそのものは廊下でも暗くしない
      const candle = isLantern ? candles[Number(key.at(-1))].brightness : 1;
      this.materials[key].color.copy(this.baseColors[key]).multiplyScalar(value * candle * (isLantern ? 1 : dim));
    }
  }

  // 行灯のにじみと芯を、カメラ側の和紙の手前に置く（和紙に隠れないように）。芯は蝋燭の炎に合わせて小さく揺らす
  placeGlows() {
    this.group.updateMatrixWorld();
    const eye = this.group.worldToLocal(camera.position.clone());
    if (this.plan.corridor) {   // 吊り行灯のにじみが天井と交わる線で切れないよう、廊下の中からは深度を見ない
      for (let i = 0; i < ANDON_MAX; i++) this.materials[`andonGlow${i}`].depthTest = Math.abs(eye.z) > CORRIDOR_HALF;
    }
    this.plan.andons.forEach(([x, z], i) => {
      const { glow, core } = this.andonParts[i];
      // 目が部屋の中にあるときは、壁と交わる線で切れないよう深度を見ない。部屋の外からは壁を透けないよう深度を見る
      glow.material.depthTest = Math.max(Math.abs(eye.x), Math.abs(eye.z)) > H;
      const dx = eye.x - x, dz = eye.z - z, len = Math.hypot(dx, dz) || 1;
      const front = ANDON_W / 2 + 0.02;
      const nx = dx / len, nz = dz / len;
      const y = ANDON_H * 0.55;
      glow.position.set(x + nx * front, y, z + nz * front);
      core.position.set(x + nx * front - nz * candles[i].sway, y + candles[i].sway * 0.8, z + nz * front + nx * candles[i].sway);
    });
  }

  // 床の高さ。廊下は全体を下げて置く（カメラの高さは変えないので、出入りで視線は上下しない）
  get floorY() { return this.plan.corridor ? -CORRIDOR_DROP : 0; }

  // いまの部屋として原点に置く
  placeAtOrigin() {
    this.group.position.set(0, this.floorY, 0);
    this.group.rotation.set(0, 0, 0);
    this.group.visible = true;
    this.groups.entry.visible = true;
  }

  // 計画 from の部屋の出口の先へ置く（建具が開くまでは描かない）。重力が変わる部屋は、進行方向の軸（部屋の高さの中央）のまわりに回して置く
  placeBeyond(from) {
    const { exit, exitX } = from;
    const pitch = exitDist(from) + WALL_T + exitDist(this.plan);
    this.group.rotation.set(0, WALL_YAW[exit], this.plan.roll);
    const axis = new THREE.Vector3(0, CEIL_H / 2, 0);
    const turned = axis.clone().applyQuaternion(this.group.quaternion);
    this.group.position.set(exitX - WALL_SIN[exit] * pitch - turned.x, axis.y - turned.y + this.floorY, -WALL_COS[exit] * pitch - turned.z);
    this.group.visible = false;
    this.groups.entry.visible = false;
  }

  // 出口の中央の 2 枚を動かす。open は 0..1
  setDoor(open) {
    const exit = this.plan.exit;
    const d = PANEL_SLIDE * open;
    const ax = WALL_COS[exit], az = -WALL_SIN[exit];
    this.groups.left.position.set(-ax * d, 0, -az * d);
    this.groups.right.position.set(ax * d, 0, az * d);
  }
}

const rooms = [new Room(), new Room()];
let current = rooms[0];
let next = rooms[1];


// ---- 歩行 ----
const switchDist = (plan) => exitDist(plan) + WALL_T + ENTER_INSET + PIVOT_BACK;   // 背後の建具を切り替えるときの、部屋の中央からの歩いた距離
const pivot = new THREE.Vector2();   // 体の中心（いまの部屋の xz）
let yaw = 0;
let phase = 'enter';   // 'enter' | 'pause' | 'turn' | 'corridor' | 'walk'
let phaseTime = 0;
let turnFrom = 0;      // 'turn' の始めの向き
let turnDelta = 0;     // 'turn' で回る角度
let turnThen = 'walk'; // 'turn' のあとの段階
let corridorLeft = 0;  // 'corridor' で残りの歩く距離（m）
let walkSpeed = 0;
let walked = 0;        // 'walk' で部屋の中央から歩いた距離
let doorOpen = 0;      // 0..1（時間での進み）
let doorStarted = false;
let doorStartWalked = 0;   // 建具が開き始めたときの walked
let viewRoll = 0;      // 視点の傾き（重力の変わるときだけ 0 以外。ラジアン）
let rollAmount = 0;    // 視点が回る角度。0 なら回っていない（着地して歩き出すときに 0 へ戻す）
let rollBase = 0;      // 傾きの起点。座標を次の部屋へ戻すと -rollAmount になる
let rollProgress = 1;  // 0..1。1 なら回っていない
let vignetteLevel = 0; // 0..1。重力の回転に備えて周辺減光を濃くしている度合い

const durationFor = ({ k, min, max }) => clamp(k / speed, min, max);

function startRoomEntry() {
  pivot.set(0, H - ENTER_INSET - PIVOT_BACK);
  yaw = 0;
  phase = 'enter';
  walkSpeed = 0;
  walked = 0;
  doorOpen = 0;
  doorStarted = false;
  viewRoll = rollAmount = rollBase = 0;
  rollProgress = 1;
}

// 出口を抜けて、次の部屋へ移る。座標を次の部屋の原点へ戻す
function enterNextRoom() {
  const passed = walked, carriedSpeed = walkSpeed;   // 歩いた距離と速さは次の部屋へ引き継ぐ
  const carriedRoll = rollAmount !== 0 ? rollProgress : 0;   // 敷居で回り始めた分も引き継ぐ
  const previous = current;
  current = next;
  next = previous;
  current.placeAtOrigin();
  startRoomEntry();
  pivot.y = exitDist(previous.plan) + WALL_T + exitDist(current.plan) - passed;
  walkSpeed = carriedSpeed;
  if (current.plan.roll !== 0) {
    // 部屋を原点へ戻したので、部屋の傾きの分を視点の傾きへ移す。視点は続けて 0 へ戻る
    rollAmount = current.plan.roll;
    rollBase = -rollAmount;
    rollProgress = carriedRoll;
    viewRoll = rollBase + rollAmount * ease(rollProgress);
  }
  next.build(planRoom(current.plan));
  next.placeBeyond(current.plan);
}

// 壁 wall の向きへ、近いほうから回り始める。回り終えたら段階 then へ進む
function startTurn(wall, then) {
  turnFrom = yaw;
  turnDelta = WALL_YAW[wall] - yaw;
  if (turnDelta > Math.PI) turnDelta -= TAU;
  else if (turnDelta < -Math.PI) turnDelta += TAU;
  turnThen = then;
  phaseTime = 0;
  phase = 'turn';
}

// 部屋の中央で止まったあと、出口へ進み始める（左右の出口なら先に向きを変える。廊下なら歩く向きへ変える）
function startTurnOrWalk() {
  walked = 0;
  phaseTime = 0;
  const plan = current.plan;
  if (plan.corridor) {
    corridorLeft = plan.walkDist;
    startTurn(plan.walkWall, 'corridor');
  } else if (plan.exit === 0) {
    phase = 'walk';
  } else {
    startTurn(plan.exit, 'walk');
  }
}

// 廊下を出口の区画まで歩く
function updateCorridorWalk(dt, accel) {
  const plan = current.plan;
  const brake = Math.sqrt(2 * accel * Math.max(0, corridorLeft));
  walkSpeed = Math.max(MIN_WALK, Math.min(speed, walkSpeed + accel * dt, brake));
  const step = Math.min(corridorLeft, walkSpeed * dt);
  corridorLeft -= step;
  pivot.x += plan.walkDir * step;
  if (corridorLeft <= 0) {
    pivot.x = plan.exitX;
    walkSpeed = 0;
    walked = 0;
    startTurn(plan.exit, 'walk');
  }
}

function updateRoll(dt) {
  if (rollProgress >= 1) return;
  rollProgress = Math.min(1, rollProgress + dt / (durationFor(ROLL_TIME) * (Math.abs(rollAmount) === Math.PI ? ROLL_HALF_SCALE : 1)));
  viewRoll = rollBase + rollAmount * ease(rollProgress);
}

// 視点が回るあいだは歩みを緩める（着地したら元の速さに戻る）
const rollSlowdown = () => (rollProgress < 1 ? 1 - ROLL_SLOW * Math.sin(Math.PI * rollProgress) : 1);

const doorAhead = () => exitDist(current.plan) - (walked - PIVOT_BACK);   // カメラから建具までの距離

function updateWalk(dt) {
  updateRoll(dt);
  const accel = speed * speed / (2 * BRAKE_DIST);
  if (phase === 'enter') {
    // 直進するときは中央で減速せず、そのまま出口へ歩き続ける。重力が変わった部屋では中央で止まる
    const gravityChanged = rollAmount !== 0;
    const keepWalking = current.plan.exit === 0 && !gravityChanged && !current.plan.corridor;
    const brake = keepWalking ? speed : Math.sqrt(2 * accel * Math.max(0, pivot.y));
    walkSpeed = Math.max(MIN_WALK, Math.min(speed, walkSpeed + accel * dt, brake));
    pivot.y -= walkSpeed * rollSlowdown() * dt;
    if (pivot.y <= 0) {
      if (keepWalking) {
        walked = -pivot.y;
        phase = 'walk';
      } else {
        pivot.y = 0;
        walkSpeed = 0;
        if (gravityChanged) {
          phase = 'pause';
          phaseTime = GRAVITY_PAUSE;
        } else {
          startTurnOrWalk();
        }
      }
    }
  } else if (phase === 'pause') {
    phaseTime -= dt;
    if (phaseTime <= 0 && rollProgress >= 1) {
      // 回り終えて（着地して）から進む。次の部屋でも重力が変われるよう、傾きの状態を片付ける
      rollAmount = rollBase = 0;
      startTurnOrWalk();
    }
  } else if (phase === 'turn') {
    phaseTime += dt / durationFor(TURN_TIME);
    yaw = turnFrom + turnDelta * ease(Math.min(1, phaseTime));
    if (phaseTime >= 1) {
      yaw = turnFrom + turnDelta;
      phase = turnThen;
      walked = 0;
      walkSpeed = 0;
    }
  } else if (phase === 'corridor') {
    updateCorridorWalk(dt, accel);
  } else {
    updateExitWalk(dt, accel);
  }
}

function updateExitWalk(dt, accel) {
  const doorTime = durationFor(DOOR_TIME);
  const toExit = exitDist(current.plan);
  const toDoor = doorAhead();
  if (!doorStarted && toDoor <= DOOR_CLEAR + speed * doorTime) {
    doorStarted = true;
    doorStartWalked = walked;
    next.group.visible = true;
  }
  if (doorStarted && doorOpen < 1) {
    doorOpen = Math.min(1, doorOpen + dt / doorTime);
    current.setDoor(ease(doorOpen));
  }
  walkSpeed = Math.min(speed, Math.max(MIN_WALK, walkSpeed + accel * dt));
  walked += walkSpeed * rollSlowdown() * dt;
  const dir = current.plan.exit;
  pivot.set(current.plan.exitX - WALL_SIN[dir] * walked, -WALL_COS[dir] * walked);
  // カメラが敷居を跨いだ瞬間から、重力の向きに合わせて視点が回り始める
  if (next.plan.roll !== 0 && rollAmount === 0 && walked - PIVOT_BACK >= toExit) {
    rollAmount = next.plan.roll;
    rollProgress = 0;
  }
  if (walked >= switchDist(current.plan)) enterNextRoom();
}

function placeCamera() {
  // 目は体の中心より少し後ろ（向きを変えるときは体の中心のまわりを回る）
  // 重力が変わった直後は、部屋の高さの中央を軸に回る（目の高さが中央なら位置は変わらない）
  const offset = EYE_H - CEIL_H / 2;
  const side = -offset * Math.sin(viewRoll);
  camera.position.set(
    pivot.x + Math.sin(yaw) * PIVOT_BACK + Math.cos(yaw) * side,
    CEIL_H / 2 + offset * Math.cos(viewRoll),
    pivot.y + Math.cos(yaw) * PIVOT_BACK - Math.sin(yaw) * side,
  );
  camera.rotation.set(CAM_PITCH, yaw, viewRoll);
}

// 重力の回転の少し前から着地までと方向転換のあいだ、周辺減光を濃く広くして視野を狭める（酔いを抑えるため）
function updateVignette(dt) {
  const rollComing = phase === 'walk' && next.plan.roll !== 0 && doorAhead() <= speed * VIGNETTE_ROLL_LEAD;
  const target = rollComing || rollProgress < 1 ? 1 : phase === 'turn' ? VIGNETTE_TURN_LEVEL : 0;
  vignetteLevel = vignetteLevel < target
    ? Math.min(target, vignetteLevel + dt / VIGNETTE_ROLL_FADE[0])
    : Math.max(target, vignetteLevel - dt / VIGNETTE_ROLL_FADE[1]);
  const level = ease(vignetteLevel);
  vignette.material.opacity = lerp(VIGNETTE_STRENGTH, VIGNETTE_ROLL_STRENGTH, level);
  vignetteEdges.set(lerp(VIGNETTE_EDGES[0], VIGNETTE_ROLL_EDGES[0], level), lerp(VIGNETTE_EDGES[1], VIGNETTE_ROLL_EDGES[1], level));
}

function updateLight(dt) {
  const flicker = 1 + FLICKER * advanceWave(flickerPhases, FLICKER_RATES, FLICKER_WEIGHTS, dt);
  candlePhases.forEach((phases, i) => {
    const wave = advanceWave(phases, CANDLE_RATES, CANDLE_WEIGHTS, dt);
    candles[i].brightness = 1 + CANDLE_FLICKER * wave;
    candles[i].sway = CANDLE_SWAY * wave;
  });
  current.setBrightness(flicker);
  next.setBrightness(flicker);
  // 開いた建具の先は霞に溶け、カメラが近づくにつれて晴れる
  hazeTextures.forEach((map, i) => { map.offset.x = (map.offset.x + HAZE_FLOW[i] * dt + 1) % 1; });
  if (doorStarted) {
    const clearAt = exitDist(current.plan) + PIVOT_BACK - HAZE_CLEAR_DIST;
    const t = clamp((walked - doorStartWalked) / (clearAt - doorStartWalked), 0, 1);
    current.setHaze(HAZE_OPACITY * (1 - ease(t)));
  }
  updateFog();
  updateVignette(dt);
}

// 廊下の奥の暗がり。廊下にいるあいだだけ掛け、出入りの敷居をまたぐあいだに距離をなめらかに変える（0 に近いほど遠くへ退く）
function updateFog() {
  const inside = current.plan.corridor, entering = next.plan.corridor && doorStarted;
  let amount = inside ? 1 : 0;
  if (doorStarted && (inside || entering)) {
    const t = ease(clamp((walked - doorStartWalked) / (switchDist(current.plan) - doorStartWalked), 0, 1));
    amount = inside ? 1 - t : t;
  }
  const scale = 1 / Math.max(amount, 1e-3);
  scene.fog.near = CORRIDOR_FOG[0] * scale;
  scene.fog.far = CORRIDOR_FOG[1] * scale;
}


// ---- シーン切替 ----
function start() {
  current = rooms[0];
  next = rooms[1];
  current.build(planRoom(null));
  current.placeAtOrigin();
  next.build(planRoom(current.plan));
  next.placeBeyond(current.plan);
  startRoomEntry();
}

const reset = () => fadeAndRun(start);


// ---- 強度 ----
function setSpeed(value) {
  speed = clamp(value, MIN_SPEED, MAX_SPEED);
}


// ---- メインループ ----
let last = performance.now();
function tick(now) {
  const dt = Math.max(0, Math.min((now - last) / 1000, 0.1));
  last = now;
  if (!isFading()) updateWalk(dt);   // 暗転中は止めておく
  updateLight(dt);
  placeCamera();
  current.placeGlows();
  if (next.group.visible) next.placeGlows();
  renderer.setRenderTarget(sceneTarget);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  composer.render();
}


// ---- 入力・UI ----
setupControls({
  changeScene: reset,
  intensity: {
    up: () => setSpeed(speed * SPEED_STEP),
    down: () => setSpeed(speed / SPEED_STEP),
    level: () => logPosition(speed, MIN_SPEED, MAX_SPEED),
  },
  onResize() {
    fitCamera();
    renderer.setSize(innerWidth, innerHeight);
    updateSceneTargetSize();
    composer.setSize(innerWidth, innerHeight);
  },
});


// ---- 開始 ----
start();
renderer.setAnimationLoop(tick);
</script>
