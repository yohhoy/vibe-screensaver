// trees は木だけの色（TREE_COLORS）。省いたものは、元の素材の同じ段と同じ色にする

// 水面の模様（16×8 ドットの周期。o は少し明るい波頭）。目立たないよう、波頭はまばらにし、明るさも 1 段だけ上げる。タイルの幅 32・高さ 16 ドットを割り切る周期なので、
// 隣のタイルとも模様がつながる。コマごとに右へ WATER_SHIFT ドットずつずらして、波を流す
const WATER_PATTERN = [
  '................',
  '..ooo...........',
  '................',
  '................',
  '................',
  '..........ooo...',
  '................',
  '................',
];
const WATER_SHIFT = 2;         // 1 コマで模様をずらすドット数
const WATER_FRAMES = 16 / WATER_SHIFT;   // 模様が一回りするコマ数
const WATER_FRAME_TIME = 0.25; // 水面のアニメーションの 1 コマ（秒）

// ---- ユーティリティ ----
const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];   // 向き 0: +x（画面の右下）、1: +y（左下）、2: -x（左上）、3: -y（右上）
const at = (x, y) => y * N + x;
const corner = (x, y) => y * (N + 1) + x;
const inMap = (x, y) => x >= 0 && y >= 0 && x < N && y < N;
const opposite = (d) => (d + 2) & 3;
// 箱庭の中の、4 方向の隣のタイル
const neighbors = (i) => [0, 1, 2, 3].map((d) => [i % N + DX[d], ((i / N) | 0) + DY[d]]).filter(([x, y]) => inMap(x, y)).map(([x, y]) => at(x, y));
const LEFT = (d) => [DY[d], -DX[d]];             // 向き d に進むときの左（列車も自動車も左側を走る）
const lerp = (a, b, t) => a + (b - a) * t;
// f が最小になる要素（同じなら先のもの）
function minBy(list, f) {
  let best, bv = Infinity;
  for (const e of list) { const v = f(e); if (v < bv) { bv = v; best = e; } }
  return best;
}
// 箱庭の絵の上の位置（ドット）。(OX, OY) がタイル (0, 0) の奥の角（高さ 0）
const OX = N * 16, OY = (MAX_LEVEL + 2) * STEP_H;
const worldX = (u, v) => (u - v) * 16 + OX;
const worldY = (u, v, z) => (u + v) * 8 + OY - z;

// 位置から決まる 0〜1 の乱数（見た目のばらつき用。Math.random を引く回数を変えない）
function hash(x, y, s = 0) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// 位置から決まる、なめらかな値のノイズ（0〜1。cell タイルごとの格子点の hash を補間する。Math.random を引かない）
function hashNoise(x, y, cell, s = 0) {
  const fx = x / cell, fy = y / cell, ix = Math.floor(fx), iy = Math.floor(fy);
  const tx = fx - ix, ty = fy - iy, sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
  const a = hash(ix, iy, s), b = hash(ix + 1, iy, s), c = hash(ix, iy + 1, s), d = hash(ix + 1, iy + 1, s);
  return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
}

// 値のノイズ（0〜1 の座標で、cells 個の格子）
function valueNoise(cells) {
  const n = cells + 2, g = Float32Array.from({ length: n * n }, () => Math.random());
  return (x, y) => {
    const fx = x * cells, fy = y * cells, ix = Math.floor(fx), iy = Math.floor(fy);
    const tx = fx - ix, ty = fy - iy, sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
    const a = g[iy * n + ix], b = g[iy * n + ix + 1], c = g[(iy + 1) * n + ix], d = g[(iy + 1) * n + ix + 1];
    return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
  };
}

  const ns = octaves.map(([cells]) => valueNoise(cells));
  return (x, y) => octaves.reduce((s, [, w], k) => s + w * ns[k](x, y), 0);
}

// 表示するパレット（RGBA）

// 季節を COLOR_PRESETS の index 番に替え、パレットを作り直す。絵はパレット番号で持っているので、描き直さずに色だけ替わる
function setColorPreset(index) {

  for (const name of RAMP_NAMES) {
    const [d, m, l] = (ramps[name] ?? RAMP_COLORS[name]).map(parseHex);
    for (let k = 0; k < 8; k++) {

  if (colorPresetIndex < 0) return Math.floor(hash(seed, 1, 7) * COLOR_PRESETS.length);
  return (colorPresetIndex + 1 + Math.floor(hash(seed, 2, 7) * (COLOR_PRESETS.length - 1))) % COLOR_PRESETS.length;

in vec3 position;

const FRAGMENT_SHADER = /* glsl */`

// 画像はパレット番号の配列。(ox, oy) が箱庭の上の基準の点（地面の高さ 0）の位置
class Sprite {
  constructor(w, h, ox, oy) {
    this.w = Math.ceil(w); this.h = Math.ceil(h); this.ox = ox; this.oy = oy;
    this.data = new Uint8Array(this.w * this.h);
  }
  set(x, y, c) { if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.data[y * this.w + x] = c; }
  // 基準の点から (u, v) タイル、高さ z ドットの点の、画像の上の位置
  px(u, v, z) { return [this.ox + (u - v) * 16, this.oy + (u + v) * 8 - z]; }

// 画像の行ごとの不透明な区間 [y, 始まり, 終わり（含まない）]。初めて使うときに求めて画像に持たせる
function opaqueRuns(s) {
  if (!s.runs) {
    s.runs = [];
    for (let y = 0; y < s.h; y++) for (let x = 0; x < s.w;) {
      if (!s.data[y * s.w + x]) { x++; continue; }
      const a = x;
      while (x < s.w && s.data[y * s.w + x]) x++;
      s.runs.push([y, a, x]);
    }
  }
  return s.runs;
}

// 多角形を塗る。c は色の番号か、(x, y) → 色の番号（0 なら塗らない）
function fillPoly(s, pts, c) {
  let y0 = Infinity, y1 = -Infinity;
  for (const [, y] of pts) { y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  const fn = typeof c === 'function';
  for (let y = Math.max(0, Math.floor(y0)); y <= Math.min(s.h - 1, Math.ceil(y1)); y++) {
    const yc = y + 0.5, xs = [];
    for (let k = 0; k < pts.length; k++) {
      const [ax, ay] = pts[k], [bx, by] = pts[(k + 1) % pts.length];
      if ((ay <= yc) !== (by <= yc)) xs.push(ax + (yc - ay) / (by - ay) * (bx - ax));
    }
    xs.sort((a, b) => a - b);
    for (let k = 0; k + 1 < xs.length; k += 2) {
      const xa = Math.max(0, Math.ceil(xs[k] - 0.5)), xb = Math.min(s.w - 1, Math.ceil(xs[k + 1] - 0.5) - 1);
      for (let x = xa; x <= xb; x++) {
        const v = fn ? c(x, y) : c;
        if (v) s.data[y * s.w + x] = v;
      }
    }
  }
}

// 箱の面。f は色の番号か、(a, z) → 色の番号（a: 面の左端からのドット、z: 面の下端からのドット）
// 左の面（v = v1）は光が当たり、右の面（u = u1）は陰になる。zClip より上は描かない（建設中のビルの外壁を下から仕上げるとき）
let zClip = Infinity;
function faceL(s, u0, u1, v, z0, z1, f) {
  z1 = Math.min(z1, zClip);
  if (z1 <= z0) return;
  const [xl, yl] = s.px(u0, v, 0);
  fillPoly(s, [s.px(u0, v, z0), s.px(u1, v, z0), s.px(u1, v, z1), s.px(u0, v, z1)],
    typeof f !== 'function' ? f : (x, y) => {
      const a = x + 0.5 - xl;
      return f(Math.floor(a), Math.floor(yl + a / 2 - y - 0.5 - z0));
    });
}
function faceR(s, v0, v1, u, z0, z1, f) {
  z1 = Math.min(z1, zClip);
  if (z1 <= z0) return;
  const [xl, yl] = s.px(u, v1, 0);
  fillPoly(s, [s.px(u, v1, z0), s.px(u, v0, z0), s.px(u, v0, z1), s.px(u, v1, z1)],
    typeof f !== 'function' ? f : (x, y) => {
      const a = x + 0.5 - xl;
      return f(Math.floor(a), Math.floor(yl - a / 2 - y - 0.5 - z0));
    });

  if (z > zClip) return;

}
function box(s, u0, v0, u1, v1, z0, z1, top, left, right) {
  faceL(s, u0, u1, v1, z0, z1, left);
  faceR(s, v0, v1, u1, z0, z1, right);
  faceT(s, u0, v0, u1, v1, z1, top);
}

// 切妻屋根。alongU なら棟が u に沿う。妻の壁は wallL（左の面）・wallR（右の面）
function gable(s, u0, v0, u1, v1, z, rh, alongU, ramp, wallL, wallR) {
  const tile = (lvl) => (x, y) => col(ramp, lvl - (y % 2));
  if (alongU) {
    const vm = (v0 + v1) / 2;
    fillPoly(s, [s.px(u0, v0, z), s.px(u1, v0, z), s.px(u1, vm, z + rh), s.px(u0, vm, z + rh)], tile(4));
    fillPoly(s, [s.px(u1, v0, z), s.px(u1, v1, z), s.px(u1, vm, z + rh)], wallR);
    fillPoly(s, [s.px(u0, v1, z), s.px(u1, v1, z), s.px(u1, vm, z + rh), s.px(u0, vm, z + rh)], tile(6));
  } else {
    const um = (u0 + u1) / 2;
    fillPoly(s, [s.px(u0, v0, z), s.px(u0, v1, z), s.px(um, v1, z + rh), s.px(um, v0, z + rh)], tile(6));
    fillPoly(s, [s.px(u1, v0, z), s.px(u1, v1, z), s.px(um, v1, z + rh), s.px(um, v0, z + rh)], tile(3));
    fillPoly(s, [s.px(u0, v1, z), s.px(u1, v1, z), s.px(um, v1, z + rh)], wallL);
  }
}

// 地面に落ちる影（右下の u の向きへ、高さに応じた長さ）
function shadow(s, u0, v0, u1, v1, h) {
  const len = Math.min(0.45, Math.min(h, zClip) * 0.014);
  fillPoly(s, [s.px(u1, v0, 0), s.px(u1 + len, v0, 0), s.px(u1 + len, v1, 0), s.px(u1, v1, 0)], SHADOW);
}

// 大きさ fw×fd タイル、高さ maxZ ドットまでの建物の画像
function buildingSprite(fw, fd, maxZ) {
  return new Sprite((fw + fd) * 16 + 20, (fw + fd) * 8 + maxZ + 14, fd * 16, maxZ + 4);
}

// 箱の建物の共通の形: 影と壁の箱。wall(lvl) は面の色（光の当たる左の面は 5、陰の右の面は 3）。extra は壁の上に要る高さ（屋根など）
function walls(fw, fd, [u0, v0, u1, v1], h, extra, shadowH, wall) {
  const s = buildingSprite(fw, fd, h + extra);
  shadow(s, u0, v0, u1, v1, shadowH);
  box(s, u0, v0, u1, v1, 0, h, 0, wall(5), wall(3));
  s.tiers = [[u0, v0, u1, v1, 0, h]];   // 壁の箱 [u0, v0, u1, v1, 下の高さ, 上の高さ]（クレーンで積み上げて建てるときに使う）
  return s;
}
// 切妻屋根の建物。軒は eave だけ出し、妻の壁は ends（左・右の色の番号）
function gableBuilding(fw, fd, rect, h, rh, wall, roof, alongU, ends, eave = 0.05) {
  const s = walls(fw, fd, rect, h, rh + 2, h + rh, wall), [u0, v0, u1, v1] = rect;
  gable(s, u0 - eave, v0 - eave, u1 + eave, v1 + eave, h, rh, alongU, roof, ...ends);
  return s;
}
// 平らな屋根の建物（屋根はふちを 1 段暗く）

// 団地・マンション: 長い面にベランダの横線、短い面に小さな窓

const pick2 = (arr, r) => arr[Math.floor(r * arr.length) % arr.length];

// クレーンで建てるビルの、建設中のコマ。外壁は高さ c まで積み上がり、その上にタワークレーンが載る。

function craneSiteImage(type, vr, fw, fd, c, crane, alongU) {
  return cached(`k:${type}:${vr}:${fw}:${fd}:${c}:${crane}:${alongU}`, () => {

    const s = new Sprite((fw + fd) * 16 + 20 + CRANE_PAD * 2, (fw + fd) * 8 + maxZ + 14, fd * 16 + CRANE_PAD, maxZ + 4);
    // 積み上がった外壁（高さ c で切り、切り口に床を張る）
    zClip = c;
    const facade = makeBuilding(type, vr, fw, fd);
    zClip = Infinity;
    for (let y = 0; y < facade.h; y++) for (let x = 0; x < facade.w; x++) {
      const v = facade.data[y * facade.w + x];
      if (v) s.set(x + s.ox - facade.ox, y + s.oy - facade.oy, v);
    }
    for (const [u0, v0, u1, v1, z0, z1] of full.tiers) if (c > z0 && c < z1) faceT(s, u0, v0, u1, v1, c, col('concrete', 4));
    if (!crane) return s;
    // タワークレーン（赤と白の縞）: 積み上がったてっぺんの段の上面の中央にマストを立て、上にジブを載せる（ワイヤーや吊り荷は描かない）

    // 影と幹

    if (kind === 0) {
      // 針葉樹: 三角。左半分を明るく
      const hgt = 10 + big * 2;
      for (let k = 0; k < hgt; k++) {
        const y = 20 - hgt + k, w = Math.floor((k + 1) * 0.3);

const TREE_SPOTS = [[0.28, 0.3], [0.72, 0.36], [0.4, 0.72], [0.78, 0.78]];
function makeTrees(i, n, conifer) {
  const kind = Math.random() < conifer ? 0 : 1, list = [];
  for (let k = 0; k < n; k++) {
    const [u, v] = TREE_SPOTS[k % TREE_SPOTS.length];
    list.push({ u: u + rand(-0.06, 0.06), v: v + rand(-0.06, 0.06), sprite: treeImage(kind, randInt(8)) });
  }
  list.sort((a, b) => a.u + a.v - b.u - b.v);

  for (const p of placed) {
    if (d % 2 === 0) box(s, p.a0, p.b0, p.a1, p.b1, p.z0, p.z1, p.top, p.left, p.right);

  const sorted = Float32Array.from(val).sort();
  const thr = sorted[Math.floor(sorted.length * (1 - HILL_SHARE))], top = sorted[sorted.length - 1];
  for (let k = 0; k < val.length; k++) hc[k] = val[k] > thr ? Math.min(MAX_LEVEL, 1 + Math.floor((val[k] - thr) / (top - thr) * MAX_LEVEL)) : 0;
  // 平野の中の低い丘（高さ 3 段まで）。山と違って林で覆わないので、草地が多く残り、斜面の明暗で起伏が見える
  for (let k = 0; k < PLAIN_HILLS; k++) {
    const a = Math.random() * 6.28, r = rand(8, 22), hx = N / 2 + Math.cos(a) * r, hy = N / 2 + Math.sin(a) * r;
    const rad = rand(...PLAIN_HILL_RADIUS), peak = rand(2, 3.4);
    for (let cy = 0; cy <= N; cy++) for (let cx = 0; cx <= N; cx++) {
      const lv = Math.round(peak * Math.exp(-(((cx - hx) ** 2 + (cy - hy) ** 2) / (rad * rad))) - 0.3);
      if (lv > hc[corner(cx, cy)]) hc[corner(cx, cy)] = lv;
    }
  }
  const pinned = new Uint8Array(val.length);
  const pinTile = (x, y) => { for (const [cx, cy] of [[x, y], [x + 1, y], [x, y + 1], [x + 1, y + 1]]) { hc[corner(cx, cy)] = 0; pinned[corner(cx, cy)] = 1; } };
  terr.fill(0);
  waterMask.fill(0);

  // 海: 箱庭の一辺に、ゆるく曲がった岸で
  let seaSide = -1;
  if (Math.random() < SEA_CHANCE) {
    seaSide = randInt(4);
    const coast = valueNoise(4);
    // 川と同じく、格子点ごとに水か陸かを決め、岸のタイルは斜めに切った形にする
    const wet = new Uint8Array((N + 1) * (N + 1));
    for (let cy = 0; cy <= N; cy++) for (let cx = 0; cx <= N; cx++) {
      const s = [cx, cy, N - cx, N - cy][seaSide], along = [cy, cx, cy, cx][seaSide];
      if (s < lerp(SEA_DEPTH[0], SEA_DEPTH[1], coast(along / N, 0.5))) wet[corner(cx, cy)] = 1;
    }
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const m = wetMask(wet, x, y);
      if (m) { terr[at(x, y)] = 2; waterMask[at(x, y)] = m; pinTile(x, y); }
    }
  }
  relaxHeights(pinned);

  // 川: 箱庭の端から、反対の端か海へ
  const startSide = seaSide >= 0 ? (seaSide + 2) & 3 : randInt(4);
  riverAxis = startSide % 2;
  // 始まりと終わりの端の点を結ぶ線を、大きくうねらせる（川のまわりはあとで平らにならすので、丘は避けなくてよい）
  const edgePoint = (side, a) => [[0, a], [a, 0], [N, a], [a, N]][side];
  const [sx, sy] = edgePoint(startSide, N * rand(0.3, 0.7)), [ex, ey] = edgePoint((startSide + 2) & 3, N * rand(0.3, 0.7));
  const len = Math.hypot(ex - sx, ey - sy), nx = -(ey - sy) / len, ny = (ex - sx) / len, bend = valueNoise(3);
  const steps = Math.ceil(len / 3);
  let pts = [];
  for (let k = 0; k <= steps; k++) {
    const t = k / steps, b = (bend(t, 0.5) - 0.5) * 2 * RIVER_BEND * Math.sin(Math.PI * t);
    pts.push([lerp(sx, ex, t) + nx * b, lerp(sy, ey, t) + ny * b]);
  }
  // 3 タイルおきの点を横へゆるく揺らしてから角を丸め、なめらかな中心線にする
  const phase = Math.random() * 6.28;
  pts = pts.map(([x, y], k) => {
    if (k === 0 || k === pts.length - 1) return [x, y];
    const [ax, ay] = pts[k - 1], [bx, by] = pts[k + 1], l = Math.hypot(bx - ax, by - ay) || 1;
    const a = RIVER_MEANDER * Math.sin(k * 3 * 6.28 / RIVER_WAVELENGTH + phase);
    return [x - (by - ay) / l * a, y + (bx - ax) / l * a];
  });
  // 端は箱庭の外まで延ばす
  const extend = (p, q) => {
    const l = Math.hypot(p[0] - q[0], p[1] - q[1]) || 1;
    return [p[0] + (p[0] - q[0]) / l * 2, p[1] + (p[1] - q[1]) / l * 2];
  };
  pts.unshift(extend(pts[0], pts[1]));
  pts.push(extend(pts[pts.length - 1], pts[pts.length - 2]));
  for (let it = 0; it < 4; it++) pts = chaikin(pts);
  // 格子点を水にする中心線からの距離（川幅の半分ほど）は、流れに沿ってゆるやかに変える
  const widthNoise = valueNoise(5), river = [];
  for (let k = 0; k + 1 < pts.length; k++) {
    const w = (t) => lerp(RIVER_HALF_WIDTH[0], RIVER_HALF_WIDTH[1], widthNoise(t, 0.5));
    river.push([...pts[k], ...pts[k + 1], w(k / pts.length), w((k + 1) / pts.length)]);
  }
  // マス目は守る: 格子点ごとに水か陸かを決め、タイルの水面はその 4 隅から、全面・半分・斜めに切った形のどれかにする
  const wet = new Uint8Array((N + 1) * (N + 1));
  for (let cy = 0; cy <= N; cy++) for (let cx = 0; cx <= N; cx++) {
    const { d, w } = nearestRiver(river, cx, cy);
    if (d < w) wet[corner(cx, cy)] = 1;
    // 川の両岸の近くは平らにする（橋を渡った先がすぐ斜面にならないように）
    if (d < w + RIVER_FLAT) { hc[corner(cx, cy)] = 0; pinned[corner(cx, cy)] = 1; }
  }
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = at(x, y), m = wetMask(wet, x, y);
    if (!m) continue;
    if (terr[i] !== 2) terr[i] = 1;   // 海の岸のタイルに川が流れ込む所は、海のまま水の隅を足す
    waterMask[i] |= m;
    pinTile(x, y);
  }
  relaxHeights(pinned);

  // 街の中心: 箱庭の中ほどの平らな所で、川から少し離れた所
  const water = bfsDistance((i) => terr[i] !== 0);
  let best = -Infinity;
  for (let y = 12; y < N - 12; y++) for (let x = 12; x < N - 12; x++) {
    const i = at(x, y);
    if (terr[i] || tmax[i] || water[i] < 2 || water[i] > 6) continue;
    let flat = 0;
    for (let dy = -8; dy <= 8; dy += 2) for (let dx = -8; dx <= 8; dx += 2) {
      const j = at(clamp(x + dx, 0, N - 1), clamp(y + dy, 0, N - 1));
      if (!terr[j] && !tmax[j]) flat++;
    }
    const score = flat - Math.hypot(x - N / 2, y - N / 2) * 0.5 + Math.random() * 8;
    if (score > best) { best = score; town = { x, y }; }
  }
  if (best === -Infinity) town = { x: N >> 1, y: N >> 1 };

  // 地面と林
  const forestNoise = fbm([[5, 1], [11, 0.5]]);
  gtype.fill(G_GRASS);
  trees.fill(null);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = at(x, y);
    if (terr[i]) continue;
    if (tmin[i] === 0 && [0, 1, 2, 3].some((d) => seaAt(x + DX[d], y + DY[d]))) { gtype[i] = G_SAND; continue; }
    const mountain = tmax[i] >= FOREST_LEVEL;
    const near = Math.hypot(x - town.x, y - town.y) < 5;
    if (!near && (mountain || forestNoise(x / N, y / N) > 1.5 - FOREST_SHARE * 1.2)) {
      gtype[i] = G_FOREST;
      trees[i] = makeTrees(i, 3 + randInt(2), mountain ? 0.7 : 0.3);
    } else if (Math.random() < SCATTERED_TREES * (0.3 + forestNoise(x / N, y / N))) {
      // 草地のところどころに 1〜2 本の木（林の近くほど多い）。建物や道ができると消える
      trees[i] = makeTrees(i, 1 + randInt(2), 0.3);
    }
  }
}

// タイルの 4 隅の水の格子点を、ビットにまとめる
const wetMask = (wet, x, y) => wet[corner(x, y)] | wet[corner(x + 1, y)] << 1 | wet[corner(x + 1, y + 1)] << 2 | wet[corner(x, y + 1)] << 3;

// 角を丸める（両端は残す）
function chaikin(p) {
  const q = [p[0]];
  for (let k = 0; k + 1 < p.length; k++) {
    const [ax, ay] = p[k], [bx, by] = p[k + 1];
    q.push([ax * 0.75 + bx * 0.25, ay * 0.75 + by * 0.25], [ax * 0.25 + bx * 0.75, ay * 0.25 + by * 0.75]);
  }
  q.push(p[p.length - 1]);
  return q;
}
// 川の中心線の 1 区間 [ax, ay, bx, by, 幅a, 幅b] までの距離と、そこでの幅
function segmentDistance(x, y, [ax, ay, bx, by, wa, wb]) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1;
  const t = clamp(((x - ax) * dx + (y - ay) * dy) / l2, 0, 1);
  return { d: Math.hypot(x - ax - dx * t, y - ay - dy * t), w: lerp(wa, wb, t) };
}
const nearestRiver = (segs, x, y) => minBy(segs.map((sg) => segmentDistance(x, y, sg)), (r) => r.d);

// 条件に合うタイルからの歩数（4 近傍）
function bfsDistance(isSource) {
  const dist = new Int16Array(N * N).fill(999), queue = [];
  for (let i = 0; i < N * N; i++) if (isSource(i)) { dist[i] = 0; queue.push(i); }
  for (let q = 0; q < queue.length; q++) {
    const i = queue[q];
    for (const j of neighbors(i)) if (dist[j] > dist[i] + 1) { dist[j] = dist[i] + 1; queue.push(j); }
  }
  return dist;
}

// ---- 街の計画 ----
// 線路・駅・道・区画を、土地を作ったときに決めておく（建てるのは時代ごと）
const mod = (a, b) => ((a % b) + b) % b;
function planTown() {
  openKind.fill(0);
  planRail();
  makeZones();
  pickIndustry();
  planRoads();
  planLots();
  markIndustry();
}
// 工業地区にできる、平らな陸のタイル（砂浜・線路・駅の予定地を除く）
const industryLand = (i) => !terr[i] && isFlat(i) && gtype[i] !== G_SAND && !railMask[i] && !reserved[i];
// 工業地区: 市街の外れの、平らな陸が多い所を 1 か所選ぶ。川を渡らずに街の中心から行ける側に限り、
// 地区の中の道の格子が、橋を回らずに街の道とつながるようにする（大回りでつながると、道の開通が遅れて工場が建たない）
function pickIndustry() {
  industryRect = null;
  const h = INDUSTRY_HALF, size = (2 * h + 1) ** 2;
  // 街の中心から、水を渡らずに行けるタイル
  const reach = new Uint8Array(N * N), queue = [at(town.x, town.y)];
  reach[queue[0]] = 1;
  for (let q = 0; q < queue.length; q++) for (const j of neighbors(queue[q])) if (!terr[j] && !reach[j]) { reach[j] = 1; queue.push(j); }
  let bestScore = -Infinity;
  for (let y = h + 1; y < N - h - 1; y++) for (let x = h + 1; x < N - h - 1; x++) {
    const d = Math.hypot(x - town.x, y - town.y);
    if (d < INDUSTRY_DIST[0] || d > INDUSTRY_DIST[1] || !reach[at(x, y)]) continue;
    let flat = 0;
    for (let b = -h; b <= h; b++) for (let a = -h; a <= h; a++) flat += industryLand(at(x + a, y + b));
    if (flat < size * INDUSTRY_MIN_FLAT) continue;
    const score = flat / size + hash(x, y, landSeed + 53) * 0.3;
    if (score > bestScore) { bestScore = score; industryRect = { x0: x - h, y0: y - h, x1: x + h, y1: y + h }; }
  }
}
// 道の原則: 平行な道を ROAD_GAP タイル以内に並べない（幅 0〜1 タイルの街区や、道だけが詰まった所を作らない）。道を足す所はすべてこれで確かめる。
// (x, y) を通る、向き axis（0: x に沿う、1: y に沿う）の道の、横に並ぶ 1〜ROAD_GAP タイルの所
function besideTiles(x, y, axis) {
  const list = [];
  for (let k = -ROAD_GAP; k <= ROAD_GAP; k++) {
    const nx = x + (axis === 1 ? k : 0), ny = y + (axis === 0 ? k : 0);
    if (k && inMap(nx, ny)) list.push(at(nx, ny));
  }
  return list;
}
// 工業地区のタイルを決める。選んだ正方形の縁を、なめらかなノイズで出入りさせる（正方形に見せない）。
// まわりの、高い建物を建てない所も決める（奥と横は INDUSTRY_CLEAR[0]、手前（画面の下）は INDUSTRY_CLEAR[1] タイル。手前の高い建物は奥の工場を隠す）
function markIndustry() {
  industry.fill(0);
  industryNear.fill(0);
  if (!industryRect) return;
  const cx = (industryRect.x0 + industryRect.x1) / 2, cy = (industryRect.y0 + industryRect.y1) / 2;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = at(x, y), d = Math.max(Math.abs(x - cx), Math.abs(y - cy));
    if (d > INDUSTRY_HALF + (hashNoise(x, y, 4, landSeed + 57) - 0.5) * 2 * INDUSTRY_WOBBLE) continue;
    if (industryLand(i) && !planRoad[i]) industry[i] = 1;
  }
  const [c0, c1] = INDUSTRY_CLEAR;
  for (let j = 0; j < N * N; j++) {
    if (!industry[j]) continue;
    const jx = j % N, jy = (j / N) | 0;
    for (let dy = -c0; dy <= c1; dy++) for (let dx = -c0; dx <= c1; dx++) {
      if ((dx > c0 || dy > c0) && (dx < 0 || dy < 0)) continue;   // 手前の側だけ広くとる
      if (inMap(jx + dx, jy + dy)) industryNear[at(jx + dx, jy + dy)] = 1;
    }
  }
}
// 工業地区とそのまわりの、低いビル（4 階まで）までしか建てず、2×2 の大きな建物も建てない所か（工場がビルに埋もれないように）
const nearIndustry = (x, y) => industryNear[at(x, y)] === 1;
function planLots() {
  // 区画: 道に面した平らな陸のタイル（砂浜は除く）。市街では道から 2 つ目のタイル（大きな街区の奥）も区画にする
  isLot.fill(0);
  isFarm.fill(0);
  const toRoad = bfsDistance((i) => planRoad[i]);
  for (let y = 1; y < N - 1; y++) for (let x = 1; x < N - 1; x++) {
    const i = at(x, y);
    // 砂浜には建物・田畑・公園を置かない
    if (terr[i] || planRoad[i] || railMask[i] || reserved[i] || !isFlat(i) || gtype[i] === G_SAND) continue;
    const dt = Math.hypot(x - town.x, y - town.y), inCity = dt <= CITY_RADIUS;
    if (toRoad[i] <= 3 && dt <= CITY_RADIUS + OUTSKIRT) isFarm[i] = 1;
    if (toRoad[i] === 1 || (toRoad[i] === 2 && inCity)) isLot[i] = 1;
  }
}

function planRail() {
  railMask.fill(0);
  platform.fill(0);
  reserved.fill(0);
  // 線路は川を横切る向きに、街の中心から 2 タイルずれた行（道の格子の間）をまっすぐ通す。海は川の行く先にあるので、海岸とは平行になる
  railAxis = 1 - riverAxis;
  const side = Math.random() < 0.5 ? -2 : 2;
  const row = (railAxis === 0 ? town.y : town.x) + side;
  const fwd = railAxis === 0 ? 0 : 1;
  // 丘は、線路の向きに沿った斜面になるよう削る（両側の格子点を低い方に揃え、まわりをならす）
  const pinned = new Uint8Array((N + 1) * (N + 1));
  for (let a = 0; a <= N; a++) {
    const [c0, c1] = railAxis === 0 ? [corner(a, row), corner(a, row + 1)] : [corner(row, a), corner(row + 1, a)];
    hc[c0] = hc[c1] = Math.min(hc[c0], hc[c1]);
    pinned[c0] = pinned[c1] = 1;
  }
  relaxHeights(pinned);
  railPath = [];
  for (let a = 0; a < N; a++) {
    const [x, y] = railAxis === 0 ? [a, row] : [row, a];
    railPath.push({ x, y });
    railMask[at(x, y)] = (1 << opposite(fwd)) | (1 << fwd);
  }
  // 駅: 平らな陸の 3 タイル。街の中心に近い所
  const railTile = (k) => at(railPath[k].x, railPath[k].y);
  const ks = railPath.map((p, k) => k).filter((k) => k > 0 && k + 1 < railPath.length && [-1, 0, 1].every((o) => isFlat(railTile(k + o)) && !terr[railTile(k + o)]));
  const bestK = minBy(ks, (k) => Math.hypot(railPath[k].x - town.x, railPath[k].y - town.y)) ?? -1;
  station = null;
  if (bestK >= 0) {
    const p = railPath[bestK], toTown = Math.sign((railAxis === 0 ? town.y - p.y : town.x - p.x)) || 1;
    const tiles = [-1, 0, 1].map((o) => railTile(bestK + o));
    const bt = tiles.map((i) => (railAxis === 0 ? i + toTown * N : i + toTown));
    const ok = bt.every((i) => i >= 0 && i < N * N && !terr[i] && isFlat(i) && !railMask[i]);
    station = { x: p.x, y: p.y, k: bestK, tiles, building: ok ? bt : null };
    for (const i of tiles) reserved[i] = 1;
    if (ok) for (const i of bt) reserved[i] = 1;
  }
  buildLanes(row, fwd);
}

// 地区: 街の中心と、ランダムな点に近い所。地区ごとに道の間隔とずれを変える（境目では道が T 字やずれた形でつながる）
let zones = [];
function makeZones() {
  zones = [{ x: town.x, y: town.y, sx: 4, sy: 4, ox: town.x, oy: town.y }];
  while (zones.length < ZONE_COUNT) {
    const x = randInt(N), y = randInt(N);
    if (Math.hypot(x - town.x, y - town.y) < 9) continue;
    const [sx, sy] = pick(BLOCK_SHAPES);
    zones.push({ x, y, sx, sy, ox: randInt(sx), oy: randInt(sy) });
  }
}
const zoneIndex = (x, y) => minBy(zones.keys(), (k) => Math.hypot(x - zones[k].x, y - zones[k].y));

// 道: 地区ごとの格子。斜面は登り下りの向きだけ、川は 3 タイルまでの橋で渡る
function planRoads() {
  planRoad.fill(0);
  const okTile = (x, y, d) => {
    const i = at(x, y);
    if (reserved[i] || terr[i] === 2 || gtype[i] === G_SAND) return false;   // 海と砂浜には道を通さない
    if (railMask[i]) {
      const m = railMask[i];
      const railAlong = m === 5 ? 0 : m === 10 ? 1 : -1;
      if (railAlong < 0 || railAlong === d % 2) return false;   // 踏切はまっすぐな線路を直角に渡る
    }
    if (!isFlat(i) && !alignedSlope(x, y, d)) return false;
    return true;
  };
  // 横（x に沿う）・縦（y に沿う）の道の候補と、その優先度（大通り 0、地区の番号 + 1）
  const hz = new Uint8Array(N * N), vt = new Uint8Array(N * N), prio = new Uint8Array(N * N);
  // 橋: (x, y) から向き d に続く水のタイル（run）と、その両岸のタイル（banks。箱庭の外なら -1）
  const riverRun = (x, y, d) => {
    const run = [at(x, y)], banks = [];
    for (const sg of [-1, 1]) for (let nx = x + DX[d] * sg, ny = y + DY[d] * sg; ; nx += DX[d] * sg, ny += DY[d] * sg) {
      if (!inMap(nx, ny) || !terr[at(nx, ny)]) { banks.push(inMap(nx, ny) ? at(nx, ny) : -1); break; }
      run.push(at(nx, ny));
    }
    return { run, banks };
  };
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const dt = Math.hypot(x - town.x, y - town.y), mainRow = y === town.y, mainCol = x === town.x;
    // 大通りは箱庭の端（画面外）まで通す。ほかの道は市街のまわりまで
    if (dt > CITY_RADIUS + OUTSKIRT && !mainRow && !mainCol) continue;
    // 街の外側は道を間引く。中心を通る十字の道（大通り）は途切れさせない
    const zi = zoneIndex(x, y), z = zones[zi], sparse = dt > CITY_RADIUS ? 3 : 1;
    let onRow = mainRow || mod(y - z.oy, z.sy * sparse) === 0, onCol = mainCol || mod(x - z.ox, z.sx * sparse) === 0;
    // 箱庭の端では、端を横切る向きの道だけを通す（端に沿う道は作らない）
    if (y === 0 || y === N - 1) onRow = false;
    if (x === 0 || x === N - 1) onCol = false;
    if (!onRow && !onCol) continue;
    const i = at(x, y);
    prio[i] = zi + 1;
    if (onRow && onCol && terr[i] === 1) {
      // 川の上の交差点は、橋として渡れる向きの道だけを通す（大通り、川を横切る向きの順に選ぶ）。交差点ごと消すと、そこを渡る橋が無くなる
      const pick = minBy([0, 1].filter((d) => okTile(x, y, d) && riverRun(x, y, d).run.length <= BRIDGE_MAX), (d) => ((d === 0 ? mainRow : mainCol) ? 0 : 2) + (d === riverAxis ? 1 : 0));
      if (pick === undefined) continue;
      onRow = pick === 0; onCol = pick === 1;
    }
    if (onRow && onCol) {
      if (isFlat(i) && !terr[i] && !railMask[i] && !reserved[i] && gtype[i] !== G_SAND) { hz[i] = mainRow ? 2 : 1; vt[i] = mainCol ? 2 : 1; }
      continue;
    }
    const d = onRow ? 0 : 1;
    if (!okTile(x, y, d) || (terr[i] === 1 && riverRun(x, y, d).run.length > BRIDGE_MAX)) continue;
    if (onRow) hz[i] = mainRow ? 2 : 1; else vt[i] = mainCol ? 2 : 1;
  }
  // 平行な道が ROAD_GAP タイル以内に並ぶ所（地区の境目）は、優先度の低い方を消す
  const rank = (i, flags) => (flags[i] === 2 ? 0 : prio[i]);
  const order = [...Array(N * N).keys()].filter((i) => hz[i] || vt[i]).sort((a, b) => prio[a] - prio[b]);
  for (const [flags, axis] of [[hz, 0], [vt, 1]]) {
    for (const i of order) {
      if (flags[i] && besideTiles(i % N, (i / N) | 0, axis).some((j) => flags[j] && rank(j, flags) < rank(i, flags))) flags[i] = 0;
    }
  }
  const cand = new Uint8Array(N * N);
  for (let i = 0; i < N * N; i++) cand[i] = hz[i] || vt[i] ? 1 : 0;
  // 1 タイルだけ突き出た道を消す
  const degree = (i) => { const m = roadMask(i % N, (i / N) | 0, cand); return (m & 1) + (m >> 1 & 1) + (m >> 2 & 1) + (m >> 3 & 1); };
  for (let pass = 0; pass < 2; pass++) for (let i = 0; i < N * N; i++) {
    if (!cand[i]) continue;
    const n = degree(i);
    if (n === 0) cand[i] = 0;
    else if (n === 1) {
      const x = i % N, y = (i / N) | 0;
      for (let d = 0; d < 4; d++) {
        const nx = x + DX[d], ny = y + DY[d];
        if (inMap(nx, ny) && cand[at(nx, ny)] && degree(at(nx, ny)) >= 3) cand[i] = 0;
      }
    }
  }
  // 橋は必ず対岸まで渡す: 川の上の道は、BRIDGE_MAX タイルまでで、途中も両岸も道の予定がある所だけ残す
  for (let i = 0; i < N * N; i++) {
    if (!cand[i] || terr[i] !== 1) continue;
    const { run, banks } = riverRun(i % N, (i / N) | 0, hz[i] ? 0 : 1);
    if (run.length > BRIDGE_MAX || !run.every((j) => cand[j]) || !banks.every((j) => j >= 0 && cand[j])) for (const j of run) cand[j] = 0;
  }
  // 斜面で行き止まりになる道は、手前の平らな所まで縮める（坂の途中で道が途切れて見えないように）
  for (let changed = true; changed;) {
    changed = false;
    for (let i = 0; i < N * N; i++) if (cand[i] && !isFlat(i) && degree(i) <= 1) { cand[i] = 0; changed = true; }
  }
  connectRoads(cand);
}

// 道の予定 cand のうち、街の中心からつながる所だけを道の予定にし、中心から道をたどった距離を求める
function connectRoads(cand) {
  planRoad.fill(0);
  roadDist.fill(-1);
  const start = at(town.x, town.y);
  if (!cand[start]) return;
  const queue = [start];
  roadDist[start] = 0;
  for (let q = 0; q < queue.length; q++) {
    const i = queue[q];
    planRoad[i] = 1;
    for (const j of neighbors(i)) if (cand[j] && roadDist[j] < 0) { roadDist[j] = roadDist[i] + 1; queue.push(j); }
  }
}

// 区画整理: 開通している街の中の道（大通り・橋・踏切を除く）を交差点から交差点までの区間ごとに取り除き、隣り合う街区をまとめる。両端の交差点で直角に
// 交わる道が両側とも残る区間だけを取り除き（街区が長方形にまとまり、行き止まりもできない）、道がつながらなくなる区間は残す。開通していた道のタイルを返す
function mergeBlocks(e) {
  const deg = (i) => roadMask(i % N, (i / N) | 0, planRoad);
  const segments = [];
  for (let i = 0; i < N * N; i++) {
    if (!planRoad[i] || deg(i) === 5 || deg(i) === 10) continue;   // 交差点・角・行き止まりから歩き出す
    for (const d of [0, 1]) {
      const seg = [];
      let x = i % N + DX[d], y = ((i / N) | 0) + DY[d];
      while (inMap(x, y) && planRoad[at(x, y)] && deg(at(x, y)) === (d === 0 ? 5 : 10)) { seg.push(at(x, y)); x += DX[d]; y += DY[d]; }
      if (!seg.length || !inMap(x, y) || !planRoad[at(x, y)]) continue;
      const mid = seg[seg.length >> 1], mx = mid % N, my = (mid / N) | 0;
      // 取り除くのは、もう開通している道（街区がまとまって見える所）だけにする
      if (mx === town.x || my === town.y || industryNear[mid] || seg.some((j) => terr[j] || railMask[j] || !road[j])) continue;   // 工業地区のまわりの道は残す
      if (townDist(mx, my) > ERA_RADIUS[e] * 0.8) continue;
      segments.push({ seg, ends: [i, at(x, y)], d: townDist(mx, my), cross: d === 0 ? 10 : 5 });   // cross: 直角に交わる道の向きのビット
    }
  }
  // 中心に近い区間ほど選ばれやすく
  segments.sort((a, b) => a.d * (0.5 + Math.random()) - b.d * (0.5 + Math.random()));
  const removed = [];
  let budget = Math.round(segments.length * MERGE_SHARE[e]);
  const total = () => planRoad.reduce((n, v) => n + v, 0);
  for (const sg of segments) {
    if (budget <= 0) break;
    if (sg.seg.some((j) => !planRoad[j]) || sg.ends.some((j) => (deg(j) & sg.cross) !== sg.cross)) continue;
    const before = total(), keep = planRoad.slice();
    for (const j of sg.seg) planRoad[j] = 0;
    connectRoads(planRoad.slice());
    if (total() !== before - sg.seg.length) { planRoad.set(keep); connectRoads(keep); continue; }
    budget--;
    for (const j of sg.seg) if (road[j]) removed.push(j);
  }
  planLots();
  return removed;
}

// 線路の 2 本の道筋（上り・下り）。行 row を向き fwd に通る中心線を、箱庭の外へ 4 タイルずつ延ばし、それぞれ進む向きの左へずらす
function buildLanes(row, fwd) {
  const ext = 4, center = [];
  for (let a = -ext; a < N + ext; a++) center.push(railAxis === 0 ? { u: a + 0.5, v: row + 0.5 } : { u: row + 0.5, v: a + 0.5 });
  lanes = [];
  for (const back of [false, true]) {
    const d = back ? opposite(fwd) : fwd, [lu, lv] = LEFT(d);
    const pts = (back ? center.slice().reverse() : center).map((p) => ({ u: p.u + lu * TRACK_OFFSET, v: p.v + lv * TRACK_OFFSET }));
    const len = [0];
    for (let k = 1; k < pts.length; k++) len.push(len[k - 1] + Math.hypot(pts[k].u - pts[k - 1].u, pts[k].v - pts[k - 1].v));
    const sAt = (k) => len[back ? pts.length - 1 - (k + ext) : k + ext];
    lanes.push({ pts, len, total: len[len.length - 1], stationS: station ? sAt(station.k) : -1 });
  }
}

// ---- 建設 ----
// 駅ビル（駅舎のタイル）までの距離（縦横の大きい方。駅舎が無ければ Infinity）
function stationGap(x, y) {
  if (!station?.building) return Infinity;
  return Math.min(...station.building.map((i) => Math.max(Math.abs(x - i % N), Math.abs(y - ((i / N) | 0)))));
}

// 街の中心か駅までの近さ
function townDist(x, y) {
  let d = Math.hypot(x - town.x, y - town.y);
  if (era >= 1 && station) d = Math.min(d, Math.hypot(x - station.x, y - station.y) + 1);
  return d;
}

function planEra(e) {
  const R = ERA_RADIUS[e], list = [];
  const add = (key, task) => list.push({ key, ...task });
  if (e === 1) {
    railPath.forEach((p, k) => add(-1000 + k, { kind: 'rail', i: at(p.x, p.y) }));
    if (station) add(-50, { kind: 'station' });
  }
  if (e === 2) {
    // 駅舎を駅ビルに建て替える
    if (station?.building) add(-50, { kind: 'station' });
    // 舗装は、新しい道と同じく中心から道をたどった距離の順番で進め、舗装した道が中心からひと続きに広がるようにする（飛び地にしない）。
    // 建物より少し先に進めて、建物の建設と混ぜる（先に全部を舗装すると、時代の前半が舗装だけになる）
    for (let i = 0; i < N * N; i++) if (road[i] === 1) add(roadKey(i), { kind: 'pave', i });
  }
  if (MERGE_SHARE[e]) {
    // 区画整理: 取り除く道は時代の始めに片付ける。前の時代の大きな建物の予定地も、区画に戻して選び直す
    for (let i = 0; i < N * N; i++) if (reserved[i] === 2) reserved[i] = 0;
    for (const i of mergeBlocks(e)) add(-60 + townDist(i % N, (i / N) | 0) * 0.1, { kind: 'unroad', i });
  }
  if (BIG_SITES[e]) {
    // 2×2 の大きな建物: 中心に近い所（まとめた街区）
    const sites2 = [];
    for (let y = 1; y < N - 2; y++) for (let x = 1; x < N - 2; x++) {
      const ts = [at(x, y), at(x + 1, y), at(x, y + 1), at(x + 1, y + 1)];
      if (!ts.every((i) => isLot[i] && !openKind[i] && !industry[i])) continue;
      // 中心に近いほど選ばれやすいが、ばらつきを持たせて、範囲の中のところどころに建てる
      const d = townDist(x + 1, y + 1);
      if (stationGap(x, y) <= STATION_CLEAR + 2 || ts.some((i) => nearIndustry(i % N, (i / N) | 0))) continue;   // 駅ビル・工場を埋もれさせない
      if (d <= R * BIG_REACH) sites2.push({ x, y, ts, d, score: lerp(d, hash(x, y, landSeed + e * 17) * R * BIG_REACH, BIG_SCATTER) });
    }
    sites2.sort((a, b) => a.score - b.score);
    const used = new Set();
    let count = 0;
    for (const s of sites2) {
      if (count >= BIG_SITES[e]) break;
      if (s.ts.some((i) => used.has(i))) continue;
      // まわりの BIG_SPACING タイルも空ける（固まって建たない）
      for (let dy = -BIG_SPACING; dy <= 1 + BIG_SPACING; dy++) for (let dx = -BIG_SPACING; dx <= 1 + BIG_SPACING; dx++) {
        if (inMap(s.x + dx, s.y + dy)) used.add(at(s.x + dx, s.y + dy));
      }
      for (const i of s.ts) reserved[i] = 2;
      add(s.d - 0.2, { kind: 'big', x: s.x, y: s.y, type: e === 2 ? 'block2' : 'tower3' });
      count++;
    }
  }
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = at(x, y), d = townDist(x, y);
    // 半径の 6 割から外は、離れるほど建つ割合を下げる（街の外れにも、まばらに家が建つ）
    const f = d <= R * 0.6 ? 1 : Math.exp(-1.5 * ((d - R * 0.6) / (R * 0.4 + FRINGE * 0.6)) ** 2);
    // 道は建物より外まで、早めに開通させる。大通りはさらに外まで延ばす。ほかの道は 1 本ごとに伸ばす長さを変え、街の形を四角くしない
    const arterial = x === town.x || y === town.y;
    if (planRoad[i] && !road[i] && d <= (arterial ? R + ARTERIAL_REACH : (R * ROAD_REACH + 2) * roadReach(x, y))) add(roadKey(i), { kind: 'road', i });
    if (reserved[i] === 2 || openKind[i]) continue;
    // 工業地区は、自動車の時代から工場に変える（家や田畑も取り壊す）。建った工場は建て替えずに残す。
    // 都市の時代にも工場にしない残りは、自動車の時代に駐車場にして、地区の全体を工場と駐車場で埋める
    if (industry[i] && e >= 2) {
      const b = obj[i]?.kind === 'bld' ? obj[i] : null, k = hash(x, y, landSeed + 51), key = R * (0.3 + 0.5 * hash(x, y, landSeed + 52));
      if (e === 2 && k >= INDUSTRY_FILL[3]) { openKind[i] = G_PARKING; add(key, { kind: 'open', i }); }
      else if (cover[i] < 0 && b?.type !== 'factory2' && k < INDUSTRY_FILL[e]) add(key, { kind: 'build', i });
      continue;
    }
    // 街の中の区画の一部は、公園・駐車場として空ける（建物があれば取り壊す）
    const open = isLot[i] && d <= R * 0.9 && cover[i] < 0 ? openSpaceAt(x, y, e) : 0;
    if (open) {
      openKind[i] = open;
      add(d + hash(x, y, landSeed + 5) * R * 0.3, { kind: 'open', i });
      continue;
    }
    const b = obj[i]?.kind === 'bld' ? obj[i] : null;
    const field = gtype[i] === G_RICE || gtype[i] === G_FIELD;
    if (isLot[i] && b) {
      // 建て替えは中心に近いほど早いが、ところどころ外れから先に起こる
      if (b.era < e && Math.random() < (e === 3 ? 0.95 : d < R * 0.5 ? 1 : 0.6) * f) add(lerp(d, Math.random() * R, REBUILD_SCATTER), { kind: 'build', i });
      continue;
    }
    // 工業地区のまわりは、空いた所を建物より田畑にし、田畑は建物に変えない（工場の一角を田園で縁取る）
    const farmBelt = isFarm[i] && !industry[i] && nearIndustry(x, y) && fieldPatch(x, y) < INDUSTRY_FIELDS;
    // 田畑は、街が来ても一部だけを建物に変え、残りは田畑のまま残す
    if (isLot[i] && !obj[i] && cover[i] < 0 && (field ? d <= R && Math.random() < FIELD_TO_TOWN * f && !nearIndustry(x, y) : !farmBelt && Math.random() < DENSITY[e] * f)) {
      add(d * BUILD_LEAD[e], { kind: 'build', i });
      continue;
    }
    // 郊外の田畑は、街より先に広く作る
    if (isFarm[i] && !field && !obj[i] && cover[i] < 0 && (farmBelt || (d > R * 0.55 && d <= R + FIELD_REACH && fieldPatch(x, y) < FIELD_DENSITY[e]))) {
      add(d * ROAD_LEAD, { kind: 'field', i });
      continue;
    }
    if (isLot[i]) continue;
    if (gtype[i] === G_FOREST && tmax[i] === 0 && Math.random() < 0.7 * f) add(d, { kind: 'clear', i });
  }
  // 外れに建つ建物と、川の向こうの道への道筋: 区画のそばの道（道ならその 1 つ手前）から、街の中心へ向けて道をたどり、開通していない所を足す。
  // 川の向こうの道は、直線では中心に近くても、橋を回って遠くからつながることがあるので、橋までの道筋も一緒に開通させる
  const roadTasks = new Set(list.filter((t) => t.kind === 'road').map((t) => t.i));
  const toCenter = (j) => {
    const jx = j % N, jy = (j / N) | 0;
    for (let d = 0; d < 4; d++) {
      const nx = jx + DX[d], ny = jy + DY[d];
      if (inMap(nx, ny) && planRoad[at(nx, ny)] && roadDist[at(nx, ny)] === roadDist[j] - 1) return at(nx, ny);
    }
    return -1;
  };
  for (const t of list.filter((t) => t.kind === 'build' || t.kind === 'field' || t.kind === 'open' || t.kind === 'road')) {
    const x = t.i % N, y = (t.i / N) | 0;
    let j = -1;
    if (t.kind === 'road') j = toCenter(t.i);
    else for (let d = 0; d < 4 && j < 0; d++) for (let k = 1; k <= 3; k++) {
      const nx = x + DX[d] * k, ny = y + DY[d] * k;
      if (inMap(nx, ny) && planRoad[at(nx, ny)]) { j = at(nx, ny); break; }
    }
    while (j >= 0 && !road[j] && !roadTasks.has(j)) {
      roadTasks.add(j);
      add(roadKey(j), { kind: 'road', i: j, keep: true });
      j = toCenter(j);
    }
  }
  reduceDeadEnds(list, add);
  list.sort((a, b) => a.key - b.key);
  return list;
}

// 道の建設の順番。街の中心から道をたどった距離で決め、手前の道が先に開通するようにする（直線の距離で決めると、
// 橋を回ってつながる川の向こうの道が、手前の道より先に回ってきて開通できない）。道の距離は直線より長いので、少し縮めて建物の順番と揃える
// 自動車の時代は、新しい道も舗装と同じ順番にする（新しい道は舗装して造るので、先に外の道ができると舗装の飛び地になる）
const roadKey = (i) => roadDist[i] * (era === 2 ? PAVE_LEAD : ROAD_LEAD * 0.8) - 0.3;

// 田畑にする順位（0〜1）。小さい所ほど田畑になる。まとまりのノイズに、タイルごとのばらつきを少し混ぜる
function fieldPatch(x, y) {
  // なめらかなノイズは 0.5 のまわりに集まるので、広げてから混ぜる
  const n = clamp((hashNoise(x, y, FIELD_PATCH, landSeed + 31) - 0.5) * 1.8 + 0.5, 0, 1);
  return lerp(n, hash(x, y, landSeed + 37), 0.25);
}

// 道 1 本ごとの、伸ばす長さの倍率（ROAD_REACH_SPREAD の範囲）。同じ地区の同じ行・列の道は同じ値にし、時代が進んでも変えない
function roadReach(x, y) {
  const horizontal = (inMap(x - 1, y) && planRoad[at(x - 1, y)]) || (inMap(x + 1, y) && planRoad[at(x + 1, y)]);
  const vertical = (inMap(x, y - 1) && planRoad[at(x, y - 1)]) || (inMap(x, y + 1) && planRoad[at(x, y + 1)]);
  const z = zoneIndex(x, y), line = (along, pos) => lerp(...ROAD_REACH_SPREAD, hash(along, pos, z + landSeed));
  // 交差点は、通る 2 本の道の長い方に合わせる
  return Math.max(horizontal ? line(0, y) : 0, vertical ? line(1, x) : 0);
}

// 行き止まりを減らす: この時代の終わりの道（開通済みと予定）で行き止まりになる所は、まっすぐ先 ROAD_LINK タイル以内に道があれば
// 延ばしてつなぎ、無ければ、予定だけの短い枝（ROAD_STUB タイル以内で分かれ道に戻るもの）を取りやめる。建物・田畑への道（keep）は残す。
// 最後に、斜面で行き止まりになる予定の道を、手前の平らな所まで取りやめる（こちらは建物・田畑への道も取りやめる）
function reduceDeadEnds(list, add) {
  const future = Uint8Array.from(road, (r) => (r ? 1 : 0)), byTile = new Map();
  for (const t of list) if (t.kind === 'road') { future[t.i] = 1; byTile.set(t.i, t); }
  const links = (i) => [0, 1, 2, 3].filter((d) => roadMask(i % N, (i / N) | 0, future) & (1 << d));
  for (let i = 0; i < N * N; i++) {
    const ds = links(i);
    if (!future[i] || ds.length !== 1) continue;
    const x = i % N, y = (i / N) | 0, fwd = opposite(ds[0]), path = [];
    let joined = false;
    for (let k = 1; k <= ROAD_LINK; k++) {
      const nx = x + DX[fwd] * k, ny = y + DY[fwd] * k, j = at(nx, ny);
      if (!inMap(nx, ny) || !planRoad[j]) break;
      if (future[j]) { joined = true; break; }
      path.push(j);
    }
    if (joined) {
      for (const j of path) { future[j] = 1; add(townDist(x, y) * ROAD_LEAD - 1, { kind: 'road', i: j }); }
      continue;
    }
    // 分かれ道まで戻り、途中がすべて予定の道なら取りやめる
    const chain = [];
    let j = i, from = -1;
    while (chain.length <= ROAD_STUB) {
      const t = byTile.get(j), next = links(j).map((d) => at(j % N + DX[d], ((j / N) | 0) + DY[d])).filter((k) => k !== from);
      if (!t || t.keep || next.length !== 1) break;
      chain.push(j);
      from = j;
      j = next[0];
    }
    if (chain.length && chain.length <= ROAD_STUB && links(j).length >= 3) {
      for (const k of chain) { future[k] = 0; byTile.get(k).kind = 'none'; }
    }
  }
  // 斜面で行き止まりになる予定の道は、手前の平らな所まで取りやめる
  for (let changed = true; changed;) {
    changed = false;
    for (const [i, t] of byTile) if (future[i] && !isFlat(i) && links(i).length <= 1) { future[i] = 0; t.kind = 'none'; changed = true; }
  }
}

// 空き地にする区画の地面の種類（0 なら空けない）。OPEN_CELL タイルの升目ごとに決め、時代が進むと増やす（前の時代の空き地は残る）
// 駐車場は 3 割ほど、ほかは公園にする
function openSpaceAt(x, y, e) {
  const cx = Math.floor(x / OPEN_CELL), cy = Math.floor(y / OPEN_CELL);
  if (hash(cx, cy, landSeed + 911) >= OPEN_SHARE[e]) return 0;
  return hash(cx, cy, landSeed + 912) < 0.3 ? G_PARKING : G_PARK;
}
// 空き地の上の物（木と止めた車）。位置から決める
function openDecor(i, g) {
  const x = i % N, y = (i / N) | 0, r = (k) => hash(x, y, landSeed + 300 + k), list = [];
  if (g === G_PARK) {
    // 園路で分けた 4 区画の真ん中に、丸い広葉樹を置く（中心の近くは少なく）
    const share = PARK_TREES[Math.hypot(x - town.x, y - town.y) < 8 ? 0 : 1];
    for (let k = 0; k < 4; k++) {
      if (r(k) >= share) continue;
      list.push({ u: k % 2 ? 0.75 : 0.25, v: k < 2 ? 0.25 : 0.75, sprite: treeImage(1, Math.floor(r(k + 10) * 8)) });
    }
  } else {
    // 区切りの間に、v の向きに止めた車（半分ほど）
    for (let k = 0; k < 8; k++) {
      if (r(k) < 0.5) continue;
      list.push({ u: (k % 4 + 0.5) / 4, v: k < 4 ? 0.27 : 0.73, sprite: carImage(k < 4 ? 1 : 3, pick2(CAR_COLORS, r(k + 10))) });
    }
  }
  list.sort((a, b) => a.u + a.v - b.u - b.v);
  return list.length ? list : null;
}

// 高い建物の代わりに建てる低い建物
const LOW_TYPE = { office3: 'office2', apart3: 'apart2' };
function chooseType(e, i) {
  const x = i % N, y = (i / N) | 0, near = townDist(x, y) / ERA_RADIUS[e];
  // 工場は、工業地区にだけ建てる
  const inFactoryZone = industry[i] === 1;
  const nearStation = station && Math.hypot(x - station.x, y - station.y) < 4;
  // 駅ビルのまわりは、駅ビルより低い建物だけにする（埋もれさせない）
  if (e >= 2 && !inFactoryZone && stationGap(x, y) <= STATION_CLEAR) return pick(['office2', 'office2', 'apart2']);
  switch (e) {
    case 0: return 'house0';
    case 1: return nearStation || near < 0.3 ? 'shop1' : Math.random() < 0.65 ? 'house1' : 'house0';
    case 2:
      if (inFactoryZone) return 'factory2';
      if (near < 0.25) return 'office2';
      if (near < 0.5) return pick(['apart2', 'office2', 'house2']);
      return Math.random() < (near < 1 ? 0.15 : 0.03) ? 'apart2' : 'house2';
    default:
      if (inFactoryZone) return 'factory2';
      // 中心でも高いビルばかりにせず、マンションや低いビルを混ぜて高さに差を付ける
      if (near < 0.25) { const h = hash(x, y, landSeed + 31); return h < 0.6 ? 'office3' : h < 0.8 ? 'apart3' : 'office2'; }
      if (near < 0.5) return pick(['office3', 'office2', 'apart3']);
      if (near < 0.75) return pick(['apart3', 'apart2', 'house2', 'office2']);
      return Math.random() < (near < 1 ? 0.7 : 0.95) ? 'house2' : 'apart2';
  }
}

// 建設を始める。frames はコマごとに呼ぶ関数
function startSite(frames) {
  sites.push({ frames, k: 0, t: 0 });
  frames[0]();
}
function updateSites(dt) {
  for (let n = sites.length - 1; n >= 0; n--) {
    const s = sites[n];
    s.t += dt;
    while (s.t >= FRAME_TIME && s.k < s.frames.length) {
      s.t -= FRAME_TIME;
      if (++s.k < s.frames.length) s.frames[s.k]();
    }
    if (s.k >= s.frames.length) sites.splice(n, 1);
  }
}

// 物を置く。(x0, y0) は奥のタイル、手前のタイルに置き、ほかのタイルは覆われたことにする
function placeObject(x0, y0, fw, fd, o) {
  const ax = x0 + fw - 1, ay = y0 + fd - 1, anchor = at(ax, ay);
  for (let y = y0; y <= ay; y++) for (let x = x0; x <= ax; x++) {
    const i = at(x, y);
    obj[i] = null;
    cover[i] = i === anchor ? -1 : anchor;
  }
  if (o) obj[anchor] = { x0, y0, fw, fd, base: tmin[anchor], ...o };
}
function clearObject(x0, y0, fw, fd) {
  for (let y = y0; y < y0 + fd; y++) for (let x = x0; x < x0 + fw; x++) {
    const i = at(x, y), a = cover[i] >= 0 ? cover[i] : i;
    const o = obj[a];
    if (o) for (let yy = o.y0; yy < o.y0 + o.fd; yy++) for (let xx = o.x0; xx < o.x0 + o.fw; xx++) cover[at(xx, yy)] = -1;
    obj[a] = null;
    cover[i] = -1;
  }
}

// 建物を建てるコマの並び（取り壊して整地 → 基礎 → 足場が 1 階ずつ伸びる → 足場を上から外す → 完成）
function buildFrames(x0, y0, fw, fd, type, eraOf, ground, vr = randInt(BUILDING_VARIANTS)) {
  const img = buildingImage(type, vr, fw, fd);
  const frames = [];
  const tiles = [];
  for (let y = y0; y < y0 + fd; y++) for (let x = x0; x < x0 + fw; x++) tiles.push(at(x, y));
  frames.push(() => { clearObject(x0, y0, fw, fd); for (const i of tiles) setGround(i, G_DIRT); });
  frames.push(() => placeObject(x0, y0, fw, fd, { kind: 'site', img: foundationImage(fw, fd) }));
  if (CRANE_TYPES.includes(type)) {
    // 都市のビル: 外壁が CRANE_STEP 階ずつ、CRANE_HOLD コマおきに積み上がる。てっぺんにはタワークレーンが載って一緒に上がる。
    // てっぺんまで積み上がったら、ジブ・マストの順にクレーンを外す
    const top = Math.max(...img.tiers.map((t) => t[5])), alongU = hash(vr, 91) < 0.5;
    const site = (c, crane) => frames.push(() => placeObject(x0, y0, fw, fd, { kind: 'site', img: craneSiteImage(type, vr, fw, fd, c, crane, alongU) }));
    for (let c = 0; c < top; c = Math.min(c + CRANE_STEP * 6, top)) {
      for (let k = 0; k < CRANE_HOLD; k++) site(c, 2);
    }
    site(top, 2);
    site(top, 1);
    frames.push(() => { for (const i of tiles) setGround(i, ground); placeObject(x0, y0, fw, fd, { kind: 'bld', type, era: eraOf, img }); });
    return frames;
  }
  // 足場は 1 コマに 1 階ずつ伸ばし（高い建物ほど建つのに時間がかかる）、建物の高さまで届いたら、
  // 上から 1 階ずつ外して、できあがった建物を上から見せていく
  const top = img.scaffoldTop ?? Math.max(6, buildingHeight(img) - 2), heights = [];
  for (let h = Math.min(6, top); h < top; h += SCAFFOLD_STEP) heights.push(h);
  heights.push(top);
  for (const h of heights) frames.push(() => placeObject(x0, y0, fw, fd, { kind: 'site', img: scaffoldImage(fw, fd, h) }));
  frames.push(() => { for (const i of tiles) setGround(i, ground); });
  for (const h of heights.slice(0, -1).reverse()) frames.push(() => placeObject(x0, y0, fw, fd, { kind: 'site', img, over: scaffoldImage(fw, fd, h) }));
  frames.push(() => placeObject(x0, y0, fw, fd, { kind: 'bld', type, era: eraOf, img }));
  return frames;
}

// 道（開通したもの）が、まっすぐ 2 タイル以内（工業地区は、区画でない街区の奥も埋めるので 3 タイル以内）にあるか
function hasActiveRoadNear(i) {
  const x = i % N, y = (i / N) | 0, reach = industry[i] ? 3 : 2;
  for (let d = 0; d < 4; d++) for (let k = 1; k <= reach; k++) if (inMap(x + DX[d] * k, y + DY[d] * k) && road[at(x + DX[d] * k, y + DY[d] * k)]) return true;
  return false;
}

// タイルの並びを囲む長方形（奥のタイルと大きさ）
function bounds(tiles) {
  const xs = tiles.map((j) => j % N), ys = tiles.map((j) => (j / N) | 0);
  const x0 = Math.min(...xs), y0 = Math.min(...ys);
  return { x0, y0, fw: Math.max(...xs) - x0 + 1, fd: Math.max(...ys) - y0 + 1 };
}

// 橋を架ける川の上のタイル（tiles）に 1 階ぶんの足場を組み、BRIDGE_HOLD コマ置いておく建設のコマ
function bridgeScaffold(tiles) {
  const img = scaffoldImage(1, 1, SCAFFOLD_STEP);
  return [() => { for (const j of tiles) placeObject(j % N, (j / N) | 0, 1, 1, { kind: 'site', img }); },
    ...Array.from({ length: BRIDGE_HOLD - 1 }, () => () => {})];
}
function clearBridgeScaffold(tiles) {
  for (const j of tiles) clearObject(j % N, (j / N) | 0, 1, 1);
}

// 道路・線路のタイル（工事中を含む）か。建物・空き地は、道路・線路と同じタイルに置かない
const onRoad = (i) => !!(road[i] || roadBegun[i] || railState[i] || railMask[i]);

// 予定を 1 つ実行する。まだ始められなければ false
function runTask(t) {
  const i = t.i, x = i % N, y = (i / N) | 0;
  switch (t.kind) {
    case 'road': {
      if (road[i] || roadBegun[i]) return true;
      // 隣の道の工事が始まっていれば始める（開通を待つと、強度が高いときに後へ回す回数が尽き、その先の道がまとめて取りやめになる）
      if (i !== at(town.x, town.y) && !neighbors(i).some((j) => roadBegun[j])) return false;
      const kind = era >= 2 ? 2 : 1, frames = [];
      if (terr[i]) {
        // 橋は途中で止めない: 続く川の上のタイルと、向こう岸の 1 タイルまで一度に架ける
        const span = [i];
        for (let q = 0; q < span.length; q++) {
          if (terr[span[q]]) for (const k of neighbors(span[q])) if (planRoad[k] && !road[k] && !span.includes(k)) span.push(k);
        }
        for (const j of span) roadBegun[j] = 1;
        const water = span.filter((j) => terr[j]);
        startSite([...bridgeScaffold(water), () => {
          clearBridgeScaffold(water);
          for (const j of span) { road[j] = kind; setGround(j, terr[j] ? gtype[j] : G_GRASS); }
        }]);
        return true;
      }
      roadBegun[i] = 1;
      frames.push(() => { clearObject(x, y, 1, 1); setGround(i, G_DIRT); },
        () => { road[i] = kind; setGround(i, G_GRASS); });
      startSite(frames);
      return true;
    }
    case 'unroad':
      if (!road[i]) return true;
      roadBegun[i] = 0;
      startSite([() => { road[i] = 0; setGround(i, G_DIRT); }, () => setGround(i, G_GRASS)]);
      return true;
    case 'pave':
      // 区画整理で先に撤去した道は舗装しない（撤去した所には建物が建つので、建物の下に道路ができる）
      if (road[i] !== 1) return true;
      startSite([() => { road[i] = 2; touchGround(i); }]);
      return true;
    case 'rail':
      startSite([...(terr[i] ? bridgeScaffold([i]) : []),
        () => { clearBridgeScaffold(terr[i] ? [i] : []); if (gtype[i] === G_FOREST || trees[i]) setGround(i, G_GRASS); railState[i] = 1; touchGround(i); },
        () => { railState[i] = 2; touchGround(i); railLaid++; }]);
      return true;
    case 'station': {
      const b = station.building;
      for (const r of station.tiles) { platform[r] = 1; touchGround(r); }
      if (!b) return true;
      const { x0, y0, fw, fd } = bounds(b);
      startSite(buildFrames(x0, y0, fw, fd, era >= 2 ? 'station2' : 'station1', era, G_LOT));
      return true;
    }
    case 'big': {
      const ts = [at(t.x, t.y), at(t.x + 1, t.y), at(t.x, t.y + 1), at(t.x + 1, t.y + 1)];
      if (ts.some(onRoad)) return true;
      if (!ts.some(hasActiveRoadNear)) return false;
      startSite(buildFrames(t.x, t.y, 2, 2, t.type, era, G_LOT));
      return true;
    }
    case 'open': {
      if (cover[i] >= 0 || onRoad(i)) return true;
      if (!hasActiveRoadNear(i)) return false;
      const g = openKind[i];
      startSite([() => { clearObject(x, y, 1, 1); setGround(i, G_DIRT); }, () => { setGround(i, g); trees[i] = openDecor(i, g); }]);
      return true;
    }
    case 'build': {
      if (cover[i] >= 0 || reserved[i] === 2 || openKind[i] || onRoad(i)) return true;
      if (!hasActiveRoadNear(i)) return false;
      // 工業地区のまわりは、高いビル・マンションを低いビル・団地に替える（工場を埋もれさせない）
      let type = chooseType(era, i);
      if (nearIndustry(x, y)) type = LOW_TYPE[type] ?? type;
      startSite(buildFrames(x, y, 1, 1, type, era, era >= 2 ? G_LOT : G_GRASS));
      return true;
    }
    case 'field': {
      if (obj[i] || cover[i] >= 0) return true;
      const g = pick([G_RICE, G_FIELD]);
      startSite([() => setGround(i, G_DIRT), () => setGround(i, g)]);
      return true;
    }
    case 'clear':
      if (gtype[i] !== G_FOREST) return true;
      startSite([() => setGround(i, G_DIRT), () => setGround(i, G_GRASS)]);
      return true;
  }
  return true;
}

const railReady = () => railPath.length > 0 && railLaid >= railPath.length;

function startEra(e) {
  era = e;
  eraStart = growth;
  busy = BUSY_SWING.map((a, j) => ({ a, k: BUSY_WAVES[j][0] + Math.floor(hash(e, j, landSeed + 41) * (BUSY_WAVES[j][1] - BUSY_WAVES[j][0] + 1)), ph: hash(e, j, landSeed + 43) * Math.PI * 2 }));
  tasks = planEra(e);
  taskIndex = 0;
}

// 時代の中の時刻 t（0〜1）までに始める建設の割合（0〜1）。波で増える速さを変え、忙しいときと静かなときを作る。
// 波の数は整数なので、t = 0・1 で 0・1 になる。振れ幅の和が 1 未満なので、減ることはない
function busyProgress(t) {
  let p = t;
  for (const { a, k, ph } of busy) p -= a * (Math.sin(2 * Math.PI * k * t + ph) - Math.sin(ph)) / (2 * Math.PI * k);
  return p;
}

// 成長の時計を進め、予定の時刻になった建設を始める
function updateGrowth(dt) {
  if (holdTimer >= 0) {
    holdTimer -= dt;
    // 暗転して新しい土地へ（newLand が holdTimer を戻すまで、もう呼ばない）
    if (holdTimer < 0) { holdTimer = Infinity; fadeAndRun(newLand); }
    return;
  }
  growth += dt * speed;
  const p = busyProgress(clamp((growth - eraStart) / (ERA_TIME * 0.92), 0, 1));
  let deferred = 0;
  while (taskIndex < tasks.length && p >= (taskIndex + 0.5) / tasks.length) {
    const t = tasks[taskIndex];
    if (!runTask(t)) {
      // まだ道が来ていない: 少し後へ回す（何度も回らない）
      t.retry = (t.retry || 0) + 1;
      if (t.retry < 6 && deferred++ < 20) tasks.splice(Math.min(tasks.length, taskIndex + 8), 0, t);
    }
    taskIndex++;
  }
  if (growth >= eraStart + ERA_TIME && taskIndex >= tasks.length) {
    if (era < 3) startEra(era + 1);
    else holdTimer = HOLD_TIME;
  }
}

// ---- 列車 ----
// 線路の道筋の、入口から s タイルの位置と向き
function laneAt(lane, s) {
  const { pts, len } = lane;
  let lo = 0, hi = len.length - 1;
  s = clamp(s, 0, lane.total);
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (len[m] <= s) lo = m; else hi = m; }
  const a = pts[lo], b = pts[hi], seg = len[hi] - len[lo] || 1, t = (s - len[lo]) / seg;
  const du = b.u - a.u, dv = b.v - a.v;
  const dir = Math.abs(du) > Math.abs(dv) ? (du > 0 ? 0 : 2) : (dv > 0 ? 1 : 3);
  return { u: lerp(a.u, b.u, t), v: lerp(a.v, b.v, t), dir };
}

function spawnTrain(l) {
  const lane = lanes[l], cars = ['steam', ...Array(3 + randInt(3)).fill('coach')];
  // 駅には、列車の真ん中がホームの真ん中に来る所で停まる
  trains.push({ lane: l, cars, s: 0, stopAt: lane.stationS >= 0 ? lane.stationS + (cars.length - 1) * CAR_GAP / 2 : -1, wait: 0, puff: 0 });
}
function updateTrains(dt) {
  if (!railReady() || lanes.length < 2) return;
  for (let l = 0; l < 2; l++) {
    if (trains.some((t) => t.lane === l)) continue;
    laneWait[l] -= dt;
    if (laneWait[l] <= 0) { spawnTrain(l); laneWait[l] = rand(...TRAIN_WAIT); }
  }
  for (let n = trains.length - 1; n >= 0; n--) {
    const t = trains[n], lane = lanes[t.lane];
    if (t.wait > 0) t.wait -= dt;   // 駅に停車中
    else {
      const s = t.s + TRAIN_SPEED * dt;
      if (t.s < t.stopAt && s >= t.stopAt) { t.s = t.stopAt; t.wait = STATION_STOP; } else t.s = s;
      if (t.s - t.cars.length * CAR_GAP > lane.total) { trains.splice(n, 1); continue; }
    }
    // 蒸気機関車の煙
    if ((t.puff -= dt) <= 0) {
      t.puff = t.wait > 0 ? 0.8 : 0.22;
      const p = laneAt(lane, t.s + 0.25);
      addPuff(p.u, p.v, heightAt(p.u, p.v) * STEP_H + 11);
    }
  }
}

// 煙（蒸気機関車と工場の煙突で共用）。小さな丸が上り、風で少し流れて、大きくなってから消える
function addPuff(u, v, z) {
  puffs.push({ u, v, z, age: 0 });
}
function updatePuffs(dt) {
  for (let n = puffs.length - 1; n >= 0; n--) {
    const p = puffs[n];
    p.age += dt; p.z += dt * 6; p.u -= dt * 0.15;
    if (p.age > 1.6) puffs.splice(n, 1);
  }
}
// 工場の煙突から、ときどき FACTORY_PUFFS 個ずつ続けて煙を出す（控えめに。工場ごとに間隔をずらす）
function updateFactorySmoke(dt) {
  if (era < 2) return;
  for (let i = 0; i < N * N; i++) {
    const o = obj[i];
    if (o?.kind !== 'bld' || !o.img.chimney) continue;
    // 間隔は位置と時刻から決める（Math.random を引く回数を変えない）
    if (o.smoke === undefined) o.smoke = hash(i, 0, landSeed + 71) * FACTORY_SMOKE[1];
    if ((o.smoke -= dt) > 0) continue;
    const left = (o.puffLeft ?? FACTORY_PUFFS) - 1;   // この回に、あと出す煙の数
    o.puffLeft = left > 0 ? left : FACTORY_PUFFS;
    o.smoke = left > 0 ? FACTORY_PUFF_GAP : lerp(...FACTORY_SMOKE, hash(i, Math.floor(time), landSeed + 72));
    const c = o.img.chimney, u = i % N + c.u, v = ((i / N) | 0) + c.v;
    addPuff(u, v, heightAt(u, v) * STEP_H + c.z + 1);
  }
}

// ---- 自動車 ----
function carPos(c) {
  const cu = c.x + 0.5, cv = c.y + 0.5, li = LEFT(c.din), lo = LEFT(c.dout);
  const mid = c.din === c.dout ? li : [li[0] + lo[0], li[1] + lo[1]];
  // 入る辺の中点 → タイルの中心 → 出る辺の中点を、まっすぐ結んで進む（どれも左へずらす）
  const pIn = [cu - DX[c.din] * 0.5 + li[0] * LANE_OFFSET, cv - DY[c.din] * 0.5 + li[1] * LANE_OFFSET];
  const pMid = [cu + mid[0] * LANE_OFFSET, cv + mid[1] * LANE_OFFSET];
  const pOut = [cu + DX[c.dout] * 0.5 + lo[0] * LANE_OFFSET, cv + DY[c.dout] * 0.5 + lo[1] * LANE_OFFSET];
  const [a, b, k] = c.t < 0.5 ? [pIn, pMid, c.t * 2] : [pMid, pOut, (c.t - 0.5) * 2];
  return { u: lerp(a[0], b[0], k), v: lerp(a[1], b[1], k), dir: c.t < 0.5 ? c.din : c.dout };
}
const paved = (x, y) => inMap(x, y) && road[at(x, y)] === 2;
// 次に進む向き。箱庭の端で画面外へつながる向きも選べる（そのまま画面外へ消える）
function nextDir(c) {
  const opts = [], m = roadMask(c.x, c.y);
  for (let d = 0; d < 4; d++) if (d !== opposite(c.din) && (paved(c.x + DX[d], c.y + DY[d]) || (m & (1 << d) && !inMap(c.x + DX[d], c.y + DY[d])))) opts.push(d);
  return opts.length ? pick(opts) : opposite(c.din);
}
// 舗装した道のうち、いちばん大きくひと続きになった所を求める（車はここにだけ出す。飛び地の短い道に出すと、短い距離を往復する）
function updateMainNet() {
  mainNet.fill(0);
  mainNetSize = 0;
  const seen = new Uint8Array(N * N);
  for (let s = 0; s < N * N; s++) {
    if (road[s] !== 2 || seen[s]) continue;
    const comp = [s];
    seen[s] = 1;
    for (let q = 0; q < comp.length; q++) for (const j of neighbors(comp[q])) if (road[j] === 2 && !seen[j]) { seen[j] = 1; comp.push(j); }
    if (comp.length > mainNetSize) { mainNetSize = comp.length; mainNet.fill(0); for (const j of comp) mainNet[j] = 1; }
  }
}
// 車を出す。画面外へつながる道があれば、半分ほどはそこから入ってくる
function spawnCar() {
  const tiles = [], gates = [];
  for (let i = 0; i < N * N; i++) {
    if (!mainNet[i]) continue;
    const x = i % N, y = (i / N) | 0, m = roadMask(x, y);
    if (m) tiles.push(i);
    for (let d = 0; d < 4; d++) if (m & (1 << d) && !inMap(x + DX[d], y + DY[d])) gates.push([x, y, opposite(d)]);
  }
  if (gates.length && Math.random() < 0.5) {
    const [x, y, din] = pick(gates);
    cars.push({ x, y, din, dout: din, t: 0, color: pick(CAR_COLORS) });
    return;
  }
  if (!tiles.length) return;
  const i = pick(tiles), x = i % N, y = (i / N) | 0;
  const dout = pick([0, 1, 2, 3].filter((d) => paved(x + DX[d], y + DY[d])));
  cars.push({ x, y, din: dout, dout, t: 0.5, color: pick(CAR_COLORS) });
}
function updateCars(dt) {
  if (era < 2) return;
  mainNetWait -= dt;
  if (mainNetWait <= 0) { updateMainNet(); mainNetWait = 0.5; }
  const target = Math.min(MAX_CARS, Math.floor(mainNetSize / ROAD_TILES_PER_CAR));
  carSpawnWait -= dt;
  if (cars.length < target && carSpawnWait <= 0) { spawnCar(); carSpawnWait = 0.4; }
  cars = cars.filter((c) => paved(c.x, c.y));   // 画面外へ出た車と、区画整理で無くなった道の上の車を消す
  for (const c of cars) {
    c.t += dt * CAR_SPEED;
    while (c.t >= 1) {
      c.t -= 1;
      c.x += DX[c.dout]; c.y += DY[c.dout];
      c.din = c.dout;
      if (!inMap(c.x, c.y)) break;   // 画面外へ出た（次のフレームで消す）
      if (!paved(c.x, c.y)) { c.x -= DX[c.din]; c.y -= DY[c.din]; c.din = opposite(c.din); }
      c.dout = nextDir(c);
    }
  }
}

// ---- カメラ ----
// 画面の中心を置ける範囲: 箱庭のひし形を、画面の大きさの VIEW_MARGIN 倍だけ縮めたひし形の中。外なら中心の向きへ寄せる
function clampView(x, y) {
  const my = OY + N * 8, r = Math.abs(x - OX) / (N * 16) + Math.abs(y - my) / (N * 8);
  const limit = Math.max(0, 1 - VIEW_MARGIN * (W / (N * 32) + H / (N * 16)));
  if (r <= limit) return [x, y];
  const k = limit / r;
  return [OX + (x - OX) * k, my + (y - my) * k];
}
// 工業地区の中心（タイルの上の位置）
const industryCenter = () => ({ x: (industryRect.x0 + industryRect.x1 + 1) / 2, y: (industryRect.y0 + industryRect.y1 + 1) / 2 });
// 時代 e でカメラをずらす向き（ラジアン）。前の時代と 90° 以上違う向きにする。工業地区があれば、自動車の時代は
// 工業地区の向きにし、鉄道・都市の時代はそこから回す。Math.random を引くと街の育ち方が変わるので、土地から決まる乱数で選ぶ
function camAngle(e) {
  const turn = (k) => Math.PI * (0.5 + hash(k, 0, landSeed + 81));
  if (industryRect) {
    const f = industryCenter(), a = Math.atan2(f.y - town.y - 0.5, f.x - town.x - 0.5);
    return e === 1 ? a - turn(2) : e === 3 ? a + turn(3) : a;
  }
  let a = hash(1, 0, landSeed + 81) * Math.PI * 2;
  for (let k = 2; k <= e; k++) a += turn(k);
  return a;
}
// カメラの目標: 時代の途中は街の中心からその時代の向きへずらした所に留まり、育ちきったら街のまわりを一周する。
// 自動車の時代は工業地区の向きへ、工業地区の中心が画面の CAM_INDUSTRY_VIEW の範囲に入るまでずらす（工場が建ち始めるのが見える）
function camTarget() {
  let a = camAngle(era), d = era ? CAM_ERA_SHIFT * ERA_RADIUS[era] : 0;
  if (era === 2 && industryRect) {
    const f = industryCenter(), tx = town.x + 0.5, ty = town.y + 0.5, dist = Math.hypot(f.x - tx, f.y - ty);
    // 街の中心から工業地区の中心までの、画面の上のずれ（ドット）
    const sx = Math.abs(worldX(f.x, f.y) - worldX(tx, ty)), sy = Math.abs(worldY(f.x, f.y, 0) - worldY(tx, ty, 0));
    const rest = Math.min(1, CAM_INDUSTRY_VIEW * W / 2 / (sx || 1), CAM_INDUSTRY_VIEW * H / 2 / (sy || 1));
    d = Math.max(d, (1 - rest) * dist);
  }
  if (holdTimer >= 0 && holdTimer <= HOLD_TIME) {
    a += Math.PI * 2 * (1 - holdTimer / HOLD_TIME);
    d = CAM_TOUR_RADIUS * ERA_RADIUS[3];
  }
  const x = town.x + 0.5 + Math.cos(a) * d, y = town.y + 0.5 + Math.sin(a) * d;
  return clampView(worldX(x, y), worldY(x, y, heightAt(x, y) * STEP_H));
}
function updateCamera(dt) {
  if (!cam.pinned) [cam.tx, cam.ty] = camTarget();
  const dx = cam.tx - cam.x, dy = cam.ty - cam.y, d = Math.hypot(dx, dy);
  if (d > 0.01) {
    const v = Math.min(W / CAM_SCREEN_TIME, d * 0.6);
    const k = Math.min(1, v * dt / d);
    cam.x += dx * k; cam.y += dy * k;
  }
}

// ---- 描く ----
// 物の画像を画面に重ねる。key・hb は物の奥行き（x + y + 1）と高さの段。手前の高い地面に隠れる所は描かない
function blit(s, dx, dy, key, hb) {
  const x0 = Math.max(0, -dx), y0 = Math.max(0, -dy), x1 = Math.min(s.w, W - dx), y1 = Math.min(s.h, H - dy);
  if (x0 >= x1 || y0 >= y1) return;
  const d = s.data, sw = s.w;
  for (let y = y0; y < y1; y++) {
    let si = y * sw + x0, di = (y + dy) * W + x0 + dx;
    for (let x = x0; x < x1; x++, si++, di++) {
      const c = d[si];
      if (c === 0) continue;
      if (gk[di] > key && gh[di] > hb) continue;
      screen[di] = c === SHADOW ? SHADE[screen[di]] : c;
    }
  }
}

// 箱庭の上の点 (u, v)、高さ z ドットに画像を置く
let viewLeft = 0, viewTop = 0;
function put(img, u, v, z, key, hb = Math.floor(z / STEP_H)) {
  blit(img, Math.round(worldX(u, v) - viewLeft) - img.ox, Math.round(worldY(u, v, z) - viewTop) - img.oy, key, hb);
}

// 乗り物と煙は、いるタイルに分けておき、そのタイルの物のあとに描く
const buckets = Array.from({ length: N * N }, () => []);
function addToBucket(img, u, v, z, keyBoost = 0) {
  const x = Math.floor(u), y = Math.floor(v);
  if (inMap(x, y)) buckets[at(x, y)].push({ img, u, v, z, keyBoost });
}

function render() {
  screen.fill(BLACK);
  gk.fill(0);
  gh.fill(0);
  const waterTick = Math.floor(time / WATER_FRAME_TIME);
  viewLeft = Math.round(cam.x - W / 2);
  viewTop = Math.round(cam.y - H / 2);
  for (const t of trains) {
    t.cars.forEach((car, k) => {
      const p = laneAt(lanes[t.lane], t.s - k * CAR_GAP);
      addToBucket(trainCarImage(car, p.dir), p.u, p.v, heightAt(p.u, p.v) * STEP_H);
    });
  }
  for (const c of cars) {
    const p = carPos(c);
    addToBucket(carImage(p.dir, c.color), p.u, p.v, heightAt(p.u, p.v) * STEP_H);
  }
  for (const p of puffs) {
    if (p.age > 1.2 && (Math.floor(p.age * 10) & 1)) continue;
    addToBucket(puffImage(p.age < 0.7 ? 1 : 2), p.u, p.v, p.z, 99);
  }
  // 地面
  updateGroundLayer(waterTick);
  copyGroundLayer();
  // 物と乗り物（奥から手前へ）
  for (let dsum = 0; dsum <= 2 * N - 2; dsum++) {
    const sy0 = dsum * 8 + OY - viewTop;
    if (sy0 < -40) continue;
    if (sy0 - 200 > H) break;
    for (let x = Math.max(0, dsum - N + 1); x <= Math.min(N - 1, dsum); x++) {
      const y = dsum - x, i = at(x, y), sx = (x - y) * 16 + OX - viewLeft;
      if (sx < -80 || sx > W + 80) continue;
      const key = x + y + 1;
      if (trees[i]) for (const t of trees[i]) put(t.sprite, x + t.u, y + t.v, heightAt(x + t.u, y + t.v) * STEP_H, key, tmin[i]);
      const o = obj[i];
      if (o) put(o.img, o.x0, o.y0, o.base * STEP_H, key);
      if (o?.over) put(o.over, o.x0, o.y0, o.base * STEP_H, key);   // 外している途中の足場
      for (const b of buckets[i]) put(b.img, b.u, b.v, b.z, key + b.keyBoost, Math.floor(b.z / STEP_H));
    }
  }
  for (const b of buckets) b.length = 0;
}

// ---- 新しい土地 ----
// preset は季節（COLOR_PRESETS の番号）。省くと前と違う季節を、土地の形から決まる乱数で選ぶ
function newLand(preset) {
  generateLand();
  road.fill(0);
  roadBegun.fill(0);
  railState.fill(0);
  obj.fill(null);
  cover.fill(-1);
  groundSprite.fill(null);
  groundCache.clear();
  layerStale = true;
  planTown();
  railLaid = 0;
  trains = []; cars = []; puffs = [];
  sites.length = 0;
  growth = 0;
  holdTimer = -1;
  startEra(0);
  cam.pinned = false;
  [cam.x, cam.y] = [cam.tx, cam.ty] = camTarget();
  setColorPreset(preset ?? pickColorPreset(at(town.x, town.y)));
}

// ---- 強度 ----
function setSpeed(v) {
  speed = clamp(v, MIN_SPEED, MAX_SPEED);
}

// ---- メインループ ----
function step(dt) {
  time += dt;
  if (!growthStopped) updateGrowth(dt);
  updateSites(dt);
  updateTrains(dt);
  updateFactorySmoke(dt);
  updatePuffs(dt);
  updateCars(dt);
  updateCamera(dt);
}

// 成長を早送りする（確認用。--at で呼ぶ）
function fastForward(seconds) {
  for (let t = 0; t < seconds; t += 0.1) step(0.1);
}

// 建物を 1 棟だけ、まわりに何も無い平地に建てる（確認用。--at で呼ぶ）。街の成長は止め、カメラはその建物に置いたままにする。
// 土地の物・木・道・線路をすべて片付け、陸は草地にする。vr は見た目の番号（0..BUILDING_VARIANTS-1）
let growthStopped = false;
function showcase(type = 'tower3', vr = 0) {
  growthStopped = true;
  sites.length = 0;
  trains = []; cars = []; puffs = [];
  obj.fill(null); cover.fill(-1); trees.fill(null); road.fill(0); roadBegun.fill(0); railState.fill(0); platform.fill(0);
  for (let i = 0; i < N * N; i++) if (!terr[i] && gtype[i] !== G_SAND) gtype[i] = G_GRASS;
  groundSprite.fill(null); groundCache.clear(); layerStale = true;
  // 街の中心にいちばん近い、まわり 3 タイルまで平らな陸の所
  const [fw, fd] = { block2: [2, 2], tower3: [2, 2], station1: [3, 1], station2: [3, 1] }[type] ?? [1, 1];
  const flat = (x, y) => { for (let dy = -3; dy < fd + 3; dy++) for (let dx = -3; dx < fw + 3; dx++) {
    if (!inMap(x + dx, y + dy)) return false;
    const i = at(x + dx, y + dy);
    if (terr[i] || tmin[i] !== tmax[i] || tmin[i] !== tmin[at(x, y)]) return false;
  } return true; };
  let best = null, bd = Infinity;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const d = Math.hypot(x - town.x, y - town.y);
    if (d < bd && flat(x, y)) { best = [x, y]; bd = d; }
  }
  const [x0, y0] = best;
  startSite(buildFrames(x0, y0, fw, fd, type, 3, G_LOT, vr));
  cam.x = cam.tx = Math.round(worldX(x0 + fw / 2, y0 + fd / 2));
  cam.y = cam.ty = Math.round(worldY(x0 + fw / 2, y0 + fd / 2, tmin[at(x0, y0)] * STEP_H) - 70);
  cam.pinned = true;
  return sites[0].frames.length;
}

function draw() {
  render();
  screenTex.needsUpdate = true;
  renderer.render(scene, camera);
}

let last = performance.now();
let nextDraw = 0;          // 次に描いてよい時刻 (ms)
function tick(now) {
  // MAX_FPS より速くは描かない。描いてよい時刻は一定の間隔で進め、画面の更新の間隔の揺れで 1 回飛ばさないよう少し余裕を持たせる
  if (now < nextDraw - 2) return;
  nextDraw = Math.max(nextDraw + 1000 / MAX_FPS, now);
  // rAF のタイムスタンプは初期の performance.now() より前のことがあるので負にしない
  const dt = Math.max(0, Math.min((now - last) / 1000, 0.1));
  last = now;
  step(dt);
  draw();
}

// ---- 入力・UI ----
// 全画面・カーソルを隠す処理・画面を消さない処理・キーとスワイプ・強度のゲージは common.js
setupControls({
  // シーン切替（Space・左右スワイプ）。暗転して、新しい土地に移る
  changeScene: () => fadeAndRun(newLand),
  // 強度（↑↓・上下スワイプ）。成長の速さ
  intensity: {
    up: () => setSpeed(speed * SPEED_STEP),
    down: () => setSpeed(speed / SPEED_STEP),
    level: () => logPosition(speed, MIN_SPEED, MAX_SPEED),   // ゲージの位置（0..1）
  },
  onResize() {
    renderer.setSize(innerWidth, innerHeight);
    layoutScreen();
  },
});

// ---- 開始 ----
newLand();
renderer.setAnimationLoop(tick);
</script>
</body>
