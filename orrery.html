<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
// 共通の入力・UI と小さな関数（common.js）
const { TAU, clamp, rand, randInt, pick, gray, IS_TOUCH, fadeAndRun, isFading, logPosition, setupControls, compactHdrFormat } = Common;

// ---- 設定 ----
// 長さの単位は m。机の天板の上面が y = 0、オーラリーの軸が原点を通る。+z が手前（カメラ側）

// カメラ（オーラリーの正面を中心に、左右へゆっくり往復する）
const CAM_FOV = 35;
const CAM_DIST = 0.84;            // 見る点からの距離（横長の画面）
const CAM_FRAME_WIDTH = 0.57;     // 縦長の画面では、見る点の位置でこの幅（m）が画面に収まるまで離す（オーラリーの幅の 9 割ほどが収まる）
const CAM_TARGET_Y = 0.15;        // 見る点の高さ（上げるほど、画面の中身が下へずれる）
const CAM_ELEVATION = 27;         // 見下ろす角度（度）
const CAM_ELEVATION_SWAY = 3;     // 見下ろす角度の揺れ（±度）
const CAM_ELEVATION_PERIOD = 131; // その周期（秒）
const CAM_SWAY = 32;              // 左右の往復の幅（±度）
const CAM_SWAY_PERIOD = 210;      // 左右の往復の周期（秒）

// 公転の速さ（倍率）
const BASE_SPEED = 1;
const MIN_SPEED = 0.25;
const MAX_SPEED = 4;
const SPEED_STEP = 1.25;          // ↑↓ 1回あたりの倍率
const EARTH_PERIOD = 60;          // 速さ 1 倍で地球が 1 周する秒数（副軸も同じ速さで逆に回る）
const MOON_RATIO = 6;             // 地球が 1 周する間に月が回る数（腕に対して）
const EARTH_SPIN = 12;            // 地球が 1 周する間に自転する数（整数。巻き戻しで向きが飛ばないように）
const EARTH_TILT = 23.4;          // 地軸の傾き（度）。向きは公転しても変えない

// 歯車。惑星ごとに、主軸の歯車（teeth 枚）と副軸の歯車（GEAR_TEETH_SUM - teeth 枚）が噛み合う。
// 公転の速さは歯数の比（副軸 ÷ 主軸）で決まる
const GEAR_TEETH_SUM = 72;        // 噛み合う 2 枚の歯数の和（軸の間隔が全段で同じになる）
const GEAR_MODULE = 0.0025;       // 歯の大きさ（ピッチ円の直径 ÷ 歯数）
const GEAR_THICKNESS = 0.004;
const GEAR_BASE_Y = 0.048;        // いちばん下の歯車の高さ
const GEAR_PITCH_Y = 0.009;       // 歯車の段の間隔
const GEAR_SPOKES = 5;            // 大きい歯車の肉抜きの数
const GEAR_SPOKE_MIN_TEETH = 24;  // これより歯の少ない歯車は肉抜きしない
const GEAR_HUB = { radius: 0.0032, height: 0.007 };   // 歯車を軸に留めるボス（radius: 軸からの肉厚、height: 高さ）
// ボスを付けない歯車（惑星の名前）。いつものカメラからは、上の段の歯車の陰になって一度も写らない
const HUBLESS = { shaft: ['Mercury'], layshaft: ['Mercury', 'Venus', 'Mars'] };
const LAYSHAFT_ANGLE = -55;       // 主軸から見た副軸の向き（度。0 が +x、負が手前）

// 惑星。内側から順。orbit: 腕の長さ、radius: 球の半径、teeth: 主軸の歯車の歯数、rough: 球の粗さ
const PLANETS = [
  { name: 'Mercury', orbit: 0.052, radius: 0.0055, teeth: 18, rough: 0.7 },
  { name: 'Venus',   orbit: 0.083, radius: 0.0085, teeth: 24, rough: 0.5 },
  { name: 'Earth',   orbit: 0.125, radius: 0.0100, teeth: 36, rough: 0.45 },
  { name: 'Mars',    orbit: 0.165, radius: 0.0072, teeth: 45, rough: 0.65 },
  { name: 'Jupiter', orbit: 0.225, radius: 0.0195, teeth: 54, rough: 0.5 },
  { name: 'Saturn',  orbit: 0.290, radius: 0.0155, teeth: 58, rough: 0.5 },
];
// 惑星と月の模様の色（RGB、0〜255）。実際の見た目に寄せつつ、彩度は控えめにする
const PLANET_LOOKS = {
  Mercury: { dark: [86, 80, 72], light: [170, 162, 150] },
  Venus: { dark: [186, 160, 112], light: [232, 220, 188] },
  Earth: { deep: [22, 54, 110], ocean: [50, 104, 170], land: [86, 98, 58], desert: [156, 134, 92], ice: [228, 230, 228], cloud: [236, 236, 232] },
  Mars: { dark: [92, 52, 36], base: [168, 96, 60], ice: [226, 218, 206] },
  Jupiter: { belt: [140, 98, 66], zone: [222, 206, 172], pole: [130, 112, 92], spot: [176, 98, 66] },
  Saturn: { belt: [184, 156, 108], zone: [226, 210, 168], pole: [150, 140, 118] },
  Moon: { mare: [150, 147, 140], highland: [188, 184, 175] },
};
const PLANET_SEED = 7;            // 模様の乱数の種（配置の乱数とは別）
const PLANE_Y = 0.215;            // 太陽と惑星の球の中心の高さ
const SUN_RADIUS = 0.028;
// 太陽は深い赤橙のガラス玉（光らせない）。光を通す描き方（transmission）は不透明な物を全部もう 1 回描いて重いので、
// 光を通さない深い赤の地に、磨いたガラスの艶の層（clearcoat）を重ねてガラスに見せる（地が明るいと陶器のように見える）。
// roughness: 地の粗さ（照り返しは艶の層に任せるので粗め）、gloss: 艶の層の粗さ（小さいほど照り返しが鋭く明るい。
// 小さすぎると、明かりの照り返しが針で突いたような強い点になって目を引く）
const SUN_GLASS = { color: 0x8a3212, roughness: 0.3, gloss: 0.08 };
const ARM_TOP_Y = 0.175;          // いちばん内側（水星）の腕の高さ。外側ほど下に付く
const ARM_PITCH_Y = 0.012;        // 腕の段の間隔
const ARM_RADIUS = 0.002;         // 腕の太さ（半径）
const MOON = { orbit: 0.024, radius: 0.0032, rough: 0.8 };
const SATURN_RING = { inner: 0.021, outer: 0.031, tilt: 0.47, lean: 0.24 };   // tilt: 左右への傾き、lean: 奥への傾き（rad）。向きは公転しても変えない

// 台座
const BASE_RADIUS = 0.18;         // 木の台
const PLATE_RADIUS = 0.16;        // 目盛りを刻んだ真鍮の板
const PLATE_Y = 0.039;            // 板の上面の高さ

// 素材の色
const BRASS = 0xc19a4f;           // 磨いた真鍮
const BRASS_AGED = 0x9a7636;      // くすんだ真鍮
// 真鍮の照り返し。金属度は 0〜1（1 で鏡のように映り込み、ろうそくの照り返しが強くなる）、粗さは大きいほど照り返しが広く弱い
const BRASS_METALNESS = 0.85;
const BRASS_ROUGHNESS = { normal: 0.4, aged: 0.5, dial: 0.6, ring: 0.42 };   // dial: 目盛りの板（広い平面でろうそくを映して白く飛ばないよう粗め）、ring: 土星の輪
const EBONY = 0x17100b;           // 台の木
const BACKGROUND = 0x030201;

// 机と部屋
const DESK = { left: -1.24, right: 1.6, depth: 1.7, centerZ: 0.2, thickness: 0.06, plank: 0.028 };   // left・right: 天板の左右の端の x、centerZ: 天板の中心の z、plank: 天板の板の厚み（m）
// 時代ごとの机（オーラリーだけが受け継がれ、机は時代の物に替わる）。天板は、板を前後方向に並べ、奥と左の辺に縁取りの木を置く。
// width: 板の幅の範囲、gap: 板のすき間、step: 板ごとの高さの違いの最大、edge: 縁の丸まった幅、trim: 縁取りの木の幅（0 で作らない）、
// trimRaise: 縁取りを天板の板より高くする分（m）、tint: 板ごとの明るさの違いの範囲、variants: 描く木目の種類の数（板ごとに選ぶ）、
// roughness: 塗装の粗さ（小さいほど艶が出る）、bumpScale: 木目の凹凸の強さ、side: 板の側面の色。
// wood は木目。early: 年輪の明るい部分（春材）、late: 暗い部分（秋材）の色（RGB）、rings: 年輪の数（1m あたり）、
// pith: 年輪の中心（丸太の芯）の、板の表面からの深さの範囲（m。浅いほど山形の木目が詰まる）、aging: 年月で色が沈着した、ゆるく大きなむらの強さ、knots: 板 1 枚の節の最大数
const DESK_STYLES = [
  {   // Candle: 無骨な普段使いの机。幅広の無垢板を、すき間を空けて並べる。無塗装で、淡い色の木が年月で落ち着いた色になったもの
    width: [0.175, 0.185], gap: 0.005, step: 0.001, edge: 0.006, trim: 0.09, trimRaise: 0.003, tint: [0.88, 1.08], variants: 6,
    roughness: 0.78, bumpScale: 4, side: 0x2a1a0e,
    wood: { early: [134, 104, 68], late: [106, 79, 50], rings: 90, pith: [0.03, 0.12], aging: 0.1, knots: 2 },
  },
  {   // Filament: 中ほどの茶色のニス塗りの書斎机（色味と明るさは、Candle と LED の机の中間）。さらに幅の広い板を細いすき間で継ぎ、艶がある。節の無いまっすぐな木目
    width: [0.27, 0.29], gap: 0.0015, step: 0.0002, edge: 0.003, trim: 0.07, trimRaise: 0.004, tint: [0.94, 1.05], variants: 6,
    roughness: 0.42, bumpScale: 1, side: 0x1a0e08,
    wood: { early: [146, 110, 76], late: [116, 84, 56], rings: 110, pith: [0.06, 0.2], aging: 0.04, knots: 0 },
  },
  {   // LED: 明るい木の色の集成材の机。約 10cm 幅の板をすき間なく寄せ、木目の濃淡は小さい。艶は無く、縁は角ばり、縁取りは無い
    width: [0.095, 0.105], gap: 0.0008, step: 0, edge: 0.0015, trim: 0, trimRaise: 0, tint: [0.95, 1.04], variants: 6,
    roughness: 0.72, bumpScale: 1.5, side: 0x6a5238,
    wood: { early: [170, 138, 103], late: [158, 126, 92], rings: 140, pith: [0.08, 0.3], aging: 0.03, knots: 0 },
  },
];
const WOOD_TEXTURE = IS_TOUCH ? [128, 1024] : [192, 1536];   // 木目 1 種類の画素数（板の幅、長さ）
const TEXTURE_ANISOTROPY = 8;     // 斜めから見たテクスチャをぼかさないための異方性フィルタの強さ
const WALL_Z = -1.1;              // 奥の壁
// 奥の壁に明かりが落とす光だまり。明かりの真後ろの壁を中心に、点光源が平らな壁を照らすときの形で外へ薄れる。
// spread: 中心から明るさが半分ほどに落ちるまでの半径（m）。色・強さ・広さは時代ごとに SCENES の wallGlow で決める
const WALL_GLOW_EXTENT = 3.5;     // 光だまりの板の半径（spread に対する倍率。ここで 0 になる）
// 壁紙。黒に近い藍色の地に、星だけを控えめに刷る（宇宙の雰囲気）（オーラリーより目を引かないように）。光だまりの中だけで見える。
// tile: 柄の繰り返しの一辺（m）、base: 地の色、ink: 柄の色、inkAlpha: 柄の濃さ、seed: 柄の乱数の種（配置の乱数とは別）
const WALLPAPER = { tile: 0.6, base: '#161b3c', ink: '#d8c99c', inkAlpha: 0.3, seed: 11 };

// 小物の位置（x, z）と向き（rad）
const CANDLE = { x: 0.35, z: -0.21, handleAngle: -0.64 };   // handleAngle: 燭台の持ち手の向き（rad。オーラリーの逆側より少し手前、右下に向ける）
const TELESCOPE = { x: -0.37, z: -0.3, angle: 0.5, thickness: 1.35, leather: 0x4a2c18 };   // thickness: 筒の太さの倍率（長さは変えない）、leather: 鏡筒に巻いた革の色（焦げ茶）
const CHART = { x: -0.3, z: 0.2, angle: 0.35, width: 0.36, height: 0.26, wave: 0.0008, cornerLift: 0.005 };   // wave: 紙の波打ちの高さ（m。0〜2 倍の範囲で波打つ）、cornerLift: 左の角の反り上がり（m）

// ろうそく
// 蝋の上端の高さ。ろうそくを低くするときは、オーラリーの中心から見た炎の仰角（約 32°）が変わらないよう CANDLE を近づけ、
// FLAME_LIGHT.intensity を距離の 2 乗の比で下げる（照らし方を保つため）
const CANDLE_TOP_Y = 0.235;
const CANDLE_WAX_Y = 0.044;       // 蝋の下端（差し口の底）の高さ
const CANDLE_RADIUS = 0.0135;
const CANDLE_SOCKET_TOP = 0.056;  // 差し口の筒（ろうそくの根元を包む）の上端の高さ
const CANDLE_CONTACT = 0.008;     // ろうそくの根元の、筒の縁から上へ暗くする高さ（接地の陰）
// 側面に垂れて固まった蝋の筋。長さ・太さ（半径）は範囲の中の乱数（m）、start: 垂れ始めを上端から下げる最大（m）
const WAX_DRIPS = { count: 3, length: [0.025, 0.09], radius: [0.002, 0.0032], start: 0.005 };
// 燭台は手持ちの形。煤でくすんだ真鍮にする（受け皿が炎の真下で上を向くので、磨いた真鍮だと炎を鏡のように映して強く照り返す）
const CANDLESTICK = { color: 0x4a3818, metalness: 0.8, roughness: 0.6 };
const FLAME_HEIGHT = 0.04;
const FLAME_WIDTH = 0.0072;       // 炎のいちばん太い所の半径
const FLAME_BASE_Y = CANDLE_TOP_Y + 0.004;   // 炎の下端の高さ（芯の途中から立つ）
const FLAME_LIGHT_Y = FLAME_BASE_Y + FLAME_HEIGHT * 0.5;   // 炎の光（点光源）の高さ
const FLAME_COLORS = { base: [0.1, 0.2, 0.9], body: [3.4, 2.2, 0.7], tip: [2.6, 1.1, 0.25] };   // 光の強さそのまま（BLOOM.threshold を超える所がブルームで光る）
// 炎のまわりの滲み。中心から外へ薄れる光の板（常にカメラを向く）。width・height: 大きさ（m）、color: 中心の光の強さ
const FLAME_HALO = { width: 0.045, height: 0.07, color: [0.8, 0.45, 0.16] };
const FLAME_CORE = { width: 0.45, height: 0.4, color: [0.04, 0.025, 0.03] };   // 芯のまわりの暗い部分（炎の幅・高さに対する割合と、色）
const FLAME_LIGHT = { color: 0xffa95c, intensity: 1.19, flicker: 0.035 };   // flicker: 明るさの揺れ（割合）
const FLAME_RATES = [7.3, 2.9, 4.1, 11.7];   // 炎の揺れの速さ（rad/秒）。揃わない 4 つの波を重ねる
const SHADOW_MAP_SIZE = 1024;

// 時代（シーン）。オーラリー・机・カメラは同じで、右奥の明かりと左の 2 つの小物、部屋の色が替わる。
// light: 電灯の光（ろうそくの時代は null。intensity は炎と同じ距離に置いたときの強さで、遠ざけた分は自動で上げる）。
// 仄暗いのは Candle だけで、現代に近づくほど部屋全体を明るくする（部屋のほかの明かりや、壁に回る光が増える）。
// 明るくするのは主に環境光にする。電灯の光を強くすると、真鍮の照り返しが白く飛ぶ（環境光は金属の真鍮にほとんど効かない）。
// ambient: 環境光の色と強さ、room: 映り込み用の部屋の壁と天井の明るさ（ENV_ROOM に対する倍率）、
// envDesk: 映り込み用の部屋の、明かりに照らされた机の色（RGB）
const SCENES = [
  { name: 'Candle', light: null, ambient: [0xb89a84, 0.33], room: 1, envDesk: [0.3, 0.19, 0.1],
    wallGlow: { color: 0xff9a50, intensity: 1.16, spread: 0.45 } },   // ろうそく、望遠鏡、羊皮紙の星図
  { name: 'Filament', light: { color: 0xf9cfae, intensity: 1.1 }, ambient: [0xaea097, 1.25], room: 1.6, envDesk: [0.36, 0.26, 0.17],
    wallGlow: { color: 0xf9cfae, intensity: 1.49, spread: 0.6 } },   // 白熱電球のランプ、天体望遠鏡、星座早見盤
  { name: 'LED', light: { color: 0xf3f5ff, intensity: 0.9 }, ambient: [0xa5a7ab, 1.0], room: 1.7, envDesk: [0.44, 0.35, 0.25],
    wallGlow: { color: 0xf3f5ff, intensity: 0.85, spread: 0.8 } },   // LED の電灯、白い望遠鏡、タブレット
];
const ENV_ROOM = [0.085, 0.062, 0.045];   // 映り込み用の部屋の壁と天井（Candle）

// 電灯の光（スポットライト）。電灯は炎より背が高いので、光を炎より高く（height: m）置き、オーラリーの中心から見た仰角は炎と同じ（約 32°）に
// 保つ所まで遠ざける（影の長さと惑星の照らされ方を揃えるため）。高くするほど画面の上へずれるので、少しだけ上げ、向き（azimuth: 度。
// オーラリーから見た向きで、0 が +x、負が奥）を炎より少し奥へ回して、画面の上での位置を炎に近づける。
// angle: 光の広がり（軸からの角度、rad）、target: 光の軸が向かう点、
// shadowFocus: 影を描く範囲（光の広がりに対する割合。オーラリーと机の上の小物が収まる範囲に絞り、影の解像度を保つ）
const LAMP_LIGHT = { height: 0.28, azimuth: -40, angle: 1.3, penumbra: 0.5, target: [0, 0.1, 0], shadowFocus: 0.6, shadowMapSize: 2048 };
// Filament の電灯。黒い塗装の丸い台から、首の曲がる管（グースネック）が立ち、先の浅い笠をオーラリーの側へ傾ける。
// 笠の縁から透明な電球がのぞき、中のフィラメントが光る。shade: 笠の縁の半径と深さ（m）、tilt: 笠の傾き（rad）、
// bulb: 電球の半径（m）、filament: フィラメントの光の強さ（BLOOM.threshold を超えて滲む）、paint: 笠の外側の塗装（落ち着いた濃い緑）、
// stand: 台と首の、黒に近い焼付塗装（真鍮にすると、オーラリーの真鍮と張り合うため。真鍮は笠の付け根の口金にだけ残す）
const FILAMENT_LAMP = { shade: [0.052, 0.055], tilt: 0.9, paint: 0x1e3a2a, stand: 0x181614, bulb: 0.017, filament: [3.2, 1.7, 0.6] };
// LED の電灯。丸い台から細い柱が立ち、関節から斜めに上がる平たい棒の頭の下面が光る。color・metalness・roughness: 艶を抑えた銀色のアルミ（電灯の光は自分に当たらず、環境光と映り込みだけで見えるので、暗い色だと闇に沈む）

// eccentricity: 離心率、far: 飛び始める・飛び終える所の太陽からの距離（m。画面のすぐ外。遠いほど、呼び出してから見えるまで待たされる）、
// duration: 飛び始めてから飛び終えるまでの秒数（強度に関わらない。far を変えるときは、太陽のそばの速さが変わらないよう合わせる）、

// 惑星には月の軌道と土星の輪を含める）
const COMET = { interval: [180, 120, 600], perihelion: 0.036, eccentricity: 0.97, far: 0.7, duration: 15, fade: 1, ease: 1.1,

// falloff: 先へ行くほど薄れる速さ（点の年齢の割合の何乗で薄れるか。大きいほど頭の近くだけが明るい）、

const MAX_PIXEL_RATIO = { pc: 1.5, touch: 1 };  // 解像度の倍率の上限（pc: PC、touch: スマホなど）
const MAX_FPS = 60;               // 1 秒に描く回数の上限（120Hz などの画面での CPU と GPU の負荷を抑える）
const MSAA_SAMPLES = 4;           // シーンを描く描画先の MSAA
const BLOOM = { strength: 0.45, radius: 0.8, threshold: 1.3, scale: 0.5, sigma: 0.4 };   // scale: ブルームを描く解像度の倍率、sigma: ぼかしの標準偏差（ぼかしの半径に対する割合）
// シーンの明るさの上限（光の強さそのまま）。艶の鋭い照り返しは半精度の上限（約 65000）を超えることがあり、
// Android などの GPU は無限大として書き込む。ブルームがそれをぼかすと、ぼかしの範囲いっぱいの四角い光になる。
// 炎・フィラメント（3 前後）よりは十分大きくする

const VIGNETTE = 0.55;            // 周辺減光の強さ（画面の隅で暗くする割合）
const EXPOSURE = 1.1;             // トーンマッピングの露出

// ---- ユーティリティ ----
const DEG = Math.PI / 180;
const gcd = (a, b) => (b ? gcd(b, a % b) : a);
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };   // GLSL の smoothstep と同じ
const mixRgb = (a, b, t) => a.map((x, i) => x + (b[i] - x) * clamp(t, 0, 1));

function canvasTexture(width, height, draw) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  draw(canvas.getContext('2d'), width, height);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = TEXTURE_ANISOTROPY;
  return texture;
}

// 角の丸い長方形（中心が原点、幅 w・高さ h、角の半径 radius）
function roundedRect(w, h, radius) {
  const shape = new THREE.Shape(), x = w / 2, y = h / 2, c = radius;
  shape.moveTo(-x + c, -y);
  shape.lineTo(x - c, -y);
  shape.quadraticCurveTo(x, -y, x, -y + c);
  shape.lineTo(x, y - c);
  shape.quadraticCurveTo(x, y, x - c, y);
  shape.lineTo(-x + c, y);
  shape.quadraticCurveTo(-x, y, -x, y - c);
  shape.lineTo(-x, -y + c);
  shape.quadraticCurveTo(-x, -y, -x + c, -y);
  return shape;
}

// 角の丸い板（机に寝かせた向き。中心が原点、幅 w（x）・奥行き d（z）、高さ 0〜height）。縁を bevel だけ丸める。
// 面のグループは 0 が上下の面、1 が縁
function roundedSlab(w, d, height, radius, bevel) {
  const geometry = new THREE.ExtrudeGeometry(roundedRect(w, d, radius),
    { depth: height - 2 * bevel, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2, curveSegments: 6 });
  geometry.rotateX(Math.PI / 2);   // 形の y を z に寝かせ、押し出しを下向きにする
  geometry.translate(0, height - bevel, 0);
  return geometry;
}

// 縦の円柱（y0〜y1）
function column(radius, y0, y1, material, segments = 20) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, y1 - y0, segments), material);
  mesh.position.y = (y0 + y1) / 2;
  return mesh;
}

// 断面 [半径, 高さ] の列を軸のまわりに回した形
function lathe(profile, material, segments = 48) {
  return new THREE.Mesh(new THREE.LatheGeometry(profile.map(([r, y]) => new THREE.Vector2(r, y)), segments), material);
}

function ball(radius, material) {
  return new THREE.Mesh(new THREE.SphereGeometry(radius, 32, 20), material);
}

// 物を場面に加え、時代ごとの物の一覧にも入れる（時代を替えるときに、一覧ごと見せる・隠す）
function place(list, ...objects) {
  for (const o of objects) {
    scene.add(o);
    list.push(o);
  }
}

// 物を寝かせて置く（y が長さの軸の物を、x の向きへ倒す）。radius: 机から軸までの高さ
function layDown(object, x, z, angle, radius) {
  object.rotation.z = Math.PI / 2;
  const holder = new THREE.Group();
  holder.add(object);
  holder.position.set(x, radius, z);
  holder.rotation.y = angle;
  return holder;
}

// 紙の上の、細かな染みとむら（canvas に描く。rgb: 染みの色の 'r,g,b'）
function paperBlots(g, w, h, count, rgb) {
  for (let i = 0; i < count; i++) {
    const x = rand(0, w), y = rand(0, h), r = rand(20, 120);
    const blot = g.createRadialGradient(x, y, 0, x, y, r);
    blot.addColorStop(0, `rgba(${rgb},${rand(0.03, 0.1)})`);
    blot.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = blot;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }
}

// 影を落とし、影を受けるようにする
function shadowed(object) {
  object.traverse((o) => { if (o.isMesh) o.castShadow = o.receiveShadow = true; });
  return object;
}

// ---- シェーダー ----
// シーンの描画先を composer へ写す。明るさを MAX_RADIANCE で抑える（無限大も抑えられる）
const SCENE_COPY_SHADER = {
  uniforms: { tScene: { value: null }, maxRadiance: { value: MAX_RADIANCE } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: `
    uniform sampler2D tScene;
    uniform float maxRadiance;
    varying vec2 vUv;
    void main() {
      gl_FragColor = vec4(min(texture2D(tScene, vUv).rgb, vec3(maxRadiance)), 1.0);
    }`,
};
const VIGNETTE_SHADER = {
  uniforms: { tDiffuse: { value: null }, amount: { value: VIGNETTE } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float amount;
    varying vec2 vUv;
    void main() {
      vec2 d = vUv - 0.5;
      gl_FragColor = texture2D(tDiffuse, vUv) * (1.0 - amount * smoothstep(0.1, 0.75, dot(d, d) * 2.0));
    }`,
};

// ---- three.js 初期化 ----
// シーンは別の描画先に描くので、画面側のアンチエイリアスは効かない。無駄なので切る
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, IS_TOUCH ? MAX_PIXEL_RATIO.touch : MAX_PIXEL_RATIO.pc));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = EXPOSURE;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(BACKGROUND);
const camera = new THREE.PerspectiveCamera(CAM_FOV, innerWidth / innerHeight, 0.05, 20);

// マルチサンプルにするのはシーンを描く描画先だけ。色の形式は compactHdrFormat（common.js）で選ぶ
const sceneTarget = new THREE.WebGLRenderTarget(1, 1,
  { type: THREE.HalfFloatType, ...compactHdrFormat(renderer, MSAA_SAMPLES), samples: MSAA_SAMPLES });
function updateSceneTargetSize() {
  const pr = renderer.getPixelRatio();
  sceneTarget.setSize(Math.round(innerWidth * pr), Math.round(innerHeight * pr));
}
updateSceneTargetSize();

const composer = new EffectComposer(renderer,
  new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, ...compactHdrFormat(renderer), depthBuffer: false }));
composer.setPixelRatio(renderer.getPixelRatio());
composer.setSize(innerWidth, innerHeight);
// 写すのは sceneTarget なので、前のパスの絵（tDiffuse）は受け取らない
const scenePass = new ShaderPass(SCENE_COPY_SHADER, 'none');
scenePass.uniforms.tScene.value = sceneTarget.texture;
scenePass.material.blending = THREE.NoBlending;
composer.addPass(scenePass);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), BLOOM.strength, BLOOM.radius, BLOOM.threshold);
// composer が渡す大きさより粗く描く
const setBloomSize = bloom.setSize.bind(bloom);
bloom.setSize = (width, height) => setBloomSize(width * BLOOM.scale, height * BLOOM.scale);
// three.js（r160）のブルームは、ぼかしの重みが端でも中心の 6 割あるところで打ち切られる（標準偏差がぼかしの半径と同じ）。
// 炎のように小さくてとても明るい点では、打ち切りの境目が四角い光の縁として見える。端でほぼ 0 になる重みに差し替える
for (const material of bloom.separableBlurMaterials) {
  const radius = material.defines.KERNEL_RADIUS;
  material.uniforms.gaussianCoefficients.value =
    Array.from({ length: radius }, (_, i) => Math.exp(-0.5 * (i / (radius * BLOOM.sigma)) ** 2));
}
composer.addPass(bloom);
composer.addPass(new ShaderPass(VIGNETTE_SHADER));
composer.addPass(new OutputPass());
// MSAA は明るさがそのままの状態で縁をならすので、炎や照り返しのような明るい物と暗い背景の境目には段差が残り、
// ゆっくり動くとちらつく。トーンマッピングのあとの絵で、もう一度縁をならす
composer.addPass(new SMAAPass(innerWidth, innerHeight));

// 金属に映り込む部屋。暗い壁と天井、明かりに照らされた机だけの簡単な部屋を撮り、粗さに応じてぼかす（PMREM）。
// 時代を替えるたびに、机の色を替えて撮り直す
function buildEnvironment({ room, envDesk: deskRgb }) {
  const env = new THREE.Scene();
  const flat = (rgb) => new THREE.MeshBasicMaterial({ color: new THREE.Color(...rgb), side: THREE.DoubleSide });
  env.add(new THREE.Mesh(new THREE.BoxGeometry(6, 4, 6), flat(ENV_ROOM.map((c) => c * room))));
  const desk = new THREE.Mesh(new THREE.CircleGeometry(1.1, 32), flat(deskRgb));
  desk.rotation.x = -Math.PI / 2;
  desk.position.y = -0.2;
  env.add(desk);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment?.dispose();
  scene.environment = pmrem.fromScene(env, 0.03).texture;
  pmrem.dispose();
  env.traverse((o) => { if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); } });
}
buildEnvironment(SCENES[0]);

const ambientLight = new THREE.AmbientLight(...SCENES[0].ambient);
scene.add(ambientLight);

// ---- 状態 ----
let time = 0;                // 経過秒（カメラ用）
let speed = BASE_SPEED;      // 公転の速さ（倍率）
let earthAngle = 0;          // 地球が回った角度（rad）。全部の歯車の角度をここから求める
const flamePhase = [0, 0, 0, 0];         // 炎の揺れの位相（0〜2π）

// earthAngle を巻き戻す周期。歯数の比（3、2、1、3/5、1/3、7/29）のどれを掛けても 2π の整数倍になる角度。
// 比を約分した分母（主軸の歯数 ÷ 2 枚の歯数の最大公約数）の最小公倍数だけ回った所で、全部の歯車が元の向きに戻る
const EARTH_ANGLE_WRAP = TAU * PLANETS
  .map((planet) => planet.teeth / gcd(planet.teeth, GEAR_TEETH_SUM - planet.teeth))
  .reduce((a, b) => a * b / gcd(a, b));

// ---- 素材 ----
const metal = (color, roughness) => new THREE.MeshStandardMaterial({ color, metalness: BRASS_METALNESS, roughness });
const brass = metal(BRASS, BRASS_ROUGHNESS.normal);
const brassAged = metal(BRASS_AGED, BRASS_ROUGHNESS.aged);

// 天板の木目。丸太から切り出した板の表面に出る年輪の断面を、1 画素ずつ求める。年輪の中心（芯）から外れた所を通る年輪が、
// 板目の山形の模様になる。色（map）と凹凸（bumpMap）を同時に描く（荒い仕上げなので、柔らかい明るい部分がへこむ）
// style: 机（DESK_STYLES の 1 つ）、plankWidth・length: 貼る板の幅と長さ（m。年輪の間隔と縁の丸まり、節の形を、板の大きさによらず揃えるため）
function plankTextures(style, plankWidth, length) {
  const WOOD = style.wood;
  const [W, H] = WOOD_TEXTURE;
  const g = document.createElement('canvas').getContext('2d'), b = document.createElement('canvas').getContext('2d');
  g.canvas.width = b.canvas.width = W;
  g.canvas.height = b.canvas.height = H;
  const color = g.createImageData(W, H), bump = b.createImageData(W, H);
  const depth = rand(...WOOD.pith), center = rand(-0.6, 0.6) * plankWidth;   // 芯の深さと、板の幅の中での位置
  const p = Array.from({ length: 5 }, () => rand(0, TAU));
  const pores = Float32Array.from({ length: W }, () => rand(-1, 1));   // 導管の細い筋（板の長さに沿う）
  const knots = Array.from({ length: randInt(WOOD.knots + 1) }, () => ({ x: rand(-0.4, 0.4) * plankWidth, z: rand(0.1, 0.9) * length, r: rand(0.004, 0.01) }));
  for (let y = 0; y < H; y++) {
    const z = y / H * length;
    const axis = center + 0.005 * Math.sin(z * 1.7 + p[0]) + 0.0015 * Math.sin(z * 5.3 + p[1]);   // 芯は長さに沿ってゆるく曲がる
    for (let x = 0; x < W; x++) {
      const X = (x / W - 0.5) * plankWidth;
      let r = Math.hypot(X - axis, depth) + 0.0012 * Math.sin(z * 9 + X * 40 + p[2]) + 0.0005 * Math.sin(z * 31 + p[3]);
      let dark = 0;
      for (const k of knots) {   // 節: まわりの年輪をゆがめ、中心を暗くする
        const d = Math.hypot(X - k.x, (z - k.z) * 0.4);
        r += 0.012 * Math.exp(-d / k.r);
        dark = Math.max(dark, 1 - smooth(k.r * 0.6, k.r, d));
      }
      const t = (r * WOOD.rings) % 1;
      const late = smooth(0.68, 0.88, t) * (1 - smooth(0.94, 1, t));   // 年輪の暗い部分（秋材）。明るい側からゆるく濃くなり、境目ではっきり切り替わる
      const edge = 1 - smooth(0, style.edge, Math.min(x, W - 1 - x) / W * plankWidth);   // 長い辺の縁（使い込んで丸まる）で 1
      const aging = WOOD.aging * (0.5 + 0.5 * Math.sin(z * 1.3 + p[4] * 2) * Math.sin(X * 17 + p[0]));   // 沈着した色のむら
      const shade = 1 + 0.05 * pores[x] + 0.04 * Math.sin(z * 2.3 + p[4]) - 0.45 * dark - 0.4 * edge - aging;
      const i = (y * W + x) * 4;
      for (let c = 0; c < 3; c++) color.data[i + c] = (WOOD.early[c] + (WOOD.late[c] - WOOD.early[c]) * late) * shade;
      bump.data[i] = bump.data[i + 1] = bump.data[i + 2] = (120 + 45 * late + 10 * pores[x]) * (1 - 0.6 * edge);
      color.data[i + 3] = bump.data[i + 3] = 255;
    }
  }
  g.putImageData(color, 0, 0);
  b.putImageData(bump, 0, 0);
  const map = new THREE.CanvasTexture(g.canvas), bumpMap = new THREE.CanvasTexture(b.canvas);
  map.colorSpace = THREE.SRGBColorSpace;
  map.anisotropy = bumpMap.anisotropy = TEXTURE_ANISOTROPY;
  return { map, bumpMap };
}
// 机 1 つ分の木目（天板の板の木目を variants 通りと、奥と左の縁取りの木目）
function deskTextures(style) {
  const planks = Array.from({ length: style.variants }, () => plankTextures(style, (style.width[0] + style.width[1]) / 2, DESK.depth - style.trim));
  if (!style.trim) return { planks };
  return { planks, trim: plankTextures(style, style.trim, DESK.right - DESK.left - style.trim), sideTrim: plankTextures(style, style.trim, DESK.depth) };
}
const candleDeskTextures = deskTextures(DESK_STYLES[0]);   // Candle の机は、木目を描く順を変えないよう、ここで描く

// ---- 歯車 ----
// 歯数 teeth の平歯車（軸は y、厚みの中心が y = 0）。歯の 1 つが +x を向く。大きい歯車は扇形に肉抜きする
const gearGeometries = new Map();
function gearGeometry(teeth) {
  if (gearGeometries.has(teeth)) return gearGeometries.get(teeth);
  const pitch = teeth * GEAR_MODULE / 2;          // ピッチ円の半径
  const root = pitch - 1.25 * GEAR_MODULE, tip = pitch + GEAR_MODULE;
  const step = TAU / teeth;
  const shape = new THREE.Shape();
  for (let i = 0; i < teeth; i++) {
    const a = i * step;
    const corners = [[root, -0.27], [tip, -0.11], [tip, 0.11], [root, 0.27]];
    corners.forEach(([r, f], k) => {
      const x = r * Math.cos(a + f * step), y = r * Math.sin(a + f * step);
      if (i === 0 && k === 0) shape.moveTo(x, y); else shape.lineTo(x, y);
    });
  }
  shape.closePath();
  if (teeth >= GEAR_SPOKE_MIN_TEETH) {
    const inner = Math.max(0.009, pitch * 0.28), outer = root - Math.max(0.004, pitch * 0.12);
    const span = TAU / GEAR_SPOKES;
    for (let i = 0; i < GEAR_SPOKES; i++) {
      const a0 = (i + 0.5) * span - span * 0.36, a1 = (i + 0.5) * span + span * 0.36;
      const hole = new THREE.Path();
      hole.absarc(0, 0, outer, a0, a1, false);
      hole.absarc(0, 0, inner, a1, a0, true);
      hole.closePath();
      shape.holes.push(hole);
    }
  }
  const geometry = new THREE.ExtrudeGeometry(shape, { depth: GEAR_THICKNESS, bevelEnabled: false, curveSegments: 8 });
  geometry.translate(0, 0, -GEAR_THICKNESS / 2);
  geometry.rotateX(-Math.PI / 2);   // 形の角度 φ が rotation.y = φ と同じ向きになる
  gearGeometries.set(teeth, geometry);
  return geometry;
}

// ---- 惑星の模様 ----
// 惑星と月の模様。球に巻く画像（正距円筒図法。u: 経度 0〜1、v: 緯度 0〜1 で 0 が北極）を描く。
// 乱数は Math.random と別にする（配置の乱数の列を変えないため）
function seededRandom(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const planetRandom = seededRandom(PLANET_SEED);

// 値ノイズを細かさを変えて重ねたもの（0〜1、平均 0.5）。経度の端（u = 0 と 1）でつながる。cells: いちばん粗い格子の経度方向の数
function sphereNoise(cells, octaves) {
  const layers = [];
  for (let o = 0; o < octaves; o++) {
    const nx = cells << o, ny = Math.max(2, nx >> 1) + 1;
    layers.push({ nx, ny, values: Float32Array.from({ length: nx * ny }, () => planetRandom()) });
  }
  const fade = (x) => x * x * (3 - 2 * x);
  return (u, v) => {
    let sum = 0, total = 0, amp = 1;
    for (const { nx, ny, values } of layers) {
      const x = u * nx, y = v * (ny - 1);
      const x0 = Math.floor(x), y0 = Math.min(ny - 2, Math.floor(y));
      const fx = fade(x - x0), fy = fade(y - y0);
      const i0 = ((x0 % nx) + nx) % nx, i1 = (i0 + 1) % nx;
      const a = values[y0 * nx + i0], b = values[y0 * nx + i1];
      const c = values[(y0 + 1) * nx + i0], d = values[(y0 + 1) * nx + i1];
      sum += amp * (a + (b - a) * fx + (c - a + (a - b + d - c) * fx) * fy);
      total += amp;
      amp *= 0.5;
    }
    return sum / total;
  };
}

// 1 画素ずつ色（color(u, v) が返す [r, g, b]）を決めて描く。after があれば、そのあとに canvas で描き足す
function planetTexture(width, height, color, after) {
  return canvasTexture(width, height, (g, w, h) => {
    const image = g.createImageData(w, h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const [r, gr, b] = color((x + 0.5) / w, (y + 0.5) / h);
        const i = (y * w + x) * 4;
        image.data[i] = r;
        image.data[i + 1] = gr;
        image.data[i + 2] = b;
        image.data[i + 3] = 255;
      }
    }
    g.putImageData(image, 0, 0);
    if (after) after(g, w, h);
  });
}

// クレーター。底は暗く、縁は明るい。小さいものほど多い。緯度が高いほど横に引き伸ばし（正距円筒図法）、経度の端をまたぐものは両側に描く
function craters(g, w, h, count, maxRadius, strength) {
  for (let i = 0; i < count; i++) {
    const r = 1 + maxRadius * planetRandom() ** 2;
    const x = planetRandom() * w, y = h * (0.1 + 0.8 * planetRandom());
    const stretch = 1 / Math.max(0.3, Math.sin(Math.PI * y / h));
    for (const dx of [-w, 0, w]) {
      g.save();
      g.translate(x + dx, y);
      g.scale(stretch, 1);
      const grad = g.createRadialGradient(0, 0, 0, 0, 0, r);
      grad.addColorStop(0, `rgba(20,16,12,${0.3 * strength})`);
      grad.addColorStop(0.72, `rgba(20,16,12,${0.15 * strength})`);
      grad.addColorStop(0.86, `rgba(255,248,236,${0.25 * strength})`);
      grad.addColorStop(1, 'rgba(255,248,236,0)');
      g.fillStyle = grad;
      g.beginPath();
      g.arc(0, 0, r, 0, TAU);
      g.fill();
      g.restore();
    }
  }
}

const latitude = (v) => Math.abs(v - 0.5) * 2;   // 赤道で 0、極で 1
const planetTextures = {
  // 水星: 灰褐色の岩肌に、大小のクレーター（控えめ）
  Mercury: (() => {
    const L = PLANET_LOOKS.Mercury, n = sphereNoise(6, 5);
    return planetTexture(512, 256, (u, v) => mixRgb(L.dark, L.light, 0.55 + (n(u, v) - 0.5) * 2.6),
      (g, w, h) => craters(g, w, h, 160, 14, 0.4));   // クレーターは目立たせない
  })(),
  // 金星: 厚い雲。淡い黄白色に、ゆるくうねる筋
  Venus: (() => {
    const L = PLANET_LOOKS.Venus, n = sphereNoise(3, 5);
    return planetTexture(512, 256, (u, v) => {
      const k = n(u, v);
      return mixRgb(L.dark, L.light, 0.6 + 0.18 * Math.sin((v + 0.15 * (k - 0.5)) * 30) + (k - 0.5) * 1.4);
    });
  })(),
  // 地球: 海と大陸（緑と砂漠）、極の氷、雲
  Earth: (() => {
    const L = PLANET_LOOKS.Earth, land = sphereNoise(4, 6), dry = sphereNoise(8, 3), cloud = sphereNoise(16, 4);
    return planetTexture(512, 256, (u, v) => {
      const k = land(u, v), lat = latitude(v);
      const sea = mixRgb(L.deep, L.ocean, smooth(0.3, 0.52, k));
      const desert = (1 - smooth(0.05, 0.2, Math.abs(lat - 0.3))) * smooth(0.45, 0.6, dry(u, v));
      let c = mixRgb(sea, mixRgb(L.land, L.desert, desert), smooth(0.54, 0.56, k));   // 海を広く（青い星に見せる）
      c = mixRgb(c, L.ice, smooth(0.8, 0.86, lat + 0.15 * (k - 0.5)));
      return mixRgb(c, L.cloud, smooth(0.58, 0.76, cloud(u, v)) * 0.35);   // 雲は少なく薄く、細かく散らす
    });
  })(),
  // 火星: 赤茶けた地面に暗い模様、極の白い氷、小さなクレーター
  Mars: (() => {

      return mixRgb(c, L.ice, smooth(0.86, 0.9, latitude(v) + 0.1 * (k - 0.5)));
    }, (g, w, h) => craters(g, w, h, 50, 6, 0.5));
  })(),
  // 木星: 明るい帯と暗い縞が交互に並び（幅は不揃い）、境目が渦で乱れる。南半球に大赤斑
  Jupiter: (() => {
    const L = PLANET_LOOKS.Jupiter, n = sphereNoise(8, 5), bands = sphereNoise(40, 2);
    return planetTexture(512, 256, (u, v) => {
      const k = n(u, v), s = v + 0.03 * (k - 0.5);
      const band = bands(0.37, s);   // 経度を固定して、緯度だけで変わる値にする
      const c = mixRgb(L.belt, L.zone, 0.25 + 0.6 * smooth(0.44, 0.56, band) + (k - 0.5) * 0.9);
      return mixRgb(c, L.pole, smooth(0.7, 0.95, latitude(v)));
    }, (g, w, h) => {
      const L = PLANET_LOOKS.Jupiter;
      g.save();
      g.translate(w * 0.3, h * 0.63);
      g.scale(1.6, 1);
      const grad = g.createRadialGradient(0, 0, 0, 0, 0, h * 0.06);
      grad.addColorStop(0, `rgba(${L.spot},0.95)`);
      grad.addColorStop(0.7, `rgba(${L.spot},0.7)`);
      grad.addColorStop(0.85, `rgba(${L.zone},0.6)`);
      grad.addColorStop(1, `rgba(${L.zone},0)`);
      g.fillStyle = grad;
      g.beginPath();
      g.arc(0, 0, h * 0.06, 0, TAU);
      g.fill();
      g.restore();
    });
  })(),
  // 土星: 淡い金色に、木星より穏やかな縞
  Saturn: (() => {
    const L = PLANET_LOOKS.Saturn, n = sphereNoise(6, 4);
    return planetTexture(512, 256, (u, v) => {
      const k = n(u, v), s = v + 0.008 * (k - 0.5);
      const c = mixRgb(L.belt, L.zone, 0.5 + 0.4 * Math.sin(s * 34 + 1.5 * Math.sin(s * 7)) + (k - 0.5) * 0.4);
      return mixRgb(c, L.pole, smooth(0.65, 0.95, latitude(v)));
    });
  })(),
};
// 月: 明るい高地に、少し暗い海とクレーター。海は地球を向く面（u = 0 の側。月の腕に固定されているので、いつも地球を向く）に多い
const moonTexture = (() => {

  for (let i = 0; i < 30; i++) {
    const x = rand(0, w), y = rand(0, w), r = rand(60, 200);
    const blot = g.createRadialGradient(x, y, 0, x, y, r);
    blot.addColorStop(0, 'rgba(70,45,12,0.16)');
    blot.addColorStop(1, 'rgba(70,45,12,0)');
    g.fillStyle = blot;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  g.strokeStyle = g.fillStyle = '#3d2a10';
  for (const [r, lw] of [[0.975, 3], [0.9, 2], [0.8, 2], [0.66, 2], [0.64, 1]]) {
    g.lineWidth = lw;
    g.beginPath();

  g.font = '38px Georgia, "Times New Roman", serif';

    g.rotate(a + Math.PI / 2);
    g.fillText(s, 0, 0);
    g.restore();
  });
});

// 惑星ごとの部品。主軸の歯車・筒・腕・球をまとめて回す（group.rotation.y = earthAngle × ratio + phase）
const planetBalls = [];   // 惑星と月の球
const planets = PLANETS.map((planet, i) => {
  const layshaftTeeth = GEAR_TEETH_SUM - planet.teeth;
  const ratio = layshaftTeeth / planet.teeth;
  const gearY = GEAR_BASE_Y + i * GEAR_PITCH_Y;
  const armY = ARM_TOP_Y - i * ARM_PITCH_Y;
  const tubeRadius = 0.0035 + i * 0.0015;

  // 副軸の歯車は、どれも歯の 1 つが +x を向いたまま副軸に固定する。主軸の歯が副軸を向くとき、
  // 副軸の歯車の谷が主軸を向くように、主軸の歯車の最初の角度を決める
  const layshaftGear = new THREE.Mesh(gearGeometry(layshaftTeeth), brassAged);
  layshaftGear.position.y = gearY;
  layshaft.add(layshaftGear);
  if (!HUBLESS.layshaft.includes(planet.name)) {
    layshaft.add(column(0.003 + GEAR_HUB.radius, gearY - GEAR_HUB.height / 2, gearY + GEAR_HUB.height / 2, brassAged));
  }
  const phase = (layshaftAngle + Math.PI - 0.5 * TAU / layshaftTeeth) * ratio + layshaftAngle;

  const group = new THREE.Group();
  const gear = new THREE.Mesh(gearGeometry(planet.teeth), brass);
  gear.position.y = gearY;
  group.add(gear);
  if (!HUBLESS.shaft.includes(planet.name)) {
    group.add(column(tubeRadius + GEAR_HUB.radius, gearY - GEAR_HUB.height / 2, gearY + GEAR_HUB.height / 2, brass));
  }
  group.add(column(tubeRadius, gearY, armY + 0.005, brass));
  group.add(column(tubeRadius + 0.0028, armY - 0.004, armY + 0.004, brass));

  // 腕は歯車に対して好きな向きに固定する
  const arm = new THREE.Group();
  const armAngle = rand(0, TAU);
  arm.rotation.y = armAngle;
  group.add(arm);
  const beam = column(ARM_RADIUS, 0, planet.orbit, brass, 10);
  beam.rotation.z = -Math.PI / 2;
  beam.position.set(planet.orbit / 2, armY, 0);
  arm.add(beam);
  const elbow = ball(ARM_RADIUS * 1.5, brass);
  elbow.position.set(planet.orbit, armY, 0);
  arm.add(elbow);
  const riser = column(ARM_RADIUS * 0.8, armY, PLANE_Y, brass, 10);
  riser.position.x = planet.orbit;
  arm.add(riser);
  // 地軸と土星の輪は、公転しても空間の中で同じ向きを保つ（腕に対して逆に回す。holder.rotation.y = -(公転の角度)）
  const holder = new THREE.Group();
  holder.position.set(planet.orbit, PLANE_Y, 0);
  arm.add(holder);
  const sphere = ball(planet.radius, planetMaterial(planet));
  planetBalls.push(sphere);
  holder.add(sphere);

  let moon = null, spin = null;
  if (planet.name === 'Earth') {
    // 傾けた枠の中で自転する（spin.rotation.y = earthAngle × EARTH_SPIN）
    const tilt = new THREE.Group();
    tilt.rotation.z = EARTH_TILT * DEG;
    holder.add(tilt);
    tilt.add(sphere);   // holder から、傾けた枠へ付け替える
    spin = sphere;
    moon = new THREE.Group();   // rotation.y = earthAngle × MOON_RATIO
    moon.position.set(planet.orbit, 0, 0);
    const y = PLANE_Y - planet.radius - 0.004;
    moon.add(column(0.004, y - 0.002, y + 0.001, brass));
    const moonArm = column(0.0009, 0, MOON.orbit, brass, 8);

// 板ごとに木目を選んで向きを変え、色味と高さをわずかに違える。すき間の奥には暗い下地が見える。
// 板の側面と端は暗くする（木目を貼ると、すき間の中が明るく見えて継ぎ目が立たない）
function buildDesk(list, style, textures) {
  const plankSide = new THREE.MeshStandardMaterial({ color: style.side, roughness: 0.9 });
  const board = (width, length, wood = pick(textures.planks)) => {   // 長さの方向が z の板。上面だけに木目を貼る（箱の面の順は +x、-x、+y、-y、+z、-z）
    const tint = rand(...style.tint);
    const top = new THREE.MeshStandardMaterial({ ...wood, color: new THREE.Color(tint, tint * rand(0.97, 1.02), tint), bumpScale: style.bumpScale, roughness: style.roughness });
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(width - style.gap, DESK.plank, length - style.gap),
      [plankSide, plankSide, top, plankSide, plankSide, plankSide]);
    mesh.position.y = -DESK.plank / 2 - rand(0, style.step);
    if (randInt(2)) mesh.rotation.y = Math.PI;
    mesh.receiveShadow = true;
    place(list, mesh);
    return mesh;
  };
  const back = DESK.centerZ - DESK.depth / 2;   // 机の奥の辺の z
  for (let x = DESK.left + style.trim; x < DESK.right;) {
    const width = rand(...style.width);
    const plank = board(width, DESK.depth - style.trim);
    plank.position.x = x + width / 2;
    plank.position.z = back + style.trim + (DESK.depth - style.trim) / 2;
    x += width;

  const trim = board(style.trim, DESK.right - DESK.left - style.trim, textures.trim);   // 奥の縁取りは、長さの方向を x に向ける
  trim.rotation.y += Math.PI / 2;
  trim.position.set((DESK.left + style.trim + DESK.right) / 2, trim.position.y + style.trimRaise, back + style.trim / 2);
  const sideTrim = board(style.trim, DESK.depth, textures.sideTrim);
  sideTrim.position.set(DESK.left + style.trim / 2, sideTrim.position.y + style.trimRaise, DESK.centerZ);
}

// 壁紙の柄（1 枚分。上下左右につながる）。星（4 つの尖りの形と、小さな点）だけを、間を広く空けて散らす
function drawWallpaper(g, w, h) {
  const random = seededRandom(WALLPAPER.seed);
  g.fillStyle = WALLPAPER.base;
  g.fillRect(0, 0, w, h);
  // 紙のむら（ごく弱い）
  const image = g.getImageData(0, 0, w, h);
  for (let i = 0; i < image.data.length; i += 4) {
    const n = (random() - 0.5) * 6;
    for (let c = 0; c < 3; c++) image.data[i + c] += n;
  }
  g.putImageData(image, 0, 0);
  g.globalAlpha = WALLPAPER.inkAlpha;
  g.fillStyle = WALLPAPER.ink;
  // 柄を、縁をまたいでも反対側につながるように、9 か所にずらして描く
  const stamp = (x, y, draw) => {
    for (const dx of [-w, 0, w]) for (const dy of [-h, 0, h]) {
      g.save();
      g.translate(x + dx, y + dy);
      draw();
      g.restore();
    }
  };
  const sparkle = (r) => {   // 4 つの尖りの星
    g.beginPath();
    for (let k = 0; k < 8; k++) {
      const a = k * Math.PI / 4, d = k % 2 ? r * 0.22 : r;
      g.lineTo(Math.cos(a) * d, Math.sin(a) * d);
    }
    g.fill();
  };
  const dot = (r) => { g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill(); };
  const at = () => [random() * w, random() * h];
  for (let k = 0; k < 50; k++) { const r = w * (0.003 + 0.004 * random()); stamp(...at(), () => dot(r)); }
  for (let k = 0; k < 11; k++) { const r = w * (0.02 + 0.025 * random()), a = random(); stamp(...at(), () => { g.rotate(a); sparkle(r); }); }
}

// 明るさは、点光源が平らな壁を照らすときの形（中心からの距離 r で (1 + r²)^-1.5）にし、板の縁で 0 に落とす。
// 暗い所の段差が目立たないよう、sRGB で書く。位置・色・強さ・広さは時代を替えるときに決め、壁紙は板が動いても壁に留まるよう、繰り返しをずらす

    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const r = Math.hypot(x + 0.5 - w / 2, y + 0.5 - h / 2) / (w / 2) * WALL_GLOW_EXTENT;

}

  telescope.scale.set(TELESCOPE.thickness, 1, TELESCOPE.thickness);   // 太さだけを変える（y が長さの軸）
  place(candleEra, shadowed(layDown(telescope, TELESCOPE.x, TELESCOPE.z, TELESCOPE.angle, radius * TELESCOPE.thickness)));
}

{

    g.lineWidth = 1.5;
    g.strokeRect(18, 18, w - 36, h - 36);
    g.lineWidth = 1;
    const cx = w * 0.42, cy = h / 2, R = h * 0.42;
    for (const f of [1, 0.97, 0.75, 0.5, 0.25]) {
      g.beginPath();
      g.arc(cx, cy, R * f, 0, TAU);

    }
    for (let i = 0; i < 24; i++) {
      const a = i * TAU / 24;

      g.lineTo(cx + Math.cos(a) * R * 0.97, cy + Math.sin(a) * R * 0.97);

      g.stroke();

    }
    // 黄道（中心をずらした円）
    g.beginPath();
    g.arc(cx + R * 0.2, cy - R * 0.1, R * 0.72, 0, TAU);
    g.stroke();
    // 星と星座の線
    const star = () => {
      const a = rand(0, TAU), r = R * Math.sqrt(rand(0, 0.9));

    for (let i = 0; i < 160; i++) {

    for (let i = 0; i < 14; i++) {

        y += rand(-34, 34);
        g.lineTo(x, y);
        g.fillRect(x - 1.5, y - 1.5, 3, 3);
      }
      g.stroke();
    }
    // 余白の書き込み
    for (let i = 0; i < 9; i++) g.fillRect(w * 0.82, h * 0.2 + i * 22, rand(40, 90), 1.5);
  });
  // 縁の欠け（白い所だけを描く）
  const edgeMask = canvasTexture(720, 520, (g, w, h) => {
    g.fillStyle = '#000';
    g.fillRect(0, 0, w, h);
    g.fillStyle = '#fff';
    g.fillRect(4, 4, w - 8, h - 8);
    g.fillStyle = '#000';
    for (let i = 0; i < 90; i++) {
      const t = rand(0, 1), [x, y] = [[t * w, 4], [t * w, h - 4], [4, t * h], [w - 4, t * h]][randInt(4)];

      g.arc(x, y, rand(1, 3.5), 0, TAU);
      g.fill();
    }
  });
  const geometry = new THREE.PlaneGeometry(CHART.width, CHART.height, 36, 26);
  geometry.rotateX(-Math.PI / 2);
  // ゆるく波打たせ、左の角を少し反らせてから、右の端を巻き上げる
  const pos = geometry.attributes.position;
  const p1 = rand(0, TAU), p2 = rand(0, TAU);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const corner = Math.hypot(x + CHART.width / 2, Math.abs(z) - CHART.height / 2);
    pos.setY(i, CHART.wave * (1 + Math.sin(x * 40 + p1) * Math.sin(z * 33 + p2)) + CHART.cornerLift * Math.max(0, 1 - corner / 0.07) ** 2);
  }
  const flat = CHART.width / 2 - 0.07, curl = 0.024;
  for (let i = 0; i < pos.count; i++) {
    const u = pos.getX(i) - flat;
    if (u <= 0) continue;
    const a = u / curl * 0.75;
    pos.setX(i, flat + curl * Math.sin(a));
    pos.setY(i, pos.getY(i) + curl * (1 - Math.cos(a)));

  geometry.computeVertexNormals();
  // 表は星図（色と同じ模様で紙のざらつきの凹凸も付ける）、裏は無地の羊皮紙
  const paper = { roughness: 0.85, alphaMap: edgeMask, alphaTest: 0.5 };
  for (const material of [
    new THREE.MeshStandardMaterial({ ...paper, map: texture, bumpMap: texture, bumpScale: 1.5, side: THREE.FrontSide }),

    chart.receiveShadow = material.side === THREE.FrontSide;

  // ディバイダ（2 本の脚を蝶番でつなぎ、少し開いてある）
  const dividers = new THREE.Group();

  for (const open of [-0.2, 0.2]) {

  dividers.add(column(0.006, -0.003, 0.003, brass));
  const handle = column(0.002, 0, 0.022, brass, 10);
  handle.rotation.z = Math.PI / 2;

}

// ---- 電灯 ----
// Filament・LED の明かり。炎と同じ仰角の、少し高く遠い所に置くスポットライトで、オーラリーへ向ける。影は 1 方向だけ描けばよい
const LIGHT_POSITION = (() => {
  const distance = Math.hypot(CANDLE.x, CANDLE.z) * LAMP_LIGHT.height / FLAME_LIGHT_Y;   // 炎と同じ仰角になる水平の距離
  const a = LAMP_LIGHT.azimuth * DEG;
  return [distance * Math.cos(a), LAMP_LIGHT.height, distance * Math.sin(a)];
})();
// 炎より遠ざけた分だけ、光を強くする（距離の 2 乗に比例）
const LAMP_DISTANCE_GAIN = (Math.hypot(...LIGHT_POSITION) / Math.hypot(CANDLE.x, FLAME_LIGHT_Y, CANDLE.z)) ** 2;
let lampLight = null;
function getLampLight() {
  if (lampLight) return lampLight;
  lampLight = new THREE.SpotLight(0xffffff, 1, 0, LAMP_LIGHT.angle, LAMP_LIGHT.penumbra, 2);
  lampLight.position.set(...LIGHT_POSITION);
  lampLight.target.position.set(...LAMP_LIGHT.target);
  lampLight.castShadow = true;
  lampLight.shadow.mapSize.set(LAMP_LIGHT.shadowMapSize, LAMP_LIGHT.shadowMapSize);
  lampLight.shadow.camera.near = 0.02;
  lampLight.shadow.camera.far = 4;
  lampLight.shadow.focus = LAMP_LIGHT.shadowFocus;
  lampLight.shadow.bias = -0.0008;
  scene.add(lampLight, lampLight.target);
  return lampLight;
}

// 電灯の台を置く向き。台の +x をオーラリーへ向ける（光は台の原点の真上から出る）
function lampStand() {
  const [x, , z] = LIGHT_POSITION;
  const stand = new THREE.Group();
  stand.position.set(x, 0, z);
  stand.rotation.y = Math.atan2(z, -x);
  return stand;
}

// ---- Filament の小物 ----
function buildFilament() {
  const objects = [];
  buildDesk(objects, DESK_STYLES[1], deskTextures(DESK_STYLES[1]));
  const lightY = LIGHT_POSITION[1];
  // 電灯。黒い塗装の丸い台から首の曲がる管が立ち上がり、先の浅い笠をオーラリーの側へ傾ける。
  // 笠の外側は濃い緑の塗装、内側は白い琺瑯。電球は光の出る所にあり、笠の縁からのぞく
  const stand = lampStand();
  const standX = -0.12;   // 台は、光の出る所から後ろへ離して置く（首が後ろから笠へ回り込む）
  const standPaint = new THREE.MeshStandardMaterial({ color: FILAMENT_LAMP.stand, metalness: 0.3, roughness: 0.4 });
  const base = lathe([[0, 0], [0.07, 0], [0.072, 0.004], [0.068, 0.011], [0.05, 0.017], [0.016, 0.021], [0.009, 0.03], [0, 0.03]], standPaint, 48);
  base.position.x = standX;
  const [rimRadius, depth] = FILAMENT_LAMP.shade, tilt = FILAMENT_LAMP.tilt;
  // 笠の頂（首の先が付く所）。笠の軸は、光の出る所から傾けた向きの逆（上）へ伸びる
  const top = new THREE.Vector3(-Math.sin(tilt), Math.cos(tilt), 0).multiplyScalar(depth + 0.01).add(new THREE.Vector3(0, lightY, 0));
  const neckPoints = [[standX, 0.028], [standX, 0.1], [standX + 0.002, 0.17], [standX + 0.012, top.y + 0.02], [top.x - 0.03, top.y + 0.03], [top.x, top.y]]
    .map(([x, y]) => new THREE.Vector3(x, y, 0));
  const neck = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(neckPoints), 48, 0.0045, 10, false), standPaint);
  stand.add(shadowed(base), shadowed(neck));
  const shade = new THREE.Group();   // 原点が光の出る所。y が笠の軸（上が頂）
  const enamel = new THREE.MeshStandardMaterial({ color: 0xf0eadc, roughness: 0.5, emissive: 0xffd8a0, emissiveIntensity: 0.35, side: THREE.BackSide });   // 電球の光で明るい
  const profile = [[rimRadius, -0.004], [rimRadius - 0.004, 0.006], [rimRadius * 0.62, depth * 0.6], [0.016, depth], [0.012, depth + 0.01], [0, depth + 0.01]];
  const paint = new THREE.MeshStandardMaterial({ color: FILAMENT_LAMP.paint, metalness: 0.3, roughness: 0.45 });
  const outer = lathe(profile, paint, 48), inner = lathe(profile, enamel, 48);
  outer.castShadow = true;   // 上へ向かう光を遮る。影は受けない（内側から照らされるので）
  shade.add(outer, inner);
  // 電球。透明なガラス（透けさせるだけで、奥は映さない）と、中で光るフィラメント、まわりの淡い光
  const R = FILAMENT_LAMP.bulb;
  const bulbGeometry = new THREE.SphereGeometry(R, 24, 16);
  bulbGeometry.scale(1, 1.25, 1);
  const bulb = new THREE.Mesh(bulbGeometry, new THREE.MeshStandardMaterial({ color: 0xfff4e0, roughness: 0.05, transparent: true, opacity: 0.22,
    emissive: 0xffc070, emissiveIntensity: 0.25, depthWrite: false }));
  const filamentPoints = [];
  for (let i = 0; i <= 16; i++) {   // 支えの線に掛けた、上が開いた輪のフィラメント
    const a = Math.PI * 0.15 + Math.PI * 1.7 * i / 16;
    filamentPoints.push(new THREE.Vector3(R * 0.45 * Math.sin(a), -R * 0.35 * Math.cos(a), 0));
  }
  const filament = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(filamentPoints), 32, 0.0006, 5, false),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(...FILAMENT_LAMP.filament) }));
  const glow = canvasTexture(64, 64, (g, w) => {
    const grad = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
    grad.addColorStop(0, 'rgba(255,255,255,0.8)');
    grad.addColorStop(0.35, 'rgba(255,255,255,0.18)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, w, w);
  });
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glow, color: new THREE.Color(0.9, 0.55, 0.25), blending: THREE.AdditiveBlending, depthWrite: false }));
  halo.scale.set(R * 4.5, R * 4.5, 1);
  const socket = column(0.011, R * 1.1, depth, brassAged, 20);   // 口金と受け口
  shade.add(socket, filament, bulb, halo);
  shade.position.y = lightY;
  shade.rotation.z = tilt;   // 縁をオーラリーの側へ向ける
  stand.add(shade);
  place(objects, stand);

  // 黒い天体望遠鏡。断面は対物側（y = 0）から接眼側へ。寝かせると +x が上になるので、ファインダーは +x の側に載せる
  {
    const scope = new THREE.Group();
    const enamel = new THREE.MeshStandardMaterial({ color: ASTRO_SCOPE.tube, roughness: 0.35, metalness: 0.3 });
    const nickel = metal(ASTRO_SCOPE.fittings, 0.35);
    scope.add(lathe([[0.03, 0], [0.034, 0], [0.034, 0.075], [0.031, 0.078], [0, 0.078]], enamel, 40));   // フード
    scope.add(lathe([[0.029, 0.078], [0.029, 0.4], [0.017, 0.405], [0, 0.405]], enamel, 40));   // 鏡筒
    for (const y of [0.078, 0.395]) scope.add(column(0.0305, y, y + 0.008, nickel, 40));   // 鏡筒の両端の金具
    scope.add(lathe([[0.016, 0.405], [0.016, 0.455], [0.013, 0.457], [0.013, 0.49], [0.007, 0.492], [0, 0.492]], brassAged, 32));   // 引き出し筒と接眼レンズ
    const rack = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.03, 0.022), nickel);   // ピントを合わせるつまみの箱
    rack.position.set(-0.018, 0.42, 0);
    scope.add(rack);
    // ファインダー（鏡筒に 2 つの脚で留める）
    const finderX = 0.029 + 0.014;
    const finder = lathe([[0.008, 0.26], [0.0095, 0.26], [0.0095, 0.37], [0.005, 0.372], [0.005, 0.385], [0, 0.385]], enamel, 20);
    finder.position.x = finderX;
    scope.add(finder);
    for (const y of [0.285, 0.35]) {
      const foot = column(0.003, 0, 0.016, nickel, 8);
      foot.rotation.z = Math.PI / 2;   // 鏡筒からファインダーへ
      foot.position.set(0.029 + 0.006, y, 0);
      scope.add(foot);
      const band = column(0.011, y - 0.003, y + 0.003, nickel, 20);
      band.position.x = finderX;
      scope.add(band);
    }
    const lens = new THREE.Mesh(new THREE.CircleGeometry(0.028, 32), new THREE.MeshStandardMaterial({ color: 0x06080c, roughness: 0.05 }));
    lens.rotation.x = Math.PI / 2;   // 対物側（-y）を向く
    lens.position.y = 0.03;
    scope.add(lens);
    for (const o of scope.children) o.position.y -= 0.492 / 2;
    place(objects, shadowed(layDown(scope, TELESCOPE.x, TELESCOPE.z, TELESCOPE.angle, 0.034)));
  }

  // 星座早見盤。星図を刷った円盤を、楕円の窓の開いた外枠に、天の北極の軸で留める。円盤を回すと、窓に見える星空が日時に合う。
  // 外枠の窓のまわりに時刻の目盛り、円盤の縁に月日の目盛りを刷る
  {
    const { size, disk: R } = PLANISPHERE;
    const [wx, wy] = PLANISPHERE.window, offset = PLANISPHERE.windowOffset;
    const N = 1024, px = N / (2 * R);   // 円盤の画素数と、1m あたりの画素数
    const diskTexture = canvasTexture(N, N, (g, w) => {
      const c = w / 2;
      g.fillStyle = PLANISPHERE.paper;   // 縁の、月日の目盛りの帯（地の紙の色）
      g.fillRect(0, 0, w, w);
      paperBlots(g, w, w, 20, '50,70,110');
      const sky = R * 0.84 * px;   // 星図の半径
      g.fillStyle = PLANISPHERE.sky;
      g.beginPath();
      g.arc(c, c, sky, 0, TAU);
      g.fill();
      g.strokeStyle = 'rgba(200,210,235,0.25)';   // 赤緯の円と赤経の線
      g.lineWidth = 1.5;
      for (const f of [0.25, 0.5, 0.75]) { g.beginPath(); g.arc(c, c, sky * f, 0, TAU); g.stroke(); }
      for (let i = 0; i < 12; i++) {
        const a = i * TAU / 12;
        g.beginPath();
        g.moveTo(c, c);
        g.lineTo(c + Math.cos(a) * sky, c + Math.sin(a) * sky);
        g.stroke();
      }
      const star = () => { const a = rand(0, TAU), r = sky * Math.sqrt(rand(0.002, 0.95)); return [c + Math.cos(a) * r, c + Math.sin(a) * r]; };
      g.fillStyle = '#eef2f8';
      for (let i = 0; i < 380; i++) {
        const [x, y] = star();
        g.beginPath();
        g.arc(x, y, 0.8 + 3 * rand(0, 1) ** 4, 0, TAU);
        g.fill();
      }
      g.strokeStyle = 'rgba(205,220,245,0.55)';   // 星座の線
      g.lineWidth = 1.6;
      for (let i = 0; i < 16; i++) {
        let [x, y] = star();
        g.beginPath();
        g.moveTo(x, y);
        for (let k = randInt(3) + 2; k > 0; k--) {
          x += rand(-45, 45);
          y += rand(-45, 45);
          g.lineTo(x, y);
        }
        g.stroke();
      }
      g.strokeStyle = g.fillStyle = '#1e2638';   // 縁の月日の目盛りと、月の名前
      g.lineWidth = 1.2;
      for (let i = 0; i < 365; i++) {
        const a = i * TAU / 365, long = i % 30 === 0 ? 22 : i % 5 === 0 ? 14 : 8;
        g.beginPath();
        g.moveTo(c + Math.cos(a) * (sky + 4), c + Math.sin(a) * (sky + 4));
        g.lineTo(c + Math.cos(a) * (sky + 4 + long), c + Math.sin(a) * (sky + 4 + long));
        g.stroke();
      }
      g.font = 'bold 26px serif';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'].forEach((m, i) => {
        const a = (i + 0.5) * TAU / 12;
        g.save();
        g.translate(c + Math.cos(a) * (w / 2 - 34), c + Math.sin(a) * (w / 2 - 34));
        g.rotate(a + Math.PI / 2);
        g.fillText(m, 0, 0);
        g.restore();
      });
    });
    const diskGeometry = new THREE.CircleGeometry(R, 96);
    diskGeometry.rotateX(-Math.PI / 2);
    const diskMesh = new THREE.Mesh(diskGeometry, new THREE.MeshStandardMaterial({ map: diskTexture, roughness: 0.8 }));
    diskMesh.rotation.y = PLANISPHERE.turn;
    diskMesh.position.y = 0.0004;
    // 外枠。角の丸い正方形の厚紙に、楕円の窓を開ける（天の北極の軸が原点。窓は南、+y の逆へずれる）
    const half = size / 2, round = 0.012;
    const shape = new THREE.Shape();
    shape.moveTo(-half + round, -half);
    shape.lineTo(half - round, -half);
    shape.quadraticCurveTo(half, -half, half, -half + round);
    shape.lineTo(half, half - round);
    shape.quadraticCurveTo(half, half, half - round, half);
    shape.lineTo(-half + round, half);
    shape.quadraticCurveTo(-half, half, -half, half - round);
    shape.lineTo(-half, -half + round);
    shape.quadraticCurveTo(-half, -half, -half + round, -half);
    const hole = new THREE.Path();
    hole.absellipse(0, -offset, wx, wy, 0, TAU, true);
    shape.holes.push(hole);
    const cardTexture = canvasTexture(1024, 1024, (g, w) => {
      const s = w / size, c = w / 2;   // 外枠の中心（軸）が画像の中心。画像の上が +y
      g.fillStyle = PLANISPHERE.card;
      g.fillRect(0, 0, w, w);
      paperBlots(g, w, w, 30, '0,0,0');
      g.strokeStyle = g.fillStyle = PLANISPHERE.ink;   // 窓のまわりの時刻の目盛りと数字
      g.lineWidth = 2;
      const cy = c + offset * s;
      g.beginPath();
      g.ellipse(c, cy, wx * s + 6, wy * s + 6, 0, 0, TAU);
      g.stroke();
      g.font = 'bold 30px serif';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      for (let h = 0; h < 24; h++) {
        const a = h * TAU / 24;
        const [x, y] = [c + Math.cos(a) * (wx * s + 6), cy + Math.sin(a) * (wy * s + 6)];
        const [ox, oy] = [Math.cos(a), Math.sin(a) * wx / wy];
        g.beginPath();
        g.moveTo(x, y);
        g.lineTo(x + ox * 16, y + oy * 16);
        g.stroke();
        if (h % 2 === 0) g.fillText(String((h + 18) % 24), x + ox * 36, y + oy * 36);
      }
      g.lineWidth = 3;
      g.strokeRect(14, 14, w - 28, w - 28);
    });
    cardTexture.repeat.set(1 / size, 1 / size);   // 形の座標（m）をそのまま UV に使うので、外枠の大きさで割る
    cardTexture.offset.set(0.5, 0.5);
    const cardGeometry = new THREE.ExtrudeGeometry(shape, { depth: 0.0015, bevelEnabled: false, curveSegments: 48 });
    cardGeometry.rotateX(-Math.PI / 2);
    const card = new THREE.Mesh(cardGeometry, [new THREE.MeshStandardMaterial({ map: cardTexture, roughness: 0.75 }),
      new THREE.MeshStandardMaterial({ color: 0x0e1528, roughness: 0.9 })]);   // 表と、切り口
    card.position.y = 0.0008;
    const pin = column(0.004, 0, 0.0035, brassAged, 16);   // 天の北極の軸の鋲
    const planisphere = new THREE.Group();
    planisphere.add(diskMesh, card, pin);
    shadowed(planisphere);
    planisphere.position.set(CHART.x, 0, CHART.z);
    planisphere.rotation.y = CHART.angle + PLANISPHERE.angle;
    place(objects, planisphere);
  }
  return objects;
}

// ---- 彗星（隠し要素） ----
// 太陽を焦点とする細長い楕円軌道の、遠い所から太陽のすぐそばを回り込んでまた遠くへ去るまでの一部を進む。軌道の面は、カメラから見て
// 左右のどちらかの上のほうから来て、手前の脚が低く奥の脚が高くなるように置き、惑星と逆の向き（上から見て時計回り。ハレー彗星と同じ逆行）に回る。
// 太陽のそばでは惑星の面を横切るので、現れるときに、通る間の惑星の位置を先読みして、惑星や腕に当たらない向きを選ぶ。
// 物はオーラリーに付ける（座標はオーラリーの中のもの。LED のデスクマットの分も一緒に上がる）。
// 乱数は Math.random と別にする（DEVELOPMENT.md: 既存の乱数を引く順番を変えない）。現れたときは、種を Math.random から取り直す。
// three.js も物を作るときに Math.random を引くので、物は最初に現れるときに作る
const cometRandom = (() => {
  let s = Date.now() >>> 0;   // mulberry32
  const next = () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = Math.imul(s ^ (s >>> 15), s | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  next.reseed = () => { s = Math.floor(Math.random() * 4294967296) >>> 0; };
  return next;
})();
const cometInterval = ([mean, min, max]) => clamp(-Math.log(1 - cometRandom()) * mean, min, max);

const COMET_A = COMET.perihelion / (1 - COMET.eccentricity);                   // 長半径
const COMET_B = COMET_A * Math.sqrt(1 - COMET.eccentricity ** 2);              // 短半径
const COMET_TABLE_RATE = 120;     // 下の表の、1 秒あたりの刻みの数
const SUN_CENTER = new THREE.Vector3(0, PLANE_Y, 0);

// 離心近点角 E の、時刻ごとの表。実際の彗星は dE/dt ∝ (r/a)^-1（ケプラーの法則）で、ここでは (r/a)^(ease-1) にして太陽のそばを遅くする。
// 毎回同じ道を同じ速さで進むので、起動時に 1 度だけ求める（描く間隔に関わらず同じ動きになり、出る前の先読みにも使える）
const cometTable = (() => {
  const e = COMET.eccentricity;
  const end = Math.acos((1 - COMET.far / COMET_A) / e);   // 太陽から far 離れた所の E
  const pace = (E) => (1 - e * Math.cos(E)) ** (COMET.ease - 1);
  // 端から端までにかかる時間を求め、duration に合うよう速さを決める
  const steps = 4000, dE = 2 * end / steps;
  let span = 0;
  for (let i = 0; i < steps; i++) span += dE / pace(-end + (i + 0.5) * dE);
  const k = span / COMET.duration;
  const f = (E) => k * pace(E);
  const table = new Float64Array(Math.ceil(COMET.duration * COMET_TABLE_RATE) + 1);
  const sub = 8, h = 1 / COMET_TABLE_RATE / sub;
  let E = -end;
  for (let i = 0; i < table.length; i++) {
    table[i] = Math.min(E, end);
    for (let j = 0; j < sub; j++) {   // ルンゲ・クッタ法
      const k1 = f(E), k2 = f(E + h * k1 / 2), k3 = f(E + h * k2 / 2), k4 = f(E + h * k3);
      E += h * (k1 + 2 * k2 + 2 * k3 + k4) / 6;
    }
  }
  return table;
})();

// 時刻 t（秒）の彗星の位置を out に入れる。orbit: { toward（近日点の向き）, across（近日点で進む向き） }
function cometPosition(t, { toward, across }, out) {
  const u = clamp(t, 0, COMET.duration) * COMET_TABLE_RATE;
  const i = Math.min(Math.floor(u), cometTable.length - 2);
  const E = cometTable[i] + (cometTable[i + 1] - cometTable[i]) * (u - i);
  return out.copy(SUN_CENTER)
    .addScaledVector(toward, COMET_A * (Math.cos(E) - COMET.eccentricity))
    .addScaledVector(across, COMET_B * Math.sin(E));
}

// 軌道の向き。azimuth: カメラの向き（rad）、side: カメラから見て右（1）と左（-1）のどちらから来るか
function cometOrbit(azimuth, side) {
  const elevation = COMET.elevation * DEG, tilt = COMET.tilt * DEG;
  const from = new THREE.Vector3(side * Math.cos(azimuth) * Math.cos(elevation), Math.sin(elevation), -side * Math.sin(azimuth) * Math.cos(elevation));
  const lift = new THREE.Vector3(0, 1, 0).addScaledVector(from, -from.y).normalize();   // 軌道の面の中で、上へ向かう向き
  const across = new THREE.Vector3(Math.sin(azimuth), 0, Math.cos(azimuth)).multiplyScalar(Math.cos(tilt)).addScaledVector(lift, -Math.sin(tilt));
  const toward = from.negate();
  if (new THREE.Vector3().crossVectors(toward, across).y > 0) across.negate();   // 上から見て時計回り（逆行）にする
  return { toward, across };
}

// 軌道 orbit を通るときの、太陽・惑星（月の軌道と土星の輪を含む）・腕との最も近い間隔（m）。
// 強度はいまのまま変わらないものとして、惑星の位置を先読みする。1/30 秒おきに調べる
function cometClearance(orbit) {
  const p = new THREE.Vector3();
  let min = Infinity;
  for (let t = 0; t <= COMET.duration; t += 1 / 30) {
    cometPosition(t, orbit, p);
    const fromSun = p.distanceTo(SUN_CENTER);
    if (fromSun > PLANETS.at(-1).orbit + SATURN_RING.outer + COMET.clearance) continue;   // オーラリーから離れている
    min = Math.min(min, fromSun - SUN_RADIUS);
    const angle = earthAngle + speed * TAU / EARTH_PERIOD * t;
    planets.forEach((planet, j) => {
      const { orbit: r, radius, name } = PLANETS[j];
      const theta = angle * planet.ratio + planet.phase + planet.armAngle;
      const ux = Math.cos(theta), uz = -Math.sin(theta);
      const armY = ARM_TOP_Y - j * ARM_PITCH_Y;
      const reach = name === 'Earth' ? MOON.orbit + MOON.radius : name === 'Saturn' ? SATURN_RING.outer : radius;
      const along = clamp(p.x * ux + p.z * uz, 0, r);   // 腕（軸から水平に伸びる）の上で、いちばん近い所
      const side = Math.hypot(p.x - r * ux, p.z - r * uz);
      min = Math.min(min,
        Math.hypot(side, p.y - PLANE_Y) - reach,                                          // 球
        Math.hypot(side, Math.max(0, armY - p.y, p.y - PLANE_Y)) - ARM_RADIUS,             // 球を支える柱
        Math.hypot(p.x - along * ux, p.y - armY, p.z - along * uz) - ARM_RADIUS);          // 腕
    });
  }
  return min;
}

let comet = null;            // 出ている彗星 { t（経過秒）, orbit（軌道の向き） }。いなければ null
let cometWait = cometInterval(COMET.interval);   // 次に現れるまでの秒数
let cometParts = null;       // 頭の光の板、尾の帯、頭の点光源 { head, tail, light }。最初に現れるときに作る
const COMET_TAIL_NODES = Math.ceil(COMET_GLOW.tail.life / COMET_GLOW.tail.step) + 2;   // 尾の帯の点の数の上限（頭の位置の点を含む）
// 尾の帯の、幅の向きの濃さ [中心からの位置（-1〜1。1 が縁）, 濃さ]。ガウス分布に近い形で、縁で 0 にする
const COMET_TAIL_PROFILE = [-1, -0.75, -0.5, -0.3, -0.15, 0, 0.15, 0.3, 0.5, 0.75, 1]
  .map((x) => [x, Math.exp(-((x / 0.45) ** 2)) * (1 - x * x)]);

function createCometParts() {
  const { head: headLook, light: lightLook } = COMET_GLOW;
  const additive = { blending: THREE.AdditiveBlending, transparent: true, depthWrite: false };
  const glow = canvasTexture(64, 64, (g, w) => {
    const c = w / 2, fade = g.createRadialGradient(c, c, 0, c, c, c);
    fade.addColorStop(0, 'rgba(255,255,255,1)');
    fade.addColorStop(0.2, 'rgba(255,255,255,0.45)');
    fade.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = fade;
    g.fillRect(0, 0, w, w);
  });
  const head = new THREE.Sprite(new THREE.SpriteMaterial({ ...additive, map: glow }));
  head.scale.setScalar(headLook.size);
  // 尾は、尾の点をつないだ帯。点ごとに幅の向きへ頂点を並べ（COMET_TAIL_PROFILE）、頂点の色で中心から外へなだらかに薄れさせて、ガスのように見せる
  const geometry = new THREE.BufferGeometry();
  const n = COMET_TAIL_NODES, m = COMET_TAIL_PROFILE.length;
  for (const name of ['position', 'color']) {
    geometry.setAttribute(name, new THREE.BufferAttribute(new Float32Array(n * m * 3), 3).setUsage(THREE.DynamicDrawUsage));
  }
  const index = [];
  for (let i = 0; i < n - 1; i++) {
    for (let j = 0; j < m - 1; j++) {
      const a = i * m + j, b = a + m;
      index.push(a, a + 1, b, a + 1, b + 1, b);
    }
  }
  geometry.setIndex(index);
  geometry.setDrawRange(0, 0);
  const tail = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ ...additive, vertexColors: true, side: THREE.DoubleSide }));
  tail.frustumCulled = false;   // 帯が動くので、囲む球を求め直さない
  // 影は落とさない（影の描画を増やさないため）。一度置いたら外さない（光の数が変わると、three.js が素材を作り直して止まるため）
  const light = new THREE.PointLight(lightLook.color, 0, 0, 2);
  orrery.add(head, tail, light);
  return { head, tail, light };
}

function startComet() {
  if (comet || isFading()) return;
  cometRandom.reseed();
  cometParts ??= createCometParts();
  const side = cometRandom() < 0.5 ? -1 : 1;
  const azimuth = CAM_SWAY * DEG * Math.sin(time * TAU / CAM_SWAY_PERIOD);   // いまのカメラの向き
  let orbit = null, best = -Infinity;
  for (const swing of COMET.swing) {
    const candidate = cometOrbit(azimuth + swing * DEG, side);
    const clearance = cometClearance(candidate);
    if (clearance > best) [orbit, best] = [candidate, clearance];
    if (clearance >= COMET.clearance) break;
  }
  comet = { t: 0, orbit };
  cometWait = cometInterval(COMET.interval);
}

// 時刻 te（秒）に頭が pos にいるときの、彗星の活動（0〜1）。太陽に近いほど強く、飛び始め・飛び終わり（画面の外）で薄れる
const cometEdge = (te) => smooth(0, COMET.fade, Math.min(te, COMET.duration - te));
const cometActivity = (te, pos) => smooth(...COMET_GLOW.active, pos.distanceTo(SUN_CENTER)) * cometEdge(te);

// 尾の帯の点。時刻 te に頭から出たガスが、時刻 t にいる所。出た時の頭の速さを引き継いだうえで、太陽と反対の向きへ流れる
// （頭から見て、いつも太陽と反対へ伸びる。引き継がないと、太陽から去るときに尾が頭の後ろ（太陽の側）へ引きずられる）。
// 点は前のコマから持ち越さず、頭の道から毎回求める。コマごとに頭の速さで動かすと、同じコマに出た点が 1 か所に集まり、
// 帯がコマの間で行き来して折れ重なり、尾の中に筋が見えるため
const cometTailPoints = Array.from({ length: COMET_TAIL_NODES }, () => ({ x: 0, y: 0, z: 0, age: 0, glow: 0 }));
const cometFrom = new THREE.Vector3();
const cometBefore = new THREE.Vector3();
const cometAfter = new THREE.Vector3();
function cometTailPoint(out, te, t, orbit) {
  const h = 1 / COMET_TABLE_RATE;
  cometPosition(te, orbit, cometFrom);
  cometPosition(te - h, orbit, cometBefore);
  cometPosition(te + h, orbit, cometAfter);
  const age = t - te, speed = COMET_GLOW.tail.speed;
  const ax = cometFrom.x - SUN_CENTER.x, ay = cometFrom.y - SUN_CENTER.y, az = cometFrom.z - SUN_CENTER.z;
  const away = speed / Math.hypot(ax, ay, az);
  const k = age / (2 * h);
  out.x = cometFrom.x + (cometAfter.x - cometBefore.x) * k + ax * away * age;
  out.y = cometFrom.y + (cometAfter.y - cometBefore.y) * k + ay * away * age;
  out.z = cometFrom.z + (cometAfter.z - cometBefore.z) * k + az * away * age;
  out.age = age;
  out.glow = cometActivity(te, cometFrom);
}

const cometHead = new THREE.Vector3();
const cometView = new THREE.Vector3();     // カメラの位置（オーラリーの中の座標）
const cometAlong = new THREE.Vector3();    // 尾の帯の、点での向き
const cometSide = new THREE.Vector3();     // 尾の帯の、点での幅の向き
const cometToView = new THREE.Vector3();
function updateComet(dt) {
  if (!comet) {
    cometWait -= dt;
    if (cometWait <= 0) startComet();   // 暗転している間は出さない（startComet が何もせず、次のコマにまた試す）
    return;
  }
  comet.t += dt;
  const { head, tail, light } = cometParts;
  const { head: headLook, tail: tailLook, light: lightLook } = COMET_GLOW;
  const t = comet.t, flying = t < COMET.duration;
  head.visible = flying;
  light.intensity = 0;
  if (flying) {
    cometPosition(t, comet.orbit, cometHead);
    const active = cometActivity(t, cometHead);
    head.position.copy(cometHead);
    head.material.color.setRGB(...headLook.color).multiplyScalar(cometEdge(t) * (headLook.dim + (1 - headLook.dim) * active));
    light.position.copy(cometHead);
    light.intensity = lightLook.intensity * active;
  }
  // 尾の点を、いちばん新しい所（飛んでいる間は頭）から step 秒おきに、life 秒前まで並べる。出た時刻を step の刻みに揃え、コマが進んでも点がずれないようにする
  // （刻みは整数の番号で数える。時刻から割り算で戻すと、誤差で同じ刻みに留まり、尾の長さが 0 になって消えるコマがあるため）
  const newest = Math.min(t, COMET.duration);
  let n = 0;
  cometTailPoint(cometTailPoints[n++], newest, t, comet.orbit);
  for (let k = Math.ceil(newest / tailLook.step) - 1; k >= 0 && n < COMET_TAIL_NODES; k--) {
    const te = k * tailLook.step;
    if (te >= newest) continue;
    if (t - te >= tailLook.life) break;
    cometTailPoint(cometTailPoints[n++], te, t, comet.orbit);
  }
  // 点をつないで帯にする。幅の向きは、帯の向きとカメラへの向きの両方に直交させ、帯がいつもカメラに面を向けるようにする
  const position = tail.geometry.attributes.position, color = tail.geometry.attributes.color;
  cometView.copy(camera.position).sub(orrery.position);
  for (let i = 0; i < n; i++) {
    const p = cometTailPoints[i], prev = cometTailPoints[Math.max(i - 1, 0)], next = cometTailPoints[Math.min(i + 1, n - 1)];
    cometAlong.set(next.x - prev.x, next.y - prev.y, next.z - prev.z);
    cometToView.set(cometView.x - p.x, cometView.y - p.y, cometView.z - p.z);
    const side = cometAlong.cross(cometToView);
    if (side.lengthSq() > 1e-16) {   // 点が重なって向きが決まらないときは、前の点の向きのまま
      side.normalize();
      if (i > 0 && side.dot(cometSide) < 0) side.negate();   // 前の点と向きを揃え、帯がねじれないようにする
      cometSide.copy(side);
    }
    const u = Math.min(p.age / tailLook.life, 1);
    const half = (tailLook.width[0] + (tailLook.width[1] - tailLook.width[0]) * u) / 2;
    const f = (1 - u) ** tailLook.falloff * p.glow;
    COMET_TAIL_PROFILE.forEach(([x, w], j) => {
      const k = i * COMET_TAIL_PROFILE.length + j, d = x * half;
      position.setXYZ(k, p.x + cometSide.x * d, p.y + cometSide.y * d, p.z + cometSide.z * d);
      color.setXYZ(k, tailLook.color[0] * f * w, tailLook.color[1] * f * w, tailLook.color[2] * f * w);
    });
  }
  tail.geometry.setDrawRange(0, Math.max(n - 1, 0) * (COMET_TAIL_PROFILE.length - 1) * 6);
  position.needsUpdate = color.needsUpdate = true;
  if (t - COMET.duration >= tailLook.life) comet = null;
}

// ---- カメラ ----
function updateCamera() {
  const azimuth = CAM_SWAY * DEG * Math.sin(time * TAU / CAM_SWAY_PERIOD);
  const elevation = (CAM_ELEVATION + CAM_ELEVATION_SWAY * Math.sin(time * TAU / CAM_ELEVATION_PERIOD)) * DEG;
  // 縦長の画面では、オーラリーの幅の 9 割ほどが収まるまで離す
  const dist = Math.max(CAM_DIST, CAM_FRAME_WIDTH / (2 * Math.tan(CAM_FOV * DEG / 2) * camera.aspect));
  const flat = dist * Math.cos(elevation);
  camera.position.set(Math.sin(azimuth) * flat, CAM_TARGET_Y + dist * Math.sin(elevation), Math.cos(azimuth) * flat);
  camera.lookAt(0, CAM_TARGET_Y, 0);
}

// ---- シーン切替 ----
// 時代を替える。オーラリーとカメラ、強度はそのまま続ける
const sceneNameEl = document.getElementById('scene-name');
const ERA_BUILDERS = [null, buildFilament, buildLed];   // Candle の物は起動時に作ってある
const eraObjects = [candleEra, null, null];
let sceneIndex = 0;
function setScene(index) {
  sceneIndex = (index + SCENES.length) % SCENES.length;
  const s = SCENES[sceneIndex];
  eraObjects[sceneIndex] ??= ERA_BUILDERS[sceneIndex]();
  eraObjects.forEach((list, i) => list?.forEach((o) => { o.visible = i === sceneIndex; }));
  if (s.light) {
    const light = getLampLight();
    light.color.set(s.light.color);
    light.intensity = s.light.intensity * LAMP_DISTANCE_GAIN;
  }
  if (lampLight) lampLight.visible = !!s.light;
  ambientLight.color.set(s.ambient[0]);
  ambientLight.intensity = s.ambient[1];
  const [glowX, glowY] = s.light ? LIGHT_POSITION : [CANDLE.x, FLAME_LIGHT_Y];   // 明かりの真後ろの壁
  placeWallGlow(glowX, glowY, s.wallGlow.spread * WALL_GLOW_EXTENT);
  wallGlow.material.color.set(s.wallGlow.color).multiplyScalar(s.wallGlow.intensity);
  orrery.position.y = s.name === 'LED' ? DESK_MAT.thickness : 0;   // LED では、デスクマットの上に載せる
  buildEnvironment(s);
  sceneNameEl.textContent = s.name;
}
const nextScene = () => fadeAndRun(() => setScene(sceneIndex + 1));

// ---- 強度 ----
function setSpeed(value) {
  speed = clamp(value, MIN_SPEED, MAX_SPEED);
}

// ---- メインループ ----
function step(dt) {
  time += dt;
  earthAngle = (earthAngle + dt * speed * TAU / EARTH_PERIOD) % EARTH_ANGLE_WRAP;
  updateOrrery();
  updateFlame(dt);
  updateCamera();
  updateComet(dt);   // 尾の帯をカメラに向けるので、カメラを動かしたあとに
}

let last = performance.now();
let nextDraw = 0;            // 次に描いてよい時刻 (ms)
function tick(now) {
  // MAX_FPS より速くは描かない。描いてよい時刻は一定の間隔で進め、画面の更新の間隔の揺れで 1 回飛ばさないよう少し余裕を持たせる
  if (now < nextDraw - 2) return;
  nextDraw = Math.max(nextDraw + 1000 / MAX_FPS, now);
  // rAF のタイムスタンプは初期の performance.now() より前のことがあるので負にしない
  const dt = Math.max(0, Math.min((now - last) / 1000, 0.1));
  last = now;
  step(dt);
  renderer.setRenderTarget(sceneTarget);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  composer.render();
}

// ---- 入力・UI ----
// 暗転・全画面・カーソルを隠す処理・画面を消さない処理・キーとスワイプ・強度のゲージは common.js
setupControls({
  // シーン切替（Space・左右スワイプ）。次の時代へ
  changeScene: nextScene,
  // 強度（↑↓・上下スワイプ）。公転の速さ
  intensity: {
    up: () => setSpeed(speed * SPEED_STEP),
    down: () => setSpeed(speed / SPEED_STEP),
    level: () => logPosition(speed, MIN_SPEED, MAX_SPEED),   // ゲージの位置（0..1）
  },
  keys: { KeyC: startComet },   // 隠し要素の彗星（操作ガイドには表示しない）
  onResize() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    updateSceneTargetSize();
    composer.setSize(innerWidth, innerHeight);
  },
});

// ---- 開始 ----
// 起動のたびに、惑星の並びが違う所から始める
earthAngle = rand(0, EARTH_ANGLE_WRAP);
setScene(randInt(SCENES.length));   // 時代はランダムに選ぶ（ほかの乱数をすべて引いたあとに引く）
renderer.setAnimationLoop(tick);
</script>
