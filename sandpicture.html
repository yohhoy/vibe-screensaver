<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sand Picture</title>
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">
  <span class="pc-only">Space: 次の絵 / F・ダブルクリック: 全画面 / ↑↓: 落とし口の数</span>
  <span class="touch-only">左右スワイプ: 次の絵 / 上下スワイプ: 落とし口の数</span>
</div>
<script type="module">
import * as THREE from 'three';
// 共通の入力・UI と小さな関数（common.js）
const { TAU, clamp, rand, randIn, randInt, randSign, randomInterval, IS_TOUCH, fadeAndRun, isFading, setupControls } = Common;

// ---- 設定 ----
const CELL_SIZE = 2.5;                     // 格子の 1 マスの大きさ（同じ面積の正方形の辺、CSS ピクセル）
const CELL_ASPECT = 1.5;                   // 格子の 1 マスの横幅（高さに対する倍率）。横長にすると、格子の上の 27°〜63° の斜面が画面では寝て見える
const CELL_PX = CELL_SIZE / Math.sqrt(CELL_ASPECT);   // 格子の 1 マスの高さ（CSS ピクセル）
const CELL_W_PX = CELL_PX * CELL_ASPECT;   // 格子の 1 マスの横幅（CSS ピクセル）

// 砂の動き
const STEPS_PER_HEIGHT = 0.35;             // 1 秒あたりの格子の更新回数（格子の高さ 1 マスあたり）。画面の解像度によらず同じ速さで落ちるようにする
const MAX_STEPS_PER_FRAME = 12;            // 1 フレームの更新回数の上限（重いフレームのあとに溜めない）
const FALL_PROB = 0.95;                    // 1 回の更新で砂が動く確率。1 に近くして粒の速さをそろえる（確率で揺らぐと、粒が追いついて列になり、流れが途切れる）
const GRAIN_SPEED_SPREAD = 0.04;           // 粒ごとの落ちる速さのばらつき（±割合）
const TOPPLE_PROB = 1.0;                   // 下がふさがった砂が斜め下へ滑る確率
const DRIFT_PROB = 0.008;                  // 液体の中を落ちる砂が斜め下へずれる確率（流れが下へ行くほど広がる）

// 落とし口と地層
const HOLE_WIDTH = [0.003, 0.006];         // 落とし口の幅（画面の幅に対する割合）
const HOLE_MIN_CELLS = 1;                  // 落とし口の幅の下限（マス）
const HOLE_MARGIN = 0.05;                  // 落とし口を置かない左右の端（画面の幅に対する割合）。位置が動いても入らない
const EMIT_PROB = 0.76;                    // 落とし口の 1 マスから、1 回の更新で砂が出てくる確率（落とし口が EMIT_BASE_HOLES 個のとき）
const EMIT_BASE_HOLES = 3;                 // EMIT_PROB の基準の落とし口の数
const STRATUM_SEC = [4, 12];               // 1 つの層を流す秒数（落とし口ごと・層ごとに選ぶ）
// 同じ色の砂でも、層ごとと層の中で濃淡を変える。実物の色砂も袋ごとに色味が少し違い、層の中にも濃淡の
// グラデーションができる。3 色をそのまま塗ると、平らな色の切り絵のように見える
const TONE_RANGE = 0.2;                    // 濃淡の幅（明るさの倍率の幅。0.2 なら 0.9〜1.1 倍）
const TONE_STEPS = 64;                     // 濃淡の段階の数（マスの r に色の番号と合わせて書くので、SAND_COLORS × TONE_STEPS ≦ 255）
const TONE_CHANGE_SEC = [1, 3];            // 層の中で濃淡の目標を選び直す間隔（秒）
const TONE_DRIFT = 0.35;                   // 層の中で濃淡が動く幅（TONE_RANGE の全幅に対する割合、片側）
const TONE_SMOOTH_SEC = 1.5;               // 濃淡が目標に近づく速さ（時定数、秒）
// 落とし口ごとの流れる量（EMIT_PROB に対する倍率）。ときどき目標を選び直し、なめらかに近づける。
// すべての口から同じ量を流すと、どの山も同じ速さで育って人工的に見える
const FLOW_CHANGE_SEC = [2, 7];            // 流れる量の目標を選び直す間隔（秒）
const FLOW_RANGE = [0.4, 2.0];             // 流れる量の目標の範囲
const FLOW_LOW_PROB = 0.15;                // 目標を選び直すとき、流れを減らす確率
const FLOW_LOW = 0.25;                     // 減らしている間の流れる量。止めはしない
const FLOW_SMOOTH_SEC = 1.2;               // 流れる量が目標に近づく速さ（時定数、秒）
// 落とし口の位置は、もとの位置から一定の幅の中をゆっくり往復させる（周期の違う 2 つの揺れを重ねる）。
// 位置が動かないと、山が同じ所にまっすぐ育って人工的に見える
const HOLE_DRIFT = 0.04;                   // もとの位置から動く幅（片側、画面の幅に対する割合）
const HOLE_DRIFT_PERIOD = [[20, 40], [9, 17]];   // 2 つの揺れの周期の範囲（秒）
const HOLE_DRIFT_MIX = [0.65, 0.35];       // 2 つの揺れの割合（合わせて 1）

// 強度（落とし口の数）
const BASE_HOLES = 4;
const MIN_HOLES = 1;
const MAX_HOLES = 8;

// 描き終わりと次の絵
const CHECK_SEC = 0.5;                     // 砂の量と表面を読み出す間隔（秒）
const FILL_AMOUNT = 0.4;                   // 砂の量が画面の面積のこの割合に達したら、流すのをやめる
const FILL_HEIGHT = 0.8;                   // 山の高さが画面の高さのこの割合に達したときも、流すのをやめる
const WATCH_SEC = 30;                      // 流すのをやめてから次の絵に移るまでの秒数

// ガラスと光
const LIQUID_TOP_GAIN = 1.0;               // 液体の上端の明るさ（配色の液体の色に対する倍率）
const LIQUID_BOTTOM_GAIN = 0.82;           // 液体の下端の明るさ（同じ）
const EDGE_DARK = 0.05;                    // 画面の縁を暗くする強さ
const EDGE_WIDTH = 0.12;                   // 縁を暗くする幅（画面の高さに対する割合）

// 砂の見た目。実物の砂は粒が見分けられないほど細かいので、マスより細かいざらつきの面として描く
const GRAIN_SHADE = 0.12;                  // マスごとの明るさのばらつき（幅）。大きいとマスの四角が見える
const FINE_GRAIN = 0.16;                   // マスより細かいざらつきの強さ（幅）。粒と一緒に動く
const FINE_GRAIN_DIV = 3;                  // マスの高さを何個のざらつきに分けるか
const SAMPLE_JITTER = 0.1;                 // 読み出す位置を画素ごとにずらす幅（マス）。層の境目や輪郭の階段をくずす
// 層の境目は、近くの 4 マスの砂の色をなめらかに混ぜてならす。マスの色をそのまま描くと、境目が格子の階段と
// 散った粒の点になり、ごま塩のように見える
const LAYER_BLEND = 0.8;                   // 近くの 4 マスの色を混ぜる割合（0: 混ぜない、1: すべて混ぜた色）
// 落ちている砂は、粒を縦にぼかして足し合わせ、濃さの揺らぐひと続きの細い筋として描く。
// 流れる砂の粒はまばらなので、1 粒ずつ描くと、筋ではなく点の列に見える
const STREAM_BELOW = 6;                    // 流れの砂かを見分けるとき、下を何マス調べるか
const STREAM_BELOW_LIQUID = 3;             // そのうち何マス以上が液体なら流れとみなすか
const STREAM_REACH = 5;                    // 上下何マスまでの粒を足し合わせるか
const STREAM_SIGMA = 2.2;                  // 縦のぼかしの幅（マス）
const STREAM_HALF_WIDTH = 0.5;             // 筋の半分の幅（マスの高さに対する割合）
const STREAM_SCATTER = 0.45;               // 筋を描くとき、読み出す位置を画素ごとに散らす幅（マス）。筋の輪郭がわずかに毛羽立ち、砂粒らしく見える
const STREAM_OFFSET = 0.0;                 // 粒ごとに筋の位置を横にずらす幅（マス）
const STREAM_GAIN = 0.7;                   // 足し合わせた濃さの倍率
const STREAM_ALPHA = 0.85;                 // 筋の濃さの上限
const SURFACE_LIGHT = 1.06;                // 山の表面（上が液体）の砂の明るさ（倍率）
const INNER_DARK = 0.97;                   // 表面から 2 マスより内側の砂の明るさ（倍率）
// 砂の厚み。砂は 2 枚のガラスの間に厚みを持って積もる。少し上から見下ろしたように、手前の稜線の上に、
// 奥のガラスまで続く砂の上面を帯にして描く。上面は斜面の向きで明るさを変え、奥ほど液体越しにかすませる
const TOP_DEPTH = 3;                       // 上面の帯の高さ（マス）。ガラスの間の厚みが見える分
const TOP_DEPTH_VARY = 0.3;                // 帯の高さを横の位置で変える幅（割合、片側）。奥の縁が直線にならないように
const TOP_DEPTH_SCALE = 24;                // 帯の高さが変わる横の間隔（マス）
const TOP_LIGHT_DIR = [-0.5, 1];           // 上面に当たる光の向き（画面の [横, 縦]。左上から）
const TOP_COLOR_SCATTER = 5;               // 上面の色を読む列を、画素ごとに横へ散らす幅（マス）
const TOP_SLOPE_REACH = 3;                 // 上面の斜面の向きを求めるとき、前後何列離れた所の高さを見るか
const TOP_SHADE = [0.64, 1.04];            // 上面の明るさの範囲（光に背を向けた斜面、光に向いた斜面。砂の色に対する倍率）
const TOP_FOG = 0.4;                       // 上面の奥の縁で、液体の色に溶ける割合（手前の縁は 0）
const TOP_EDGE_LIGHT = 1.1;                // 手前の角（上面と手前の面の境目）の明るさ（倍率）
const TOP_EDGE_WIDTH = 0.8;                // 手前の角を明るくする幅（マス）
const FLOOR_GAIN = 0.62;                   // 床（容器の底の上面）の明るさ（液体の色に対する倍率）。砂の無い所で、上面の帯の代わりに見える

// ラクダ（隠し要素）
const CAMEL_INTERVAL = [120, 60, 180];     // 出てくる間隔（秒）: [平均, 最小, 最大]
const CAMEL_HEIGHT_PX = 31.5;              // ラクダの高さ（足もとから頭のてっぺんまで、CSS ピクセル）
const CAMEL_SPEED_PX = 16;                 // 歩く速さ（CSS ピクセル/秒）
const CAMEL_EDGE = [0.1, 0.2];             // 現れる・消える位置（画面の端からの距離。画面の幅に対する割合の範囲）
const CAMEL_FADE_SEC = 1.5;                // 現れる・消えるときのフェードの秒数
const CAMEL_STRIDE_SEC = 1.3;              // 4 本の脚がひと回り動く周期（秒）
const CAMEL_DUTY = 0.6;                    // 1 周期のうち脚が地面に着いている割合
const CAMEL_STAND = 0.93;                  // 平らな所で立っているときの脚の伸び（脚の長さに対する割合）
const CAMEL_LEG_STRETCH = [0.07, 0.3];     // 足を地面に合わせるとき、脚を [伸ばす, 縮める] 量の上限（脚の長さに対する割合）
const CAMEL_FOLLOW = 2;                    // 胴の傾きを地面に合わせる速さ（1/秒）。遅くして、歩く姿を落ち着かせる
const CAMEL_GROUND_FOLLOW = 3;             // 胴の高さを地面に合わせる速さ（1/秒）。遅くして、降り積もる砂で胴が震えないようにする
const CAMEL_FOOT_FOLLOW = 4;               // 足の高さを地面に合わせる速さ（1/秒）
const CAMEL_MAX_PITCH = 0.9;               // 斜面に合わせて傾ける角度の上限（ラジアン）
const CAMEL_READ_SEC = 0.1;                // ラクダがいる間に砂の表面を読み出す間隔（秒）
const CAMEL_COLOR = 0x1a120c;

// 配色のプリセット（docs/specs/sandpicture.md の「配色の定義」。絵ごとにこの順番でローテーションする）。
// name: 読む人のための名前（コードでは使わない）, liquid: 液体の色, sand: 砂の 3 色で、[色, 安息角（画面での角度、度）]。安息角は約 18〜53 の範囲で、大きいほど急な斜面で積もる。
// 3 色の安息角を離しておくと、山の上に積もる層の厚さが色ごとに変わり、地層のように見える
const COLOR_PRESETS = [
  { name: 'Desert', liquid: 0xe9dcbc, sand: [[0x3a2418, 45], [0xd0702a, 32], [0xf3ede2, 18]] },
  { name: 'Ocean', liquid: 0xcfe2ec, sand: [[0x14254a, 45], [0x1f8a8a, 32], [0xf0f4f6, 18]] },
  { name: 'Sunset', liquid: 0xf3dcd6, sand: [[0x4a2160, 45], [0xc0303f, 32], [0xe6b53a, 18]] },
];
const SAND_COLORS = 3;                     // 1 つの配色の砂の色の数

// 描画
const MAX_PIXEL_RATIO = { pc: 2, touch: 1 };  // 解像度の倍率の上限（pc: PC、touch: スマホなど。高解像度画面での負荷を抑える）

// ---- ユーティリティ ----
// 0xRRGGBB を sRGB のまま 0〜1 の Vector3 にする（ShaderMaterial は色空間を変換しないため）
const hexToVec3 = (hex, gain = 1) => new THREE.Vector3(
  ((hex >> 16) & 255) / 255 * gain, ((hex >> 8) & 255) / 255 * gain, (hex & 255) / 255 * gain);

// 安息角（画面での角度、度）から、斜めに滑らない粒の割合を求める。格子の上では、割合 0 で傾き 1、
// 1 で傾き 2 の斜面になる。マスが横長なので、画面での傾きはその 1 / CELL_ASPECT（1.5 倍なら約 34°〜53°）
const gridSlope = (angle) => Math.tan(THREE.MathUtils.degToRad(angle)) * CELL_ASPECT;
const stickyFraction = (angle) => clamp(gridSlope(angle) - 1, 0, 1);
// 格子の上で傾き 1 より緩い斜面にするため、段のふちで横へ動く粒の割合を求める。割合 0 で傾き 1、
// 1 で傾き 0.5 の斜面になる（1.5 倍なら画面で約 34°〜18°）
const flatFraction = (angle) => clamp(2 * (1 - gridSlope(angle)), 0, 1);

// ---- シェーダー ----
const QUAD_VERTEX = /* glsl */ `
varying vec2 vUv;
void main() {
  vUv = uv;
  gl_Position = vec4(position.xy, 0.0, 1.0);
}`;

// マスの中身: r = 種類（0: 液体、1〜: 砂。1 を引いた値の SAND_COLORS で割った余りが色の番号、商が濃淡の段階）、g = 粒の明るさの乱数、b = 粒の落ちる速さの乱数、
// a = 粒の滑りにくさの乱数（色ごとのしきい値より小さい粒は、斜めに滑らない・段のふちで横へ動く）
const SIM_FRAGMENT = /* glsl */ `
uniform sampler2D uGrid;
uniform vec4 uHoles[${MAX_HOLES}];   // 落とし口（x: 左端、y: 右端の次のマス、z: 出す砂の種類（r に書く値）、w: 流れる量の倍率。使わない口は 0）
uniform int uW, uH;
uniform int uOffX, uOffY;     // 2×2 の組の区切りのずらし（Margolus 近傍）
uniform int uSeed;
uniform float uFall, uSpread, uTopple, uDrift;
uniform float uEmit;          // 落とし口の 1 マスから砂が出てくる確率
uniform float uSticky[${SAND_COLORS}];   // 色ごとの、斜めに滑らない粒の割合
uniform float uFlat[${SAND_COLORS}];     // 色ごとの、段のふちで横へ動く粒の割合

uint hash(uint x) {
  x ^= x >> 16; x *= 0x7feb352du;
  x ^= x >> 15; x *= 0x846ca68bu;
  x ^= x >> 16;
  return x;
}
float rnd(uint h) { return float(h & 0xffffffu) / 16777216.0; }

// 格子の外。壁として扱う
bool outside(ivec2 p) {
  return p.x < 0 || p.y < 0 || p.x >= uW || p.y >= uH;
}

// 格子の中の空いたマスか（組の外を読むだけのときに使う）
bool emptyAt(ivec2 p) {
  return !outside(p) && texelFetch(uGrid, p, 0).r <= 0.002;
}

// マスの r から、砂の色の番号を求める
int colorOf(float r) {
  return (int(r * 255.0 + 0.5) - 1) % ${SAND_COLORS};
}

// p の下（p - (0, 1) の位置）の砂が積もって止まっているか。p 自身は組の外で、底か砂なら止まっている
bool resting(ivec2 p) {
  return outside(p) || texelFetch(uGrid, p, 0).r > 0.002;
}

void main() {
  ivec2 q = ivec2(gl_FragCoord.xy) + ivec2(uOffX, uOffY);
  ivec2 b = q / 2;
  ivec2 base = b * 2 - ivec2(uOffX, uOffY);
  int me = (q.x - b.x * 2) + (q.y - b.y * 2) * 2;   // 組の中の位置（0: 左下、1: 右下、2: 左上、3: 右上）

  vec4 c[4];
  int k[4];   // 0: 液体、1: 砂、2: 壁
  uint h = hash(uint(b.x) * 1973u + uint(b.y) * 9277u + uint(uSeed) * 26699u);
  for (int i = 0; i < 4; i++) {
    ivec2 p = base + ivec2(i % 2, i / 2);
    if (outside(p)) {
      c[i] = vec4(0.0);
      k[i] = 2;
      continue;
    }
    c[i] = texelFetch(uGrid, p, 0);
    k[i] = c[i].r > 0.002 ? 1 : 0;
    // 上端の行の、落とし口の下の空いたマスに砂を出す。色は落とし口ごと
    if (p.y != uH - 1 || k[i] != 0) continue;
    vec4 hole = vec4(0.0);
    for (int j = 0; j < ${MAX_HOLES}; j++) {
      if (float(p.x) >= uHoles[j].x && float(p.x) < uHoles[j].y) hole = uHoles[j];
    }
    if (hole.z == 0.0) continue;
    h = hash(h);
    if (rnd(h) < uEmit * hole.w) {
      uint g = hash(h), bb = hash(g), a = hash(bb);
      c[i] = vec4(hole.z, rnd(g), rnd(bb), rnd(a));
      k[i] = 1;
    }
  }

  float r[5];
  for (int i = 0; i < 5; i++) { h = hash(h); r[i] = rnd(h); }

  // 左右の列のどちらを先に動かすかは組ごとに乱数で決め、偏りを出さない
  bool leftFirst = r[4] < 0.5;
  int moved = -1;   // この更新で横へ動いた粒のマス（1 回の更新で 2 度動かさない）
  for (int n = 0; n < 2; n++) {
    bool left = (n == 0) == leftFirst;
    int top = left ? 2 : 3;
    int below = left ? 0 : 1;
    int diag = left ? 1 : 0;
    int side = left ? 3 : 2;
    if (k[top] != 1 || top == moved) continue;
    float p = uFall * (1.0 - uSpread + 2.0 * uSpread * c[top].b);
    if ((left ? r[0] : r[1]) >= p) continue;
    float rd = left ? r[2] : r[3];
    int dst = -1;
    if (k[below] == 0) dst = (k[diag] == 0 && rd < uDrift) ? diag : below;
    // 斜めや横へ動くのは、下の砂が積もって止まっているときだけ。落ちている砂どうしがぶつかって滑ると、流れの筋が横に広がる
    else if (rd < uTopple && (k[below] == 2 || resting(base + ivec2(below, -1)))) {
      int color = colorOf(c[top].r);
      if (k[diag] == 0) {
        // 滑りにくい粒は、斜め下が 1 マスの段差なら留まり、2 マス以上落ちていれば滑る。
        // これで色ごとの斜面の角度が 45°〜約 63° に収まり、尖った柱が立たない
        if (c[top].a >= uSticky[color] || emptyAt(base + ivec2(diag, -1))) dst = diag;
      } else if (k[side] == 0 && c[top].a < uFlat[color] && emptyAt(base + ivec2(left ? 2 : -1, 0))) {
        // 45° より緩い斜面。斜め下もふさがっていても、横が空いていて、その 1 マス先（組の外、読むだけ）に段があれば、
        // 横へ 1 マス動く。次の更新で段から斜め下へ滑るので、2 マス進んで 1 段下がる斜面（傾き 0.5）まで作れる
        dst = side;
        moved = side;
      }
    }
    if (dst >= 0) {
      c[dst] = c[top]; k[dst] = 1;
      c[top] = vec4(0.0); k[top] = 0;
    }
  }
  gl_FragColor = c[me];
}`;

// 列ごとに、砂の表面の高さ（底から続く砂のマス数）と砂の量を数える。
// 8 ビットの描画先なので、それぞれ上位・下位の 2 バイトに分けて書く
const SURFACE_FRAGMENT = /* glsl */ `
uniform sampler2D uGrid;
uniform int uH;
void main() {
  int x = int(gl_FragCoord.x);
  int height = 0, count = 0;
  bool solid = true;
  for (int y = 0; y < 8192; y++) {
    if (y >= uH) break;
    bool sand = texelFetch(uGrid, ivec2(x, y), 0).r > 0.002;
    if (sand) count++;
    if (solid && sand) height = y + 1; else solid = false;
  }
  gl_FragColor = vec4(float(height / 256), float(height % 256), float(count / 256), float(count % 256)) / 255.0;
}`;

const VIEW_FRAGMENT = /* glsl */ `
uniform sampler2D uGrid;
uniform int uW, uH;
uniform vec3 uSand[${SAND_COLORS}];
uniform vec3 uLiquidTop, uLiquidBottom;
uniform float uAspect;
uniform sampler2D uSurface;   // 列ごとの砂の表面の高さ（SURFACE_FRAGMENT の出力）
uniform float uTopSeed;       // 上面の帯の高さの揺れの種（絵ごとに変える）
uniform vec3 uFloor;          // 床の色
varying vec2 vUv;

float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

// 列 x の砂の表面の高さ（マス）。格子の外は端の列
float surfaceAt(int x) {
  vec4 t = texelFetch(uSurface, ivec2(clamp(x, 0, uW - 1), 0), 0) * 255.0;
  return floor(t.r + 0.5) * 256.0 + floor(t.g + 0.5);
}

// 横の位置 u（列の中心を整数とする）の砂の表面の高さ（マス）。列の中心のあいだを直線でつなぐ
float surfaceLerp(float u) {
  int i = int(floor(u));
  return mix(surfaceAt(i), surfaceAt(i + 1), fract(u));
}

// 砂か（格子の外は液体とみなす）
bool sandAt(ivec2 p) {
  return p.x >= 0 && p.y >= 0 && p.x < uW && p.y < uH && texelFetch(uGrid, p, 0).r > 0.002;
}

// マスの r から、砂の色（濃淡を付けた色）を求める
vec3 baseColor(float r) {
  int v = int(r * 255.0 + 0.5) - 1;
  float tone = float(v / ${SAND_COLORS}) / ${TONE_STEPS - 1}.0 - 0.5;
  return uSand[v % ${SAND_COLORS}] * (1.0 + ${TONE_RANGE.toFixed(3)} * tone);
}

// 宙を落ちている流れの砂か。下 ${STREAM_BELOW} マスのうち ${STREAM_BELOW_LIQUID} マス以上が液体なら、流れとみなす（格子の外は底）。
// 斜面を転がる砂は、斜めに滑った直後に真下が液体になるが、その下は砂なので流れに入れない（縦の筋に見えないように）。
// 流れの中で粒が縦に連なっても、下の半分ほどは液体なので流れに入る
bool fallingAt(ivec2 p) {
  if (!sandAt(p)) return false;
  int liquid = 0;
  for (int i = 1; i <= ${STREAM_BELOW}; i++) {
    if (p.y - i < 0) break;
    if (!sandAt(p - ivec2(0, i))) liquid++;
  }
  return liquid >= ${STREAM_BELOW_LIQUID};
}

// 積もった砂か（斜面を転がっている砂も含む）
bool restingAt(ivec2 p) {
  return sandAt(p) && !fallingAt(p);
}

// 積もった砂の色。マスごとの明るさのばらつき・マスより細かいざらつき・表面の明るさを付ける
vec3 sandColor(vec3 base, vec4 c, ivec2 cell, vec2 gp) {
  // マスより細かいざらつき。粒の乱数を種にするので、粒と一緒に動く
  vec2 fine = floor(fract(gp) * vec2(${FINE_GRAIN_DIV * CELL_ASPECT}, ${FINE_GRAIN_DIV}.0));
  float grain = hash12(fine + c.gb * 97.0);
  vec3 sand = base * (1.0 + ${GRAIN_SHADE.toFixed(3)} * (c.g - 0.5) + ${FINE_GRAIN.toFixed(3)} * (grain - 0.5));
  // 山の表面をわずかに明るく、少し内側をわずかに暗くする
  return sand * (!sandAt(cell + ivec2(0, 1)) ? ${SURFACE_LIGHT.toFixed(3)} : !sandAt(cell + ivec2(0, 2)) ? 1.0 : ${INNER_DARK.toFixed(3)});
}

// 層の境目をならした砂の色。近くの 4 マスの砂の色を、マスの中心からの距離で混ぜる（液体のマスは除く）
vec3 layerColor(vec4 c, vec2 gp) {
  vec3 own = baseColor(c.r);
  vec2 bp = gp - 0.5;
  ivec2 b0 = ivec2(floor(bp));
  vec2 t = fract(bp);
  vec3 sum = vec3(0.0);
  float wsum = 0.0;
  for (int i = 0; i < 4; i++) {
    ivec2 o = ivec2(i % 2, i / 2);
    ivec2 p = b0 + o;
    if (!sandAt(p)) continue;
    vec2 wt = mix(1.0 - t, t, vec2(o));
    float w = wt.x * wt.y;
    sum += w * baseColor(texelFetch(uGrid, p, 0).r);
    wsum += w;
  }
  return wsum > 0.0 ? mix(own, sum / wsum, ${LAYER_BLEND.toFixed(3)}) : own;
}

// 砂と床の上面（ガラスの間の厚み）。列の表面の高さを横になめらかにつなぎ、その上 TOP_DEPTH マスを上面の帯にする
// （砂の無い列は床の上面）。帯の外なら col をそのまま返す
vec3 topSurface(vec3 col, vec2 gs, vec2 gp) {
  float u = gs.x - 0.5;
  float hs = surfaceLerp(u);
  // 帯の高さは横の位置でゆるやかに変え、奥の縁を直線にしない。床の奥の縁はまっすぐ
  float tx = gs.x / ${TOP_DEPTH_SCALE}.0;
  float ti = floor(tx);
  float wave = mix(hash12(vec2(ti, uTopSeed)), hash12(vec2(ti + 1.0, uTopSeed)), smoothstep(0.0, 1.0, fract(tx)));
  float depth = ${TOP_DEPTH}.0 * (1.0 + ${TOP_DEPTH_VARY.toFixed(3)} * (2.0 * wave - 1.0) * min(hs, 1.0));
  float d = gp.y - hs;   // 手前の稜線からの高さ（マス）
  if (d <= 0.0 || d >= depth) return col;

  // 上面の色は、画素ごとに横へ散らした列の、いちばん上の砂の色にする。列ごとに表面の層の厚さや
  // 転がる粒の色が違うので、1 列ずつの色にすると縦の筋が並ぶ。散らすと、ざらついた砂の面になる
  int sx = clamp(int(floor(gs.x + (hash12(gl_FragCoord.xy + 101.0) - 0.5) * ${TOP_COLOR_SCATTER.toFixed(3)})), 0, uW - 1);
  float sh = surfaceAt(sx);
  if (sh < 1.0) {   // 散らした先が砂の無い列なら、自分の列の色にする（山の裾に床の色の点が混じらないように）
    sx = clamp(int(gs.x), 0, uW - 1);
    sh = surfaceAt(sx);
  }
  vec3 topColor = uFloor;
  float grain = 0.0;
  float topR = sh >= 1.0 ? texelFetch(uGrid, ivec2(sx, int(sh) - 1), 0).r : 0.0;
  // 暗転中に格子を空にした直後は、表面の高さが古いまま残るので、マスが空なら床にする
  if (hs > 0.0 && topR > 0.002) {
    topColor = baseColor(topR);
    vec2 fine = floor(gp * vec2(${FINE_GRAIN_DIV * CELL_ASPECT}, ${FINE_GRAIN_DIV}.0));
    grain = ${FINE_GRAIN.toFixed(3)} * (hash12(fine) - 0.5);
  }
  // 斜面の向き。表面の高さは 1 マスずつの階段なので、前後 ${TOP_SLOPE_REACH} 列離れた所の高さから求め、列ごとに飛ばないようにする。
  // マスが横長なので、画面での傾きは格子の上の 1 / CELL_ASPECT
  float slope = (surfaceLerp(u + ${TOP_SLOPE_REACH}.0) - surfaceLerp(u - ${TOP_SLOPE_REACH}.0)) / ${(2 * TOP_SLOPE_REACH * CELL_ASPECT).toFixed(3)};
  float lit = max(dot(normalize(vec2(-slope, 1.0)), normalize(vec2(${TOP_LIGHT_DIR.map((v) => v.toFixed(3)).join(', ')}))), 0.0);
  vec3 top = topColor * mix(${TOP_SHADE[0].toFixed(3)}, ${TOP_SHADE[1].toFixed(3)}, lit) * (1.0 + grain)
             * mix(${TOP_EDGE_LIGHT.toFixed(3)}, 1.0, smoothstep(0.0, ${TOP_EDGE_WIDTH.toFixed(3)}, d));
  // 奥ほど液体越しにかすませる
  return mix(top, col, ${TOP_FOG.toFixed(3)} * d / depth);
}

void main() {
  vec2 gs = vUv * vec2(uW, uH);   // 格子の座標
  vec3 liquid = mix(uLiquidBottom, uLiquidTop, vUv.y);
  vec3 col = liquid;

  // 積もった砂。読み出す位置を画素ごとに少しずらし、層の境目や輪郭の階段をくずす
  vec2 jitter = vec2(hash12(gl_FragCoord.xy), hash12(gl_FragCoord.yx + 17.0)) - 0.5;
  vec2 gp = gs + jitter * ${SAMPLE_JITTER.toFixed(3)};
  ivec2 cell = clamp(ivec2(floor(gp)), ivec2(0), ivec2(uW - 1, uH - 1));
  vec2 f = fract(gp);
  ivec2 down = cell - ivec2(0, 1);
  if (restingAt(cell)) {
    vec4 c = texelFetch(uGrid, cell, 0);
    col = sandColor(layerColor(c, gp), c, cell, gp);
  } else if (!sandAt(cell)) {
    if (restingAt(down) && ((restingAt(cell - ivec2(1, 0)) && f.y < 1.0 - f.x) || (restingAt(cell + ivec2(1, 0)) && f.y < f.x))) {
      // 山の表面の階段をならす。下と横が積もった砂の液体のマスは、斜め半分を下の砂で埋め、階段の角どうしを斜めの線でつなぐ
      vec4 c = texelFetch(uGrid, down, 0);
      col = sandColor(layerColor(c, gp), c, down, gp);
    } else {
      col = topSurface(col, gs, gp);
    }
  }

  // 落ちている砂。上下 STREAM_REACH マスの粒を、縦にぼかして足し合わせる。読み出す位置を画素ごとに散らす
  vec2 scatter = vec2(hash12(gl_FragCoord.xy + 31.0), hash12(gl_FragCoord.yx + 53.0)) - 0.5;
  vec2 gp0 = gs + scatter * ${STREAM_SCATTER.toFixed(3)};
  ivec2 cell0 = clamp(ivec2(floor(gp0)), ivec2(0), ivec2(uW - 1, uH - 1));
  float density = 0.0;
  vec3 stream = vec3(0.0);
  // 落ちている粒は、その列の砂の表面より上にしかない。上 STREAM_REACH マスまで表面より下の画素（積もった砂の奥）では探さない。
  // 積もった砂の画素で探すと、1 マスごとに下を読むので、1 画素で 80 回ほどテクスチャを読むことになる
  if (cell0.y + ${STREAM_REACH} >= int(surfaceAt(cell0.x))) {
    for (int k = -${STREAM_REACH}; k <= ${STREAM_REACH}; k++) {
      ivec2 p = cell0 + ivec2(0, k);
      if (!fallingAt(p)) continue;
      vec4 g = texelFetch(uGrid, p, 0);
      // 筋の横の位置は粒ごとにずらす。マスが横長なので、横の距離は CELL_ASPECT 倍して測る
      float dx = (gp0.x - float(p.x) - 0.5 - (g.b - 0.5) * ${STREAM_OFFSET.toFixed(3)}) * ${CELL_ASPECT};
      float dy = (gp0.y - float(p.y) - 0.5) / ${STREAM_SIGMA.toFixed(3)};
      float w = (1.0 - smoothstep(${(STREAM_HALF_WIDTH * 0.3).toFixed(3)}, ${STREAM_HALF_WIDTH.toFixed(3)}, abs(dx))) * exp(-dy * dy);
      density += w;
      stream += w * baseColor(g.r) * (1.0 + ${GRAIN_SHADE.toFixed(3)} * (g.g - 0.5));
    }
  }
  if (density > 0.0) col = mix(col, stream / density, min(density * ${STREAM_GAIN.toFixed(3)}, ${STREAM_ALPHA.toFixed(3)}));
  vec2 sv = vUv * vec2(uAspect, 1.0);
  // 画面の縁をわずかに暗くする
  float edge = min(min(sv.x, uAspect - sv.x), min(sv.y, 1.0 - sv.y));
  col *= 1.0 - ${EDGE_DARK.toFixed(3)} * (1.0 - smoothstep(0.0, ${EDGE_WIDTH.toFixed(3)}, edge));
  // 暗い階調の段差を隠すごく小さなノイズ
  col += (hash12(gl_FragCoord.xy) - 0.5) / 255.0;
  gl_FragColor = vec4(col, 1.0);
}`;

// ---- three.js 初期化 ----
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, IS_TOUCH ? MAX_PIXEL_RATIO.touch : MAX_PIXEL_RATIO.pc));
renderer.setSize(innerWidth, innerHeight);
renderer.autoClear = false;
renderer.setClearColor(0x000000, 0);   // 格子を 0（液体）で消すため
document.body.appendChild(renderer.domElement);

const quadGeometry = new THREE.PlaneGeometry(2, 2);
const quadCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
// 全画面の四角形 1 枚を描くだけのシーン
function quadPass(fragmentShader, uniforms) {
  const material = new THREE.ShaderMaterial({
    vertexShader: QUAD_VERTEX, fragmentShader, uniforms, depthTest: false, depthWrite: false,
  });
  const scene = new THREE.Scene();
  scene.add(new THREE.Mesh(quadGeometry, material));
  return { scene, uniforms };
}
const gridTargetOptions = {
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: false, generateMipmaps: false,
};

const simPass = quadPass(SIM_FRAGMENT, {
  uGrid: { value: null },
  uHoles: { value: Array.from({ length: MAX_HOLES }, () => new THREE.Vector4(0, 0, 0, 0)) },
  uW: { value: 1 }, uH: { value: 1 }, uOffX: { value: 0 }, uOffY: { value: 0 }, uSeed: { value: 0 },
  uFall: { value: FALL_PROB }, uSpread: { value: GRAIN_SPEED_SPREAD },
  uTopple: { value: TOPPLE_PROB }, uDrift: { value: DRIFT_PROB },
  uEmit: { value: 0 },
  uSticky: { value: new Array(SAND_COLORS).fill(0) },
  uFlat: { value: new Array(SAND_COLORS).fill(0) },
});
const surfacePass = quadPass(SURFACE_FRAGMENT, { uGrid: { value: null }, uH: { value: 1 } });
const viewPass = quadPass(VIEW_FRAGMENT, {
  uGrid: { value: null }, uW: { value: 1 }, uH: { value: 1 },
  uSand: { value: Array.from({ length: SAND_COLORS }, () => new THREE.Vector3()) },
  uLiquidTop: { value: new THREE.Vector3() }, uLiquidBottom: { value: new THREE.Vector3() },
  uAspect: { value: 1 }, uSurface: { value: null }, uTopSeed: { value: 0 }, uFloor: { value: new THREE.Vector3() },
});

// ラクダを砂の上に重ねて描くシーン。座標は CSS ピクセル（マスが横長なので、格子のマスにすると形がゆがむ）
const overlayScene = new THREE.Scene();
const overlayCamera = new THREE.OrthographicCamera(0, 1, 1, 0, -1, 1);

// ---- 状態 ----
let holeCount = BASE_HOLES;     // 落とし口の数（強度）
let colorPresetIndex = 0;       // いまの配色（COLOR_PRESETS の番号）
let W = 0, H = 0;               // 格子の大きさ（マス）
let targets = [];               // 格子の描画先（交互に読み書きする 2 枚）
let current = 0;                // いまの格子が入っている描画先の番号
let holes = [];                 // 落とし口 { home・x（もとの位置といまの位置）, width（マス）, color（いまの層の色）, time（層の残りの秒数）,
                                //   tone・toneBase・toneTarget・toneTime（濃淡、層の始まりの濃淡、濃淡の目標、目標を選び直すまでの秒数）,
                                //   flow（流れる量）, flowTarget（その目標）, flowTime（目標を選び直すまでの秒数）, drift（位置の揺れ） }
let surfaceTarget = null;       // 列ごとの砂の表面の高さと量
let surfaceBuffer = null;
let surface = new Float32Array(0);   // 列ごとの砂の表面の高さ（マス）
let stepCount = 0;              // 格子の更新回数（乱数の種と組のずらしに使う）
let stepCarry = 0;              // 次のフレームへ持ち越す更新回数の端数
let checkWait = 0;              // 次に砂の量と表面を読み出すまでの秒数
let sandCount = 0;              // 砂の量（マス）
let pouring = false;            // 落とし口から砂を流している間か
let watchTime = 0;              // 流すのをやめてからの秒数
let camelWait = randomInterval(CAMEL_INTERVAL);   // 次にラクダを出すまでの秒数
let camel = null;               // 歩いているラクダ

// ---- 砂と液体 ----
// 画面の大きさに合わせて格子を作り直す。描いている途中の絵では呼ばない（次の絵から合わせる）
function buildGrid() {
  const w = Math.max(16, Math.round(innerWidth / CELL_W_PX));
  const h = Math.max(16, Math.round(innerHeight / CELL_PX));
  if (w !== W || h !== H) {
    for (const t of targets) t.dispose();
    surfaceTarget?.dispose();
    W = w; H = h;
    targets = [0, 1].map(() => new THREE.WebGLRenderTarget(W, H, gridTargetOptions));
    surfaceTarget = new THREE.WebGLRenderTarget(W, 1, gridTargetOptions);
    surfaceBuffer = new Uint8Array(W * 4);
    surface = new Float32Array(W);
  }
  simPass.uniforms.uW.value = viewPass.uniforms.uW.value = W;
  simPass.uniforms.uH.value = viewPass.uniforms.uH.value = surfacePass.uniforms.uH.value = H;
  viewPass.uniforms.uAspect.value = W / H;
  overlayCamera.right = W * CELL_W_PX;
  overlayCamera.top = H * CELL_PX;
  overlayCamera.updateProjectionMatrix();
}

// 格子を液体だけにする
function clearGrid() {
  current = 0;
  renderer.setRenderTarget(targets[current]);
  renderer.clear();
  renderer.setRenderTarget(null);
}

// 落とし口を 1 つ足す。候補のうち、ほかの口からいちばん遠い所に開ける
function addHole() {
  const width = Math.max(HOLE_MIN_CELLS, Math.round(W * randIn(HOLE_WIDTH)));
  const margin = Math.round(W * HOLE_MARGIN);
  let best = null;
  let bestGap = -1;
  for (let i = 0; i < 40; i++) {
    const x = margin + randInt(Math.max(1, W - 2 * margin - width));
    const center = x + width / 2;
    const gap = holes.reduce((g, h) => Math.min(g, Math.abs(h.x + h.width / 2 - center) - (h.width + width) / 2), Infinity);
    if (gap > bestGap) { bestGap = gap; best = x; }
  }
  const flow = randomFlow();
  const drift = HOLE_DRIFT_PERIOD.map((period) => ({ speed: TAU / randIn(period), phase: rand(0, TAU) }));
  holes.push({
    home: best, x: best, width, color: randInt(COLOR_PRESETS[colorPresetIndex].sand.length), time: randIn(STRATUM_SEC),
    ...newStratumTone(),
    flow, flowTarget: flow, flowTime: randIn(FLOW_CHANGE_SEC), drift,
  });
}

function removeHole() {
  holes.splice(randInt(holes.length), 1);
}

// 落とし口の数を holeCount に合わせ、テクスチャと 1 つの口から出る量を更新する
function updateHoles() {
  while (holes.length < holeCount) addHole();
  while (holes.length > holeCount) removeHole();
  writeHoles();
  updateEmit();
}

// 1 つの口から出る量。落とし口が多いほど減らす。口の数に比例して流す量を増やすと、
// 口が 1 つの絵は描き終わるまで長くかかりすぎ、8 つの絵はすぐ終わってしまう。流すのをやめた後は 0
function updateEmit() {
  simPass.uniforms.uEmit.value = pouring ? Math.min(1, EMIT_PROB * Math.sqrt(EMIT_BASE_HOLES / holes.length)) : 0;
}

// 流れる量の目標。ときどき流れを減らす
const randomFlow = () => (Math.random() < FLOW_LOW_PROB ? FLOW_LOW : randIn(FLOW_RANGE));

// 層の始まりの濃淡（0〜1）。層ごとに選ぶ
function newStratumTone() {
  const tone = Math.random();
  return { tone, toneBase: tone, toneTarget: tone, toneTime: randIn(TONE_CHANGE_SEC) };
}

// 落とし口の位置といまの層の色・流れる量をシェーダーに渡す
function writeHoles() {
  simPass.uniforms.uHoles.value.forEach((v, i) => {
    const h = holes[i];
    if (h) v.set(h.x, h.x + h.width, (h.color + SAND_COLORS * Math.round(h.tone * (TONE_STEPS - 1)) + 1) / 255, h.flow);
    else v.set(0, 0, 0, 0);
  });
}

// 格子を 1 回更新する
function step() {
  const u = simPass.uniforms;
  u.uGrid.value = targets[current].texture;
  u.uOffY.value = stepCount & 1;          // 縦のずらしは毎回変え、落ちている砂が毎回動けるようにする
  u.uOffX.value = (stepCount >> 1) & 1;
  u.uSeed.value = stepCount % 1000000007;
  current = 1 - current;
  renderer.setRenderTarget(targets[current]);
  renderer.render(simPass.scene, quadCamera);
  stepCount++;
}

function updateSand(dt) {
  stepCarry = Math.min(stepCarry + STEPS_PER_HEIGHT * H * dt, MAX_STEPS_PER_FRAME);
  for (; stepCarry >= 1; stepCarry--) step();
  renderer.setRenderTarget(null);
}

// 列ごとの砂の表面の高さと砂の量を数える。砂の上面を描くのに使うので、毎フレーム数える
function countSurface() {
  surfacePass.uniforms.uGrid.value = targets[current].texture;
  renderer.setRenderTarget(surfaceTarget);
  renderer.render(surfacePass.scene, quadCamera);
  renderer.setRenderTarget(null);
}

// 数えた砂の表面の高さと、砂の量を読み出す
function readSurface() {
  renderer.readRenderTargetPixels(surfaceTarget, 0, 0, W, 1, surfaceBuffer);
  let count = 0;
  for (let x = 0; x < W; x++) {
    const o = x * 4;
    surface[x] = surfaceBuffer[o] * 256 + surfaceBuffer[o + 1];
    count += surfaceBuffer[o + 2] * 256 + surfaceBuffer[o + 3];
  }
  sandCount = count;
}

// ---- 地層と次の絵 ----
// 落とし口ごとに、決めた秒数だけ流したら次の層に移る。色は前の層と同じにしない。
// 口ごとに切り替えるので、山ごとに層の色の順番と厚さが変わる。
// 流れる量も口ごとに、ときどき選び直した目標へなめらかに近づけ、位置もゆっくり動かす
function updateStreams(dt) {
  const count = COLOR_PRESETS[colorPresetIndex].sand.length;
  const follow = 1 - Math.exp(-dt / FLOW_SMOOTH_SEC);
  for (const h of holes) {
    h.time -= dt;
    if (h.time <= 0) {
      h.color = (h.color + 1 + randInt(count - 1)) % count;
      h.time = randIn(STRATUM_SEC);
      Object.assign(h, newStratumTone());
    }
    // 層の中の濃淡は、層の始まりの濃淡のまわりをゆっくり動かす
    h.toneTime -= dt;
    if (h.toneTime <= 0) {
      h.toneTarget = clamp(h.toneBase + rand(-TONE_DRIFT, TONE_DRIFT), 0, 1);
      h.toneTime = randIn(TONE_CHANGE_SEC);
    }
    h.tone += (h.toneTarget - h.tone) * (1 - Math.exp(-dt / TONE_SMOOTH_SEC));
    h.flowTime -= dt;
    if (h.flowTime <= 0) {
      h.flowTarget = randomFlow();
      h.flowTime = randIn(FLOW_CHANGE_SEC);
    }
    h.flow += (h.flowTarget - h.flow) * follow;
    let offset = 0;
    h.drift.forEach((d, i) => {
      d.phase = (d.phase + d.speed * dt) % TAU;
      offset += HOLE_DRIFT_MIX[i] * Math.sin(d.phase);
    });
    // 動いても、左右の端の HOLE_MARGIN には入れない
    h.x = clamp(h.home + offset * HOLE_DRIFT * W, W * HOLE_MARGIN, W * (1 - HOLE_MARGIN) - h.width);
  }
  writeHoles();
}

function updatePicture(dt) {
  if (pouring) updateStreams(dt);
  checkWait -= dt;
  if (checkWait <= 0) {
    checkWait = camel ? CAMEL_READ_SEC : CHECK_SEC;   // ラクダの足もとの砂は動くので、ラクダがいる間はこまめに読み出す
    readSurface();
    if (pouring) {
      // ある程度まで積もったら、流すのをやめる
      if (sandCount >= FILL_AMOUNT * W * H || Math.max(...surface) >= FILL_HEIGHT * H) {
        pouring = false;
        watchTime = 0;
        updateEmit();
      }
    }
  }
  if (!pouring) {
    watchTime += dt;
    if (watchTime >= WATCH_SEC && !isFading()) nextPicture();
  }
}

// ---- ラクダ ----
// 形は「胴の中心を原点、前を +x、上を +y」の単位で決め、CAMEL_UNIT_PX 倍して映す。
// 全体を斜面に合わせて傾け（重力は斜面に垂直とみなす）、脚は 1 本ずつ、足の下の砂の表面へ近づくよう膝を曲げて描く。
// 着地の正確さより歩く姿の落ち着きを優先し、地面は前後にならして使い、脚の伸び縮みにも上限を設ける
const CAMEL_MODEL_H = 84;                  // 足もとから頭のてっぺんまでの高さ（単位）
const CAMEL_UNIT_PX = CAMEL_HEIGHT_PX / CAMEL_MODEL_H;   // 1 単位の CSS ピクセル
const CAMEL_CANVAS = 200;                  // 絵の大きさ（単位）。胴を傾けても収まる大きさ
const CAMEL_LEG = 47;                      // 脚の長さ（付け根から球節まで、単位）
const CAMEL_HIP_Y = -6;                    // 脚の付け根の高さ（胴の中心から、単位）
const CAMEL_STEP = 7;                      // 足を上げる高さ（単位）
const CAMEL_PAD = 2.5;                     // 足の裏から球節（足の裏のすぐ上の関節）までの高さ（単位）
const CAMEL_SMOOTH = 30;                   // 地面をならす前後の幅（片側、単位）。傾きもこの距離だけ前後の地面の差で測る
// 脚: x（付け根の前後の位置、単位）, front（前脚か）, side（0: 手前・1: 奥）, upper（膝までの長さ、単位）。
// ラクダは側対歩（同じ側の前脚と後ろ脚を揃えて出す）で歩くので、手前と奥で位相を半周ずらす。
// 前脚の膝（手首）は脚の中ほど、後ろ脚のかかとは低い所にある
const CAMEL_LEGS = [
  { x: -21, front: false, side: 1, upper: 28 }, { x: 25, front: true, side: 1, upper: 23 },
  { x: -24, front: false, side: 0, upper: 28 }, { x: 22, front: true, side: 0, upper: 23 },
];

const camelCanvas = document.createElement('canvas');
camelCanvas.width = camelCanvas.height = CAMEL_CANVAS;
const camelTexture = new THREE.CanvasTexture(camelCanvas);
const camelMaterial = new THREE.MeshBasicMaterial({
  map: camelTexture, color: CAMEL_COLOR, transparent: true, depthTest: false, depthWrite: false,
});
// 原点が胴の中心（絵の中央）になる
const camelMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), camelMaterial);
camelMesh.visible = false;
overlayScene.add(camelMesh);

// 位置 x（CSS ピクセル）の砂の表面の高さ（CSS ピクセル）。列の中心のあいだを直線でつなぐ。
// ラクダはガラスの間の奥行きの中ほどを歩くので、砂の上面の帯の半分だけ上にする
function groundPx(x) {
  const u = x / CELL_W_PX - 0.5;
  const i = Math.floor(u), f = u - i;
  const a = surface[clamp(i, 0, W - 1)], b = surface[clamp(i + 1, 0, W - 1)];
  return (a + (b - a) * f + TOP_DEPTH / 2) * CELL_PX;
}

// 前後 CAMEL_SMOOTH をならした砂の表面の高さ（CSS ピクセル）。尖った山頂や粒のでこぼこで胴が揺れないようにする
function smoothGroundPx(x) {
  let sum = 0;
  for (let i = -3; i <= 3; i++) sum += groundPx(x + CAMEL_SMOOTH * CAMEL_UNIT_PX * i / 3);
  return sum / 7;
}

// 位置 x での、ならした斜面の傾き（前が高いと正、ラジアン）
function camelSlope(x, dir) {
  const d = CAMEL_SMOOTH * CAMEL_UNIT_PX;
  return Math.atan2(smoothGroundPx(x + dir * d) - smoothGroundPx(x - dir * d), 2 * d);
}

// 脚の付け根 (hx, hy) から足 (fx, fy) までを、長さ upper と残りの 2 本の骨でつなぐ膝の位置（単位）。
// bend が 1 なら膝を前へ、-1 なら後ろへ出す（前脚の手首は前、後ろ脚のかかとは後ろへ曲がる）
function camelKnee(hx, hy, fx, fy, bend, upper) {
  const lower = CAMEL_LEG - upper;
  const dx = fx - hx, dy = fy - hy;
  const d = clamp(Math.hypot(dx, dy), 1e-3, CAMEL_LEG);
  const cos = clamp((upper * upper + d * d - lower * lower) / (2 * upper * d), -1, 1);
  const angle = Math.atan2(dy, dx) + bend * Math.acos(cos);
  return [hx + Math.cos(angle) * upper, hy + Math.sin(angle) * upper];
}

// 右を向いたぽっちゃりしたふたこぶラクダのシルエットを、斜面の傾き c.pitch だけ傾けて描く。
// feet は脚ごとの足の位置（傾けた向きでの、胴の中心からの単位）
function drawCamel(c, feet) {
  const g = camelCanvas.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, CAMEL_CANVAS, CAMEL_CANVAS);
  g.setTransform(1, 0, 0, -1, CAMEL_CANVAS / 2, CAMEL_CANVAS / 2);   // 上を +y にする
  g.rotate(c.pitch);
  g.fillStyle = g.strokeStyle = '#fff';
  g.lineCap = g.lineJoin = 'round';
  const line = (width, ...points) => {
    g.lineWidth = width;
    g.beginPath();
    for (let i = 0; i < points.length; i += 2) g.lineTo(points[i], points[i + 1]);
    g.stroke();
  };
  const blob = (x, y, rx, ry, angle = 0) => { g.beginPath(); g.ellipse(x, y, rx, ry, angle, 0, TAU); g.fill(); };
  // 太さが w1 から w2 へ細くなる骨（両端は丸める）
  const limb = (x1, y1, x2, y2, w1, w2) => {
    const a = Math.atan2(y2 - y1, x2 - x1), nx = -Math.sin(a) / 2, ny = Math.cos(a) / 2;
    g.beginPath();
    g.moveTo(x1 + nx * w1, y1 + ny * w1); g.lineTo(x2 + nx * w2, y2 + ny * w2);
    g.lineTo(x2 - nx * w2, y2 - ny * w2); g.lineTo(x1 - nx * w1, y1 - ny * w1);
    g.fill();
    blob(x1, y1, w1 / 2, w1 / 2);
    blob(x2, y2, w2 / 2, w2 / 2);
  };
  // 脚。付け根は筋肉で太く、膝から下は細い。膝と球節にこぶを付け、大きく平たい足の裏を roll だけ傾ける。
  // 肩と腰は、脚につられて少し前後に動く
  CAMEL_LEGS.forEach((leg, i) => {
    const { u, v, roll } = feet[i];
    const hx = leg.x + (u - leg.x) * 0.12, hy = CAMEL_HIP_Y;
    const ax = u, ay = v + CAMEL_PAD;   // 球節（足の裏のすぐ上の関節）
    const [kx, ky] = camelKnee(hx, hy, ax, ay, leg.front ? 1 : -1, leg.upper);
    limb(hx, hy + 6, kx, ky, leg.front ? 12 : 17, 5.6);
    blob(kx, ky, 3.4, 3.4);   // 膝（後ろ脚はかかと）のこぶ
    limb(kx, ky, ax, ay, 4.6, 3.6);
    blob(ax, ay, 2.6, 2.6);
    blob(ax + Math.cos(roll) * 2.2 + Math.sin(roll) * 1.4, ay + Math.sin(roll) * 2.2 - Math.cos(roll) * 1.4, 4.6, 1.9, roll);
  });
  // 胴と 2 つのこぶ
  blob(0, -1, 34, 16);
  blob(-14, 12, 12.5, 12, 0.15);
  blob(10, 12, 12.5, 12, -0.15);
  // 首は前へ低く出してから持ち上げる。左右の脚が着くたびに少し遅れて首を前後に振る
  const nod = Math.sin(c.walk * TAU * 2 - 0.6);
  const headX = 44 + nod * 2, headY = 23 - nod * 1.2;
  g.lineWidth = 12;
  g.beginPath(); g.moveTo(24, 2); g.quadraticCurveTo(40 + nod, 2, headX - 3, headY - 2); g.stroke();
  blob(headX + 5, headY, 11, 7, -0.2);
  line(2.5, headX + 1, headY + 4, headX - 1, headY + 8);   // 耳
  // 尾はゆっくり揺らす
  g.beginPath(); g.moveTo(-31, 2); g.quadraticCurveTo(-37, -4, -36 + Math.sin(c.walk * TAU + 1) * 2, -17); g.stroke();
  camelTexture.needsUpdate = true;
}

// 画面の片側の端寄りに現れ、山を越えながら反対側の端寄りまで歩かせる（C キーでも呼ぶ）。向きはランダム。
// 位置と速さは CSS ピクセル
function startCamel() {
  if (camel || isFading()) return;
  readSurface();
  const center = W * CELL_W_PX / 2;
  const dir = randSign();
  const from = center - dir * (center - W * CELL_W_PX * randIn(CAMEL_EDGE));
  const to = center + dir * (center - W * CELL_W_PX * randIn(CAMEL_EDGE));
  camel = {
    x: from, dir, slope: camelSlope(from, dir), foot: from, ground: smoothGroundPx(from), walk: 0, time: 0,
    to,
    feet: CAMEL_LEGS.map(() => 0),   // 脚ごとの足の高さの補正（単位）
  };
  camelMesh.visible = true;
}

function updateCamel(dt) {
  if (!camel) {
    camelWait -= dt;
    if (camelWait <= 0) {
      camelWait = randomInterval(CAMEL_INTERVAL);
      startCamel();
    }
    return;
  }
  const c = camel, s = CAMEL_UNIT_PX;
  const left = (c.to - c.x) * c.dir;   // 消える位置までの横の距離（CSS ピクセル）
  if (left <= 0) {
    hideCamel();
    return;
  }
  c.time += dt;
  c.walk += dt / CAMEL_STRIDE_SEC;
  // 斜面に沿って一定の速さで歩かせる（横に一定の速さで動かすと、急な坂で速まって見え、足も滑る）。
  // 進みは傾きの上限で止める前の、地面そのものの傾きで決める
  // 傾き c.slope は、降り積もる砂で揺れないようゆっくり追わせ、歩く速さと胴の傾きの両方に使う
  c.slope += (camelSlope(c.x, c.dir) - c.slope) * (1 - Math.exp(-CAMEL_FOLLOW * dt));
  c.pitch = clamp(c.slope, -CAMEL_MAX_PITCH, CAMEL_MAX_PITCH);
  const step = CAMEL_SPEED_PX * Math.cos(c.slope) * dt;
  c.x += c.dir * step;
  const cos = Math.cos(c.pitch), sin = Math.sin(c.pitch);
  // 胴は、足もとの地面から斜面に垂直に一定の高さだけ上げる。足を 1 本ずつ着くたびに、胴が少し上下する。
  // c.x は胴の中心の横の位置。足もとの点から決めると、山頂で傾きが反転するときに胴が回り込んで速まって見える
  const height = (CAMEL_LEG * CAMEL_STAND - CAMEL_HIP_Y + Math.cos(c.walk * TAU * 2) * 0.8) * s;
  // 足もとの点 c.foot の地面の高さ c.ground。足もとが動いた分の高さの差（同じ砂の表面で測る）はそのまま足し、
  // 砂が降り積もって変わった分だけをゆっくり追わせる。まとめてゆっくり追わせると、坂で遅れて浮いたり沈んだりする
  const foot = c.x + c.dir * sin * height, ground = smoothGroundPx(foot);
  c.ground += ground - smoothGroundPx(c.foot);
  c.ground += (ground - c.ground) * (1 - Math.exp(-CAMEL_GROUND_FOLLOW * dt));
  c.foot = foot;
  const cx = c.x, cy = c.ground + cos * height;
  // 足の前後の位置。地面に着いている間は、胴が進むぶん後ろへ下げて地面の上で止める。
  // 浮いている間は、先に足を持ち上げて膝の下へたたみ、それから前へぶらりと振り出して伸ばしながら下ろす。
  // 足の高さは、足の下の地面との差だけ脚を伸び縮みさせて合わせる（脚の長さの範囲に収め、なめらかに追わせる）
  const reach = CAMEL_SPEED_PX * CAMEL_STRIDE_SEC * CAMEL_DUTY / s / 2;   // 胴の下での足の前後の振れ幅（単位）
  const base = CAMEL_HIP_Y - CAMEL_LEG * CAMEL_STAND;                     // 平らな所での足の高さ（単位）
  const ease = 1 - Math.exp(-CAMEL_FOOT_FOLLOW * dt);
  // 足の裏は、着いている間の終わりにかかとから浮かせ、浮いている間は足先を下へ垂らす（roll、負で足先が下）
  const smooth = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
  const feet = CAMEL_LEGS.map((leg, i) => {
    const t = (c.walk + leg.side * 0.5) % 1;
    let u = leg.x, lift = 0, roll;
    if (t < CAMEL_DUTY) {
      u += reach * (1 - 2 * t / CAMEL_DUTY);
      roll = -0.5 * smooth((t / CAMEL_DUTY - 0.8) / 0.2);
    } else {
      // 先に膝を折って足を持ち上げ、振り子のように前へ運び、少し前へ伸ばしてから下ろす
      const w = (t - CAMEL_DUTY) / (1 - CAMEL_DUTY);
      const e = smooth((w - 0.15) / 0.85);
      u += -reach * Math.cos(Math.PI * e) + reach * 0.25 * Math.sin(Math.PI * e) * e;
      lift = Math.sin(Math.PI * Math.pow(w, 0.6)) * CAMEL_STEP;
      roll = -0.5 * (1 - w) - Math.sin(Math.PI * w);
    }
    const x = cx + c.dir * (u * cos - base * sin) * s, y = cy + (u * sin + base * cos) * s;
    const gap = clamp((groundPx(x) - y) * cos / s, -CAMEL_LEG * CAMEL_LEG_STRETCH[0], CAMEL_LEG * CAMEL_LEG_STRETCH[1]);
    c.feet[i] += (gap - c.feet[i]) * ease;
    return { u, v: base + c.feet[i] + lift, roll };
  });
  drawCamel(c, feet);
  camelMaterial.opacity = clamp(Math.min(c.time, left / CAMEL_SPEED_PX) / CAMEL_FADE_SEC, 0, 1);
  camelMesh.position.set(cx, cy, 0);
  camelMesh.scale.set(CAMEL_CANVAS * s * c.dir, CAMEL_CANVAS * s, 1);
}

function hideCamel() {
  camel = null;
  camelMesh.visible = false;
}

// ---- シーン切替 ----
// 砂の色・安息角と液体の色を COLOR_PRESETS の index 番に替える
function setColorPreset(index) {
  colorPresetIndex = (index + COLOR_PRESETS.length) % COLOR_PRESETS.length;
  const s = COLOR_PRESETS[colorPresetIndex];
  s.sand.forEach(([hex, angle], i) => {
    viewPass.uniforms.uSand.value[i].copy(hexToVec3(hex));
    simPass.uniforms.uSticky.value[i] = stickyFraction(angle);
    simPass.uniforms.uFlat.value[i] = flatFraction(angle);
  });
  viewPass.uniforms.uLiquidTop.value.copy(hexToVec3(s.liquid, LIQUID_TOP_GAIN));
  viewPass.uniforms.uLiquidBottom.value.copy(hexToVec3(s.liquid, LIQUID_BOTTOM_GAIN));
  viewPass.uniforms.uFloor.value.copy(hexToVec3(s.liquid, FLOOR_GAIN));
}

// 格子を画面に合わせて空にし、配色を index 番に替え、落とし口を選び直して、新しい絵を始める
function startPicture(index) {
  buildGrid();
  clearGrid();
  setColorPreset(index);
  viewPass.uniforms.uTopSeed.value = rand(0, 1000);
  holes = [];
  pouring = true;
  watchTime = 0;
  updateHoles();
  sandCount = 0;
  surface.fill(0);
  stepCarry = 0;
  checkWait = CHECK_SEC;
  hideCamel();
}

const nextPicture = () => fadeAndRun(() => startPicture(colorPresetIndex + 1));

// ---- 強度 ----
function setHoleCount(value) {
  holeCount = clamp(value, MIN_HOLES, MAX_HOLES);
  updateHoles();   // 描いている途中の絵にもすぐ反映する
}

// ---- メインループ ----
let last = performance.now();
function tick(now) {
  // rAF のタイムスタンプは初期の performance.now() より前のことがあるので負にしない
  const dt = Math.max(0, Math.min((now - last) / 1000, 0.1));
  last = now;
  if (!isFading()) {   // 暗転中は止めておく
    updateSand(dt);
    countSurface();
    updatePicture(dt);
    updateCamel(dt);
  }
  viewPass.uniforms.uGrid.value = targets[current].texture;
  viewPass.uniforms.uSurface.value = surfaceTarget.texture;
  renderer.setRenderTarget(null);
  renderer.render(viewPass.scene, quadCamera);
  if (camel) renderer.render(overlayScene, overlayCamera);
}

// ---- 入力・UI ----
setupControls({
  changeScene: nextPicture,
  intensity: {
    up: () => setHoleCount(holeCount + 1),
    down: () => setHoleCount(holeCount - 1),
    level: () => (holeCount - MIN_HOLES) / (MAX_HOLES - MIN_HOLES),
  },
  keys: {
    KeyC: startCamel,               // 隠しコマンド（操作ガイドには出さない）
  },
  // 描いている途中の絵は格子を作り直さずに引き伸ばして映す（次の絵から画面に合わせる）
  onResize() {
    renderer.setSize(innerWidth, innerHeight);
  },
});

// ---- 開始 ----
startPicture(randInt(COLOR_PRESETS.length));
renderer.setAnimationLoop(tick);
</script>
</body>
</html>
