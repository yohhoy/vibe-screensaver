const srgb = (c) => new THREE.Color().setRGB(...c, THREE.SRGBColorSpace);

// stops を 0..1 に等間隔に並べた色の、t の位置の色を out に入れる
function gradient(stops, t, out, offset) {
  const x = clamp(t, 0, 1) * (stops.length - 1);
  const i = Math.min(Math.floor(x), stops.length - 2);
  const k = x - i;
  for (let c = 0; c < 3; c++) out[offset + c] = stops[i][c] + (stops[i + 1][c] - stops[i][c]) * k;
}

// 半径 r、角度 a の地面の位置 [x, z]
const polar = (r, a) => [Math.cos(a) * r, Math.sin(a) * r];

// 焚き火のまわりは平らで、森の奥ほど起伏がある地面の高さ
function groundHeight(x, z) {
  const k = smoothstep(Math.hypot(x, z), FOREST_INNER, FOREST_INNER * 5);
  const n = Math.sin(x * 0.07) + Math.sin(z * 0.05 + 1.3) + 0.5 * Math.sin((x + z) * 0.13) + 2.5;
  return k * HILL_HEIGHT * n / 5;
}

    varying vec3 vDir;
    void main() {
      vDir = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform vec3 uZenith, uHorizon;
    varying vec3 vDir;
    void main() {
      float h = max(normalize(vDir).y, 0.0);
      gl_FragColor = vec4(mix(uHorizon, uZenith, sqrt(h)), 1.0);
    }`,
};

// 炎・火の粉・煙などの粒。粒ごとに色・不透明度・大きさを持つ、ふちのぼけた円
const ParticleShader = {
  vertexShader: /* glsl */`
    attribute vec4 color;     // rgb と不透明度
    attribute float size;     // 大きさ（ワールドの単位）
    uniform float uScale;     // 距離 1 で大きさ 1 の粒が何画素になるか
    uniform float uMinSize;   // 遠くても小さくしすぎない画素数
    varying vec4 vColor;
    void main() {
      vColor = color;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = max(size * uScale / -mv.z, uMinSize);
    }`,
  fragmentShader: /* glsl */`
    varying vec4 vColor;
    void main() {
      float d = length(gl_PointCoord - 0.5) * 2.0;
      float a = 1.0 - min(d, 1.0);
      gl_FragColor = vec4(vColor.rgb, vColor.a * a * a);
    }`,
};

// ---- テクスチャ ----
// canvas に描くテクスチャ。draw(context, 一辺の画素数) で描く
function canvasTexture(n, draw) {
  const c = document.createElement('canvas');
  c.width = c.height = n;
  draw(c.getContext('2d'), n);
  const texture = new THREE.CanvasTexture(c);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();   // 斜めから見る面がぼやけすぎないように
  return texture;
}

// 繰り返し貼るテクスチャ
function repeatTexture(n, draw) {
  const texture = canvasTexture(n, draw);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  return texture;
}

// ふちのぼけた白い円（星、焚き火の照り返し）
const softDotTexture = canvasTexture(64, (g, n) => {
  const r = n / 2;
  const grad = g.createRadialGradient(r, r, 0, r, r, r);
  [[0, 1], [0.4, 0.35], [1, 0]].forEach(([t, a]) => grad.addColorStop(t, gray(255, a)));
  g.fillStyle = grad;
  g.fillRect(0, 0, n, n);
});

// 草原: 灰色の地に、明るさの違う短い線（草の葉）を散らす。色は material の色と頂点の色で付ける
function grassTexture() {
  return repeatTexture(256, (g, n) => {
    g.fillStyle = gray(190);
    g.fillRect(0, 0, n, n);
    g.lineWidth = 1.5;
    g.lineCap = 'round';
    for (let i = 0; i < GRASS_BLADES; i++) {
      const x = rand(0, n), y = rand(0, n), a = rand(0, TAU), len = rand(4, 12);
      g.strokeStyle = gray(Math.floor(rand(90, 255)));
      // 繰り返し貼っても継ぎ目が出ないよう、端をはみ出す線は反対側にも描く
      for (const dx of [-n, 0, n]) for (const dy of [-n, 0, n]) {
        g.beginPath();
        g.moveTo(x + dx, y + dy);
        g.lineTo(x + dx + Math.cos(a) * len, y + dy + Math.sin(a) * len);
        g.stroke();
      }
    }
  });
}

// 黒っぽい土: ぼけた円をいくつか重ねてふちを不規則にし、灰（白っぽい粒）と炭（黒い粒）を散らす
function soilTexture() {
  const rgb = SOIL_COLOR.map((c) => Math.round(c * 255)).join(',');
  return canvasTexture(256, (g, n) => {
    const r = n / 2;
    const blob = (x, y, radius, alpha) => {
      const grad = g.createRadialGradient(x, y, 0, x, y, radius);
      grad.addColorStop(0, `rgba(${rgb},${alpha})`);
      grad.addColorStop(0.5, `rgba(${rgb},${alpha * 0.8})`);
      grad.addColorStop(1, `rgba(${rgb},0)`);
      g.fillStyle = grad;
      g.fillRect(0, 0, n, n);
    };
    blob(r, r, r * 0.8, 1);
    for (let i = 0; i < 12; i++) {
      const [x, y] = polar(r * rand(0.3, 0.5), rand(0, TAU));
      blob(r + x, r + y, r * rand(0.25, 0.45), 0.8);
    }
    for (let i = 0; i < 1500; i++) {
      const d = r * 0.65 * Math.sqrt(Math.random());
      const [x, y] = polar(d, rand(0, TAU));
      const ash = Math.random() < 0.5 - d / r * 0.6;   // 中心ほど灰が多い
      g.fillStyle = gray(Math.floor(ash ? rand(90, 140) : rand(0, 20)), rand(0.3, 0.8));
      g.fillRect(r + x, r + y, rand(1, 2.5), rand(1, 2.5));
    }
  });
}

// 薪の樹皮: 灰色の地に、長さ方向（テクスチャの縦）の筋と、焦げた黒いしみを描く。色は material の色で付ける
function barkTexture() {
  return repeatTexture(128, (g, n) => {
    g.fillStyle = gray(160);
    g.fillRect(0, 0, n, n);
    for (let i = 0; i < 160; i++) {
      const x = rand(0, n), y = rand(0, n), w = rand(1, 3.5), h = rand(15, 70);
      g.fillStyle = gray(Math.floor(rand(60, 230)));
      for (const dy of [-n, 0]) g.fillRect(x, y + dy, w, h);   // 縦につなげて貼っても継ぎ目が出ないように
    }
    for (let i = 0; i < 5; i++) {
      g.fillStyle = gray(15, rand(0.4, 0.7));
      g.beginPath();
      g.ellipse(rand(0, n), rand(0, n), rand(6, 16), rand(12, 30), 0, 0, TAU);
      g.fill();
    }
  });
}

// 石: 灰色の地に、明暗のまだらと細かい粒を散らす。色は material の色で付ける
function stoneTexture() {
  return canvasTexture(128, (g, n) => {
    g.fillStyle = gray(170);
    g.fillRect(0, 0, n, n);
    for (let i = 0; i < 12; i++) {
      const x = rand(0, n), y = rand(0, n), r = rand(10, 30), v = Math.floor(rand(90, 230));
      const grad = g.createRadialGradient(x, y, 0, x, y, r);
      grad.addColorStop(0, gray(v, 0.6));
      grad.addColorStop(1, gray(v, 0));
      g.fillStyle = grad;
      g.fillRect(0, 0, n, n);
    }
    for (let i = 0; i < 1200; i++) {
      g.fillStyle = gray(Math.floor(rand(50, 255)), rand(0.3, 0.7));
      g.fillRect(rand(0, n), rand(0, n), rand(1, 2.5), rand(1, 2.5));
    }
  });
}

let starColors;   // 星の色（またたかせるとき、もとの色から計算する）
const twinklers = [];   // またたく星 { i, phase, freq }
{
  const positions = new Float32Array(STAR_COUNT * 3);
  const colors = new Float32Array(STAR_COUNT * 3);
  const dir = new THREE.Vector3();
  for (let i = 0; i < STAR_COUNT; i++) {
    const el = Math.asin(rand(0.05, 1));     // 空に一様に散らす
    const az = rand(0, TAU);
    dir.set(Math.cos(az) * Math.cos(el), Math.sin(el), Math.sin(az) * Math.cos(el));
    dir.multiplyScalar(SKY_RADIUS * 0.9).toArray(positions, i * 3);
    const b = STAR_BRIGHTNESS[0] + Math.pow(Math.random(), 3) * (STAR_BRIGHTNESS[1] - STAR_BRIGHTNESS[0]);   // 暗い星を多く
    colors.set([b, b, b * rand(0.9, 1.1)], i * 3);
    if (Math.random() < STAR_TWINKLE.share) twinklers.push({ i, phase: rand(0, TAU), freq: randIn(STAR_TWINKLE.freq) });
  }
  const geometry = new THREE.BufferGeometry()
    .setAttribute('position', new THREE.BufferAttribute(positions, 3))
    .setAttribute('color', new THREE.BufferAttribute(colors, 3));
  starColors = { array: colors, base: colors.slice(), geometry };
  sky.add(new THREE.Points(geometry, new THREE.PointsMaterial({
    size: STAR_SIZE * renderer.getPixelRatio(), sizeAttenuation: false, vertexColors: true, fog: false,
    map: softDotTexture,   // 四角い点だとブルームで四角くにじむので、丸くぼかす
    transparent: true, depthWrite: false,
  })));
}

function updateStars() {
  const { array, base, geometry } = starColors;
  for (const t of twinklers) {
    const k = 1 - STAR_TWINKLE.depth * (0.5 + 0.5 * Math.sin(t.phase + time * t.freq));
    for (let c = 0; c < 3; c++) array[t.i * 3 + c] = base[t.i * 3 + c] * k;
  }
  geometry.attributes.color.needsUpdate = true;
}

// ---- 森と草むら ----
// 木と草むらは影を落とさない（炎から見て後ろに落ちるのでほとんど見えず、点光源の影は重い）

// 大きさ 1 の geometry を count 個、place() が返す位置 [x, z]・大きさ [x, y, z]・明るさで地面に置く
function scatter(geometry, material, count, place) {
  const mesh = new THREE.InstancedMesh(geometry, material, count);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion();
  const p = new THREE.Vector3(), s = new THREE.Vector3(), tint = new THREE.Color();
  for (let i = 0; i < count; i++) {
    const { at: [x, z], sink = 0, scale, brightness } = place();
    p.set(x, groundHeight(x, z) - sink, z);
    q.setFromAxisAngle(THREE.Object3D.DEFAULT_UP, rand(0, TAU));
    mesh.setMatrixAt(i, m.compose(p, q, s.set(...scale)));
    mesh.setColorAt(i, tint.setScalar(brightness));
  }
  scene.add(mesh);
}

// 針葉樹。幹と 3 段の円錐を 1 つにまとめ、頂点の色で塗り分ける。高さは 1
function treeGeometry() {
  const paint = (geometry, color) => {
    const c = srgb(color);
    const colors = new Float32Array(geometry.attributes.position.count * 3);
    for (let i = 0; i < colors.length; i += 3) c.toArray(colors, i);
    return geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  };
  const parts = [paint(new THREE.CylinderGeometry(0.03, 0.05, 0.3, 6).translate(0, 0.15, 0), TRUNK_COLOR)];
  for (let i = 0; i < 3; i++) {
    const r = 0.3 - i * 0.075, h = 0.42 - i * 0.06;
    parts.push(paint(new THREE.ConeGeometry(r, h, 7).translate(0, 0.2 + i * 0.2 + h / 2, 0), TREE_COLOR));
  }
  return mergeGeometries(parts);
}

scatter(treeGeometry(),
  new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.9 }),
  TREE_COUNT, () => {
    const r = FOREST_INNER + (FOREST_OUTER - FOREST_INNER) * Math.pow(Math.random(), 1.5);
    const h = randIn(TREE_HEIGHT) * (1 + r / FOREST_OUTER * 0.5);   // 奥ほど大きく、稜線を作る
    return {
      at: polar(r, rand(0, TAU)), sink: 0.1,
      scale: [h * rand(0.8, 1.1), h, h * rand(0.8, 1.1)], brightness: rand(0.75, 1.15),
    };
  });

// 草むら。細い三角形の葉を根もとから外へ傾けて束ねる。葉の長さは 1 前後
function bushGeometry() {
  const positions = [], colors = [];
  const base = srgb(BUSH_COLOR).toArray(), tip = srgb(BUSH_TIP_COLOR).toArray();
  for (let i = 0; i < BUSH_BLADES; i++) {
    const a = rand(0, TAU);
    const lean = rand(0.1, 0.6), len = rand(0.3, 0.7);  // 外への傾き / 長さ
    const w = rand(0.04, 0.07) / 2;                     // 根もとの幅の半分
    const [bx, bz] = polar(rand(0, 0.18), a);           // 根もとの位置
    const [tx, tz] = polar(Math.sin(lean) * len, a);    // 根もとから葉先まで（水平方向）
    const [px, pz] = polar(w, a + Math.PI / 2);         // 葉の幅の向き（傾ける向きと直角）
    positions.push(bx - px, 0, bz - pz, bx + px, 0, bz + pz, bx + tx, Math.cos(lean) * len, bz + tz);
    colors.push(...base, ...base, ...tip);
  }
  const geometry = new THREE.BufferGeometry()
    .setAttribute('position', new THREE.Float32BufferAttribute(positions, 3))
    .setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geometry.computeVertexNormals();
  return geometry;
}

scatter(bushGeometry(),
  new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 1 }),
  BUSH_COUNT, () => {
    const k = randIn(BUSH_SIZE);
    return {
      at: polar(randIn(BUSH_RING), rand(0, TAU)),
      scale: [k * rand(0.8, 1.3), k, k * rand(0.8, 1.3)], brightness: rand(0.75, 1.2),
    };
  });

// ---- 焚き火の石と薪 ----
// 石。分割した正二十面体の頂点を、石ごとに違うゆるい起伏で凸凹させ、底を平らにする。半径は 1 前後
const STONE_BOTTOM = -0.55;       // 平らにした底の高さ

function stoneGeometry() {
  const geometry = new THREE.IcosahedronGeometry(1, STONE_DETAIL);
  // 起伏は向きだけで決まる関数にする（同じ位置にある頂点は同じだけ動き、面が割れない）
  const waves = Array.from({ length: 3 }, () => ({
    dir: new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).normalize(),
    freq: rand(1.5, 3.5), phase: rand(0, TAU),
  }));
  const pos = geometry.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    let k = 1;
    for (const w of waves) k += STONE_ROUGHNESS / waves.length * Math.sin(v.dot(w.dir) * w.freq + w.phase);
    v.multiplyScalar(k);
    v.y = Math.max(v.y, STONE_BOTTOM);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  // 法線は、位置が同じ頂点の面法線を平均した滑らかなものと、もとの面法線（フラット）を STONE_SMOOTH で混ぜる
  geometry.computeVertexNormals();
  const normal = geometry.attributes.normal;
  const flat = normal.array.slice();
  const key = (i) => `${pos.getX(i).toFixed(4)},${pos.getY(i).toFixed(4)},${pos.getZ(i).toFixed(4)}`;
  const sums = new Map();
  for (let i = 0; i < pos.count; i++) {
    const sum = sums.get(key(i)) ?? [0, 0, 0];
    for (let c = 0; c < 3; c++) sum[c] += flat[i * 3 + c];
    sums.set(key(i), sum);
  }
  for (let i = 0; i < pos.count; i++) {
    const [sx, sy, sz] = sums.get(key(i));
    const len = Math.hypot(sx, sy, sz) || 1;
    v.set(
      sx / len * STONE_SMOOTH + flat[i * 3] * (1 - STONE_SMOOTH),
      sy / len * STONE_SMOOTH + flat[i * 3 + 1] * (1 - STONE_SMOOTH),
      sz / len * STONE_SMOOTH + flat[i * 3 + 2] * (1 - STONE_SMOOTH)).normalize();
    normal.setXYZ(i, v.x, v.y, v.z);
  }
  return geometry;
}
{
  const stoneMap = stoneTexture();
  const material = new THREE.MeshStandardMaterial({
    color: srgb(STONE_COLOR), roughness: 0.95,
    map: stoneMap, bumpMap: stoneMap, bumpScale: TEXTURE_BUMP, vertexColors: true,
  });
  // 石ごとに形が違うが、描画命令（影は 6 方向）を減らすため、1 つのメッシュに結合する。石ごとの明るさは頂点色で付ける
  const geometries = [];
  const placer = new THREE.Object3D();
  for (let i = 0; i < STONE_COUNT; i++) {
    const [x, z] = polar(STONE_RING + rand(-0.04, 0.04), (i + rand(-0.2, 0.2)) / STONE_COUNT * TAU);
    const geometry = stoneGeometry();
    const shade = rand(0.7, 1.1);
    geometry.setAttribute('color', new THREE.BufferAttribute(
      new Float32Array(geometry.attributes.position.count * 3).fill(shade), 3));
    const size = STONE_SIZE * rand(0.85, 1.2);
    placer.scale.set(size * rand(0.9, 1.3), size * rand(0.6, 0.85), size * rand(0.8, 1.1));
    placer.position.set(x, -STONE_BOTTOM * placer.scale.y - 0.01, z);   // 底を地面に少し埋める
    placer.rotation.set(rand(-0.15, 0.15), rand(0, TAU), rand(-0.15, 0.15));
    placer.updateMatrix();
    geometries.push(geometry.applyMatrix4(placer.matrix));
  }
  const stones = new THREE.Mesh(mergeGeometries(geometries), material);
  stones.castShadow = true;
  scene.add(stones);
}

// 薪。円すい形に組んだ 5 本と、下に渡した 2 本
const logGlows = [];   // [材質, 発光の倍率]。発光の強さを明かりに合わせて変える
{
  const barkMap = barkTexture();
  // 光り方は、樹皮の模様に長さ方向の明暗（canvas の上 = 薪の先端側）をかけたもの
  const glowMap = (stops) => {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const g = c.getContext('2d');
    g.drawImage(barkMap.image, 0, 0);
    g.globalCompositeOperation = 'multiply';
    const grad = g.createLinearGradient(0, 0, 0, 128);
    stops.forEach(([t, v]) => grad.addColorStop(t, gray(v)));
    g.fillStyle = grad;
    g.fillRect(0, 0, 128, 128);
    const texture = new THREE.CanvasTexture(c);
    texture.colorSpace = THREE.SRGBColorSpace;
    return texture;
  };
  const logMaterial = (glow, boost) => {
    const m = new THREE.MeshStandardMaterial({
      color: srgb(LOG_COLOR), roughness: 0.9, map: barkMap, bumpMap: barkMap, bumpScale: TEXTURE_BUMP,
      emissive: srgb(LOG_EMISSIVE), emissiveMap: glow, emissiveIntensity: 0,
    });
    logGlows.push([m, boost]);
    return m;
  };
  // 斜めの薪は炎の中に入る先端ほど強く、下に渡した薪は炎の真下の中ほどが、薪自体が燃えているように強く光る
  const tipMaterial = logMaterial(glowMap([[0, 255], [0.5, 110], [1, 30]]), 1);
  const midMaterial = logMaterial(glowMap([[0, 20], [0.5, 255], [1, 20]]), LOG_BURN);
  const addLog = (from, to, radius) => {
    const material = from.y === to.y ? midMaterial : tipMaterial;
    const dir = new THREE.Vector3().subVectors(to, from);
    const log = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, dir.length(), 8), material);
    log.position.addVectors(from, to).multiplyScalar(0.5);
    log.quaternion.setFromUnitVectors(THREE.Object3D.DEFAULT_UP, dir.normalize());
    scene.add(log);
  };
  for (const angle of LEAN_LOG_ANGLES) {
    const a = (angle + rand(-LEAN_LOG_JITTER, LEAN_LOG_JITTER)) / 360 * TAU;
    const [bx, bz] = polar(0.48, a), [tx, tz] = polar(0.06, a + 0.4);
    addLog(new THREE.Vector3(bx, 0.02, bz), new THREE.Vector3(tx, 0.62, tz), rand(0.05, 0.07));
  }
  for (const { from, to, radius } of BASE_LOGS) addLog(new THREE.Vector3(...from), new THREE.Vector3(...to), radius);
}

// 薪の火に照らされた地面
const glowDisc = new THREE.Mesh(
  new THREE.PlaneGeometry(1.8, 1.8).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({
    map: softDotTexture, color: 0xff5010, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, fog: false,
  }));
glowDisc.position.y = 0.015;

// ---- 粒 ----
// 距離 1 で大きさ 1 の粒の画素数。画面の高さで変わる（リサイズで更新）
const particleScale = { value: 1 };
function updateParticleScale() {
  particleScale.value = innerHeight * renderer.getPixelRatio() / (2 * Math.tan(THREE.MathUtils.degToRad(CAM_FOV) / 2));
}
updateParticleScale();

// max 個までの粒を入れる器。粒は list に持ち、毎フレーム write で書き込んで flush で描く
function createParticles(max, { blending = THREE.AdditiveBlending, minSize = 0, order = 0 } = {}) {
  const position = new Float32Array(max * 3);
  const color = new Float32Array(max * 4);
  const size = new Float32Array(max);
  const geometry = new THREE.BufferGeometry()
    .setAttribute('position', new THREE.BufferAttribute(position, 3).setUsage(THREE.DynamicDrawUsage))
    .setAttribute('color', new THREE.BufferAttribute(color, 4).setUsage(THREE.DynamicDrawUsage))
    .setAttribute('size', new THREE.BufferAttribute(size, 1).setUsage(THREE.DynamicDrawUsage));
  geometry.setDrawRange(0, 0);
  const points = new THREE.Points(geometry, new THREE.ShaderMaterial({
    ...ParticleShader,
    uniforms: { uScale: particleScale, uMinSize: { value: minSize * renderer.getPixelRatio() } },
    blending, transparent: true, depthWrite: false,
  }));
  points.frustumCulled = false;   // 毎フレーム位置が変わるので画面外の判定はしない
  points.renderOrder = order;
  scene.add(points);
  return { max, position, color, size, geometry, list: [], carry: 0 };
}

function addParticle(sys, p) {
  if (sys.list.length < sys.max) sys.list.push(p);
}

// 寿命の尽きた粒を取り除く
function removeDead(sys) {
  let n = 0;
  for (const p of sys.list) if (p.age < p.life) sys.list[n++] = p;
  sys.list.length = n;
}

// k 番目の粒の位置・不透明度・大きさを書き込む（色の rgb は呼び出し側で書く）
function writeParticle(sys, k, x, y, z, alpha, size) {
  sys.position[k * 3] = x;
  sys.position[k * 3 + 1] = y;
  sys.position[k * 3 + 2] = z;
  sys.color[k * 4 + 3] = alpha;
  sys.size[k] = size;
}

// 書き込んだ n 個を描く
function flushParticles(sys, n) {
  sys.geometry.setDrawRange(0, n);
  for (const name of ['position', 'color', 'size']) sys.geometry.attributes[name].needsUpdate = true;
}

const smoke = createParticles(MAX_SMOKE, { blending: THREE.NormalBlending, order: 1 });
const flames = createParticles(MAX_FLAMES, { order: 2 });
const embers = createParticles(MAX_EMBERS, { minSize: 1.5, order: 3 });
const fireworks = createParticles(MAX_FIREWORKS, { minSize: 1.5, order: 4 });

// ---- 炎 ----
// 炎の舌。根もとの位置が薪の範囲をゆっくりさまよい、そこから出た粒は同じ位相で揺れる。
// 火の強さに応じて先頭から使う数を変えるので、何本使っても散らばるよう黄金角ずつずらして並べる
const tongues = Array.from({ length: Math.ceil(FLAME_TONGUES * Math.pow(MAX_FIRE, FIRE_TONGUE_EXP)) }, (_, i) => ({
  angle: i * GOLDEN_ANGLE, speed: rand(-0.6, 0.6), radius: 0, seed: rand(0, TAU),
}));

function updateTongues(dt) {
  for (const g of tongues) {
    g.angle += g.speed * dt;
    g.radius = FLAME_BASE_RADIUS * fireScale.width * (0.35 + 0.3 * Math.sin(time * 0.7 + g.seed));
  }
}

// 下に渡した薪の上面から出る低い炎。背は低く、ゆっくり上る（薪の山の下の方が燃えて見えるように）
function spawnLowFlame() {
  const f = fireScale;
  const { from, to, radius } = BASE_LOGS[randInt(BASE_LOGS.length)];
  const t = 0.5 + rand(-0.5, 0.5) * LOW_FLAME_SPAN;
  return {
    x: from[0] + (to[0] - from[0]) * t, y: from[1] + radius * rand(0.5, 1.2), z: from[2] + (to[2] - from[2]) * t,
    vy: FLAME_RISE * f.speed * rand(0.3, 0.5),
    age: 0, life: randIn(FLAME_LIFE) * f.speed * 0.7,
    size: FLAME_SIZE * rand(0.5, 0.8) * f.size,
    opacity: f.opacity,
    seed: rand(0, TAU),
  };
}

function spawnFlame() {
  if (rand(0, 1) < LOW_FLAME_SHARE) return spawnLowFlame();
  const f = fireScale;
  const g = tongues[randInt(f.tongues)];
  const [x, z] = polar(g.radius, g.angle);
  return {
    x: x + rand(-1, 1) * TONGUE_SPREAD, y: rand(0.1, 0.25), z: z + rand(-1, 1) * TONGUE_SPREAD,
    vy: FLAME_RISE * f.speed * rand(0.7, 1.15),
    age: 0, life: randIn(FLAME_LIFE) * f.speed,
    size: FLAME_SIZE * rand(0.6, 1.1) * f.size,
    opacity: f.opacity,
    seed: g.seed,
  };
}

function updateFlames(dt) {
  updateTongues(dt);
  emit(flames, FLAME_RATE * fire, dt, spawnFlame);

  // 寿命が長いほど弱くして、強くしても炎の先の細り方の比率を変えない
  const pull = Math.exp(-FLAME_PULL / fireScale.speed * dt);
  for (const p of flames.list) {
    p.age += dt;
    p.vy += FLAME_BUOYANCY * dt;
    p.y += p.vy * dt;
    p.x *= pull;
    p.z *= pull;
  }
  removeDead(flames);
  flames.list.forEach((p, k) => {
    const t = p.age / p.life;
    // 高いところほど大きく揺らぐ。高さで位相をずらして、炎の舌がうねるように
    const sway = FLAME_SWAY * p.y;
    // うねりの位相は背の高さで割る（割らないと、強いほど波の数が増えて、らせん状の竜巻に見える）
    const wy = p.y / fireScale.height;
    const lean = FLAME_LEAN * p.y * p.y;
    writeParticle(flames, k,
      p.x + lean * SMOKE_WIND[0] + sway * (Math.sin(time * 2.7 + wy * 2.5) + 0.6 * Math.sin(time * 6.1 + wy * 5 + p.seed)),
      p.y,
      p.z + lean * SMOKE_WIND[1] + sway * (Math.sin(time * 2.1 + wy * 3.1 + 1) + 0.6 * Math.sin(time * 5.3 + wy * 4 + p.seed)),
      p.opacity * smoothstep(t, 0, 0.25) * (1 - smoothstep(t, 0.6, 1)),
      p.size * (1 - 0.5 * t));
    gradient(FLAME_COLORS, t, flames.color, k * 4);
  });
  flushParticles(flames, flames.list.length);
}

// ---- 火の粉 ----
// 普段の火の粉（spark: false）は、熱いうちは押し上げられてふらふら上る。
// はぜて飛び散る火の粉（spark: true）は、重力で放物線を描き、すぐ燃え尽きる
function spawnEmber() {
  const [x, z] = polar(rand(0, 0.3), rand(0, TAU));
  return {
    x, y: rand(0.3, 0.8), z,
    vx: rand(-0.3, 0.3), vy: randIn(EMBER_RISE) * Math.sqrt(fire), vz: rand(-0.3, 0.3),
    age: 0, life: randIn(EMBER_LIFE), size: EMBER_SIZE * rand(0.6, 1.3),
    phase: rand(0, TAU), freq: rand(8, 20), spark: false,
  };
}

// 点 o から、真上を lean だけ傾けた向きのまわりに飛び散る火の粉
function spawnSpark(o, lean) {
  const float = Math.random() < SPARK_FLOAT_CHANCE;
  const az = rand(0, TAU), el = Math.PI / 2 - rand(0, SPARK_SPREAD);
  const v = randIn(SPARK_SPEED) * (float ? 0.4 : 1);
  const dir = new THREE.Vector3(Math.cos(az) * Math.cos(el), Math.sin(el), Math.sin(az) * Math.cos(el))
    .add(lean).normalize().multiplyScalar(v);
  return {
    x: o.x, y: o.y, z: o.z, vx: dir.x, vy: dir.y, vz: dir.z,
    age: 0, life: float ? randIn(EMBER_LIFE) : randIn(SPARK_LIFE),
    size: EMBER_SIZE * rand(0.5, 1.1),
    phase: rand(0, TAU), freq: rand(8, 20), spark: !float,
  };
}

function updateEmbers(dt) {
  emit(embers, EMBER_RATE * fire, dt, spawnEmber);

  const drag = Math.exp(-EMBER_DRAG * dt);
  const sparkDrag = Math.exp(-SPARK_DRAG * dt);
  for (const p of embers.list) {
    p.age += dt;
    if (p.spark) {
      p.vx *= sparkDrag;
      p.vz *= sparkDrag;
      p.vy = (p.vy - SPARK_GRAVITY * dt) * sparkDrag;
    } else {
      const t = p.age / p.life;
      p.vx = (p.vx + rand(-1, 1) * EMBER_TURBULENCE * dt) * drag;
      p.vz = (p.vz + rand(-1, 1) * EMBER_TURBULENCE * dt) * drag;
      p.vy = (p.vy + (EMBER_LIFT * (1 - t) - 0.3) * dt) * drag;   // 冷めると押し上げが弱まる
    }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.z += p.vz * dt;
    if (p.y < 0) p.age = p.life;   // 地面に落ちたら消える
  }
  removeDead(embers);
  embers.list.forEach((p, k) => {
    const t = p.age / p.life;
    const twinkle = 0.7 + 0.3 * Math.sin(p.phase + p.age * p.freq);
    writeParticle(embers, k, p.x, p.y, p.z, twinkle * Math.min(1, (1 - t) * 4), p.size);
    gradient(EMBER_COLORS, t, embers.color, k * 4);
  });
  flushParticles(embers, embers.list.length);
}

// ---- 煙 ----
const smokeColor = srgb(SMOKE_COLOR).toArray();
const smokeLit = srgb(SMOKE_LIT).toArray();

function updateSmoke(dt) {
  emit(smoke, SMOKE_RATE * fire, dt, () => ({
    x: rand(-0.15, 0.15) * fireScale.width, y: SMOKE_START * fireScale.height, z: rand(-0.15, 0.15) * fireScale.width,
    age: 0, life: SMOKE_LIFE * rand(0.8, 1.2), seed: rand(0, TAU),
    tone: randIn(SMOKE_VARIATION.tone), scale: randIn(SMOKE_VARIATION.size),
  }));
  for (const p of smoke.list) {
    p.age += dt;
    p.x += (SMOKE_WIND[0] + 0.08 * Math.sin(time * 0.4 + p.seed)) * dt;
    p.y += SMOKE_RISE * dt;
    p.z += SMOKE_WIND[1] * dt;
  }
  removeDead(smoke);
  smoke.list.forEach((p, k) => {
    const t = p.age / p.life;
    writeParticle(smoke, k, p.x, p.y, p.z,
      SMOKE_OPACITY * p.tone * Math.sin(Math.PI * t),
      (SMOKE_SIZE[0] + (SMOKE_SIZE[1] - SMOKE_SIZE[0]) * t) * p.scale * fireScale.width);
    const lit = Math.max(0, 1 - t * 3) * lightLevel;   // 根もとほど炎の色に照らされる
    for (let c = 0; c < 3; c++) smoke.color[k * 4 + c] = smokeColor[c] + smokeLit[c] * lit;
  });
  flushParticles(smoke, smoke.list.length);
}

// ---- 明かり ----
function updateLight(dt) {
  // ランダムな目標へなめらかに近づく揺らぎと、ゆっくりした波を重ねる
  if ((flicker.timer -= dt) <= 0) {
    flicker.target = rand(1 - FLICKER, 1 + FLICKER);
    flicker.timer = rand(0.05, 0.18);
  }
  flicker.value += (flicker.target - flicker.value) * (1 - Math.exp(-dt * 18));
  const wave = 1 + 0.06 * Math.sin(time * 7.3) + 0.04 * Math.sin(time * 12.9 + 1.7);
  flare *= Math.exp(-dt / CRACKLE_FLARE_TIME);
  lightLevel = fireScale.light * flicker.value * wave + flare * CRACKLE_FLARE;
  fireLight.intensity = FIRE_LIGHT_INTENSITY * lightLevel;
  // 光源も少し動かして、影を揺らす。高さは炎の背に合わせる
  fireLight.position.set(
    0.06 * Math.sin(time * 3.1),
    FIRE_LIGHT_HEIGHT * (0.6 + 0.4 * fireScale.height) + 0.05 * Math.sin(time * 5.3),
    0.06 * Math.sin(time * 2.3 + 1));
  baseLight.intensity = BASE_LIGHT_INTENSITY * lightLevel;
  // 下に渡した薪は、ゆっくり脈打つ（ほかの揺らぎより遅く、燃え続ける熱に見せる）
  const burn = 1 + 0.15 * Math.sin(time * 1.3);
  for (const [m, boost] of logGlows) m.emissiveIntensity = Math.min(lightLevel, 1.5) * (boost > 1 ? boost * burn : 1);
  glowDisc.material.opacity = Math.min(1, 0.6 * lightLevel);
}

// ---- 薪がはぜる ----
function crackle() {
  // 弾ける場所は、組んだ薪の下の方のどこか 1 点
  const [x, z] = polar(rand(0, 0.25), rand(0, TAU));
  const o = new THREE.Vector3(x, rand(0.15, 0.5), z);
  const [lx, lz] = polar(SPARK_LEAN, rand(0, TAU));
  const lean = new THREE.Vector3(lx, 0, lz);
  for (let i = 0; i < CRACKLE_SPARKS; i++) addParticle(embers, spawnSpark(o, lean));
  flare = 1;
}

function updateCrackle(dt) {
  if ((crackleWait -= dt) > 0) return;
  crackle();
  crackleWait = randomInterval(CRACKLE_INTERVAL);
}

// ---- リスと花火（隠し要素） ----
// リスは canvas に描いたシルエットの板で、カメラの方を向ける（焚き火のまわりを回るカメラに合わせて向きを変える）。
// 画面の横から現れて焚き火へ走り、石の外で立ち上がってどんぐりを投げ、花火に驚いて逃げる。毎フレーム描き直す（脚が動くため）
// 絵を描く canvas とそれを貼った板（SQUIRREL.size 四方）を作る。最初は非表示
function createSprite(order, extraMaterial = {}) {
  const canvas = Object.assign(document.createElement('canvas'), { width: 256, height: 256 });
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(SQUIRREL.size, SQUIRREL.size),
    new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthWrite: false, side: THREE.DoubleSide, fog: false, ...extraMaterial }),   // 霧の影響は受けない
  );
  mesh.visible = false;
  mesh.renderOrder = order;
  scene.add(mesh);
  return { canvas, texture, mesh };
}
const { canvas: squirrelCanvas, texture: squirrelTexture, mesh: squirrelMesh } = createSprite(2);
// シルエットのまわりのほのかな光。シルエットを少しにじませた絵を、加算合成で後ろ（renderOrder が 1 つ小さい）に敷く。
// ctx.filter は Safari で効かないので、輪郭の外へ向けてずらした複数の重ね描きでにじませる
const { canvas: glowCanvas, texture: glowTexture, mesh: glowMesh } = createSprite(1, { blending: THREE.AdditiveBlending });
// 光の絵を描く。シルエットを、12 方向 × 3 段階（半径の 1・2・3 倍）にずらして、薄く（透明度 0.14）重ねる
function drawGlow() {
  const g = glowCanvas.getContext('2d'), n = glowCanvas.width;
  g.clearRect(0, 0, n, n);
  g.globalAlpha = 0.14;
  for (const k of [1, 2, 3]) {
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * TAU;
      g.drawImage(squirrelCanvas, Math.cos(a) * k * SQUIRREL.glowRadius * n, Math.sin(a) * k * SQUIRREL.glowRadius * n);
    }
  }
  g.globalAlpha = 1;
}
const acornMesh = new THREE.Mesh(
  new THREE.SphereGeometry(ACORN.size, 8, 6).scale(1, 1.3, 1),
  new THREE.MeshBasicMaterial({ fog: false }),   // 色はリスのシルエットと同じにする（updateSquirrel で毎フレーム合わせる）。霧の影響は受けない
);
acornMesh.visible = false;
scene.add(acornMesh);

let squirrel = null;       // いるリス { phase: 'run' | 'throw' | 'flee', t（その段階の経過秒）, dist（焚き火からの距離）, dir（焚き火から見たリスの向き）, start（現れた距離）, thrown（どんぐりを投げたか）, startle（花火が開いてから逃げ出すまでの残り秒。開くまでは無い） }。いなければ null
let squirrelWait = randomInterval(SQUIRREL.interval);   // 次に現れるまでの秒数
let acorn = null;          // 飛んでいるどんぐり { t, from（飛び始める点）, to（落ちる点） }。なければ null
let rocket = null;         // 上がっている花火 { t, x, z }。なければ null（上がり始める前は rocketDelay が数える）
let rocketDelay = 0;       // どんぐりが落ちてから花火が上がるまでの残り秒数（0 のときは待っていない）

// リスの姿を板に描く（顔は右向き。足もとは板の高さの 0.9）。pose: 'run' なら走る、'sit' なら立ち上がる。
// ph は走る脚の位相、armU は投げる腕の進み (0..1)、armBack は投げたあと手が最初の位置へ戻る進み (0..1)、
// look は頭を上へ傾ける進み (0..1。花火を見上げるとき)。どんぐりは描かない（投げる瞬間に別のメッシュが手から飛ぶ）
function drawSquirrel(pose, ph, armU, armBack = 0, look = 0) {
  const ctx = squirrelCanvas.getContext('2d');
  const s = squirrelCanvas.width;
  ctx.clearRect(0, 0, s, s);
  ctx.fillStyle = '#fff';
  const oval = (x, y, rx, ry, rot = 0) => {
    ctx.beginPath();
    ctx.ellipse(x * s, y * s, rx * s, ry * s, rot, 0, TAU);
    ctx.fill();
  };
  // 楕円 [x, y, rx, ry] をいくつか重ねた 1 つの形（和集合）
  const union = (list) => {
    ctx.beginPath();
    for (const [x, y, rx, ry] of list) {
      ctx.moveTo((x + rx) * s, y * s);
      ctx.ellipse(x * s, y * s, rx * s, ry * s, 0, 0, TAU);
    }
    ctx.fill();
  };
  // 卵型。中心 (cx, cy)、長さ方向の半径 a、幅方向の半径 b、細い側が向く角度 rot (rad。0 で右、正で時計回り)、細さ k (0..1)
  const egg = (cx, cy, a, b, rot, k) => {
    ctx.beginPath();
    for (let i = 0; i <= 48; i++) {
      const t = i / 48 * TAU, u = Math.cos(t), v = Math.sin(t) * (1 - k * u);   // 細い側 (u=1) ほど幅が狭い
      const x = u * a, y = v * b;
      const px = cx + x * Math.cos(rot) - y * Math.sin(rot), py = cy + x * Math.sin(rot) + y * Math.cos(rot);
      if (i === 0) ctx.moveTo(px * s, py * s); else ctx.lineTo(px * s, py * s);
    }
    ctx.closePath();
    ctx.fill();
  };
  // 尾。体側の縁はほぼ真っすぐ、外側は先で大きく膨らみ、その下でくびれて付け根へ細くなる（炎のような形）。
  // 支点 (0.4, 0.86) を (bx, by) に置き、傾き rot (rad、負で後ろへ倒れる)・大きさ k にして描く
  const tail = (bx, by, rot, k) => {
    ctx.save();
    ctx.translate(bx * s, by * s);
    ctx.rotate(rot);
    ctx.scale(k, k);
    ctx.translate(-0.4 * s, -0.86 * s);
    ctx.beginPath();
    ctx.moveTo(0.385 * s, 0.86 * s);   // アンカー点 A（支点 (0.4, 0.86) の左。F に近づけて、根もとを細くする。立ち絵では脚の丸の内側に隠れる）
    ctx.bezierCurveTo(0.566 * s, 0.787 * s, 0.463 * s, 0.559 * s, 0.446 * s, 0.431 * s);   // A→B 体側の縁。B（楕円の右端）のハンドルは縦に近い向きで、滑らかにつなぐ
    // 先の膨らみの上半分は、B→C→D の 2 本の曲線（縦にわずかにつぶれた楕円に近い形）
    ctx.bezierCurveTo(0.432 * s, 0.330 * s, 0.378 * s, 0.237 * s, 0.241 * s, 0.245 * s);   // B→C 右上
    ctx.bezierCurveTo(0.144 * s, 0.250 * s, 0.077 * s, 0.327 * s, 0.084 * s, 0.437 * s);   // C→D 左上
    ctx.bezierCurveTo(0.088 * s, 0.509 * s, 0.152 * s, 0.547 * s, 0.208 * s, 0.570 * s);   // D→E くびれへ。E は先の膨らみのすぐ下の角（上下のハンドルのなす角は約 115 度の鈍角）
    ctx.bezierCurveTo(0.211 * s, 0.632 * s, 0.214 * s, 0.721 * s, 0.345 * s, 0.847 * s);   // E→F 下側の縁
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  };
  // 輪郭は、座って尾を立てたリスのイラスト風（卵型の大きな頭、頭の上の丸い耳、先で丸く膨らんでくびれのある尾）。走る姿も同じパーツを使う
  if (pose === 'run') {
    const bob = -0.03 * Math.abs(Math.sin(ph));   // 跳ねて体が上下する
    const sw = 0.05 * Math.sin(ph + 1);   // 尾の揺れ（rad）
    // 立ち絵と同じ大きさ・同じ相対位置のパーツを、足もと (0.5, 0.9) を基準に縮めて描く（板に収めるため）。
    // 体は立ち絵と同じ楕円を、長い方向が横になるよう回す
    ctx.save();
    ctx.translate(0.5 * s, 0.9 * s);
    ctx.scale(SQUIRREL.runScale, SQUIRREL.runScale);
    ctx.translate(-0.5 * s, -0.9 * s);
    const bx = 0.58, by = 0.66 + bob;                                      // 体の中心
    const hx = bx + 0.3, hy = by - 0.07;                                   // 頭の中心（体の前上）
    tail(bx - 0.11, by + 0.06, -0.55 + sw, 1);
    oval(bx, by, 0.17, 0.205, Math.PI / 2 + 0.12);                         // 体（立ち絵と同じ大きさ）
    egg(hx, hy, 0.183, 0.145, 0.24, 0.18);                                 // 頭（立ち絵と同じ）
    oval(hx - 0.127, hy - 0.163, 0.076, 0.076);                            // 耳（立ち絵と同じ頭との相対位置）
    // 足は、付け根から足先へ向けて傾けた楕円（短くてよい）。付け根は、体の楕円の下側の輪郭より少し内側（輪郭の高さから 0.04 上）に置く。体の外に出ると、足が浮いて見える
    for (const [dx, off] of [[-0.13, Math.PI], [-0.05, Math.PI + 0.5], [0.1, 0], [0.18, 0.5]]) {
      const lx = bx + dx, ly = by + 0.17 * Math.sqrt(1 - (dx / 0.205) ** 2) - 0.04;
      const a = 0.9 * Math.sin(ph + off);
      const x = lx + 0.14 * Math.sin(a), y = Math.min(ly + 0.14 * Math.cos(a), 0.93);
      oval((lx + x) / 2, (ly + y) / 2, Math.hypot(x - lx, y - ly) / 2 + 0.025, 0.05, Math.atan2(y - ly, x - lx));
    }
    ctx.restore();
    return;
  }
  ctx.save();
  ctx.translate(0.5 * s, 0.9 * s);
  ctx.scale(SQUIRREL.sitScale, SQUIRREL.sitScale);
  ctx.translate(-0.5 * s, -0.9 * s);
  tail(0.4, 0.86, 0, 1);                                                   // 座った姿
  oval(0.57, 0.685, 0.17, 0.205, 0.12);                                       // 体
  union([[0.454, 0.797, 0.104, 0.093], [0.696, 0.850, 0.065, 0.058], [0.587, 0.885, 0.164, 0.023]]);   // 脚（腰・前足の丸・足もとの和集合）
  // 頭と耳は、首の付け根 (0.62, 0.58) を支点に、見上げるとき上へ（反時計回りに）傾ける。耳は頭と同じだけ動く
  ctx.save();
  ctx.translate(0.62 * s, 0.58 * s);
  ctx.rotate(-look * SQUIRREL.lookAngle);
  ctx.translate(-0.62 * s, -0.58 * s);
  egg(0.708, 0.489, 0.183, 0.145, 0.24, 0.18);                                  // 頭（卵型。細い側が右下の鼻先）
  oval(0.581, 0.326, 0.076, 0.076);                                            // 耳
  ctx.restore();
  // 腕: 胸の前でどんぐりを持つ → 後ろへ振り上げる → 前へ投げ出す
  const hold = [0.791, 0.704], wind = [0.86, 0.42], throwTo = [0.96, 0.54];
  const lerp = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
  const hand = armBack > 0 ? lerp(throwTo, hold, smoothstep(armBack, 0, 1))
    : armU < 0.6 ? lerp(hold, wind, smoothstep(armU, 0, 0.6)) : lerp(wind, throwTo, smoothstep(armU, 0.6, 1));
  // 手は体につながった 1 つの楕円。肩 (0.616, 0.646) から手の先へ伸ばす（持っているときは 4 時方向に傾く）
  const shoulder = [0.616, 0.646];
  const dx = hand[0] - shoulder[0], dy = hand[1] - shoulder[1];
  oval((shoulder[0] + hand[0]) / 2, (shoulder[1] + hand[1]) / 2, Math.hypot(dx, dy) / 2 + 0.03, 0.057, Math.atan2(dy, dx));
  ctx.restore();
}

// カメラの右向き（水平面での単位ベクトル [x, z]）。画面の左右を、ワールドの向きで決めるのに使う
const cameraRight = () => [camera.position.z / CAM_DIST, -camera.position.x / CAM_DIST];

// リスと光の板の表示を切り替える
function showSquirrel(visible) {
  squirrelMesh.visible = glowMesh.visible = visible;
}

// 焚き火から見たリスの向き dir に立つ点のワールド座標
const squirrelPos = (r) => new THREE.Vector3(squirrel.dir.x * r, 0, squirrel.dir.z * r);

function startSquirrel() {
  if (squirrel) return;
  squirrelWait = randomInterval(SQUIRREL.interval);
  // 画面の左右どちらかの外から現れる。横長・縦長の画面に合わせ、画面の端より少し外から
  const side = randSign();
  const [rightX, rightZ] = cameraRight();
  const edge = CAM_DIST * Math.tan(THREE.MathUtils.degToRad(CAM_FOV) / 2) * camera.aspect;
  const start = clamp(edge + SQUIRREL.size, 3, 12);
  squirrel = { phase: 'run', t: 0, dist: start, start, dir: new THREE.Vector3(rightX * side, 0, rightZ * side) };
  showSquirrel(true);
}

// 花火を上げる（どんぐりが落ちた少しあと）
function launchRocket() {
  rocket = { t: 0, x: 0, z: 0 };
}

// 花火が開いたら、少し（SQUIRREL.startleTime 秒）見上げたあと、リスは驚いて逃げ出す（それまでは、座って花火を見上げている）
function scareSquirrel() {
  if (squirrel) squirrel.startle = SQUIRREL.startleTime;
}

function updateSquirrel(dt) {
  if (!squirrel) {
    if ((squirrelWait -= dt) <= 0) startSquirrel();
  }
  if (rocketDelay > 0 && (rocketDelay -= dt) <= 0) {
    rocketDelay = 0;
    launchRocket();
  }

  // 飛んでいるどんぐり
  if (acorn) {
    acorn.t += dt;
    const u = Math.min(acorn.t / ACORN.time, 1);
    acornMesh.position.set(
      acorn.from.x + (acorn.to.x - acorn.from.x) * u,
      acorn.from.y + (acorn.to.y - acorn.from.y) * u + 4 * ACORN.arc * u * (1 - u),
      acorn.from.z + (acorn.to.z - acorn.from.z) * u);
    acornMesh.rotation.z = acorn.t * 14;
    if (u >= 1) {   // 炎に落ちる。火の粉が飛んで、一瞬明るくなる
      const o = acorn.to;
      acorn = null;
      acornMesh.visible = false;
      for (let i = 0; i < ACORN.sparks; i++) addParticle(embers, spawnSpark(o, new THREE.Vector3()));
      flare = Math.max(flare, ACORN.flare);
      rocketDelay = ROCKET.delay;
    }
  }

  if (!squirrel) return;
  const q = squirrel;
  q.t += dt;
  let pose = 'run', armU = 0, armBack = 0, look = 0, toward = -1;   // toward: 焚き火へ向かうとき -1、離れるとき 1（顔の向きを決める）
  if (q.phase === 'run') {
    q.dist = Math.max(SQUIRREL.stopDist, q.dist - SQUIRREL.runSpeed * dt);
    if (q.dist <= SQUIRREL.stopDist) { q.phase = 'throw'; q.t = 0; }
  }
  if (q.phase === 'throw') {
    pose = 'sit';
    armU = clamp((q.t - SQUIRREL.holdTime) / SQUIRREL.throwTime, 0, 1);
    armBack = clamp((q.t - SQUIRREL.holdTime - SQUIRREL.throwTime) / SQUIRREL.returnTime, 0, 1);   // 投げ終えたあと、手を元の位置へ戻す
    if (rocket) {   // 花火の昇る高さ（updateFireworks と同じ式）に合わせて、頭を上げていく
      const u = Math.min(rocket.t / ROCKET.time, 1);
      look = 1 - (1 - u) * (1 - u);
    } else if (q.startle !== undefined) {   // 花火が開いたあと、逃げ出すまでは上を向いたまま
      look = 1;
      if ((q.startle -= dt) <= 0) { q.phase = 'flee'; q.t = 0; }
    }
    if (armU >= 1 && !acorn && !q.thrown) {   // 腕を振り切ったところで手を離れる
      q.thrown = true;
      const hand = squirrelPos(q.dist).addScaledVector(q.dir, -ACORN.reach);
      hand.y = SQUIRREL.size * 0.5;
      acorn = { t: 0, from: hand, to: squirrelPos(ACORN.land).setY(ACORN.height) };
      acornMesh.visible = true;
    }
  } else if (q.phase === 'flee') {
    toward = 1;
    q.dist += SQUIRREL.fleeSpeed * dt;
    if (q.dist > q.start + SQUIRREL.size) {
      squirrel = null;
      showSquirrel(false);
      return;
    }
  }
  drawSquirrel(pose, q.t * SQUIRREL.stride, armU, armBack, look);
  squirrelTexture.needsUpdate = true;
  drawGlow();
  glowTexture.needsUpdate = true;

  // カメラの方を向け、顔は進む向きに（画面の左右で決める）
  const p = squirrelPos(q.dist);
  const [rightX, rightZ] = cameraRight();
  const face = Math.sign((q.dir.x * rightX + q.dir.z * rightZ) * toward) || 1;
  squirrelMesh.position.set(p.x, SQUIRREL.size * 0.4, p.z);   // 足もと（板の高さの 0.9）が地面に着く高さ
  squirrelMesh.rotation.y = Math.atan2(camera.position.x - p.x, camera.position.z - p.z);
  squirrelMesh.scale.x = face;
  glowMesh.position.copy(squirrelMesh.position);
  glowMesh.rotation.copy(squirrelMesh.rotation);
  glowMesh.scale.copy(squirrelMesh.scale);
  // 色は周囲の光（炎の近さ・明滅）と霧に左右されない一定の色。どんぐりもシルエットなので、同じ色にする
  squirrelMesh.material.color.setRGB(...SQUIRREL.color, THREE.SRGBColorSpace);
  glowMesh.material.color.setRGB(...SQUIRREL.glowColor, THREE.SRGBColorSpace);
  acornMesh.material.color.copy(squirrelMesh.material.color);
}

// 花火の粒（尾・星・閃光）。vx・vy・vz と抵抗 drag・重力 gravity で動き、色 color は消えるにつれて暗くなる
function addFirework(x, y, z, v, life, size, color, drag, gravity) {
  addParticle(fireworks, {
    x, y, z, vx: v[0], vy: v[1], vz: v[2], age: 0, life, size, color, drag, gravity,
    phase: rand(0, TAU), freq: rand(10, 24),
  });
}

function burst() {
  const main = pick(BURST.colors);
  const sub = pick(BURST.colors.filter((c) => c !== main));
  for (let i = 0; i < BURST.stars; i++) {
    // 球面に一様に散らす
    const cz = rand(-1, 1), a = rand(0, TAU), r = Math.sqrt(1 - cz * cz);
    const v = BURST.speed * rand(0.85, 1);
    addFirework(0, BURST.y, 0, [r * Math.cos(a) * v, cz * v, r * Math.sin(a) * v],
      randIn(BURST.life), BURST.size * rand(0.8, 1.2), rand(0, 1) < BURST.twoTone ? sub : main, BURST.drag, BURST.gravity);
  }
  addFirework(0, BURST.y, 0, [0, 0, 0], 0.25, 0.9, [0.8, 0.7, 0.6], 0, 0);   // 開いた瞬間の閃光
  burstLight.color.setRGB(...main.map((c) => Math.min(c, 1)));
  burstLight.intensity = BURST.light;
}

function updateFireworks(dt) {
  if (rocket) {
    rocket.t += dt;
    const u = Math.min(rocket.t / ROCKET.time, 1);
    rocket.x = 0.02 * Math.sin(rocket.t * 17);   // 上るにつれてわずかに揺れる
    rocket.y = ROCKET.from + (BURST.y - ROCKET.from) * (1 - (1 - u) * (1 - u));
    emit(fireworks, TRAIL.rate, dt, () => ({
      x: rocket.x + rand(-0.02, 0.02), y: rocket.y, z: rocket.z + rand(-0.02, 0.02),
      vx: rand(-0.1, 0.1), vy: rand(-0.4, -0.1), vz: rand(-0.1, 0.1),
      age: 0, life: TRAIL.life * rand(0.6, 1), size: ROCKET.size * 0.5, color: TRAIL.color,
      drag: 1, gravity: 0, phase: 0, freq: 0,
    }));
    if (u >= 1) {
      burst();
      scareSquirrel();
      rocket = null;
    }
  }
  for (const p of fireworks.list) {
    p.age += dt;
    const drag = Math.exp(-p.drag * dt);
    p.vx *= drag;
    p.vz *= drag;
    p.vy = (p.vy - p.gravity * dt) * drag;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.z += p.vz * dt;
  }
  removeDead(fireworks);
  let n = 0;
  for (const p of fireworks.list) {
    const t = p.age / p.life;
    const twinkle = p.freq ? 0.75 + 0.25 * Math.sin(p.phase + p.age * p.freq) : 1;
    writeParticle(fireworks, n, p.x, p.y, p.z, twinkle * Math.min(1, (1 - t) * 3), p.size);
    for (let c = 0; c < 3; c++) fireworks.color[n * 4 + c] = p.color[c] * (1.1 - 0.8 * t);
    n++;
  }
  if (rocket) {   // 上っている先頭
    writeParticle(fireworks, n, rocket.x, rocket.y, rocket.z, 1, ROCKET.size);
    for (let c = 0; c < 3; c++) fireworks.color[n * 4 + c] = ROCKET.color[c];
    n++;
  }
  flushParticles(fireworks, n);
  burstLight.intensity *= Math.exp(-dt / BURST.lightTime);
}

// ---- カメラ ----
function updateCamera() {
  const a = time * TAU / ORBIT_PERIOD;
  camera.position.set(Math.sin(a) * CAM_DIST, CAM_HEIGHT + 0.08 * Math.sin(time * 0.3), Math.cos(a) * CAM_DIST);
  camera.lookAt(0, CAM_TARGET_Y, 0);
  sky.position.copy(camera.position);
}

// ---- 強度 ----
// 炎の大きさは、主に背の高さと舌の数で出し（粒の大きさはわずかに変えるだけ）、明るさの密度は保つ
function setFire(value) {
  fire = clamp(value, MIN_FIRE, MAX_FIRE);
  const f = fireScale;
  f.height = Math.pow(fire, FIRE_HEIGHT_EXP);
  f.width = Math.pow(fire, FIRE_WIDTH_EXP);
  f.speed = Math.sqrt(f.height);   // 背の高さは、上る速さと寿命に半分ずつ配る
  f.size = Math.pow(fire, FIRE_SIZE_EXP);
  f.tongues = clamp(Math.round(FLAME_TONGUES * Math.pow(fire, FIRE_TONGUE_EXP)), 2, tongues.length);
  // 粒の数は強さに比例し、寿命は speed 倍、炎の見かけの面積は height 倍（根もとが広がるぶんは、白く飛ばさないよう半分だけ戻す）。
  // 重なりの明るさが強さ 1 のときとほぼ同じになるよう、1 粒の不透明度を下げる
  f.opacity = Math.min(FLAME_OPACITY * f.speed * Math.sqrt(f.width) / (fire * f.size * f.size), 0.8);
  f.light = Math.pow(fire, FIRE_LIGHT_EXP);
}

// ---- メインループ ----
function step(dt) {
  time += dt;
  updateLight(dt);
  updateFlames(dt);
  updateEmbers(dt);
  updateSmoke(dt);
  updateStars();
  updateCrackle(dt);
  updateCamera();
  updateSquirrel(dt);
  updateFireworks(dt);
}

let last = performance.now();
function tick(now) {
  // rAF のタイムスタンプは初期の performance.now() より前のことがあるので負にしない
  const dt = Math.max(0, Math.min((now - last) / 1000, 0.1));
  last = now;
  step(dt);
  composer.render();
}

// ---- 入力・UI ----
// 暗転・全画面・カーソルを隠す処理・画面を消さない処理・キーとスワイプ・強度のゲージは common.js
setupControls({
  // シーン切替（Space・左右スワイプ）。焚き火は場面が 1 つだけなので無い
  changeScene: null,
  // 隠し要素のリスを呼び出す（操作ガイドには表示しない）
  keys: { KeyC: startSquirrel },
  // 強度（↑↓・上下スワイプ）。強める・弱める処理と、ゲージの位置
  intensity: {
    up: () => setFire(fire * FIRE_STEP),
    down: () => setFire(fire / FIRE_STEP),
    level: () => logPosition(fire, MIN_FIRE, MAX_FIRE),   // ゲージの位置（0..1）
  },
  onResize() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    composer.setSize(innerWidth, innerHeight);
    updateParticleScale();
  },
});

// ---- 開始 ----
setFire(BASE_FIRE);
// 起動直後から燃えている状態にするため、少し先まで進めておく
for (let i = 0; i < 90; i++) step(1 / 30);
renderer.setAnimationLoop(tick);
</script>
