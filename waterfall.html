// 岩。球をランダムな平面で切り落として、角ばった形にする。半径は 1 前後
function boulderGeometry() {
  const geometry = new THREE.IcosahedronGeometry(1, 2);
  const pos = geometry.attributes.position;
  const v = new THREE.Vector3();
  const cuts = Array.from({ length: 14 }, () => ({
    n: new THREE.Vector3(rand(-1, 1), rand(-0.4, 1), rand(-1, 1)).normalize(), d: rand(0.55, 0.92),
  }));
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    for (const { n, d } of cuts) {
      const over = v.dot(n) - d;
      if (over > 0) v.addScaledVector(n, -over);
    }
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  // 上を向いた面には苔
  geometry.computeVertexNormals();
  const normal = geometry.attributes.normal;
  const rock = linear(BOULDER_COLOR), moss = linear(MOSS_COLOR);
  const colors = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    const m = smoothstep(normal.getY(i), 0.55, 0.85) * smoothstep(fbm(pos.getX(i) * 2 + 4, pos.getZ(i) * 2 + 4), 0.35, 0.55);
    for (let c = 0; c < 3; c++) colors[i * 3 + c] = mix(rock[c], moss[c], m);
  }
  return geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
}

// 大きさ 1 の geometry を count 個、place(i) が返す { x, y, z, scale: [x, y, z], brightness } に置く。向きは Y 軸まわりにランダム
function scatter(geometry, material, count, place) {
  const mesh = new THREE.InstancedMesh(geometry, material, count);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion();
  const p = new THREE.Vector3(), s = new THREE.Vector3(), tint = new THREE.Color();
  for (let i = 0; i < count; i++) {
    const { x, y, z, scale, brightness } = place(i);
    q.setFromAxisAngle(THREE.Object3D.DEFAULT_UP, rand(0, TAU));
    mesh.setMatrixAt(i, m.compose(p.set(x, y, z), q, s.set(...scale)));
    mesh.setColorAt(i, tint.setRGB(brightness * rand(0.88, 1.14), brightness, brightness * rand(0.85, 1.05)));   // 色みも少しずつ変える
  }
  mesh.frustumCulled = false;
  scene.add(mesh);
  return mesh;
}

// 画面に入る位置か（画面の外に木や草木は置かない）
const inView = (x, z) => Math.abs(x) < 12 + VIEW_SLOPE * (CAM_POS[2] - z);

const triple = (v) => [v, v, v];

const NO_UV = triple([0, 0]);     // テクスチャを使わない三角形の座標

// 葉の板や枝を三角形で積む器。法線は面の向きではなく、葉のかたまりの外向きにして、ふんわりした陰影にする
function triangleSoup() {
  const position = [], normal = [], color = [], uv = [];
  const ab = new THREE.Vector3(), ac = new THREE.Vector3(), n = new THREE.Vector3();
  return {
    // 頂点 corners（[x, y, z] 3 つ）、外向き out（単位ベクトルでなくてよい）、頂点の色 colors（線形の [r, g, b] 3 つ）、
    // テクスチャの座標 uvs（[u, v] 3 つ。テクスチャを使わないものは省略する）、
    // 頂点ごとの法線 normals（[x, y, z] 3 つ。省略すると out）
    add(corners, out, colors, uvs = NO_UV, normals = triple(out)) {
      const [a, b, c] = corners;
      n.fromArray(out).normalize();
      ab.set(b[0] - a[0], b[1] - a[1], b[2] - a[2]);
      ac.set(c[0] - a[0], c[1] - a[1], c[2] - a[2]);
      // 表が外を向くように頂点の順を決める（裏から見た面は法線が反転して暗くなるため）
      for (const i of ab.cross(ac).dot(n) < 0 ? [0, 2, 1] : [0, 1, 2]) {
        position.push(...corners[i]);
        n.fromArray(normals[i]).normalize();
        normal.push(n.x, n.y, n.z);
        color.push(...colors[i]);
        uv.push(...uvs[i]);
      }
    },
    geometry() {
      return new THREE.BufferGeometry()
        .setAttribute('position', new THREE.Float32BufferAttribute(position, 3))
        .setAttribute('normal', new THREE.Float32BufferAttribute(normal, 3))
        .setAttribute('color', new THREE.Float32BufferAttribute(color, 3))
        .setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    },
  };
}

// 幹や枝、倒木。from から to へ、太さ r0 から r1 へ変わる sides 角の筒を積む（ふたは付けない）
function addLimb(soup, from, to, r0, r1, sides, color = TRUNK_COLOR) {
  const colors = triple(linear(color));
  const axis = new THREE.Vector3(to[0] - from[0], to[1] - from[1], to[2] - from[2]).normalize();
  const helper = Math.abs(axis.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
  const u = new THREE.Vector3().crossVectors(axis, helper).normalize();
  const v = new THREE.Vector3().crossVectors(axis, u);
  const dir = (i) => {   // i 番目の角の向き（筒の軸に垂直）。0.5 刻みで面の向きにも使う
    const a = i / sides * TAU;
    return u.clone().multiplyScalar(Math.cos(a)).addScaledVector(v, Math.sin(a)).toArray();
  };
  const at = (p, d, r) => p.map((x, k) => x + d[k] * r);
  for (let i = 0; i < sides; i++) {
    const d0 = dir(i), d1 = dir(i + 1), out = dir(i + 0.5);
    // 法線は角ごとの向きにして、なめらかに丸く見せる（面ごとにすると、倒木が角材に見える）
    soup.add([at(from, d0, r0), at(from, d1, r0), at(to, d1, r1)], out, colors, NO_UV, [d0, d1, d1]);
    soup.add([at(from, d0, r0), at(to, d1, r1), at(to, d0, r1)], out, colors, NO_UV, [d0, d1, d0]);
  }
}

// 葉の板を 1 枚（三角形 2 枚）積む。向きは外向き out からランダムに傾ける。法線は out のままにして、板ごとの陰影の差を出さない
function addCard(soup, p, halfSize, out, color) {
  const facing = new THREE.Vector3(out[0] + rand(-0.9, 0.9), out[1] + rand(-0.9, 0.9), out[2] + rand(-0.9, 0.9)).normalize();
  const u = new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).cross(facing).normalize().multiplyScalar(halfSize);
  const v = new THREE.Vector3().crossVectors(facing, u);
  const corner = (a, b) => [p[0] + u.x * a + v.x * b, p[1] + u.y * a + v.y * b, p[2] + u.z * a + v.z * b];
  const colors = triple(color);
  soup.add([corner(-1, -1), corner(1, -1), corner(1, 1)], out, colors, [[0, 0], [1, 0], [1, 1]]);
  soup.add([corner(-1, -1), corner(1, 1), corner(-1, 1)], out, colors, [[0, 0], [1, 1], [0, 1]]);
}

// いくつかのふくらみ lobes（[x, y, z, 半径] の配列）に葉の板を散らす。
// 法線はかたまりの中心 center からの向きにする。ふくらみごとに陰影を付けると、玉の集まりに見えるため
function addFoliage(soup, lobes, center, cards, halfSize) {
  const dark = linear(BROADLEAF_COLORS[0]), light = linear(BROADLEAF_COLORS[1]);
  const d = new THREE.Vector3();
  // 大きなふくらみほど板を多くする（どのふくらみも同じ枚数だと、小さなふくらみが玉に見える）
  const weighted = lobes.flatMap((lobe) => Array(Math.ceil(lobe[3] * lobe[3] * 400)).fill(lobe));
  for (let i = 0; i < cards; i++) {
    const [lx, ly, lz, r] = pick(weighted);
    d.set(rand(-1, 1), rand(-1, 1), rand(-1, 1)).normalize();
    const k = 0.35 + 0.75 * Math.sqrt(Math.random());   // 表面の近くに多く置く
    const p = [lx + d.x * r * k, ly + d.y * r * k, lz + d.z * r * k];
    // 法線は上へ寄せる。下の葉が光をまったく受けないと、黒い塊が浮いて見える
    const out = new THREE.Vector3(p[0] - center[0], p[1] - center[1] + 0.2, p[2] - center[2]).normalize().toArray();
    // 上の葉ほど明るく、内側の葉ほど暗い（内側の暗い板が、向こうの透けを減らす）
    const inner = smoothstep(k, 0.45, 0.85);
    const lit = (0.25 + 0.65 * smoothstep(p[1], center[1] - 0.25, center[1] + 0.25)) * rand(0.88, 1.12) * mix(0.65, 1, inner);
    addCard(soup, p, halfSize * rand(0.8, 1.25), out, dark.map((v, ch) => mix(v, light[ch], lit)));
  }
}

// テクスチャを使わないもの（崖の上の木の幹、シダ、倒木）の材質
const plainMaterial = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
// 葉の板は表（外向き）だけ描く。裏も描くと、法線が反転して真っ黒な塊に見える
const leafMaterial = new THREE.MeshLambertMaterial({ vertexColors: true, map: leafTexture, alphaTest: LEAF_ALPHA_TEST });
const foliageMaterials = [plainMaterial, leafMaterial];   // 景色の foliage を掛ける材質
const rimTreeMaterials = [];   // 崖の上の木の板の材質。RIM_TREE_BRIGHTNESS も掛ける
const rimTreeShapes = [];      // 崖の上の木の輪郭 { x, z, halfW（見える幅の半分）, top（てっぺんの高さ） }。龍の昇り始める位置を、木の無い所から選ぶのに使う

// 崖の上の木。滝口の真上は川なので、広めに奥まで空ける（隠し要素の龍の昇り始めも見やすくなる）。奥ほど背を高くして稜線を作る
function rimTree() {
  for (;;) {
    const x = rand(-CLIFF_HALF, CLIFF_HALF);
    const d = 2 + (RIM_TREE_DEPTH - 2) * Math.random() ** 1.3;
    const z = wallZ(x, rimY(x)) - d;
    if ((Math.abs(x) < FALL_MAX_HALF * 0.8 && d < 30) || !inView(x, z)) continue;
    const h = randIn(RIM_TREE_HEIGHT) * (1 + d / RIM_TREE_DEPTH * 0.7);
    return {
      x, y: plateauY(x, d) - 0.3, z, d,
      scale: [h * rand(0.85, 1.2), h, h * rand(0.85, 1.2)], brightness: rand(0.7, 1.25),
    };
  }
}

// カメラに向けて立てた板を積む。遠い木を 1 枚の絵で描くのに使う。
// 中心 (x, y, z)、大きさの半分 halfW / halfH、手前へ出す量 forward、下と上の頂点の色 low / high、テクスチャの区画の数 cols × rows
function addFacingCard(soup, x, y, z, halfW, halfH, forward, low, high, cols, rows) {
  const front = new THREE.Vector3(CAM_POS[0] - x, 0, CAM_POS[2] - z).normalize();
  const out = front.toArray();
  // 板の隅 (a, b)。a は横、b は縦に -1..1
  const corner = (a, b) => [x + front.x * forward + front.z * halfW * a, y + halfH * b, z + front.z * forward - front.x * halfW * a];
  // 法線を隅ごとに外へ開いて、1 枚の板でも丸みのある陰影にする
  const normal = (a, b) => [front.x + front.z * a * 0.8, 0.35 + b * 0.6, front.z - front.x * a * 0.8];
  // 区画を選び、半分は左右を反転して、同じ形が並んで見えないようにする
  const col = randInt(cols), row = randInt(rows), flip = Math.random() < 0.5;
  const u0 = (col + (flip ? 1 : 0)) / cols, u1 = (col + (flip ? 0 : 1)) / cols;
  const v0 = row / rows, v1 = (row + 1) / rows;
  soup.add([corner(-1, -1), corner(1, -1), corner(1, 1)], out, [low, low, high],
    [[u0, v0], [u1, v0], [u1, v1]], [normal(-1, -1), normal(1, -1), normal(1, 1)]);
  soup.add([corner(-1, -1), corner(1, 1), corner(-1, 1)], out, [low, high, high],
    [[u0, v0], [u1, v1], [u0, v1]], [normal(-1, -1), normal(1, 1), normal(-1, 1)]);
}

// 崖の上の木。遠くて葉や枝の 1 本ずつは見えないので、木を丸ごと描いた板を 1 本につき 1 枚立てる。
// 葉の板を重ねると離れた板が円盤のように浮いて見え、枝の三角形を積むと枝の間が透けて枯れ木に見えるため
function plantRimTrees() {
  const crowns = triangleSoup(), conifers = triangleSoup(), trunks = triangleSoup();
  const tinter = (colors, brightness) => {
    const dark = linear(colors[0]), light = linear(colors[1]);
    return (t) => dark.map((v, k) => mix(v, light[k], t) * brightness);
  };
  const coniferCount = Math.round(RIM_TREE_COUNT * CONIFER_SHARE);
  for (let i = 0; i < RIM_TREE_COUNT; i++) {
    const { x, y, z, d, scale: [width, height], brightness } = rimTree();
    // 滝口の真上の広めの範囲の木は、捨てる入れ物に描いて取り除く（乱数の引き方を変えず、ほかの木や草木の配置を変えない）
    const cleared = Math.abs(x) < RIM_CLEARING[0] && d < RIM_CLEARING[1] ? triangleSoup() : null;
    // 見える幅は板より狭い（針葉樹は先が細く、樹冠の絵は板のふちに余白がある）
    if (!cleared) rimTreeShapes.push({ x, z, halfW: width * (i < coniferCount ? RIM_CONIFER_WIDTH * 0.3 : CROWN_SIZE * 0.42), top: y + height });
    if (i < coniferCount) {
      const tint = tinter(CONIFER_COLORS, brightness);
      const halfW = width * RIM_CONIFER_WIDTH / 2, halfH = height / 2;
      addFacingCard(cleared ?? conifers, x, y + halfH, z, halfW, halfH, 0, tint(0.5), tint(1), 4, 2);
    } else {
      const tint = tinter(BROADLEAF_COLORS, brightness);
      const halfW = width * CROWN_SIZE / 2, halfH = height * CROWN_SIZE / 2;
      addLimb(cleared ?? trunks, [x, y, z], [x, y + height * 0.55, z], height * 0.04, height * 0.015, 3);
      // 板を幹より手前に出す。幹が葉の上に透けて見えないように
      addFacingCard(cleared ?? crowns, x, y + height - halfH, z, halfW, halfH, height * 0.05, tint(0.25), tint(0.65), 2, 2);
    }
  }
  const cardMaterial = (map) => {
    const material = new THREE.MeshLambertMaterial({ vertexColors: true, map, alphaTest: LEAF_ALPHA_TEST });
    rimTreeMaterials.push(material);
    return material;
  };
  for (const mesh of [
    new THREE.Mesh(crowns.geometry(), cardMaterial(crownTexture)),
    new THREE.Mesh(conifers.geometry(), cardMaterial(coniferCardTexture)),
    new THREE.Mesh(trunks.geometry(), plainMaterial),
  ]) {
    mesh.layers.set(MAIN_ONLY_LAYER);   // 崖の上の木は、水面に映る範囲にほとんど入らない
    scene.add(mesh);
  }
}
plantRimTrees();

// シダ。根もとから放射状に葉を出す。葉は軸の左右に細い小葉を並べ、弧を描いて垂れる。テクスチャは使わず三角形で描く。半径 1
function fernGeometry() {
  const soup = triangleSoup();
  const dark = linear(FERN_COLORS[0]), light = linear(FERN_COLORS[1]);
  for (let f = 0; f < FERN_FRONDS; f++) {
    const a = (f + rand(-0.3, 0.3)) / FERN_FRONDS * TAU, dx = Math.cos(a), dz = Math.sin(a);
    const reach = rand(0.75, 1), rise = rand(0.3, 0.5);
    const shade = rand(0.8, 1.15);
    // 葉の軸の位置。t は 0（根もと）〜 1（先）
    const spine = (t) => [dx * reach * t, rise * Math.sin(t * Math.PI * 0.85), dz * reach * t];
    for (let i = 0; i < FERN_LEAFLETS; i++) {
      const t0 = i / FERN_LEAFLETS, t1 = (i + 1) / FERN_LEAFLETS;
      const p0 = spine(t0), p1 = spine(t1);
      const width = 0.17 * reach * Math.sin(Math.PI * Math.min(1, t0 * 0.8 + 0.15));   // 中ほどがいちばん幅広い
      const color = dark.map((v, k) => mix(v, light[k], t1) * shade);
      for (const side of [-1, 1]) {
        const tip = [(p0[0] + p1[0]) / 2 - dz * width * side, (p0[1] + p1[1]) / 2 - width * 0.25, (p0[2] + p1[2]) / 2 + dx * width * side];
        soup.add([p0, p1, tip], [dx, 0.7, dz], triple(color));
      }
    }
  }
  return soup.geometry();
}

// 低木。幹の無い、地面に低く広がる葉のかたまり。高さ 1
function shrubGeometry() {
  const soup = triangleSoup();
  const center = [0, 0.3, 0];
  const lobes = [[0, 0.35, 0, 0.42], ...Array.from({ length: 5 }, (_, i) => {
    const a = i * GOLDEN_RATIO * TAU, d = rand(0.25, 0.5);
    return [Math.cos(a) * d, rand(0.15, 0.4), Math.sin(a) * d, rand(0.18, 0.3)];
  })];
  addFoliage(soup, lobes, center, SHRUB_CARDS, LEAF_CARD_SIZE * 2.4);
  return soup.geometry();
}

// 崖の足もとの低い草木の位置。i 番目までを画面の端に置く。内側は斜面の上にまとまって生やし、岩と水を見せる。
// 画面の端は木の代わりに崖を縁取るので、隙間なく、高い所まで生やす
function bankPlant(i, count) {
  const edge = i < count * EDGE_PLANT_SHARE;
  for (;;) {
    const x = randSign() * (edge ? EDGE_PLANT_X + 30 * Math.random() ** 1.5 : rand(18, EDGE_PLANT_X));
    const y = rand(0.25, edge ? TALUS_HEIGHT - 3 : TALUS_HEIGHT - 4);
    const z = wallZ(x, y) + 0.3;
    if ((!edge && fbm(x * 0.09 + 60, y * 0.25) < 0.42) || !inView(x, z)) continue;
    return { x, y: y - 0.1, z, grow: edge ? EDGE_PLANT_SCALE : 1 };
  }
}

// シダは細かいので映り込みには描かない
scatter(fernGeometry(), plainMaterial, FERN_COUNT, (i) => {
  const { x, y, z, grow } = bankPlant(i, FERN_COUNT);
  const s = randIn(FERN_SIZE) * grow;
  return { x, y, z, scale: [s, s * rand(0.8, 1.2), s], brightness: rand(0.7, 1.2) };
}).layers.set(MAIN_ONLY_LAYER);
for (let i = 0; i < SHRUB_SHAPES; i++) {
  const count = Math.round(SHRUB_COUNT / SHRUB_SHAPES);
  scatter(shrubGeometry(), leafMaterial, count, (j) => {
    const { x, y, z, grow } = bankPlant(j, count);
    const s = randIn(SHRUB_SIZE) * grow;
    return { x, y, z, scale: [s * rand(1.2, 1.6), s, s * rand(1.2, 1.6)], brightness: rand(0.65, 1.1) };
  });
}

// 倒木。区切りごとに苔の色を変え、折れた枝を 2 本残す
{
  const soup = triangleSoup();
  for (const { from, to, radius } of FALLEN_LOGS) {
    const at = (t) => from.map((v, k) => mix(v, to[k], t));
    const radiusAt = (t) => radius * mix(1, 0.72, t);
    for (let i = 0; i < LOG_SEGMENTS; i++) {
      const t0 = i / LOG_SEGMENTS, t1 = (i + 1) / LOG_SEGMENTS, moss = rand(0, 0.4);
      addLimb(soup, at(t0), at(t1), radiusAt(t0), radiusAt(t1), LOG_SIDES, LOG_COLOR.map((v, k) => mix(v, MOSS_COLOR[k], moss)));
    }
    for (const t of [rand(0.3, 0.45), rand(0.6, 0.75)]) {
      const p = at(t);
      addLimb(soup, p, [p[0] + rand(-1.6, 1.6), p[1] + rand(1, 2.2), p[2] + rand(-1.6, 1.6)], radiusAt(t) * 0.35, radiusAt(t) * 0.1, 3, LOG_COLOR);
    }
  }
  scene.add(new THREE.Mesh(soup.geometry(), plainMaterial));
}

// 滝壺の岩。岸に沿って並べ、滝の手前にも少し置く
{
  const material = new THREE.MeshLambertMaterial({ vertexColors: true, map: rockTexture, flatShading: true });
  for (let i = 0; i < BOULDER_SHAPES; i++) {
    scatter(boulderGeometry(), material, Math.round(BOULDER_COUNT / BOULDER_SHAPES), () => {
      const s = rand(1.2, 5);
      const x = randSign() * rand(12, 52);
      const z = lipZ(x) + rand(7, 25);
      return { x, y: s * rand(-0.15, 0.2), z, scale: [s * rand(1, 1.5), s * rand(0.6, 1), s], brightness: rand(0.65, 1.1) };
    });
  }
}

// 滝口の岩。滝口の縁に埋め込み、水は岩の左右に分かれて流れる（下の avoidLipRocks）。岩の下には濡れた崖がのぞく
// 滝口を等分した区画に 1 個ずつ置くので、岩どうしは重ならない
const lipRocks = Array.from({ length: LIP_ROCK_COUNT }, (_, i) => {
  const x = ((i + 0.5 + rand(-0.2, 0.2)) / LIP_ROCK_COUNT * 2 - 1) * FALL_MAX_HALF * 0.8;
  const size = randIn(LIP_ROCK_SIZE), stretch = rand(1.1, 1.5);
  return { x, size, stretch, halfWidth: size * stretch * 0.75 };
});
{
  const material = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
  scatter(boulderGeometry(), material, LIP_ROCK_COUNT, (i) => {
    const { x, size, stretch } = lipRocks[i];
    return {
      x, y: rimY(x) - size * 0.1, z: lipZ(x) - size * 0.4,
      scale: [size * stretch, size * 0.8, size], brightness: rand(0.7, 1),
    };
  });
}

// 水の帯が滝口の岩にかからないよう、帯の位置を岩の脇へよける
function avoidLipRocks(x, width) {
  for (const r of lipRocks) {
    const gap = r.halfWidth * 0.7 + width * 0.6;
    if (Math.abs(x - r.x) < gap) return r.x + (x < r.x ? -gap : gap);
  }
  return x;
}

// ---- ツタ ----
// 崖の上端から垂れる束を描いた板を、崖の面に沿わせて貼る。板が岩に埋もれないよう、幅の中でいちばん手前の位置に合わせる。
// 法線は崖の弧の向きにする（カメラへ向けると、影の側の崖でも光って見える）
{
  const soup = triangleSoup();
  const dark = linear(VINE_COLORS[0]), light = linear(VINE_COLORS[1]);
  for (let c = 0; c < VINE_CLUSTERS; c++) {
    const cx = randSign() * randIn(VINE_X);
    const halfW = randIn(VINE_WIDTH) / 2, length = randIn(VINE_LENGTH);
    const top = Math.min(rimY(cx - halfW), rimY(cx), rimY(cx + halfW));   // 板の上端が崖の上へはみ出さないように
    const out = [-2 * GORGE_CURVE * cx / GORGE_WIDTH ** 2, 0.25, 1];
    const shape = randInt(VINE_SHAPES), brightness = rand(0.75, 1.15);
    const u0 = shape / VINE_SHAPES, u1 = (shape + 1) / VINE_SHAPES;
    const colorAt = (t) => dark.map((v, k) => mix(v, light[k], mix(0.8, 0.45, t)) * brightness);
    const rowAt = (j) => {
      const t = j / VINE_ROWS, y = top - length * t;
      const z = Math.max(wallZ(cx - halfW, y), wallZ(cx, y), wallZ(cx + halfW, y)) + 0.3;
      return { t, left: [cx - halfW, y, z], right: [cx + halfW, y, z] };
    };
    for (let j = 0; j < VINE_ROWS; j++) {
      const a = rowAt(j), b = rowAt(j + 1);
      const ca = colorAt(a.t), cb = colorAt(b.t);
      soup.add([a.left, a.right, b.right], out, [ca, ca, cb], [[u0, 1 - a.t], [u1, 1 - a.t], [u1, 1 - b.t]]);
      soup.add([a.left, b.right, b.left], out, [ca, cb, cb], [[u0, 1 - a.t], [u1, 1 - b.t], [u0, 1 - b.t]]);
    }
  }
  const material = new THREE.MeshLambertMaterial({ vertexColors: true, map: vineTexture, alphaTest: VINE_ALPHA_TEST });
  foliageMaterials.push(material);
  const mesh = new THREE.Mesh(soup.geometry(), material);
  mesh.layers.set(MAIN_ONLY_LAYER);   // 崖の高い所にあり、水面にはほとんど映らない
  scene.add(mesh);
}

// ---- 滝 ----
// 水の帯。中央に近い順に並べ、先頭から水量に応じた本数を描く
const streams = [];
for (let i = 0; i < STREAM_COUNT; i++) {
  const original = (((i + 1) * GOLDEN_RATIO) % 1 * 2 - 1) * FALL_MAX_HALF;
  const k = Math.abs(original) / FALL_MAX_HALF;
  const width = mix(STREAM_WIDTH[0], STREAM_WIDTH[1], k) * rand(0.7, 1.3);
  const x = avoidLipRocks(original, width);
  const y0 = rimY(x) + 0.5 * (fbm(x * 0.3, 1.5) - 0.5);
  streams.push({
    x, rejoinX: original, y0, z0: lipZ(x) + 0.2, life: fallTime(y0),
    width,
    // 乱数に位置のノイズを混ぜ、隣の帯と白さや揺れを揃える。滝に太い柱の模様が出る
    seed: smoothstep(fbm(original * 0.3, 9.7), 0.32, 0.68) * 0.8 + rand(0, 0.2),
  });
}
// 中央に近い順に並べる。順番を少し乱して、水量が増えたときに端へ細い筋から増えていくようにする。
// 中央は乱さない。乱すと、水量が少ないときに帯が散らばって薄く見える
for (const st of streams) {
  const d = Math.abs(st.x);
  st.order = d + rand(0, STREAM_ORDER_JITTER) * smoothstep(d, 0, STREAM_ORDER_CORE);
}
streams.sort((a, b) => a.order - b.order);

const streamMesh = (() => {
  const count = streams.length * (STREAM_SEGMENTS + 1) * 2;
  const position = new Float32Array(count * 3);
  const side = new Float32Array(count), fallT = new Float32Array(count);
  const fallK = new Float32Array(count), seed = new Float32Array(count);
  const indices = new Uint32Array(streams.length * STREAM_SEGMENTS * 6);
  let v = 0, e = 0;
  for (const s of streams) {
    for (let j = 0; j <= STREAM_SEGMENTS; j++) {
      const k = j / STREAM_SEGMENTS, t = k * s.life;
      // 滝口の近くでは寄り道を抑える
      const wander = FALL_WANDER * 2 * (fbm(s.rejoinX * 0.14 + 3, k * 1.8) - 0.5) * smoothstep(k, 0, 0.45);
      // 岩でよけた帯は、落ちるうちに元の位置へ戻る（岩の下で水が合流する）
      const cx = (mix(s.x, s.rejoinX, smoothstep(k, 0, LIP_ROCK_REJOIN)) + wander) * (1 + FALL_FAN * k);
      const half = s.width * (1 + STREAM_SPREAD * k);
      for (const sd of [-1, 1]) {
        position.set([cx + sd * half, fallY(s.y0, t), fallZ(s.z0, t)], v * 3);
        side[v] = sd;
        fallT[v] = t;
        fallK[v] = k;
        seed[v] = s.seed;
        v++;
      }
      if (j < STREAM_SEGMENTS) {
        const a = v - 2;
        indices.set([a, a + 1, a + 2, a + 2, a + 1, a + 3], e);
        e += 6;
      }
    }
  }
  const geometry = new THREE.BufferGeometry()
    .setAttribute('position', new THREE.BufferAttribute(position, 3))
    .setAttribute('aSide', new THREE.BufferAttribute(side, 1))
    .setAttribute('aTime', new THREE.BufferAttribute(fallT, 1))
    .setAttribute('aFall', new THREE.BufferAttribute(fallK, 1))
    .setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  geometry.setIndex(new THREE.BufferAttribute(indices, 1));
  const mesh = new THREE.Mesh(geometry, new THREE.ShaderMaterial({
    ...StreamShader, side: THREE.DoubleSide, transparent: true, depthWrite: false,
  }));
  mesh.material.uniforms.uStreak.value = streakTexture;
  mesh.frustumCulled = false;
  mesh.renderOrder = 2;
  scene.add(mesh);
  return mesh;
})();
const streamUniforms = streamMesh.material.uniforms;

function updateStreams() {
  streamUniforms.uPhase.value.set((time * STREAK_RATE[0]) % 1, (time * STREAK_RATE[1]) % 1);
  streamUniforms.uSway.value = (time * STREAM_SWAY_SPEED) % TAU;
}

// ---- 水滴 ----
// 速さのままに動かす（水滴・しぶき）
function moveParticle(p, dt) {
  p.x += p.vx * dt;
  p.y += p.vy * dt;
  p.z += p.vz * dt;
}

// 寿命（life 秒）を持つ粒（登る鯉の水しぶき）は、時間が来たら消す。返り値は不透明度に掛ける倍率で、最後の 0.2 秒で薄れ、0 なら消す。
// 寿命の無い粒は 1（水面に落ちるまで残る）
function ageParticle(p, dt) {
  if (p.life === undefined) return 1;
  p.life -= dt;
  return clamp(p.life / 0.2, 0, 1);
}

// いま噴き上がっている所。水の線と水煙はここから出す
const bursts = [];
let nextBurst = 0;
function updateBursts(dt) {
  for (const b of bursts) b.left -= dt;
  while (bursts.length && bursts[0].left <= 0) bursts.shift();
  nextBurst -= dt * water;
  if (nextBurst <= 0) {
    nextBurst = randomInterval(BURST_INTERVAL);
    bursts.push({ x: rand(-impactHalf, impactHalf), left: BURST_TIME });
  }
}

// 滝のまわりに落ちる細い水滴。速さの向きに伸ばした線で描く
const drops = (() => {
  const position = new Float32Array(MAX_DROPS * 6);
  const color = new Float32Array(MAX_DROPS * 6);
  const geometry = new THREE.BufferGeometry()
    .setAttribute('position', new THREE.BufferAttribute(position, 3).setUsage(THREE.DynamicDrawUsage))
    .setAttribute('color', new THREE.BufferAttribute(color, 3).setUsage(THREE.DynamicDrawUsage));
  const lines = new THREE.LineSegments(geometry, new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
  }));
  lines.frustumCulled = false;
  lines.renderOrder = 3;
  lines.layers.set(MAIN_ONLY_LAYER);
  scene.add(lines);
  return { max: MAX_DROPS, position, color, geometry, list: [], carry: 0, tint: [1, 1, 1] };
})();

function updateDrops(dt) {
  emit(drops, DROP_RATE * water, dt, () => {
    const s = streams[randInt(streamsInUse)];
    const t = rand(0, 0.5);   // 滝口からの落ち始めは、少しばらつかせる
    return {
      x: s.x + rand(-1.6, 1.6) * s.width, y: fallY(s.y0, t), z: fallZ(s.z0, t) + rand(-0.5, 1.5),
      vx: rand(-0.7, 0.7), vy: -LIP_SPEED[0] - FALL_GRAVITY * t, vz: LIP_SPEED[1] + rand(-0.3, 0.9),
      a: rand(0.1, 0.5),
    };
  });
  // 噴き上がる水。落ちる水と同じ重力の線にする（軽い粒で描くと、舞う雪に見える）
  const force = thin(THIN_SPRAY);
  emit(drops, BURST_JET_RATE * bursts.length, dt, () => {
    const x = pick(bursts).x + rand(-BURST_WIDTH, BURST_WIDTH);
    return {
      x, y: 0.2, z: lipZ(x) + IMPACT_Z + rand(0, 2),
      vx: rand(-6, 6) * force, vy: randIn(BURST_JET_SPEED) * force, vz: rand(0, 7) * force,
      a: rand(0.3, 0.9),
    };
  });
  const { position, color, tint } = drops;
  let n = 0;
  for (const p of drops.list) {
    p.vy -= FALL_GRAVITY * dt;
    moveParticle(p, dt);
    const a = p.a * ageParticle(p, dt);
    if (p.y <= 0 || a <= 0) continue;
    position.set([p.x, p.y, p.z,
      p.x - p.vx * DROP_STREAK, p.y - p.vy * DROP_STREAK, p.z - p.vz * DROP_STREAK], n * 6);
    color.set([tint[0] * a, tint[1] * a, tint[2] * a, 0, 0, 0], n * 6);
    drops.list[n++] = p;
  }
  drops.list.length = n;
  drops.geometry.setDrawRange(0, n * 2);
  drops.geometry.attributes.position.needsUpdate = true;
  drops.geometry.attributes.color.needsUpdate = true;
}

// ---- しぶきと霧 ----
// 距離 1 で大きさ 1 の粒の画素数。画面の高さと画角で変わる（リサイズで更新）
const particleScale = { value: 1 };
function updateParticleScale() {
  particleScale.value = innerHeight * renderer.getPixelRatio() / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
}

// max 個までの粒を入れる器。粒は list に持ち、毎フレーム write で書き込んで flush で描く
function createParticles(max, { map, minSize = 0, depthTest = true, order = 0 }) {
  const position = new Float32Array(max * 3);
  const color = new Float32Array(max * 4);
  const size = new Float32Array(max);
  const angle = new Float32Array(max);
  const geometry = new THREE.BufferGeometry()
    .setAttribute('position', new THREE.BufferAttribute(position, 3).setUsage(THREE.DynamicDrawUsage))
    .setAttribute('color', new THREE.BufferAttribute(color, 4).setUsage(THREE.DynamicDrawUsage))
    .setAttribute('size', new THREE.BufferAttribute(size, 1).setUsage(THREE.DynamicDrawUsage))
    .setAttribute('angle', new THREE.BufferAttribute(angle, 1).setUsage(THREE.DynamicDrawUsage));
  geometry.setDrawRange(0, 0);
  const points = new THREE.Points(geometry, new THREE.ShaderMaterial({
    ...ParticleShader,
    uniforms: { uScale: particleScale, uMinSize: { value: minSize * renderer.getPixelRatio() }, uMap: { value: map } },
    transparent: true, depthWrite: false, depthTest,
  }));
  points.frustumCulled = false;   // 毎フレーム位置が変わるので画面外の判定はしない
  points.renderOrder = order;
  scene.add(points);
  return { max, points, position, color, size, angle, geometry, list: [], carry: 0, tint: [1, 1, 1] };
}

// k 番目の粒を書き込む。色はその器の tint で揃える
function writeParticle(sys, k, p, alpha, size) {
  sys.position[k * 3] = p.x;
  sys.position[k * 3 + 1] = p.y;
  sys.position[k * 3 + 2] = p.z;
  sys.color.set(sys.tint, k * 4);
  sys.color[k * 4 + 3] = alpha;
  sys.size[k] = size;
  sys.angle[k] = p.angle ?? 0;
}

function flushParticles(sys, n) {
  sys.geometry.setDrawRange(0, n);
  for (const name of ['position', 'color', 'size', 'angle']) sys.geometry.attributes[name].needsUpdate = true;
}

const spray = createParticles(MAX_SPRAY, { map: softDotTexture, minSize: 1.2, order: 4 });
spray.points.layers.set(MAIN_ONLY_LAYER);
// 霧は奥行きの判定をしない。岩や水面に切られて輪郭が出ないように
const mist = createParticles(MAX_MIST, { map: puffTexture, depthTest: false, order: 5 });

function updateSpray(dt) {
  const force = thin(THIN_SPRAY);
  emit(spray, SPRAY_RATE * water, dt, () => {
    const x = rand(-impactHalf, impactHalf);
    return {
      x, y: 0.2, z: lipZ(x) + IMPACT_Z + rand(-1.5, 1.5),
      vx: rand(-5, 5) * force, vy: randIn(SPRAY_SPEED) * Math.random() ** 0.5 * force, vz: rand(-1, 9) * force,
      size: randIn(SPRAY_SIZE), a: rand(0.2, 0.7),
    };
  });
  let n = 0;
  for (const p of spray.list) {
    p.vy -= SPRAY_GRAVITY * dt;
    moveParticle(p, dt);
    const a = p.a * ageParticle(p, dt);
    if (p.y <= 0 || a <= 0) continue;
    writeParticle(spray, n, p, a, p.size);
    spray.list[n++] = p;
  }
  spray.list.length = n;
  flushParticles(spray, n);
}

function updateMist(dt) {
  emit(mist, BURST_PUFF_RATE * bursts.length, dt, () => {
    const x = pick(bursts).x + rand(-BURST_WIDTH, BURST_WIDTH);
    return {
      x, y: rand(0, 2), z: lipZ(x) + IMPACT_Z + rand(0, 4),
      vx: rand(-1.5, 1.5), vy: randIn(BURST_PUFF_RISE), vz: rand(1, 4),
      age: 0, life: rand(2, 3.5), angle: rand(0, TAU), spin: rand(-0.3, 0.3),
      grow: rand(0.4, 0.8), strength: 3.5,
    };
  });
  emit(mist, MIST_RATE * water, dt, () => {
    const boil = Math.random() < BOIL_SHARE;
    const x = rand(-impactHalf, impactHalf) * (boil ? BOIL_SPREAD : 1.1);
    return {
      x, y: boil ? rand(0, 2) : rand(0, 4), z: lipZ(x) + IMPACT_Z + (boil ? rand(0, 4) : rand(-1, 7)),
      vx: x * 0.03 + rand(-0.7, 0.7), vy: boil ? rand(0.4, 1.6) : randIn(MIST_RISE), vz: rand(0.6, MIST_DRIFT),
      age: 0, life: boil ? rand(2, 4) : randIn(MIST_LIFE), angle: rand(0, TAU), spin: rand(-0.12, 0.12),
      grow: boil ? rand(0.4, 0.7) : rand(0.75, 1.2), strength: boil ? 2.8 : 1,
    };
  });
  let n = 0;
  const opacity = mistOpacity * Math.pow(water, 0.25) * thin(THIN_MIST_OPACITY);
  const sizeScale = thin(THIN_MIST_SIZE);
  for (const p of mist.list) {
    p.age += dt;
    if (p.age >= p.life) continue;
    const t = p.age / p.life;
    p.x += p.vx * dt;
    p.y += p.vy * (1 - 0.6 * t) * dt;
    p.z += p.vz * dt;
    p.angle += p.spin * dt;
    writeParticle(mist, n, p, opacity * p.strength * Math.sin(Math.PI * t), mix(MIST_SIZE[0], MIST_SIZE[1], t) * p.grow * sizeScale);
    mist.list[n++] = p;
  }
  mist.list.length = n;
  flushParticles(mist, n);
}

// ---- 光の筋 ----
// 崖の上端から差し込む夕日を、筋を描いた半透明の板で描く。空気の手前にあるものとして奥行きの判定をせず、色を足す。
// 板はカメラの方を向けたままで、濃さをゆっくり変える
const shaftTexture = canvasTexture(512, (g, n) => {
  for (let i = 0; i < 7; i++) {
    const y = n * (0.5 + 0.4 * rand(-1, 1) * Math.random());
    const half = rand(12, 44), a = rand(0.1, 0.5);
    const grad = g.createLinearGradient(0, y - half, 0, y + half);
    grad.addColorStop(0, gray(255, 0));
    grad.addColorStop(0.5, gray(255, a));
    grad.addColorStop(1, gray(255, 0));
    g.fillStyle = grad;
    g.fillRect(0, y - half, n, half * 2);
  }
  // 差し込む側（右）は明るく、先へ行くほど消す。始まりも少しぼかす
  g.globalCompositeOperation = 'destination-in';
  const fade = g.createLinearGradient(0, 0, n, 0);
  [[0, 0], [0.4, 0.5], [0.75, 1], [1, 0]].forEach(([t, a]) => fade.addColorStop(t, gray(255, a)));
  g.fillStyle = fade;
  g.fillRect(0, 0, n, n);
});
const shafts = Array.from({ length: SHAFT_COUNT }, (_, i) => {
  const angle = SHAFT_ANGLE + rand(-0.08, 0.08), [length, width] = SHAFT_SIZE;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(length, width), new THREE.MeshBasicMaterial({
    map: shaftTexture, color: new THREE.Color(...SHAFT_COLOR), transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false, fog: false,
  }));
  mesh.position.set(SHAFT_SOURCE[0] - Math.cos(angle) * length / 2 + rand(-6, 6), SHAFT_SOURCE[1] - Math.sin(angle) * length / 2, rand(20, 40));
  mesh.rotation.z = angle;
  mesh.scale.y = i % 2 ? 1 : -1;   // 1 枚おきに上下を反転して、同じ筋が重ならないようにする
  mesh.renderOrder = 3;     // 水の帯のあと、霧の前
  mesh.layers.set(MAIN_ONLY_LAYER);
  mesh.userData.phase = rand(0, TAU);
  scene.add(mesh);
  return mesh;
});

function updateShafts() {
  for (const mesh of shafts) {
    if (mesh.visible) mesh.material.opacity = SHAFT_OPACITY * (1 - SHAFT_PULSE[0] + SHAFT_PULSE[0] * Math.sin(time * SHAFT_PULSE[1] + mesh.userData.phase));
  }
}

// ---- 蛍 ----
// 霧の外から崖の前と手前へ奥行きを散らし、決まった場所のまわりを漂って、ゆっくり明滅する。
// 場所は霧の外側からの距離で持つ。水量が変わると霧の幅に合わせて場所がずれるので、霧の中には入らない
const fireflies = createParticles(FIREFLY_COUNT, { map: softDotTexture, minSize: 1.2, order: 4 });
fireflies.points.layers.set(MAIN_ONLY_LAYER);
fireflies.tint = FIREFLY_COLOR;
fireflies.list = Array.from({ length: FIREFLY_COUNT }, () => {
  for (;;) {
    const gap = Math.random(), depth = Math.random();
    if (gap * gap + depth * depth > 1) continue;   // 角を落として、丸い範囲にする
    return {
      side: randSign(), gap: gap * FIREFLY_REACH[0], depth: depth * FIREFLY_REACH[1],
      hy: rand(0.8, 8), alpha: mix(FIREFLY_FAR_ALPHA, 1, depth),
      phase: Array.from({ length: 4 }, () => rand(0, TAU)), blink: randIn(FIREFLY_BLINK),
      x: 0, y: 0, z: 0,
    };
  }
});

let fireflyEdge = null;   // 蛍の範囲の内側の端（滝の中央からの横の距離）
function updateFireflies(dt) {
  // 霧の広がりに合わせる。水量が少ないと霧も小さいので、離す距離も縮める
  const edge = impactHalf * BOIL_SPREAD + FIREFLY_MIST_GAP * thin(THIN_MIST_SIZE);
  fireflyEdge = fireflyEdge === null ? edge : mix(fireflyEdge, edge, Math.min(1, FIREFLY_FOLLOW * dt));
  if (!fireflies.points.visible) return;
  fireflies.list.forEach((p, k) => {
    const hx = p.side * (fireflyEdge + p.gap);
    const hz = lipZ(hx) + 6 + p.depth;   // 崖の中には置かない
    p.x = hx + FIREFLY_DRIFT[0] * Math.sin(time * 0.31 + p.phase[0]) + Math.sin(time * 0.73 + p.phase[1]);
    p.y = p.hy + FIREFLY_DRIFT[1] * Math.sin(time * 0.43 + p.phase[2]);
    p.z = hz + FIREFLY_DRIFT[2] * Math.sin(time * 0.27 + p.phase[1]) + Math.sin(time * 0.61 + p.phase[0]);
    writeParticle(fireflies, k, p, p.alpha * smoothstep(Math.sin(time * p.blink + p.phase[3]), 0.2, 0.9), FIREFLY_SIZE);
  });
  flushParticles(fireflies, FIREFLY_COUNT);
}

// ---- 滝壺の水面 ----
const pool = new Reflector(new THREE.PlaneGeometry(POOL_SIZE, POOL_SIZE), {
  shader: PoolShader, clipBias: 0.001, multisample: 0,
  textureWidth: 16, textureHeight: 16,   // 下の updateReflectionSize で画面に合わせる
});
pool.rotation.x = -Math.PI / 2;
pool.position.z = POOL_SIZE / 2 - 60;
pool.material.depthWrite = false;   // 霧やしぶきが水面に切られないように
pool.renderOrder = 1;               // 崖や岩の水中の部分を水面で覆うよう、後から描く
scene.add(pool);
const poolUniforms = pool.material.uniforms;
poolUniforms.uNoise.value = noiseTexture;   // Reflector は uniform を複製するので、テクスチャはここで渡す

// 映り込みにだけ描く、粗い崖。崖は三角形の大半を占めるので、2 回とも細かく描くと無駄が大きい
const reflectionCliff = cliffMesh(Math.round(CLIFF_COLS * REFLECTION_CLIFF_SCALE), Math.round(CLIFF_ROWS * REFLECTION_CLIFF_SCALE));
reflectionCliff.visible = false;

// 映り込みは小さい描画先に描くので、粒の大きさもその割合に縮め、崖も粗いものに替える
const renderReflection = pool.onBeforeRender;
pool.onBeforeRender = (...args) => {
  const scale = particleScale.value;
  particleScale.value = scale * REFLECTION_SIZE / (innerHeight * renderer.getPixelRatio());
  cliff.visible = false;
  reflectionCliff.visible = true;
  renderReflection.apply(pool, args);
  cliff.visible = true;
  reflectionCliff.visible = false;
  particleScale.value = scale;
};

function updateReflectionSize() {
  pool.getRenderTarget().setSize(Math.round(REFLECTION_SIZE * innerWidth / innerHeight), REFLECTION_SIZE);
}

function updatePool() {
  poolUniforms.uPhase.value.set(
    (time * WAVE_SPEED[0]) % 1, (time * WAVE_SPEED[1]) % 1, (time * WAVE_SPEED[2]) % 1);
  poolUniforms.uSwell.value = (time * SWELL_SPEED / SWELL_LENGTH % 1) * TAU;
}

// ---- 虹 ----
// 霧より手前に置く板。霧の無い所まで広げると、描かない画素の計算が増えるだけなので、霧のある範囲に収める
const rainbow = new THREE.Mesh(
  new THREE.PlaneGeometry(170, RAINBOW_TOP),
  new THREE.ShaderMaterial({
    ...RainbowShader, transparent: true, depthWrite: false,
    blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
  }));
rainbow.position.set(0, RAINBOW_TOP / 2, 24);
rainbow.renderOrder = 6;
rainbow.layers.set(MAIN_ONLY_LAYER);
scene.add(rainbow);
const rainbowUniforms = rainbow.material.uniforms;

// 虹の濃さと広がりは霧に合わせる。水量が少ないと霧も少ないので薄く、滝が細いと狭くなる
function updateRainbow() {
  const strength = SCENES[sceneIndex].rainbow;
  rainbow.visible = strength > 0;
  rainbowUniforms.uStrength.value = strength * water ** 0.5;
  rainbowUniforms.uReach.value = activeHalf + RAINBOW_SPREAD;
}

// ---- 鯉の滝登り（隠し要素） ----
// 鯉と龍は canvas に描いた白いシルエットの板で、色は材質の色で付ける。体をくねらせるので毎フレーム描き直す。
// 夜は後ろに、シルエットをにじませた絵を加算合成で敷く（ctx.filter は Safari で効かないので、ずらした重ね描きでにじませる）。
// 乱数は Math.random と別にする（DEVELOPMENT.md: 既存の乱数を引く順番を変えない）。現れるまでは Math.random を引かないので、
// 隠し要素の出ない場面は追加の前と同じ絵になる。現れたときは、種を Math.random から取り直す。動画のツールで乱数を固定すると、
// 現れたあとの動き（向き・位置・水滴）も毎回同じになる。three.js も板を作るときに Math.random を引くので、板は最初に現れるときに作る
const carpRandom = (() => {
  let s = Date.now() >>> 0;   // mulberry32
  const next = () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = Math.imul(s ^ (s >>> 15), s | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  next.reseed = () => { s = Math.floor(Math.random() * 4294967296) >>> 0; };
  return next;
})();
const carpRand = (a, b) => a + carpRandom() * (b - a);
const carpInterval = ([mean, min, max]) => clamp(-Math.log(1 - carpRandom()) * mean, min, max);

// シルエットの板（幅 w、高さ h、テクスチャ tw × th 画素）と、その後ろの光の板。最初は非表示
function silhouetteSprite(w, h, tw, th) {
  const plane = (canvas, extra) => {
    const texture = new THREE.CanvasTexture(canvas);
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({
      map: texture, transparent: true, depthWrite: false, side: THREE.DoubleSide, fog: false, ...extra,   // 霧の影響は受けない
    }));
    mesh.layers.set(MAIN_ONLY_LAYER);   // 水面には映さない
    mesh.frustumCulled = false;
    return mesh;
  };
  const canvas = Object.assign(document.createElement('canvas'), { width: tw, height: th });
  const glowCanvas = Object.assign(document.createElement('canvas'), { width: tw, height: th });
  const mesh = plane(canvas, {});
  const glow = plane(glowCanvas, { blending: THREE.AdditiveBlending });
  mesh.renderOrder = 3;   // 滝（2）より後に描き、落ちる水に隠れないようにする
  glow.renderOrder = 2.5;
  mesh.add(glow);
  mesh.visible = false;
  return { canvas, glowCanvas, mesh, glow };
}

// シルエットを描き終えたあとに呼ぶ。光の絵を作り、2 枚のテクスチャを更新する
function finishSprite(sp) {
  const g = sp.glowCanvas.getContext('2d');
  g.clearRect(0, 0, sp.glowCanvas.width, sp.glowCanvas.height);
  g.globalAlpha = 0.14;
  for (const k of [1, 2, 3]) {
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * TAU;
      g.drawImage(sp.canvas, Math.cos(a) * k * SILHOUETTE_GLOW, Math.sin(a) * k * SILHOUETTE_GLOW);
    }
  }
  g.globalAlpha = 1;
  sp.mesh.material.map.needsUpdate = true;
  sp.glow.material.map.needsUpdate = true;
}

// 色を当てる。color は画面に出る値、glow は線形の値。alpha は不透明度。dim は色を toward（既定は水の色）へ寄せる割合
function tintSprite(sp, { color, glow }, alpha = 1, dim = 0, toward = SCENES[sceneIndex].deep) {
  sp.mesh.material.color.copy(srgb(color)).lerp(srgb(toward), dim);
  sp.mesh.material.opacity = alpha;
  sp.glow.material.color.setRGB(glow[0] * alpha, glow[1] * alpha, glow[2] * alpha);
  sp.glow.visible = glow.some((v) => v > 0);   // 光の無い景色では描かない
}

// 点の列 pts（[x, y]）に沿った幅 width(s) の体の輪郭を塗る（s は 0..1）。各点の向きと横の向きも返す
function fillBody(ctx, pts, width) {
  const n = pts.length - 1, frames = [];
  for (let i = 0; i <= n; i++) {
    const [ax, ay] = pts[Math.max(0, i - 1)], [bx, by] = pts[Math.min(n, i + 1)];
    const len = Math.hypot(bx - ax, by - ay);
    const dx = (bx - ax) / len, dy = (by - ay) / len;   // 頭から尾への向き
    frames.push({ x: pts[i][0], y: pts[i][1], dx, dy, px: -dy, py: dx, w: width(i / n) });
  }
  ctx.beginPath();
  for (const f of frames) ctx.lineTo(f.x + f.px * f.w, f.y + f.py * f.w);
  for (let i = n; i >= 0; i--) ctx.lineTo(frames[i].x - frames[i].px * frames[i].w, frames[i].y - frames[i].py * frames[i].w);
  ctx.fill();
  return frames;
}

// 楕円。中心 (x, y)、向き (dx, dy) に長さの半径 a、横に半径 b
function ellipseAlong(ctx, x, y, dx, dy, a, b) {
  ctx.beginPath();
  ctx.ellipse(x, y, a, b, Math.atan2(dy, dx), 0, TAU);
  ctx.fill();
}

// 鯉を背の側から見た形（頭が上）。胴と胸びれと三角の尾びれだけの単純な形。beat は体のくねりの位相、amp はくねらせる幅。
// 振りは頭から尾へ遅れて伝わり、尾ほど大きい（体全体が揃って揺れると板に見える）
function drawCarpTop(sp, beat, amp) {
  const ctx = sp.canvas.getContext('2d'), n = sp.canvas.width;
  ctx.clearRect(0, 0, n, n);
  ctx.fillStyle = '#fff';
  const pts = [];
  for (let i = 0; i <= 24; i++) {
    const s = i / 24;
    pts.push([n / 2 + amp * n * (0.15 + 0.85 * s * s) * Math.sin(beat - 3.5 * s), n * (0.06 + 0.72 * s)]);
  }
  // 頭は丸く、胴の前の方がいちばん太く、尾の付け根へ細くなる
  const width = (s) => n * (s < 0.3 ? 0.1 * Math.sin(s / 0.3 * Math.PI / 2) ** 0.6 : 0.1 - 0.078 * ((s - 0.3) / 0.7) ** 1.2);
  const f = fillBody(ctx, pts, width);
  // 胸びれ。後ろへ向けて左右に開く
  const fin = f[7];
  for (const sd of [-1, 1]) {
    const fx = sd * fin.px * 0.8 + fin.dx * 0.6, fy = sd * fin.py * 0.8 + fin.dy * 0.6;
    ellipseAlong(ctx, fin.x + sd * fin.px * fin.w + fx * 0.05 * n, fin.y + sd * fin.py * fin.w + fy * 0.05 * n, fx, fy, 0.065 * n, 0.028 * n);
  }
  // 尾びれ（三角）
  const { x, y, dx, dy, px, py } = f[24];
  const at = (along, side) => [x + dx * along * n + px * side * n, y + dy * along * n + py * side * n];
  ctx.beginPath();
  for (const p of [at(0, 0.02), at(0.15, 0.08), at(0.15, -0.08), at(0, -0.02)]) ctx.lineTo(...p);
  ctx.fill();
  finishSprite(sp);
}

// 龍を横から見た形。pts は胴の点の列（板のテクスチャの画素。頭が先頭）、scales は各点の大きさ（遠ざかると小さくなる）。
// 遠くて小さいので、胴と角の輪郭を優先し、ひげは実物より長く描く。たてがみと尾の先の房は見分けられず、足はとげが出てせわしなく見えるので描かない
function drawDragon(sp, pts, scales) {
  const ctx = sp.canvas.getContext('2d'), W = sp.canvas.width, H = sp.canvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = ctx.strokeStyle = '#fff';
  ctx.lineCap = 'round';
  ctx.shadowColor = '#fff';   // 輪郭をぼかして霞ませる（ctx.filter は Safari で効かないので、影でぼかす）
  ctx.shadowBlur = DRAGON_BLUR * scales[0];   // 遠ざかって小さくなっても、ぼかしに埋もれないよう一緒に縮める
  const N = pts.length - 1;
  const U0 = 0.58 * DRAGON_LENGTH * W / DRAGON_SIZE;   // 胴の太さや角・ひげなどの大きさの単位（胴の長さの 0.58 倍ぶんの画素。遠ざかる前）
  const U = U0 * scales[0];   // 頭のまわりの大きさの単位
  // 首のあたりがいちばん太く、尾の近くまで太さを保ってから細く絞り、尾の先は糸のように消える
  // （前から一気に細くすると、小さく見えたときにおたまじゃくしやうなぎに見える）
  const width = (s) => U0 * scales[Math.round(s * N)] * (s < 0.12 ? mix(0.055, 0.075, s / 0.12) : Math.max(0.003, 0.075 * (1 - ((s - 0.12) / 0.88) ** 2.2)));
  const f = fillBody(ctx, pts, width);
  const line = (w, ...p) => {
    ctx.lineWidth = w * U;
    ctx.beginPath();
    ctx.moveTo(...p[0]);
    if (p.length === 3) ctx.quadraticCurveTo(...p[1], ...p[2]);
    else for (const q of p.slice(1)) ctx.lineTo(...q);
    ctx.stroke();
  };
  // 頭（d は頭の向き = 胴と逆）。頭と鼻先、後ろへ伸びる角、胴に沿って流れるひげ
  const { x, y, dx, dy, px, py } = f[0];
  const at = (fwd, side) => [x - dx * fwd * U + px * side * U, y - dy * fwd * U + py * side * U];
  ellipseAlong(ctx, ...at(0.03, 0), dx, dy, 0.075 * U, 0.05 * U);
  ellipseAlong(ctx, ...at(0.1, -0.005), dx, dy, 0.05 * U, 0.032 * U);
  for (const sd of [-1, 1]) {
    line(0.028, at(0.01, sd * 0.03), at(-0.08, sd * 0.1), at(-0.21, sd * 0.085));
    // ひげ: 鼻先から頬を回って、胴の脇に沿って後ろへ流れる。独自には揺らさず、胴と一緒にくねる
    const whisker = [at(0.12, sd * 0.025), at(0.02, sd * 0.07)];
    const last = Math.round(N * DRAGON_WHISKER.length);
    for (let i = 2; i <= last; i++) {
      const b = f[i], gap = b.w + U0 * scales[i] * mix(DRAGON_WHISKER.gap[0], DRAGON_WHISKER.gap[1], i / last);
      whisker.push([b.x + b.px * sd * gap, b.y + b.py * sd * gap]);
    }
    line(0.012, ...whisker);
  }
  finishSprite(sp);
}

let carp = null;            // 出ている鯉と龍 { phase（CARP_PHASES の番号）, t（その段階の経過秒）, dir（泳ぎ始める位置の左右）, dragonPath（龍の頭が通る道。昇り始めに作る）, beat（体のくねりの位相）, splashWait（次に水しぶきを跳ね散らすまでの秒数）, burst（登り始めの水を噴き上げたか） }。いなければ null
let carpWait = carpInterval(CARP_INTERVAL);   // 次に現れるまでの秒数

// 段階の名前と秒数（泳ぐ、登る、滝口を越えて奥へ消える、間をおく、龍が昇る）
const CARP_PHASES = [
  ['swim', CARP_SWIM_TIME], ['climb', CARP_CLIMB_TIME], ['over', CARP_OVER_TIME],
  ['pause', CARP_PAUSE], ['dragon', DRAGON_RISE_TIME],
];

// 鯉と龍の板 { group（鯉の位置と大きさ。水中では奥行きの向きに伸ばす）, carp, dragon }。最初に現れるときに作る
let carpParts = null;
function createCarpParts() {
  const group = new THREE.Group();
  const carpSprite = silhouetteSprite(CARP_LENGTH, CARP_LENGTH, 256, 256);
  group.add(carpSprite.mesh);
  const dragon = silhouetteSprite(DRAGON_SIZE, DRAGON_SIZE, 512, 512);
  scene.add(group, dragon.mesh);
  return { group, carp: carpSprite, dragon };
}

function startCarp() {
  if (carp) return;
  carpRandom.reseed();
  carpParts ??= createCarpParts();
  carp = { phase: 0, t: 0, dir: carpRandom() < 0.5 ? -1 : 1, dragonPath: null, beat: 0, splashWait: 0, burst: false };
  carpWait = carpInterval(CARP_INTERVAL);
}

const CARP_CLIMB_LENGTH = CARP_LENGTH * CARP_CLIMB_SCALE;   // 滝を登るときの鯉の長さ
const CARP_HEAD = 0.44;   // 背から見た鯉の絵の、板の中心から頭の先までの距離（板の一辺に対する割合）
// 滝の中央の滝口の高さと奥行き
const CARP_LIP_Y = rimY(0), CARP_LIP_Z = lipZ(0) + 0.2;
// 泳ぐ道は、画面の手前から滝の足もとの霧の手前までのまっすぐな線
const CARP_SWIM_TO = IMPACT_Z + CARP_SWIM_GAP;
// 落ちる水の手前で、高さ y の所の奥行き
const climbZ = (y) => fallZ(CARP_LIP_Z, fallTime(clamp(CARP_LIP_Y - y, 0, CARP_LIP_Y))) + CARP_FRONT;

// 龍の頭が通る道。空の板の上の座標 (u: 右, v: 上) で、昇り始めの点（anchor）が原点。
// 直線と円弧を、進む向きを揃えてつなぎ、0.1 ごとの点の列にする。昇り始めより下（滝口の縁の陰）から作り始め、
// 頭が薄れて消える所まで作る。道の長さ s で点を引けるよう、長さの表も作る。緩急を付けるため、頭が各点に着く時刻の表も作る。
// start / end は、頭が昇り始める所（v が 0 を越える所）と、頭が消える所の時刻（速さ 1 で進んだときの道の長さの単位）。
// headAt は時刻から頭の位置の s を引く。
// view は道の上の点を、空の奥へ遠ざかったときに見える位置と大きさ [u, v, 大きさ] に移す
function dragonPath() {
  const dist = CAM_POS[2] + DRAGON_DIST, toRad = THREE.MathUtils.degToRad;
  const e0 = toRad(DRAGON_START_ELEVATION);
  const top = Math.atan2(CAM_TARGET_Y - CAM_POS[1], CAM_POS[2]) + toRad(camera.fov / 2);
  const vTop = dist / Math.cos(e0) * (top - e0);   // 画面の上端までの v（板は視線に垂直なので、角度 × 距離）
  const dir = carpRandom() < 0.5 ? -1 : 1;
  const { width, turn, slope, drift } = DRAGON_PATH;
  const a = toRad(slope), leg = 2 * (width - turn);
  const us = [], vs = [], ss = [], ts = [];
  let u = -dir * leg / 2, v = -DRAGON_LENGTH, h = dir > 0 ? a : Math.PI - a, s = 0, time = 0;
  const push = (speed = 1) => {
    if (us.length) {
      const d = Math.hypot(u - us[us.length - 1], v - vs[vs.length - 1]);
      s += d; time += d / speed;
    }
    us.push(u); vs.push(v); ss.push(s); ts.push(time);
  };
  push();
  // 遠ざかり始める高さ v0 より上では、昇った高さに応じて小さくなる。頭が消える高さ vEnd まで道を作る
  const v0 = DRAGON_RECEDE.from * vTop, R = DRAGON_RECEDE.range * vTop;
  const vEnd = v0 + R * (1 / DRAGON_RECEDE.fade[1] - 1);
  const STEP = 0.1;
  for (let side = dir; v < vEnd + 10; side = -side) {
    for (let d = 0; d < leg; d += STEP) {   // 直線
      u += Math.cos(h) * STEP; v += Math.sin(h) * STEP; push(1 + DRAGON_PACE.leg * Math.sin(Math.PI * d / leg));
    }
    // 円弧: 進む向きを π − 2a だけ回して、反対向きの直線につなぐ（右へ進んでいたら左回り、左へ進んでいたら右回り）
    const total = Math.PI - 2 * a, dh = STEP / turn * side;
    for (let t = 0; t < total; t += STEP / turn) {
      h += dh; u += Math.cos(h) * STEP; v += Math.sin(h) * STEP; push(1 - DRAGON_PACE.arc * Math.sin(Math.PI * t / total));
    }
    h = side > 0 ? Math.PI - a : a;   // 丸めの誤差を残さない
  }
  // 画面の上端の高さまで昇るあいだに、左右へ drift だけずらす（ずらしても、なめらかさは変わらない）
  for (let i = 0; i < us.length; i++) us[i] += dir * drift * vs[i] / vTop;
  // 増えていく表 keys で q を挟む 2 点と、その間の割合
  const find = (keys, q) => {
    let lo = 0, hi = keys.length - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (keys[mid] < q) lo = mid; else hi = mid; }
    return [lo, hi, clamp((q - keys[lo]) / (keys[hi] - keys[lo]), 0, 1)];
  };
  const at = (q) => {
    const [lo, hi, k] = find(ss, q);
    return [mix(us[lo], us[hi], k), mix(vs[lo], vs[hi], k)];
  };
  const headAt = (T) => {
    const [lo, hi, k] = find(ts, T);
    return mix(ss[lo], ss[hi], k);
  };
  // 遠ざかる: 大きさ g = 1 / (1 + (v − v0) / R)。見える高さは g を積んだもの（昇る速さも g の割合で遅くなる）。
  // 横は、左右へずれる中心の線からの離れを g 倍する
  const center = (y) => dir * drift * y / vTop;
  const view = ([pu, pv]) => {
    if (pv <= v0) return [pu, pv, 1];
    const g = 1 / (1 + (pv - v0) / R), y = v0 + R * Math.log(1 + (pv - v0) / R);
    return [center(y) + (pu - center(pv)) * g, y, g];
  };
  const first = vs.findIndex((y) => y >= 0), last = vs.findIndex((y) => y >= vEnd);
  // 昇り始める横の位置: 崖の上の木が空に突き出していない所を優先する。
  // 昇り始めから DRAGON_START.rise の高さまでに道が通る横の範囲で、木の稜線の高さ（見上げる角度の正接）を平均し、いちばん低い所を選ぶ
  const rising = us.filter((_, i) => vs[i] >= 0 && vs[i] <= DRAGON_START.rise);
  const uMin = Math.min(...rising), uMax = Math.max(...rising);
  const skyline = (x) => {   // 龍の奥行きで横の位置 x の方向に、木が昇り始めの高さより上へ突き出す量（突き出す木が無ければ 0）
    let top = 0;
    for (const t of rimTreeShapes) {
      const depth = CAM_POS[2] - t.z;
      if (Math.abs(x * depth / dist - t.x) < t.halfW) top = Math.max(top, (t.top - CAM_POS[1]) / depth - Math.tan(e0));
    }
    return top;
  };
  let startX = 0, best = Infinity;
  for (let k = 0; k < DRAGON_START.tries; k++) {   // 位置はランダムに試すので、木の無い所が何か所もあれば、そのどれかになる
    const x = carpRand(-DRAGON_X, DRAGON_X);
    let score = 0;
    for (let j = 0; j <= 6; j++) score += skyline(x + mix(uMin, uMax, j / 6));
    if (score < best) { best = score; startX = x; }
  }
  const anchor = new THREE.Vector3(startX, CAM_POS[1] + dist * Math.tan(e0), -DRAGON_DIST);
  return { at, headAt, view, anchor, start: ts[first], end: ts[last] };
}

function updateCarp(dt) {
  if (!carp) {
    carpWait -= dt;
    if (carpWait <= 0) startCarp();
    return;
  }
  carp.t += dt;
  while (carp.t >= CARP_PHASES[carp.phase][1]) {
    carp.t -= CARP_PHASES[carp.phase][1];
    if (++carp.phase === CARP_PHASES.length) {
      carp = null;
      carpParts.carp.mesh.visible = carpParts.dragon.mesh.visible = false;
      return;
    }
  }
  const [name, duration] = CARP_PHASES[carp.phase], t = carp.t, u = t / duration;
  const { group, carp: sp, dragon } = carpParts;
  const mesh = sp.mesh, colors = SCENES[sceneIndex].carp;
  mesh.visible = name !== 'pause' && name !== 'dragon';
  dragon.mesh.visible = name === 'dragon';
  group.scale.set(1, 1, 1);

  if (name === 'swim') {
    // 手前から滝の下へ、水中をゆったり泳ぐ。奥行きの向きに伸ばす。滝壺に近づくほど薄れて消える
    const fromX = carp.dir * CARP_SWIM_FROM[0], fromZ = CARP_SWIM_FROM[1];
    const k = u ** 1.5;   // 手前ほどゆっくり、滝に近づくと速く（画面の上では奥ほど遅く見えるので、ならす。滝壺の近くで間延びしない）
    group.position.set(mix(fromX, 0, k), -CARP_SWIM_DEPTH, mix(fromZ, CARP_SWIM_TO, k));
    group.scale.z = CARP_WATER_STRETCH;
    mesh.rotation.set(-Math.PI / 2, 0, Math.atan2(fromX, fromZ - CARP_SWIM_TO));   // 水平に寝かせ、頭を進む向きへ
    carp.beat = (carp.beat + dt * CARP_TAIL_BEAT[0]) % TAU;
    drawCarpTop(sp, carp.beat, CARP_TAIL_AMP[0]);
    tintSprite(sp, colors, CARP_WATER_ALPHA * (1 - smoothstep(u, ...CARP_FADE)), CARP_WATER_TINT);
  } else if (name === 'climb') {
    // 落ちる水の手前を、何度も勢いをつけながら登る（速さが変わる）。体のくねりは一定。
    // 滝の足もと（霧の中）で薄く現れ、頭が滝口の縁を越えるまで登る
    if (!carp.burst) {   // 現れる所を、噴き上がる水でごまかす
      bursts.push({ x: 0, left: BURST_TIME });
      carp.burst = true;
    }
    const w = TAU * CARP_CLIMB_SURGES;
    const y = mix(-CARP_CLIMB_LENGTH * 0.2, CARP_LIP_Y + CARP_CLIMB_LENGTH * (CARP_TOP_RISE - CARP_HEAD), u - CARP_CLIMB_SURGE * Math.sin(w * u) / w);
    group.position.set(0, y, climbZ(y));
    group.scale.setScalar(CARP_CLIMB_SCALE);
    mesh.rotation.set(0, 0, 0);
    carp.beat = (carp.beat + dt * CARP_TAIL_BEAT[1]) % TAU;
    drawCarpTop(sp, carp.beat, CARP_TAIL_AMP[1]);
    const wet = 1 - smoothstep(y, -CARP_CLIMB_LENGTH * 0.3, CARP_CLIMB_LENGTH * 0.2);   // 水の中にいる割合
    tintSprite(sp, colors, mix(1, CARP_WATER_ALPHA, wet) * smoothstep(t, 0, CARP_APPEAR), CARP_WATER_TINT * wet);
    // 尾びれのあたりから下で、バシャッと水しぶきを跳ね散らす（胴に重なると、鯉の形が読みにくい）。勢いのあるときほど多く、強く飛ばす
    const surge = 1 - CARP_CLIMB_SURGE * Math.cos(w * u);   // いまの速さ（平均 1）
    carp.splashWait -= dt;
    if (y > 0 && y < CARP_LIP_Y && carp.splashWait <= 0) {
      carp.splashWait += CARP_SPLASH_INTERVAL;
      const count = Math.round(CARP_SPLASH_COUNT * surge), L = CARP_CLIMB_LENGTH;
      for (let i = 0; i < count; i++) {
        const a = carpRand(0, Math.PI), speed = carpRand(...CARP_SPLASH_SPEED) * (0.6 + 0.4 * surge);   // 上向きの半円に飛ばす
        const p = {
          x: group.position.x + carpRand(-0.2, 0.2) * L, y: y + carpRand(-0.5, -0.35) * L, z: group.position.z + 0.4,
          vx: Math.cos(a) * speed * CARP_SPLASH_SPREAD, vy: Math.sin(a) * speed * 0.8, vz: carpRand(0.5, 2.5),
          life: carpRand(...CARP_SPLASH_LIFE),
        };
        // 丸い粒（しぶき）と、速さの向きに伸びた線（水滴）を混ぜる
        if (i % 3 === 0) {
          if (drops.list.length < drops.max) drops.list.push({ ...p, a: carpRand(0.5, 0.9) });
        } else if (spray.list.length < spray.max) {
          spray.list.push({ ...p, size: carpRand(...CARP_SPLASH_SIZE), a: carpRand(0.4, 0.9) });
        }
      }
    }
  } else if (name === 'over') {
    // 滝口を越えて、奥の川へ倒れ込む（縁の陰に隠れる）
    const k = smoothstep(u, 0, 1);
    group.position.set(0, mix(CARP_LIP_Y + CARP_CLIMB_LENGTH * (CARP_TOP_RISE - CARP_HEAD), CARP_LIP_Y - 0.3, k), mix(climbZ(CARP_LIP_Y), lipZ(0) - 1.5, k));
    group.scale.setScalar(CARP_CLIMB_SCALE);
    mesh.rotation.set(-Math.PI / 2 * k, 0, 0);
    carp.beat = (carp.beat + dt * CARP_TAIL_BEAT[0]) % TAU;
    drawCarpTop(sp, carp.beat, CARP_TAIL_AMP[0]);
    tintSprite(sp, colors);
  } else if (name === 'dragon') {
    // 遠くの空を、つづら折りの道で昇る。滝口の縁の陰から現れ、空の奥へ遠ざかって小さく薄れて消える。
    // 頭は道を緩急を付けて進み（折り返しでゆっくり）、胴の各点は、道の上で頭から胴の長さぶん後ろまでの所に置く。
    // 胴には、頭から尾へ伝わる小さな波を重ねて、道から少し横へ外す
    carp.dragonPath ??= dragonPath();
    const path = carp.dragonPath, head = path.headAt(mix(path.start, path.end, u));
    const { amp, period, waves } = DRAGON_WAVE, phase = TAU * t / period;
    const body = [];
    for (let i = 0; i <= 48; i++) {
      const s = i / 48, q = head - DRAGON_LENGTH * s;
      const [pu, pv] = path.at(q), [au, av] = path.at(q - 0.5), [bu, bv] = path.at(q + 0.5);
      const len = Math.hypot(bu - au, bv - av), off = amp * smoothstep(s, 0, 0.3) * Math.sin(phase - TAU * waves * s);
      body.push(path.view([pu - (bv - av) / len * off, pv + (bu - au) / len * off]));
    }
    // 板の中心は胴の外接矩形の中心（道が折り返すので、頭と尾の中点では胴が板からはみ出すことがある）
    const us = body.map((b) => b[0]), vs = body.map((b) => b[1]);
    const cu = (Math.min(...us) + Math.max(...us)) / 2, cv = (Math.min(...vs) + Math.max(...vs)) / 2;
    dragon.mesh.position.copy(path.anchor);
    dragon.mesh.lookAt(camera.position);
    dragon.mesh.translateX(cu);
    dragon.mesh.translateY(cv);
    const n = dragon.canvas.width;
    drawDragon(dragon, body.map(([pu, pv]) => [n / 2 + (pu - cu) / DRAGON_SIZE * n, n / 2 - (pv - cv) / DRAGON_SIZE * n]), body.map((b) => b[2]));
    // 遠くの空に霞ませる。遠ざかるほど空の色に寄せ、頭が十分小さくなったら薄れて消える
    const g = body[0][2], { fade, haze } = DRAGON_RECEDE;
    tintSprite(dragon, SCENES[sceneIndex].dragon, DRAGON_HAZE[0] * smoothstep(g, fade[1], fade[0]), mix(DRAGON_HAZE[1], haze, 1 - g), SCENES[sceneIndex].horizon);
  }
}

// ---- カメラ ----
// 縦長の画面では縦の画角を広げて、滝の幅が収まるようにする
function fitCamera() {
  camera.aspect = innerWidth / innerHeight;
  const toRad = THREE.MathUtils.degToRad;
  const fitted = 2 * Math.atan(Math.tan(toRad(CAM_MIN_HFOV) / 2) / camera.aspect);
  camera.fov = Math.max(CAM_FOV, THREE.MathUtils.radToDeg(fitted));
  camera.updateProjectionMatrix();
  updateParticleScale();
}

// ---- シーン切替 ----
function setScene(index) {
  sceneIndex = (index + SCENES.length) % SCENES.length;
  const s = SCENES[sceneIndex];
  skyUniforms.uZenith.value.copy(srgb(s.zenith));
  skyUniforms.uHorizon.value.copy(srgb(s.horizon));
  skyUniforms.uBelow.value.copy(srgb(s.deep));
  const cloud = srgb(s.cloud);
  skyUniforms.uCloud.value.set(cloud.r, cloud.g, cloud.b, s.cloud[3]);
  fireflies.points.visible = s.fireflies;
  for (const mesh of shafts) mesh.visible = s.shafts;
  if (s.disc) {
    skyUniforms.uMoonDir.value.fromArray(s.disc.dir).normalize();
    skyUniforms.uMoonColor.value.fromArray(s.disc.color);
    skyUniforms.uMoonGlow.value.fromArray(s.disc.glow);
    skyUniforms.uMoonCos.value = Math.cos(s.disc.size);
  } else {
    skyUniforms.uMoonColor.value.setRGB(0, 0, 0);
    skyUniforms.uMoonGlow.value.setRGB(0, 0, 0);
  }
  const fog = srgb(s.fog);
  scene.fog.color.copy(fog);
  scene.fog.density = s.fog[3];
  ambientLight.color.copy(srgb(s.ambient.sky));
  ambientLight.groundColor.copy(srgb(s.ambient.ground));
  ambientLight.intensity = s.ambient.intensity;
  keyLight.color.copy(srgb(s.light.color));
  keyLight.intensity = s.light.intensity;
  keyLight.position.fromArray(s.light.dir);
  const foliage = srgb(s.foliage);
  for (const material of foliageMaterials) material.color.copy(foliage);
  for (const material of rimTreeMaterials) material.color.copy(foliage).multiplyScalar(RIM_TREE_BRIGHTNESS);
  streamUniforms.uLit.value.copy(srgb(s.lit));
  streamUniforms.uShade.value.copy(srgb(s.shade));
  streamUniforms.uGlass.value.copy(srgb(s.glass));
  drops.tint = linear(s.spray);
  spray.tint = linear(s.spray);
  mist.tint = linear(s.mist);
  mistOpacity = s.mist[3];
  poolUniforms.uDeep.value.copy(srgb(s.deep));
  poolUniforms.uFoam.value.copy(srgb(s.foam));
  poolUniforms.uFogColor.value.copy(fog);
  poolUniforms.uFogDensity.value = s.fog[3];
  updateRainbow();
  rainbowUniforms.uAntiSun.value.fromArray(s.light.dir).normalize().negate();
  bloom.enabled = s.bloom.strength > 0;
  bloom.strength = s.bloom.strength;
  bloom.threshold = s.bloom.threshold;
  renderer.toneMappingExposure = s.exposure;
  document.getElementById('scene-name').textContent = s.name;
}

// 暗転している間に、次の景色へ
const nextScene = () => fadeAndRun(() => setScene(sceneIndex + 1));

// ---- 強度 ----
// 水量に応じて、中央から順に使う帯の数を変える（滝の幅が広がる）
function setWater(value) {
  water = clamp(value, MIN_WATER, MAX_WATER);
  streamsInUse = clamp(Math.round(STREAM_COUNT * water / MAX_WATER), 1, STREAM_COUNT);
  streamMesh.geometry.setDrawRange(0, streamsInUse * STREAM_SEGMENTS * 6);
  activeHalf = FALL_MIN_HALF;
  for (let i = 0; i < streamsInUse; i++) activeHalf = Math.max(activeHalf, Math.abs(streams[i].x));
  impactHalf = activeHalf * (1 + FALL_FAN);
  streamUniforms.uHalf.value = activeHalf;
  poolUniforms.uForce.value = thin(THIN_FOAM);
  poolUniforms.uImpact.value.set(impactHalf, IMPACT_Z);
  updateRainbow();
}

// ---- メインループ ----
function step(dt) {
  time += dt;
  updateStreams();
  updateBursts(dt);
  updateCarp(dt);   // 登る鯉が跳ねる水しぶきを、水滴・しぶきより先に足す
  updateDrops(dt);
  updateSpray(dt);
  updateMist(dt);
  updateFireflies(dt);
  updateShafts();
  updatePool();
  updateSky();
}

function render() {
  renderer.setRenderTarget(sceneTarget);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);   // composer は最後に、呼ばれたときの描画先へ戻す
  composer.render();
}

let last = performance.now();
function tick(now) {
  // rAF のタイムスタンプは初期の performance.now() より前のことがあるので負にしない
  const dt = Math.max(0, Math.min((now - last) / 1000, 0.1));
  last = now;
  step(dt);
  render();
}

// ---- 入力・UI ----
// 暗転・全画面・カーソルを隠す処理・画面を消さない処理・キーとスワイプ・強度のゲージは common.js
setupControls({
  // シーン切替（Space・左右スワイプ）。暗転して次の場面へ移る。何が変わるかは作品ごとに違う
  changeScene: nextScene,
  // 隠し要素の鯉の滝登りを呼び出す（操作ガイドには表示しない）
  keys: { KeyC: startCarp },
  // 強度（↑↓・上下スワイプ）。強める・弱める処理と、ゲージの位置
  intensity: {
    up: () => setWater(water * WATER_STEP),
    down: () => setWater(water / WATER_STEP),
    level: () => logPosition(water, MIN_WATER, MAX_WATER),   // ゲージの位置（0..1）
  },
  onResize() {
    fitCamera();
    renderer.setSize(innerWidth, innerHeight);
    composer.setSize(innerWidth, innerHeight);
    updateSceneTargetSize();
    updateReflectionSize();
  },
});

// ---- 開始 ----
fitCamera();
updateReflectionSize();
setWater(BASE_WATER);
setScene(randInt(SCENES.length));
// 起動直後から霧が立ちこめている状態にするため、少し先まで進めておく
for (let i = 0; i < 300; i++) step(1 / 30);
renderer.setAnimationLoop(tick);
</script>
</body>
