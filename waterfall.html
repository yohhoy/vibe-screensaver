<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';

// 共通の入力・UI と小さな関数（common.js）
const { TAU, clamp, rand, randIn, randInt, randSign, pick, randomInterval, gray, emit, IS_TOUCH, fadeAndRun, logPosition, setupControls, compactHdrFormat } = Common;

// ---- 設定 ----
// 座標: 滝壺の水面が y = 0、滝の中心が x = 0。カメラは +z の側から -z の向きに滝を見る。長さの単位はメートルのつもり

// カメラ（滝壺の手前から見上げる）
const CAM_POS = [0, 9, 88];
const CAM_TARGET_Y = 23;          // 見る点の高さ
const CAM_FOV = 46;
const CAM_MIN_HFOV = 26;          // 横の画角の下限（度）。縦長の画面では縦の画角を広げて滝の幅を収める

// 水量（倍率）
const BASE_WATER = 1;
const MIN_WATER = 0.13;
const MAX_WATER = 2;
const WATER_STEP = 1.25;          // ↑↓ 1回あたりの倍率
// 水量が 1 より少ないときの変化。倍率 = 水量 ^ この値。大きいほど、水量を減らしたときの変化が強い
const THIN_FOAM = 0.6;            // 泡が広がる距離と、滝の近くの波の強さ
const THIN_MIST_OPACITY = 0.35;   // 霧の不透明度
const THIN_MIST_SIZE = 0.4;       // 霧の大きさ
const THIN_SPRAY = 0.4;           // しぶきの跳ねる速さ

// 滝（水の帯を何本も重ねる。中央の帯から順に使うので、水量が増えると滝の幅が広がる）
const FALL_HEIGHT = 50;           // 滝口の高さ
const FALL_MAX_HALF = 13;         // 水量が最大のときの滝の幅の半分
const STREAM_COUNT = 90;          // 帯の数（水量が最大のとき）
const STREAM_SEGMENTS = 22;       // 帯 1 本の縦の分割数
const STREAM_WIDTH = [1.7, 0.7];  // 帯の幅の半分（滝の中央 / 端）
const STREAM_SPREAD = 0.7;        // 滝壺に着くまでに帯の幅が広がる割合
const STREAM_ORDER_JITTER = 3;    // 中央から順に使う順番の乱れ（距離）
const STREAM_ORDER_CORE = 4;      // 順番を乱さない中央の範囲（距離）。水量が少なくても帯が中央に集まり、濃い水の柱になる
const FALL_MIN_HALF = 2.3;        // いまの滝の幅の半分の下限。水量が少ないときに、霧・しぶき・泡と、端を薄くする範囲が細くなりすぎないように
const FALL_FAN = 0.18;            // 滝壺に着くまでに滝全体の幅が広がる割合
const FALL_WANDER = 2.2;          // 帯が左右に寄り道する幅。隣の帯と揃って動くので、滝の輪郭がでこぼこになる
const STREAM_SWAY = 0.8;          // 帯が風で揺れる幅（滝壺の近くで最大）
const STREAM_SWAY_SPEED = 0.7;    // 帯が風で揺れる速さ（rad/秒）
const FALL_GRAVITY = 9.8;
const LIP_SPEED = [3, 2.2];       // 滝口での水の速さ（下向き、手前向き）
const STREAK_RATE = [0.55, 0.23]; // 筋の模様 2 枚の流れる速さ（1 秒の落下で模様の何枚ぶん進むか）

// 滝のまわりに落ちる水滴と、滝壺から噴き上がる水（線で描く）
const MAX_DROPS = IS_TOUCH ? 1200 : 1500;
const DROP_RATE = 150;            // 1 秒に生まれる数（水量 1 のとき）
const DROP_STREAK = 0.035;        // 線の長さ（速さ × この秒数）

// 滝壺のしぶき
const MAX_SPRAY = 1500;
const SPRAY_RATE = 420;           // 1 秒に生まれる数（水量 1 のとき）
const SPRAY_SPEED = [3, 12];      // 跳ね上がる速さの範囲
const SPRAY_SIZE = [0.05, 0.22];
const SPRAY_GRAVITY = 7;          // 細かい粒なので、空気の抵抗も込みで弱めにする

// 水が砕けて塊で噴き上がる所（1 か所から、しぶきと水煙を少しの間だけ出す）
const BURST_INTERVAL = [0.35, 0.1, 1.2];   // 起こる間隔 [平均, 最短, 最長]（秒。水量 1 のとき）
const BURST_TIME = 0.5;           // 1 回が噴き上がり続ける秒数
const BURST_WIDTH = 2.5;          // 噴き上がる所の幅の半分
const BURST_JET_RATE = IS_TOUCH ? 50 : 100;      // 1 回が 1 秒に出す水の線の数
const BURST_JET_SPEED = [5, 13];  // 水の線が跳ね上がる速さの範囲
const BURST_PUFF_RATE = IS_TOUCH ? 10 : 30;      // 1 回が 1 秒に出す水煙の数
const BURST_PUFF_RISE = [2, 5];   // 水煙が上る速さの範囲

// 滝壺から立ちのぼる霧
const MAX_MIST = IS_TOUCH ? 180 : 560;
const MIST_RATE = IS_TOUCH ? 12 : 34;  // 1 秒に生まれる数（水量 1 のとき）
const MIST_LIFE = [6, 12];        // 消えるまでの秒数の範囲
const MIST_RISE = [1, 2.6];       // 上る速さの範囲
const MIST_DRIFT = 3;             // 手前へ流れる速さの上限
const MIST_SIZE = [7, 27];        // 生まれたとき / 消えるときの大きさ
const BOIL_SHARE = 0.7;           // そのうち、滝の足もとで低くわき立つ霧の割合（滝と水面の境をぼかす）
const BOIL_SPREAD = 1.3;          // 足もとの霧が生まれる幅（滝の幅に対する倍率）

// 崖
const CLIFF_COLS = IS_TOUCH ? 200 : 360;   // 崖の横の分割数
const CLIFF_ROWS = IS_TOUCH ? 100 : 170;   // 崖の縦の分割数
const REFLECTION_CLIFF_SCALE = 0.25;   // 映り込みに描く崖の分割数の倍率（映り込みは小さく、波で揺れるので粗くてよい）
const PLATEAU_ROWS = 10;          // 崖の上の台地の奥行きの分割数
const CLIFF_HALF = 120;           // 崖の横幅の半分
const PLATEAU_DEPTH = 130;        // 崖の上の台地の奥行き
const GORGE_CURVE = 45;           // 崖が両側で手前に迫る量（x = GORGE_WIDTH の所で）
const GORGE_WIDTH = 60;
const RIM_RISE = 7;               // 滝口の両側で崖の上が高くなる量
const LIP_SAG = 2;                // 滝口の線が中央から両端へ上がる量。水は中央のくぼみに集まって落ちる
const LIP_ROUGH = 1.6;            // 滝口の線の細かな高低差
const RECESS = 7;                 // 滝の裏で崖がえぐれている深さ
const TALUS_HEIGHT = 11;          // 崖の足もとの崩れた斜面の高さ
const TALUS_REACH = 20;           // 崩れた斜面が手前へ張り出す長さ
const BLOCK_SIZE = [5, 3.2];      // 岩の塊の幅と高さ（縦の割れ目と地層で区切られる）
const BLOCK_SHIFT = [2.6, [0.4, 1.7]];   // 岩の塊を前後にずらす幅（列ごと、段ごとの [ずれの弱い所, 強い所]）

const MOSS_COLOR = [0.2, 0.3, 0.1];
const GRASS_COLOR = [0.14, 0.23, 0.09];
const ROCK_TILE = 16;             // 岩の模様のテクスチャ 1 枚が受け持つ広さ

// 岩
const BOULDER_COUNT = 40;
const BOULDER_SHAPES = 4;         // 岩の形の種類
const BOULDER_COLOR = [0.3, 0.29, 0.27];
const LIP_ROCK_COUNT = 4;         // 滝口の岩の数
const LIP_ROCK_SIZE = [1.2, 2.6]; // 滝口の岩の大きさの範囲
const LIP_ROCK_REJOIN = 0.3;      // 岩で分かれた水が合流し終える位置（滝口 0 〜 滝壺 1。落ちる時間の割合）

// 木と草木
const CONIFER_SHARE = 0.55;       // 崖の上の木のうち針葉樹の割合
const LEAF_CARD_SCALE = IS_TOUCH ? 0.7 : 1;   // 葉の板の数の倍率。スマホでは減らし、そのぶん板を大きくする
const LEAF_CARD_SIZE = 0.05 / Math.sqrt(LEAF_CARD_SCALE);   // 葉の板の大きさの半分（低木の高さに対する割合）

const CROWN_LEAVES = 260;         // 樹冠 1 つに描く葉の数
const RIM_CONIFER_WIDTH = 0.5;    // 崖の上の針葉樹の板の幅（木の高さに対する割合）。テクスチャの区画と同じ 1:2
const RIM_CONIFER_LAYERS = 8;     // 崖の上の針葉樹の絵の段数
const LEAF_ALPHA_TEST = 0.45;     // 葉の板のテクスチャで、不透明度がこれより低い所を描かない
const RIM_TREE_COUNT = IS_TOUCH ? 160 : 240;   // 崖の上の木の数
const RIM_TREE_HEIGHT = [8, 15];
const RIM_TREE_DEPTH = 65;        // 崖の上の木を置く奥行き。これより奥は崖に隠れて見えない
const RIM_CLEARING = [10, 40];    // 滝口の真上で木を置かない範囲 [中央からの横の距離, 崖の上端からの奥行き]。川の上で、昇り始めの龍が見えるように空ける
const FERN_COUNT = IS_TOUCH ? 60 : 110;    // シダの株の数
const FERN_FRONDS = 9;            // シダ 1 株の葉の枚数

const FERN_COLORS = [[0.05, 0.13, 0.06], [0.15, 0.29, 0.11]];   // シダの色（根もと / 先）
const SHRUB_COUNT = IS_TOUCH ? 12 : 20;    // 低木の数
const SHRUB_SHAPES = 2;           // 低木の形の種類
const SHRUB_CARDS = Math.round(90 * LEAF_CARD_SCALE);       // 低木 1 本の葉の板の数
const SHRUB_SIZE = [3, 6];        // 低木の高さ
const EDGE_PLANT_X = 30;          // これより外側の低い草木は、画面の端を縁取るものとして、高い所まで大きく生やす
const EDGE_PLANT_SHARE = 0.6;     // 低い草木のうち、画面の端に置く割合
const EDGE_PLANT_SCALE = 1.2;     // 画面の端の低い草木の大きさの倍率
const VINE_CLUSTERS = IS_TOUCH ? 7 : 10;   // ツタのまとまりの数
const VINE_LENGTH = [10, 32];     // ツタの板の長さ
const VINE_WIDTH = [7, 12];       // ツタの板の幅
const VINE_ROWS = 8;              // ツタの板を崖に沿わせる分割数
const VINE_SHAPES = 4;            // テクスチャに描くツタの束の種類
const VINE_ALPHA_TEST = 0.3;      // ツタのテクスチャで、不透明度がこれより低い所を描かない。細い筋は遠くで薄まるので、葉より低くする
const VINE_X = [23, 46];          // ツタの束の中心を置く、滝の中央からの横の距離の範囲。滝のすぐ脇を空けて、滝と崖の境を見せる（束の幅のぶん、端はもっと滝に近づく）
const VINE_COLORS = [[0.05, 0.12, 0.04], [0.2, 0.34, 0.1]];   // ツタの色（暗い葉 / 明るい葉）
const FALLEN_LOGS = [             // 倒木。根もとは斜面に、先は水に沈めて、切り口を見せない
  { from: [-40, 3.4, 27], to: [-19, -0.6, 40], radius: 0.8 },
  { from: [36, 2.6, 26], to: [23, -0.6, 34], radius: 0.55 },
];
const LOG_COLOR = [0.18, 0.15, 0.12];
const LOG_SEGMENTS = 6;           // 倒木を区切る数。区切りごとに苔の色を変える
const LOG_SIDES = 10;             // 倒木の角数
const FIREFLY_COUNT = 36;         // 蛍の数（Midnight だけ）
const FIREFLY_COLOR = [1.5, 2, 0.55];   // 蛍の色（線形の値。1 を超えるとブルームで光る）
const FIREFLY_SIZE = 0.5;         // 蛍の大きさ
const FIREFLY_MIST_GAP = 10;      // 足もとの霧の生まれる幅から蛍を離す距離（水量 1 のとき）。霧の中には飛ばさない
const FIREFLY_REACH = [30, 36];   // 蛍が飛ぶ範囲 [霧の外から横へ, 崖の前から手前へ]。カメラのそばには飛ばさない
const FIREFLY_FOLLOW = 0.5;       // 水量が変わったときに、蛍の範囲が追いつく速さ（1 秒あたりの割合）
const FIREFLY_FAR_ALPHA = 0.5;    // いちばん奥の蛍の明るさの倍率
const FIREFLY_DRIFT = [2.5, 1.2, 2.5];   // 蛍が漂う幅 (x, y, z)
const FIREFLY_BLINK = [0.5, 1.1];  // 蛍の明滅の速さの範囲（rad/秒）
const SHAFT_COUNT = 2;            // 光の筋の板の数（Sunset だけ）
const SHAFT_COLOR = [1, 0.5, 0.2];   // 光の筋の色（線形の値）
const SHAFT_OPACITY = 0.18;       // 光の筋の濃さ
const SHAFT_SOURCE = [12, 60];    // 光の筋が差し込み始める位置 (x, y)。滝口のあたり
const SHAFT_ANGLE = 0.55;         // 光の筋の傾き（rad。水平から）
const SHAFT_SIZE = [75, 26];      // 光の筋の板の長さと幅
const SHAFT_PULSE = [0.3, 0.17];  // 光の筋の濃さの揺らぎ [幅（割合）, 速さ（rad/秒）]
const VIEW_SLOPE = 1.05;          // 画面に入る横の広がり（横の画角の半分の tan）。21:9 まで収まる値。これより外には木や草木を置かない
const CONIFER_COLORS = [[0.03, 0.08, 0.05], [0.16, 0.3, 0.16]];     // 針葉樹の枝の色（根もと / 先）
const RIM_TREE_BRIGHTNESS = 2;    // 崖の上の木の板（樹冠・針葉樹）の明るさ。景色の foliage にさらに掛ける。空を背にして黒い影に沈まないように
const BROADLEAF_COLORS = [[0.06, 0.13, 0.05], [0.3, 0.43, 0.16]];   // 広葉樹と低木の葉の色（暗い葉 / 明るい葉）
const TRUNK_COLOR = [0.2, 0.16, 0.12];

// 滝壺の水面
const POOL_SIZE = 700;
const REFLECTION_SIZE = IS_TOUCH ? 256 : 360;   // 水面に映す景色を描く解像度（画面の高さに当たる画素数）
const FOAM_REACH = 20;            // 泡が滝壺から広がる距離（1/e になる距離）
const WAVE_SPEED = [0.05, 0.12, 0.09];   // 波 2 枚と泡の模様が外へ流れる速さ（1 秒に模様の何枚ぶんか）
const WAVE_STRENGTH = 0.05;       // 波で映り込みが揺れる強さ
const SWELL_LENGTH = 13;          // 滝壺から外へ押し出す白波の輪の間隔
const SWELL_SPEED = 7;            // 白波の輪が広がる速さ（1 秒の距離）

// 空
const SKY_RADIUS = 900;
const CLOUD_SPEED = 0.003;        // 雲の流れる速さ（1 秒に模様の何枚ぶんか）

// 虹（太陽と反対の向きを中心にした円。昼の景色だけ）
const RAINBOW_RADIUS = [40.5, 42.5];   // 虹の内側 / 外側の半径（度）
const RAINBOW_TINT = 3.5;          // 下の景色の色を虹の色に置き換える強さ。大きいほど、白い滝の上で色がはっきりする
const RAINBOW_SPREAD = 14;         // 霧の広がり。滝の端からこのくらいの距離で虹が薄れる
const RAINBOW_TOP = 38;            // 虹が消える高さ

// 鯉の滝登り（隠し要素）。鯉が滝壺から滝を登って滝口の奥へ去り、少しおいて遠くの空を龍が昇る
const CARP_INTERVAL = [640, 300, 1200];   // 現れる間隔 [指数分布の平均, 下限, 上限]（秒）。下限・上限で丸めたあとの実際の平均が約 600 秒になる値
const CARP_LENGTH = 6;             // 鯉の板の一辺（鯉の全長とほぼ同じ）。実物より大きくして、遠くからでも形が分かるようにする
const CARP_SWIM_TIME = 8;          // 手前から滝の足もとの霧の手前まで泳ぐ秒数
const CARP_SWIM_FROM = [5, 58];    // 泳ぎ始める位置（滝の中央からの横の距離, z）。画面の下端の少し外
const CARP_SWIM_DEPTH = 0.4;       // 泳ぐ深さ。水面は奥行きを書かないので、水中の鯉が透けて見える
const CARP_WATER_STRETCH = 3.2;    // 水中の鯉を奥行きの向きに伸ばす倍率。低い所から斜めに見るので、そのままだと細い線につぶれる
const CARP_WATER_ALPHA = 0.75;     // 水中の鯉の不透明度
const CARP_WATER_TINT = 0.35;      // 水中の鯉の色を、水の色へ寄せる割合
const CARP_SWIM_GAP = 8;           // 泳ぐ道の終わりの、滝の落ちる線より手前への距離。足もとの霧の手前で泳ぎ終え、すぐに登り始める（霧の中を泳ぐ間は見えず、間延びする）
const CARP_FADE = [0.75, 1];       // 泳ぐ道のこの区間（0 = 手前 〜 1 = 終わり）で薄れて消える。登り始めへの切り替わりを見せない
const CARP_APPEAR = 2.0;           // 登り始めに、滝の足もとから現れるまでの秒数
const CARP_CLIMB_TIME = 8;         // 滝を登る秒数
const CARP_CLIMB_SCALE = 0.8;      // 滝を登るときの鯉の大きさの倍率（泳ぐときに対して）

const CARP_CLIMB_SURGE = 0.75;     // 勢いの強さ（0 で一定の速さ、1 で勢いの合間に止まる）
const CARP_FRONT = 1.2;            // 落ちる水より手前に置く距離
const CARP_SPLASH_INTERVAL = 0.35; // 登る間に水しぶきを跳ね散らす間隔（秒）

const CARP_SPLASH_SPEED = [3, 8];  // しぶきの飛ぶ速さの範囲

// ---- ユーティリティ ----
const GOLDEN_RATIO = 0.618034;    // この割合ずつずらすと、何個並べても偏らない
const { smoothstep } = THREE.MathUtils;   // smoothstep(x, min, max)

// 画面に出る色 [r, g, b]（sRGB）を THREE.Color に
const srgb = (c) => new THREE.Color().setRGB(c[0], c[1], c[2], THREE.SRGBColorSpace);
// 同じ色を、線形の [r, g, b] の配列で
const linear = (c) => srgb(c).toArray();
const mix = (a, b, t) => a + (b - a) * t;

// なめらかなノイズ（値ノイズ）。戻り値は 0..1
function hash2(i, j) {
  const s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453;
  return s - Math.floor(s);
}
// 格子点の値 at(i, j) をなめらかにつなぐ
function smoothLattice(x, y, at) {
  const i = Math.floor(x), j = Math.floor(y);
  const u = x - i, v = y - j;
  const su = u * u * (3 - 2 * u), sv = v * v * (3 - 2 * v);
  return mix(mix(at(i, j), at(i + 1, j), su), mix(at(i, j + 1), at(i + 1, j + 1), su), sv);
}
const valueNoise = (x, y) => smoothLattice(x, y, hash2);
// 細かさの違うノイズを 4 枚重ねる。戻り値はほぼ 0..1
function fbm(x, y) {
  let sum = 0, amp = 0.53;
  for (let k = 0; k < 4; k++) {
    sum += amp * valueNoise(x, y);
    x = x * 2.03 + 17.3;
    y = y * 2.03 + 9.1;
    amp *= 0.5;
  }
  return sum;
}

// 崖の上端の高さ。滝口は FALL_HEIGHT のあたりで、両側へ高くなる
function rimY(x) {
  const center = Math.exp(-((x / (FALL_MAX_HALF * 1.8)) ** 4));
  const sag = 1 - Math.exp(-((x / FALL_MAX_HALF) ** 2));
  const lip = LIP_SAG * sag + center * LIP_ROUGH * (fbm(x * 0.25, 6.2) - 0.5);
  const rim = (1 - center) * (RIM_RISE + 7 * fbm(x * 0.04, 3.7) + 14 * (x / 130) ** 2);
  return FALL_HEIGHT + lip + rim;
}

// 滝口の奥行きの位置（崖の凹凸を除いた、弧を描く崖の線）
const lipZ = (x) => GORGE_CURVE * (x / GORGE_WIDTH) ** 2;

// 崖の面の奥行きの位置。高さ y、横の位置 x の点の z を返す
function wallZ(x, y) {
  const top = rimY(x);
  const below = top - y;   // 崖の上端から下へ測った距離
  const fall = Math.exp(-((x / FALL_MAX_HALF) ** 4));   // 滝の裏か（中央で 1）
  // 滝口のあたりは凹凸を抑え、水の帯が崖に埋もれないようにする
  const rough = 1 - fall * (1 - smoothstep(below, 0, 6));
  let z = lipZ(x);
  z += rough * 9 * (fbm(x * 0.03, y * 0.035) - 0.5);                  // 大きなうねり
  // 縦の割れ目と地層で区切られた岩の塊。列ごと・段ごとに前後にずらす
  const col = Math.floor((x + 9 * fbm(y * 0.04, 2.5)) / BLOCK_SIZE[0]);
  const row = Math.floor((y + 5 * fbm(x * 0.03, 8.5)) / BLOCK_SIZE[1]);
  // 段のずれは所々だけ強くする。どこも同じだと、段の影が崖の端から端まで黒い線で続く
  const rowShift = mix(BLOCK_SHIFT[1][0], BLOCK_SHIFT[1][1], smoothstep(fbm(x * 0.05 + 14, y * 0.07), 0.4, 0.65));
  z += rough * (BLOCK_SHIFT[0] * (hash2(col, 5) - 0.5) + rowShift * (hash2(col, row) - 0.5));
  z += rough * 2.2 * (fbm(x * 0.35, y * 0.35) - 0.5);                 // 細かな凹凸
  z -= RECESS * fall * smoothstep(below, 0.5, 9);                     // 滝の裏はえぐれている
  const talus = clamp(1 - y / TALUS_HEIGHT, 0, 1);                    // 足もとの崩れた斜面（滝の近くには無い）
  z += TALUS_REACH * talus * talus * smoothstep(Math.abs(x), 16, 42);
  return z;
}

// 崖の上の台地の高さ。d は崖の上端から奥へ測った距離
const plateauY = (x, d) => rimY(x) + 0.06 * d + 9 * fbm(x * 0.012 + 3, d * 0.012) * smoothstep(d, 0, 60);

// 滝の水の落ちる位置。滝口 (x, y0, z0) から t 秒落ちた所の y と z
const fallY = (y0, t) => y0 - LIP_SPEED[0] * t - 0.5 * FALL_GRAVITY * t * t;
const fallZ = (z0, t) => z0 + LIP_SPEED[1] * t;
// 滝口の高さ y0 から水面に着くまでの秒数
const fallTime = (y0) => (-LIP_SPEED[0] + Math.sqrt(LIP_SPEED[0] ** 2 + 2 * FALL_GRAVITY * y0)) / FALL_GRAVITY;
// 水が水面に着く線の、滝口より手前への距離
const IMPACT_Z = fallZ(0, fallTime(FALL_HEIGHT));

// ---- シェーダー ----
// 空のグラデーションと雲、月。見上げた空しか映らないので、グラデーションは高い所まで伸ばす
const SkyShader = {
  uniforms: {
    uZenith: { value: new THREE.Color() },
    uHorizon: { value: new THREE.Color() },
    uBelow: { value: new THREE.Color() },                   // 崖より低い所の色
    uCloud: { value: new THREE.Vector4(0, 0, 0, 0) },       // 雲の色と濃さ
    uMoonDir: { value: new THREE.Vector3(0, 1, 0) },
    uMoonColor: { value: new THREE.Color(0, 0, 0) },
    uMoonGlow: { value: new THREE.Color(0, 0, 0) },
    uMoonCos: { value: 1 },                                 // 月の半径の cos
    uNoise: { value: null },
    uCloudPhase: { value: 0 },                              // 雲が流れる位相（0..1。JS で求める）
  },
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main() {
      vDir = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform vec3 uZenith, uHorizon, uBelow, uMoonDir, uMoonColor, uMoonGlow;
    uniform vec4 uCloud;
    uniform float uMoonCos, uCloudPhase;
    uniform sampler2D uNoise;
    varying vec3 vDir;
    void main() {
      vec3 d = normalize(vDir);
      vec3 col = mix(uHorizon, uZenith, smoothstep(0.1, 0.7, d.y));
      // 雲: 空を平面とみなしてノイズを貼る
      vec2 p = d.xz / (abs(d.y) + 0.25);
      float n = texture2D(uNoise, p * 0.6 + vec2(uCloudPhase, 0.0)).r;
      col = mix(col, uCloud.rgb, uCloud.a * smoothstep(0.54, 0.72, n));
      // 月
      float m = dot(d, uMoonDir);
      col += uMoonColor * smoothstep(uMoonCos, uMoonCos + 0.00004, m) + uMoonGlow * pow(max(m, 0.0), 300.0);
      // 崖より低い空は映り込みの描画先にしか出ない。そこでは水面の下に入った光線が岩の裏を抜けて空に届く。
      // 波で読む位置がずれたときに、岸の下で空の色を拾わないように塗りつぶす
      gl_FragColor = vec4(d.y < 0.18 ? uBelow : col, 1.0);
    }`,
};

// 滝の水の帯。縦の座標を「落ちた秒数」にして筋の模様を流すと、下へ行くほど模様が伸びて速くなる
const StreamShader = {
  uniforms: {
    uStreak: { value: null },
    uPhase: { value: new THREE.Vector2() },       // 筋の模様 2 枚の流れる位相（0..1。JS で求める）
    uSway: { value: 0 },                          // 風で揺れる位相（0..2π。JS で求める）
    uLit: { value: new THREE.Color() },
    uShade: { value: new THREE.Color() },
    uGlass: { value: new THREE.Color() },
    uHalf: { value: 1 },                          // いまの滝の幅の半分（滝口）
  },
  vertexShader: /* glsl */`
    attribute float aSide;    // 帯の幅の向きの位置（-1..1）
    attribute float aTime;    // 滝口から落ちた秒数
    attribute float aFall;    // 滝口から滝壺までの位置（0..1）
    attribute float aSeed;    // 帯ごとの乱数（0..1）
    uniform float uSway;
    varying float vSide, vTime, vFall, vSeed, vX;
    void main() {
      vSide = aSide;
      vTime = aTime;
      vFall = aFall;
      vSeed = aSeed;
      vX = position.x;
      vec3 p = position;
      p.x += ${STREAM_SWAY.toFixed(2)} * aFall * aFall * sin(uSway + aSeed * 6.0 + p.y * 0.08);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform sampler2D uStreak;
    uniform vec2 uPhase;
    uniform vec3 uLit, uShade, uGlass;
    uniform float uHalf;
    varying float vSide, vTime, vFall, vSeed, vX;
    void main() {
      float a = texture2D(uStreak, vec2(vX * 0.09 + vSeed, vTime * ${STREAK_RATE[0].toFixed(3)} + vSeed * 3.0 - uPhase.x)).r;
      float b = texture2D(uStreak, vec2(vX * 0.035 + vSeed * 5.0, vTime * ${STREAK_RATE[1].toFixed(3)} + vSeed * 7.0 - uPhase.y)).r;
      float foam = (a * 0.75 + b * 0.65) * (0.5 + 0.8 * vSeed);   // 帯ごとに白さを変えて、縦の柱の模様にする
      float edge = 1.0 - vSide * vSide;
      float aerated = smoothstep(0.0, 0.16, vFall);   // 滝口はなめらかで、落ちるにつれて白く泡立つ
      vec3 col = mix(uShade, uLit, smoothstep(0.2, 0.85, foam));
      col = mix(uGlass, col, aerated);
      float alpha = edge * mix(0.6, 0.1 + 0.7 * smoothstep(0.1, 0.75, foam), aerated);
      float halfHere = uHalf * (1.0 + ${FALL_FAN.toFixed(2)} * vFall);   // その高さでの滝の幅の半分
      alpha *= 0.3 + 0.7 * smoothstep(1.0, 0.65, abs(vX) / halfHere);   // 滝の端ほど薄く、岩が透けて見える
      gl_FragColor = vec4(col, alpha * (1.0 - smoothstep(0.93, 1.0, vFall)));
    }`,
};

// しぶきと霧の粒。粒ごとに色・不透明度・大きさ・向きを持つ
const ParticleShader = {
  vertexShader: /* glsl */`
    attribute vec4 color;     // rgb と不透明度
    attribute float size;     // 大きさ（ワールドの単位）
    attribute float angle;    // テクスチャの向き (rad)
    uniform float uScale;     // 距離 1 で大きさ 1 の粒が何画素になるか
    uniform float uMinSize;   // 遠くても小さくしすぎない画素数
    varying vec4 vColor;
    varying vec2 vRot;
    void main() {
      vColor = color;
      vRot = vec2(cos(angle), sin(angle));
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = max(size * uScale / -mv.z, uMinSize);
    }`,
  fragmentShader: /* glsl */`
    uniform sampler2D uMap;
    varying vec4 vColor;
    varying vec2 vRot;
    void main() {
      vec2 p = gl_PointCoord - 0.5;
      p = vec2(p.x * vRot.x - p.y * vRot.y, p.x * vRot.y + p.y * vRot.x) + 0.5;
      gl_FragColor = vec4(vColor.rgb, vColor.a * texture2D(uMap, p).r);
    }`,
};

// 滝壺の水面。Reflector が描いた映り込みを波で揺らし、滝壺のまわりに泡を重ねる
const PoolShader = {
  uniforms: {
    color: { value: null },
    tDiffuse: { value: null },
    textureMatrix: { value: null },
    uNoise: { value: null },
    uPhase: { value: new THREE.Vector3() },       // 波 2 枚と泡の模様が流れる位相（0..1。JS で求める）
    uImpact: { value: new THREE.Vector2() },      // 滝の落ちる線の (幅の半分, z)
    uDeep: { value: new THREE.Color() },
    uFoam: { value: new THREE.Color() },
    uFogColor: { value: new THREE.Color() },
    uFogDensity: { value: 0 },
    uForce: { value: 1 },                         // 泡が広がる距離と滝の近くの波の倍率（水量が少ないほど小さい）
    uSwell: { value: 0 },                         // 白波の輪の位相（0..2π。JS で求める）
  },
  vertexShader: /* glsl */`
    uniform mat4 textureMatrix;
    varying vec4 vReflect;
    varying vec3 vPos;
    void main() {
      vReflect = textureMatrix * vec4(position, 1.0);
      vec4 world = modelMatrix * vec4(position, 1.0);
      vPos = world.xyz;
      gl_Position = projectionMatrix * viewMatrix * world;
    }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse, uNoise;
    uniform vec3 uPhase, uDeep, uFoam, uFogColor;
    uniform vec2 uImpact;
    uniform float uFogDensity, uForce, uSwell;
    varying vec4 vReflect;
    varying vec3 vPos;
    void main() {
      // 滝の落ちる線からの距離 d と、そこから放射状に流れる座標 flow
      vec2 p = vec2(vPos.x, vPos.z - uImpact.y);
      float d = length(vec2(max(abs(p.x) - uImpact.x, 0.0), p.y));
      vec2 flow = vec2(p.x / (1.0 + d * 0.035), d);
      // 波。滝に近いほど大きく揺らす
      vec2 w1 = texture2D(uNoise, flow * vec2(0.03, 0.06) - vec2(0.0, uPhase.x)).gb - 0.5;
      vec2 w2 = texture2D(uNoise, flow * vec2(0.3, 0.22) - vec2(0.0, uPhase.y)).gb - 0.5;
      vec2 tilt = (w1 + w2 * 0.45) * ${WAVE_STRENGTH.toFixed(3)} * (1.0 + 2.5 * uForce * exp(-d / 40.0));
      // 映り込み（縦に長く揺らす）とフレネル
      vec3 view = normalize(cameraPosition - vPos);
      float fresnel = 0.05 + 0.95 * pow(1.0 - clamp(view.y + tilt.y, 0.0, 1.0), 4.0);
      vec3 refl = texture2D(tDiffuse, vReflect.xy / vReflect.w + tilt * vec2(0.05, 1.6)).rgb;
      vec3 col = mix(uDeep, refl, fresnel);
      // 泡。滝に近いほど多く、外へ流れながら細かくなって消える
      float reach = exp(-d / (${FOAM_REACH.toFixed(1)} * uForce));
      float n = texture2D(uNoise, flow * vec2(0.16, 0.09) - vec2(0.0, uPhase.z)).r * 0.6
              + texture2D(uNoise, flow * vec2(0.55, 0.3) - vec2(0.0, uPhase.z * 2.0)).g * 0.4;
      // 輪の山では泡が増える。模様で位相をずらして、輪が切れ切れの白波に見えるようにする
      float swell = smoothstep(0.3, 1.0, sin(d * ${(TAU / SWELL_LENGTH).toFixed(3)} - uSwell + n * 4.0));
      float edge = mix(0.7, 0.2, reach) - 0.3 * swell;
      float foam = smoothstep(edge, edge + 0.3, n);
      col = mix(col, uFoam, foam * smoothstep(0.12, 0.55, reach));
      // 遠くを霞ませる
      float fog = uFogDensity * length(cameraPosition - vPos);
      gl_FragColor = vec4(mix(uFogColor, col, exp(-fog * fog)), 1.0);
    }`,
};

// 虹。太陽と反対の向きを中心にした円。カメラから見た向きで決まるので、霧の前の 1 枚の板に描く。
// 色を足しつつ下の景色を少し薄める。暗い岩の上では光って見え、白い滝の上でも淡い色として見える
const RainbowShader = {
  uniforms: {
    uAntiSun: { value: new THREE.Vector3(0, -1, 0) },
    uStrength: { value: 0 },
    uReach: { value: 1 },     // 霧の届く横の距離
  },
  vertexShader: /* glsl */`
    varying vec3 vPos;
    void main() {
      vec4 world = modelMatrix * vec4(position, 1.0);
      vPos = world.xyz;
      gl_Position = projectionMatrix * viewMatrix * world;
    }`,
  fragmentShader: /* glsl */`
    uniform vec3 uAntiSun;
    uniform float uStrength, uReach;
    varying vec3 vPos;
    void main() {
      float angle = degrees(acos(dot(normalize(vPos - cameraPosition), uAntiSun)));
      float t = (angle - ${RAINBOW_RADIUS[0].toFixed(1)}) / ${(RAINBOW_RADIUS[1] - RAINBOW_RADIUS[0]).toFixed(1)};
      if (t < -0.3 || t > 1.3) discard;
      // 内側が紫、外側が赤。赤・緑・青の山を重ねると、間に黄色や水色ができる。内側の端に赤を少し足して紫にする
      vec3 d = (t - vec3(0.8, 0.5, 0.2)) / 0.22;
      vec3 spectrum = exp(-d * d) + vec3(0.35, 0.0, 0.0) * exp(-t * t / 0.02);
      // 太陽の大きさのぶん色が混ざるので、少し白っぽくする
      spectrum = spectrum * 0.75 + 0.25 * (spectrum.r + spectrum.g + spectrum.b) / 3.0;
      // 霧のある所にだけ見える（低い所、滝の近く）
      float x = vPos.x / uReach;
      float mist = smoothstep(0.0, 3.0, vPos.y) * smoothstep(${RAINBOW_TOP.toFixed(1)}, 16.0, vPos.y) * exp(-x * x);
      float amount = uStrength * mist;
      gl_FragColor = vec4(spectrum * amount, amount * ${RAINBOW_TINT.toFixed(1)} * max(spectrum.r, max(spectrum.g, spectrum.b)));
    }`,
};

// ---- three.js 初期化 ----
// シーンはブルーム用の別の描画先に描くので、画面側のアンチエイリアスは効かない。無駄なので切る
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, IS_TOUCH ? MAX_PIXEL_RATIO.touch : MAX_PIXEL_RATIO.pc));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0);
const camera = new THREE.PerspectiveCamera(CAM_FOV, innerWidth / innerHeight, 0.5, SKY_RADIUS * 1.5);
camera.position.set(...CAM_POS);
camera.lookAt(0, CAM_TARGET_Y, 0);

// 全画面の描画先の色の形式は compactHdrFormat（common.js）で選ぶ。不透明度は使わない
// マルチサンプルにするのはシーンを描く描画先だけ。後段のブルームと合成までマルチサンプルにすると、全画面の処理がとても重くなる
const sceneSamples = renderer.getPixelRatio() < MSAA_OFF_PIXEL_RATIO ? MSAA_SAMPLES : 0;
const sceneTarget = new THREE.WebGLRenderTarget(1, 1,
  { type: THREE.HalfFloatType, ...compactHdrFormat(renderer, sceneSamples), samples: sceneSamples });
function updateSceneTargetSize() {
  const pr = renderer.getPixelRatio();
  sceneTarget.setSize(Math.round(innerWidth * pr), Math.round(innerHeight * pr));
}
updateSceneTargetSize();

const composer = new EffectComposer(renderer,
  new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, ...compactHdrFormat(renderer), depthBuffer: false }));
composer.setPixelRatio(renderer.getPixelRatio());
composer.setSize(innerWidth, innerHeight);
const scenePass = new TexturePass(sceneTarget.texture);
scenePass.material.blending = THREE.NoBlending;   // 加算合成で不透明度が 1 を超えても、色をそのまま写す
composer.addPass(scenePass);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0, 0.6, 1);
// composer が渡す大きさより粗く描く
const setBloomSize = bloom.setSize.bind(bloom);
bloom.setSize = (width, height) => setBloomSize(width * BLOOM_SCALE, height * BLOOM_SCALE);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const ambientLight = new THREE.HemisphereLight(0xffffff, 0xffffff, 1);
scene.add(ambientLight);
const keyLight = new THREE.DirectionalLight(0xffffff, 1);
scene.add(keyLight);

// 映り込みに描かないものを置くレイヤー。水面に映る範囲にほとんど入らないものと、映っても見分けられない細かいもの
const MAIN_ONLY_LAYER = 1;
camera.layers.enable(MAIN_ONLY_LAYER);

// ---- 状態 ----
let water = BASE_WATER;    // 水量
const thin = (power) => Math.min(1, water ** power);   // 水量が 1 より少ないほど小さくなる倍率。水量が 1 以上なら 1
let time = 0;              // 経過秒
let sceneIndex = 0;        // いまの景色
let streamsInUse = 0;      // いま描いている水の帯の数
let activeHalf = 0;        // いまの滝の幅の半分（滝口）
let impactHalf = 0;        // いまの滝の幅の半分（水面に落ちる所）
let mistOpacity = 0;       // いまの景色の霧の不透明度

// ---- テクスチャ ----
const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();

// canvas に描くテクスチャ。background で塗ってから draw(context, 一辺の画素数) で描く。wrap を省くと繰り返して貼れる
function canvasTexture(n, draw, { background = null, flipY = true, wrap = THREE.RepeatWrapping } = {}) {
  const c = document.createElement('canvas');
  c.width = c.height = n;
  const g = c.getContext('2d');
  if (background) {
    g.fillStyle = background;
    g.fillRect(0, 0, n, n);
  }
  draw(g, n);
  const texture = new THREE.CanvasTexture(c);
  texture.wrapS = texture.wrapT = wrap;
  texture.flipY = flipY;
  texture.anisotropy = maxAnisotropy;
  return texture;
}

// 繰り返して貼れるノイズ。r, g, b は別々の模様。雲と水面の波・泡に使う
const noiseTexture = (() => {
  const n = 256;
  const wrap = THREE.MathUtils.euclideanModulo;
  // 周期 period の格子で繰り返す値ノイズ
  const tile = (x, y, period, seed) => smoothLattice(x, y, (a, b) => hash2(wrap(a, period) + seed, wrap(b, period) - seed));
  const data = new Uint8Array(n * n * 4);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    for (let c = 0; c < 3; c++) {
      let sum = 0, amp = 0.5, period = 6;
      for (let k = 0; k < 5; k++) {
        sum += amp * tile(x / n * period, y / n * period, period, 31.7 * (c + 1) + k * 5.3);
        amp *= 0.5;
        period *= 2;
      }
      data[(y * n + x) * 4 + c] = clamp(sum * 1.04, 0, 1) * 255;
    }
    data[(y * n + x) * 4 + 3] = 255;
  }
  const texture = new THREE.DataTexture(data, n, n, THREE.RGBAFormat);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.magFilter = THREE.LinearFilter;
  texture.minFilter = THREE.LinearMipmapLinearFilter;
  texture.generateMipmaps = true;
  texture.anisotropy = maxAnisotropy;
  texture.needsUpdate = true;
  return texture;
})();

// 滝の筋の模様。頭（下）が明るく尾（上）へ薄れる細長い水塊を散らす。canvas の下がテクスチャの v の大きい側
const streakTexture = canvasTexture(512, (g, n) => {
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 420; i++) {
    const x = rand(0, n), y = rand(0, n), w = rand(1.5, 8), h = rand(30, 240), a = rand(0.15, 0.7);
    const grad = g.createLinearGradient(0, y, 0, y + h);
    grad.addColorStop(0, gray(255, 0));
    grad.addColorStop(0.7, gray(255, a));
    grad.addColorStop(1, gray(255, 0));
    g.fillStyle = grad;
    // 繰り返し貼っても継ぎ目が出ないよう、端をはみ出す水塊は反対側にも描く（グラデーションごとずらす）
    for (const dx of [-n, 0, n]) for (const dy of [-n, 0]) {
      g.setTransform(1, 0, 0, 1, dx, dy);
      g.beginPath();
      g.ellipse(x, y + h / 2, w, h / 2, 0, 0, TAU);
      g.fill();
    }
  }
}, { background: '#000', flipY: false });

// 岩の模様。灰色の地に、明暗のまだらと横に走る細い割れ目と細かい粒を描く。色は頂点の色で付ける
const rockTexture = canvasTexture(512, (g, n) => {
  const each = (x, y, r, draw) => {
    for (const dx of [-n, 0, n]) for (const dy of [-n, 0, n]) if (Math.hypot(x + dx - n / 2, y + dy - n / 2) < n + r) draw(x + dx, y + dy);
  };
  for (let i = 0; i < 90; i++) {
    const x = rand(0, n), y = rand(0, n), r = rand(20, 80), v = Math.floor(rand(90, 240));
    each(x, y, r, (px, py) => {
      const grad = g.createRadialGradient(px, py, 0, px, py, r);
      grad.addColorStop(0, gray(v, 0.45));
      grad.addColorStop(1, gray(v, 0));
      g.fillStyle = grad;
      g.fillRect(px - r, py - r, r * 2, r * 2);
    });
  }
  g.lineCap = 'round';
  for (let i = 0; i < 40; i++) {
    const x = rand(0, n), y = rand(0, n), len = rand(20, 90), slope = rand(-0.5, 0.5);
    each(x, y, len, (px, py) => {
      g.strokeStyle = gray(Math.floor(rand(20, 70)), rand(0.3, 0.7));
      g.lineWidth = rand(0.8, 2.6);
      g.beginPath();
      g.moveTo(px, py);
      g.lineTo(px + len, py + len * slope);
      g.stroke();
    });
  }
  for (let i = 0; i < 9000; i++) {
    g.fillStyle = gray(Math.floor(rand(40, 255)), rand(0.15, 0.5));
    g.fillRect(rand(0, n), rand(0, n), rand(1, 2.5), rand(1, 2.5));
  }
}, { background: gray(165) });

// ふちのぼけた白い円（しぶき、蛍）
const softDotTexture = canvasTexture(64, (g, n) => {
  const r = n / 2;
  const grad = g.createRadialGradient(r, r, 0, r, r, r);
  [[0, 1], [0.35, 0.55], [1, 0]].forEach(([t, a]) => grad.addColorStop(t, gray(255, a)));
  g.fillStyle = grad;
  g.fillRect(0, 0, n, n);
}, { background: '#000' });

// 霧の 1 かたまり。ぼけた円をいくつか重ねて、丸く見えないようにする
const puffTexture = canvasTexture(128, (g, n) => {
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 16; i++) {
    const a = rand(0, TAU), d = rand(0, n * 0.3);
    const x = n / 2 + Math.cos(a) * d, y = n / 2 + Math.sin(a) * d, r = rand(n * 0.08, n * 0.2);
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, gray(255, 0.32));
    grad.addColorStop(1, gray(255, 0));
    g.fillStyle = grad;
    g.fillRect(0, 0, n, n);
  }
  // 粒を回すと四角の隅がテクスチャの外を読む。繰り返すと反対側の模様を拾い、粒の四角の角が見える
}, { background: '#000', wrap: THREE.ClampToEdgeWrapping });

// 葉の束。透明の地に細長い葉を散らす。先に暗い葉を、あとから明るい葉を描き、束に奥行きを出す。色は頂点の色で付ける。
const leafTexture = canvasTexture(256, (g, n) => {
  const count = 240;
  const c = n / 2;   // 葉の束の中心
  for (let i = 0; i < count; i++) {
    // 小さな房を 6 つ集めて置く。一様に散らすと、板 1 枚が丸い円盤に見える。板のふちまでは届かせない（四角い輪郭を見せない）
    const tuft = i % 6 / 6 * TAU;
    const a0 = rand(0, TAU), d0 = c * 0.38 * Math.sqrt(Math.random());
    const px = Math.cos(tuft) * c * 0.46 + Math.cos(a0) * d0, py = Math.sin(tuft) * c * 0.46 + Math.sin(a0) * d0;
    const len = rand(n * 0.047, n * 0.082);
    const v = Math.floor(mix(150, 255, i / count) * rand(0.9, 1));
    g.fillStyle = gray(v);
    g.beginPath();
    g.ellipse(c + px, n - c + py, len, len * 0.42, rand(0, TAU), 0, TAU);
    g.fill();
  }
});

// ツタの束を描く。横に VINE_SHAPES 個の区画に分け、区画の上から筋を何本も垂らして葉を付ける。色は頂点の色で付ける
const vineTexture = canvasTexture(512, (g, n) => {
  const w = n / VINE_SHAPES;
  for (let shape = 0; shape < VINE_SHAPES; shape++) {
    for (let strand = 0; strand < 5; strand++) {
      // 筋ごとに始まる高さをずらす。揃えると、束の上端が四角く切れて見える
      const y0 = n * rand(0, 0.25) * Math.random();
      const x0 = (shape + rand(0.2, 0.8)) * w, length = (n - y0) * mix(0.3, 0.97, Math.random() ** 1.3);
      const phase = rand(0, TAU), wave = rand(1.5, 4);
      for (let i = 0; i < 70; i++) {
        const t = i / 70;
        const r = mix(9, 4, t) * rand(0.7, 1.2);   // 細いと、遠くで透明として捨てられて消える
        g.fillStyle = gray(Math.floor(rand(130, 255)));
        g.beginPath();
        g.ellipse(x0 + wave * Math.sin(t * length * 0.035 + phase) + rand(-2.5, 2.5), y0 + t * length + 3, r, r * 0.6, rand(0, TAU), 0, TAU);
        g.fill();
      }
    }
  }
});

// 崖の上の広葉樹の樹冠を丸ごと描く。2 × 2 の区画に 1 種類ずつ。色は頂点の色で付ける。
// 中央のかたまりと、それに必ず重なる外側のふくらみを暗く塗りつぶし、その上に葉を散らす。樹冠はひとつながりで、ふちはでこぼこになる
const crownTexture = canvasTexture(RIM_TEXTURE_SIZE, (g, n) => {
  const c = n / 2;   // 区画の一辺
  for (let row = 0; row < 2; row++) for (let col = 0; col < 2; col++) {
    // 中央からの距離と半径の範囲は、外側のふくらみが中央（半径 0.19）に重なり、区画の外へはみ出さない値にする
    const lobes = [[0.5, 0.52, 0.19], ...Array.from({ length: 10 }, (_, i) => {
      const a = (i + rand(-0.3, 0.3)) * GOLDEN_RATIO * TAU, d = rand(0.14, 0.25);
      const y = 0.52 + Math.sin(a) * d * 1.05;
      return [0.5 + Math.cos(a) * d * mix(0.7, 1, y), y, rand(0.08, 0.14)];   // 上ほど細くする
    })];
    const ox = col * c, oy = row * c;
    g.fillStyle = gray(70);
    for (const [x, y, r] of lobes) {
      g.beginPath();
      g.arc(ox + x * c, oy + y * c, r * c, 0, TAU);
      g.fill();
    }
    for (let i = 0; i < CROWN_LEAVES; i++) {
      const [x, y, r] = lobes[i % lobes.length];
      const a = rand(0, TAU), d = r * 1.05 * Math.sqrt(Math.random());
      const px = x + Math.cos(a) * d, py = y + Math.sin(a) * d;
      const len = rand(0.035, 0.06);
      // あとから描く葉ほど明るく、上の葉ほど明るい
      const v = Math.floor(clamp(mix(70, 255, i / CROWN_LEAVES) * mix(1.15, 0.65, py) * rand(0.85, 1.1), 0, 255));
      g.fillStyle = gray(v);
      g.beginPath();
      g.ellipse(ox + px * c, oy + py * c, len * c, len * 0.45 * c, rand(0, TAU), 0, TAU);
      g.fill();
    }
  }
});

// 崖の上の針葉樹を丸ごと描く。縦長の区画（4 × 2）に 1 種類ずつ。色は頂点の色で付ける。
// 垂れ下がる枝のスカートを下の段から重ねて塗りつぶす。枝の間が透けないので、枯れ木に見えない
const coniferCardTexture = canvasTexture(RIM_TEXTURE_SIZE, (g, n) => {
  const cw = n / 4, ch = n / 2;   // 区画の幅と高さ
  for (let row = 0; row < 2; row++) for (let col = 0; col < 4; col++) {
    const ox = col * cw, oy = row * ch;
    const px = (x) => ox + x * cw, py = (y) => oy + y * ch;   // 区画の中の位置（0..1）を画素に
    g.fillStyle = gray(45);   // 根もとの幹
    g.fillRect(px(0.45), py(0.86), cw * 0.1, ch * 0.12);
    for (let i = 0; i < RIM_CONIFER_LAYERS; i++) {
      const t = i / (RIM_CONIFER_LAYERS - 1);
      const bottom = mix(0.92, 0.2, t) + rand(-0.008, 0.008);
      const apex = bottom - mix(0.26, 0.19, t);
      const half = mix(0.46, 0.09, t ** 0.9) * rand(0.9, 1.05);
      // 枝の先ほど明るい。段の根もとは暗く、上の段の影になる
      const grad = g.createLinearGradient(0, py(apex), 0, py(bottom));
      grad.addColorStop(0, gray(55));
      grad.addColorStop(0.55, gray(95));
      grad.addColorStop(1, gray(Math.floor(rand(200, 245))));
      g.fillStyle = grad;
      // 頂点から左の端へ下り、ぎざぎざの枝先を右の端まで描いて戻る
      g.beginPath();
      g.moveTo(px(0.5), py(apex));
      const teeth = 5 + Math.round(5 * (1 - t));
      for (let k = 0; k <= teeth; k++) {
        const x = 0.5 + half * (k / teeth * 2 - 1);
        const edge = 1 - Math.abs(k / teeth * 2 - 1);   // 端で 0、中央で 1。中央ほど枝先が下がる
        g.lineTo(px(x), py(bottom - 0.035 * (1 - edge) + rand(-0.006, 0.006)));
        if (k < teeth) g.lineTo(px(x + half / teeth), py(bottom - 0.05 - 0.035 * (1 - edge)));
      }
      g.closePath();
      g.fill();
    }
  }
});

const cliffMaterial = new THREE.MeshLambertMaterial({
  vertexColors: true, map: rockTexture, flatShading: true,
  side: THREE.DoubleSide,   // 映り込みは水面の下から見上げて描く。面の裏が抜けると、水面に空が映ってしまう
});

// 横に cols、縦に「崖の面（rows）→ 台地」と続く 1 枚の格子。x は滝の近くほど細かく区切る
function cliffMesh(cols, rows) {
  const nx = cols + 1, ny = rows + PLATEAU_ROWS + 1;
  const positions = new Float32Array(nx * ny * 3);
  const uvs = new Float32Array(nx * ny * 2);
  const isWall = new Uint8Array(nx * ny);
  for (let i = 0; i < nx; i++) {
    const q = i / cols * 2 - 1;
    const x = CLIFF_HALF * Math.sign(q) * Math.abs(q) ** 1.5;
    const top = rimY(x), rimZ = wallZ(x, top);
    for (let j = 0; j < ny; j++) {
      const k = i * ny + j;
      let y, z;
      if (j <= rows) {
        y = mix(-2, top, j / rows);
        z = wallZ(x, y);
        isWall[k] = 1;
      } else {
        const d = PLATEAU_DEPTH * ((j - rows) / PLATEAU_ROWS) ** 2;
        y = plateauY(x, d);
        z = rimZ - d;
      }
      positions.set([x, y, z], k * 3);
      uvs.set([x / ROCK_TILE, y / ROCK_TILE + z / ROCK_TILE * 0.5], k * 2);
    }
  }
  const indices = [];
  for (let i = 0; i < cols; i++) for (let j = 0; j < ny - 1; j++) {
    const a = i * ny + j, b = a + ny, c = a + 1, d = b + 1;
    indices.push(a, b, c, c, b, d);
  }
  const geometry = new THREE.BufferGeometry()
    .setAttribute('position', new THREE.BufferAttribute(positions, 3))
    .setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();

  // 頂点の色: 岩は暗い色と明るい色のまだら、上向きの面と足もとには苔。滝の裏は濡れて暗い
  const normals = geometry.attributes.normal;
  const colors = new Float32Array(nx * ny * 3);
  const rockA = linear(ROCK_COLORS[0]), rockB = linear(ROCK_COLORS[1]);
  const moss = linear(MOSS_COLOR), grass = linear(GRASS_COLOR);
  for (let k = 0; k < nx * ny; k++) {
    const x = positions[k * 3], y = positions[k * 3 + 1];
    const m = fbm(x * 0.1 + 5, y * 0.13);
    const shade = smoothstep(m, 0.3, 0.7);
    const wet = Math.exp(-((x / (FALL_MAX_HALF + 4)) ** 4)) * (1 - smoothstep(y, FALL_HEIGHT - 1, FALL_HEIGHT + 2));
    const up = smoothstep(normals.getY(k), 0.2, 0.6);
    const low = 1 - smoothstep(y, 0, 16);
    const mossAmount = clamp(up + 0.35 + 0.5 * low, 0, 1) * smoothstep(fbm(x * 0.19, y * 0.21 + 11), 0.42, 0.56);
    const stain = 1 - 0.5 * smoothstep(fbm(x * 0.55, y * 0.025 + 2), 0.45, 0.6);   // 岩肌を伝う水の縦のしみ
    const strata = mix(STRATA_TONE[0], STRATA_TONE[1], smoothstep(fbm(x * 0.012 + 30, y * 0.16), 0.35, 0.65));   // 地層は影ではなく色の帯で見せる
    const warm = smoothstep(fbm(x * 0.03 + 40, y * 0.04 + 9), 0.42, 0.62);   // 広い範囲で岩の色みを変える
    for (let c = 0; c < 3; c++) {
      let v = mix(rockA[c], rockB[c], shade) * stain * strata * mix(1, ROCK_WARM[c], warm);
      v = isWall[k] ? mix(v, moss[c] * mix(0.7, 1.15, shade), mossAmount * (1 - 0.6 * wet)) : grass[c] * mix(0.75, 1.2, shade);
      colors[k * 3 + c] = v * mix(1, 0.55, wet) * mix(0.25, 1, smoothstep(y, 0, 2.5));   // 水際は濡れて暗い
    }
  }
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mesh = new THREE.Mesh(geometry, cliffMaterial);
  scene.add(mesh);
  return mesh;
}
const cliff = cliffMesh(CLIFF_COLS, CLIFF_ROWS);
