  <span class="touch-only">左右スワイプ: 次の材質 / 上下スワイプ: ビー玉の数</span>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
// 共通の入力・UI と小さな関数（common.js）
const { TAU, clamp, rand, randInt, pick, IS_TOUCH, fadeAndRun, isFading, logPosition, setupControls, compactHdrFormat, seededRandom, sideRandom, randomInterval, randIntIn, pickWeighted } = Common;

// ---- 設定 ----
// 長さの単位は立方体の一辺（実物の 5cm ほどの見立て）。y が上。格子のマス (i, j) は x = i〜i+1、z = j〜j+1 を占める。
// 柱の高さ h は、柱のいちばん上の面の高さ（y = h）。カメラは +x・+z の側から見下ろし、画面の右は +x・−z、画面の下（手前）は +x・+z。
// マスの行は r = i + j（画面の下ほど大きい）、行の中の位置は q = i − j（画面の右ほど大きい。横の位置は q/√2）

// カメラ（正射影で、斜め上から見下ろしたまま、画面の下へ進むだけ）
const CAM_ELEVATION = 49;         // 見下ろす角度（度）。上面の菱形は、縦の対角線が横の sin(49°) ≈ 0.75 倍になる
const VIEW_SHORT = 10;            // 画面の短い辺に写る長さ（立方体の上面の横の対角線 √2 が 7 個ぶんほど）
const SCROLL_PERIOD = 40;         // 画面の短い辺の長さぶん流れる秒数
const CAM_DIST = 60;              // 見る点からカメラまでの距離（正射影なので、写り方には効かない）

// 地形（柱の高さ）。基準の高さは −⌊(i + j)/2⌋（行 2 本ぶんの幅の、横に長い台地が、手前へ 1 段ずつ下がる段々）
const TERRAIN_NOISE = 0.6;        // 基準の高さからのゆらぎ（段）。ノイズは −1〜1 で高さは四捨五入するので、0.5 以下では効かない
const TERRAIN_NOISE_SCALE = 0.35; // ゆらぎの細かさ（1 マスあたり）
const MAX_STEP = 2;               // 隣り合う柱の高さの差の上限（それより高い崖を作らない）

// 経路
const PATH_SPACING = 6;           // 経路の横の間隔の目安（q で数える。横の長さでは 6/√2 ≈ 4.2）
const RUN_LENGTH = [3, 6];        // 受けのあとに続ける平らな溝のマス数（受けを入れて 4〜7 マス）
const PLATEAU_RUN = 8;            // 同じ高さの台地が続くときは、下らずにこのマス数まで平らに進む
const LEG_LENGTH = [1, 3];        // 平らな溝で、曲がらずにまっすぐ進むマス数（曲がるまでの 1 区切り）
const LEG_STRAIGHT = [20, 0.4];   // まっすぐ進む向きの重みの倍率（区切りの途中、区切りの後）
const PLATEAU_SCAN = 12;          // 下りる向きを選ぶとき、下りた先の台地の広さを数える上限（マス）
const TUNNEL_CHANCE = 0.25;       // 下るときに、穴を選ぶ割合（残りは飛び降り）
const BACKTRACK = 2;              // 経路が奥へ戻ってよい行数
const BAND_MARGIN = 2.5;          // 積み木を作る範囲の、画面の左右の外の余白
const ROW_MARGIN_TOP = 5;         // 画面の上の外に残しておく行数（ビー玉はここから現れる）
const ROW_MARGIN_BOTTOM = 4;      // 画面の下の外に、作っておく行数
const ROW_LOOKAHEAD = 8;          // 経路は、作っておく行よりさらにこれだけ先まで決めておく
const CHUNK_ROWS = 4;             // 立方体をまとめて作る・捨てる行数

// 立方体の形
const BEVEL = 0.04;               // 辺の面取りの半径
const LIP_ROUND = 0.035;          // 溝・くぼみの縁の丸みの半径（縁を格子の細かさでギザギザにしないためにも要る）
const GROOVE_DEPTH = 0.16;        // 溝の深さ
const GROOVE_RADIUS = 0.2;        // 溝の断面の円の半径（溝の幅は 2√(R² − (R − 深さ)²) ≈ 0.39）
const DISH_RADIUS = 0.3;          // 受けのくぼみの半径（深さは溝と同じ）
const HOLE_RADIUS = 0.2;          // 穴の半径
const HOLE_BOTTOM = -0.45;        // 穴を描く深さ（立方体の中心からの高さ。その下は暗い蓋で閉じる）
const TUNNEL_RADIUS = 0.19;       // トンネルの半径。中心は立方体の中心の高さ
const TUNNEL_BORE = 0.45;         // トンネルの出口の穴を描く深さ（その奥は暗い蓋で閉じる）
const BORE_WALL = 0.55;           // 穴の格子のうち、壁にする外側の割合（内側は蓋）
const BORE_EASE = 2;              // 壁の輪を下ろす深さの曲線の次数（縁の近くの輪を浅く詰め、縁で明暗が急に変わる帯を細くする）
const BORE_SHADE = [0.3, 0.04];   // 穴・出口の壁の明るさ（縁の下、奥。奥の蓋も奥の明るさ）
const CARVE_STEP = 0.048;         // 溝・穴を彫る面の格子の間隔
const CURVE_SEGMENTS = 12;        // 曲がりの上面を、角度で分ける数（90° を等分）
const MAX_DRAW_DEPTH = 5;         // 柱の上から何個まで立方体を描くか（それより深い所は見えない）

// 橋（一直線につながった直進溝の 2 個を 1×2 の部材にし、見える長い側面の下をアーチ形にくり抜く。橋にできる組はすべて橋にする）
const ARCH_SIZE = [0.62, 0.64];   // アーチの横の半径（2 個のつなぎ目から）と高さ（立方体の下面から。溝の底より下に収める）
const ARCH_DEPTH = 0.6;           // アーチを彫る奥行き（奥は暗い蓋で閉じる。斜め上からは奥まで見えない）
const ARCH_SHADE = [0.42, 0.1];   // アーチの中の明るさ（入口、奥）

// 飾りの木（ろくろで挽いた木のおもちゃ）。経路の無い無地の柱の上に、まれに置く。形は 3 種類で、どれも細い円柱の幹の上に載せる
const TREE_CHANCE = 0.05;         // 置ける柱のうち、木を置く割合
const TREE_HEIGHT = 1.5;          // 柱の上面から先端までの高さ
const TREE_TRUNK_RADIUS = 0.1;
const TREE_CONES = [              // 円錐の木・段々の木の円錐（[底の高さ, 底の半径, 先端の高さ]）
  [[0.42, 0.38, TREE_HEIGHT]],
  [[0.36, 0.4, 0.95], [0.72, 0.32, 1.25], [1.02, 0.24, TREE_HEIGHT]],
];
const TREE_BALL = [0.4, 0.58];    // 丸い木の長球（縦に長い回転楕円体）の横と縦の半径（上端が TREE_HEIGHT）
const TREE_ROUND = 0.03;          // 円錐の底の縁の丸み
const TREE_AO = [0.6, 0.55];      // 陰の明るさ（幹の根元、葉の下の幹）
const TREE_TINT = [0.42, 0.3, 0.24];   // 木材のシーンの色の倍率（線形。積み木より濃い、くるみ材のような色）。ほかのシーンは SCENES

// 隠し要素のマスコット（Claude Code のマスコットを、角材から削り出して組んだおもちゃにしたもの）。無地の柱の上に、カメラの方を向けて置く
const MASCOT_INTERVAL = [300, 120, 900];   // 次に置くまでの秒数 [平均, 最小, 最大]
const MASCOT_DOT = [0.055, 0.14]; // ドット絵の 1 ドットの横（と奥行き）・縦の大きさ（胴の幅 12 ドットで立方体の 0.66 個ぶん。縦に伸ばす）
const MASCOT_BODY_SCALE = 1.2;    // 胴体の高さの倍率（ドット絵の胴体は 4 行。足と腕の太さは変えない）
const MASCOT_EYE_SIZE = [0.055, 0.11];   // 目の大きさ（縦に伸ばさない）
const MASCOT_LEG = 0.06;          // 足の長さの増し分（立方体に対する長さ。斜め上から足が見えるように、胴体を持ち上げる）
const MASCOT_ARM = 2.6;           // 腕の長さ（ドット。胴体の横から出っ張る長さ。向きを回しても柱の上面から出ない長さにする）
const MASCOT_YAW = 30;            // 正面を、カメラの方から左右どちらかへずらす角度（度。置くたびにランダムに向きを選ぶ）
const MASCOT_BEVEL = 0.02;        // 胴体の辺の面取りの幅（下の辺と、足・腕・目は面取りしない）
const MASCOT_TINT = [0.52, 0.19, 0.13];  // 木材のシーンの色の倍率（線形。レッドシダーのような、赤みのある深い茶色）。ほかのシーンは SCENES
const MASCOT_BELOW = 0.8;         // 置く柱の、画面の下端から外への最小の距離（柱の上面の中心。マスコットの頭が置いたときに見えないように、高さの分だけ外にする）
const MASCOT_SIDE_MARGIN = 1;     // 置く柱を、画面の左右の端からこれだけ内側にする
const MASCOT_EXIT_ROWS = 3;       // 柱が、画面の上端からこれだけ上の段（行）まで出たら消す
const MASCOT_EYE = 0.06;          // 目の明るさ（黒い材の埋め込み）

// 木材のシーン（無塗装のブナ材）。木目は 1 つの立方体ぶんの 3 次元テクスチャに描き、立方体ごとに向きとずれを変えて貼る
const WOOD_RGB = [226, 190, 150]; // 地の色（sRGB）
const WOOD_RES = { nx: 64, ny: 128, nz: 128 };   // テクスチャの大きさ（x が木の繊維の向き）
const WOOD_SEED = 7;              // 木目の乱数の種
const RINGS_PER_UNIT = 15;        // 1 マスあたりの年輪の数
const RING_DARK = 0.09;           // 年輪の晩材の暗さ
const STREAK = 0.075;             // 繊維に沿った細かな筋の濃淡
const RAY_COUNT = 2600;           // 放射組織（斑）の数
const RAY_DARK = 0.22;            // 斑の暗さ
const END_GRAIN_DARK = 0.19;      // 木口の面の暗さ
const WOOD_TINT = 0.05;           // 立方体ごとの色味のばらつき
const WOOD_ROUGHNESS = 0.72;      // 粗さ
const WOOD_ENV = 0.55;            // 映り込み（環境の光）の強さ
const CUT_BRIGHT = 1.05;          // 削った面の明るさ（外の面に対する倍率）
const GROOVE_AO = 0.5;            // 溝の底の暗さ（底で 1 − この値の明るさ）
const BEVEL_AO = 0.14;            // 面取りの暗さ
const CONTACT_COLOR = [0.25, 0.18, 0.12];   // 柱が接する所の陰の色（線形）
const CONTACT_ALPHA = 0.5;        // その濃さ
const CONTACT_WIDTH = 0.22;       // その幅

// 石（白大理石）と金属（ブラスト仕上げのアルミ）。立方体ごとの模様は、木と同じ 3 次元テクスチャで引く
const STONE_RGB = [212, 206, 194];   // 白大理石の地の色（sRGB）
const STONE_RES = 80;             // テクスチャの大きさ（一辺）
const STONE_SEED = 11;            // 脈の乱数の種
const STONE_VEIN_FREQ = 2.2;      // 脈の筋の細かさ（1 マスあたりの本数）
const STONE_TURB = 0.9;           // 脈のうねり（乱れの大きさ）
const STONE_VEIN_DARK = 0.6;      // 脈の暗さ
const METAL_RGB = [196, 200, 206];   // アルミの地の色（sRGB）
const METAL_RES = 32;             // テクスチャの大きさ（一辺。繰り返して引く）
const METAL_GRAIN = 0.05;         // ブラストの粒の濃淡
const METAL_GRAIN_SCALE = 3;      // 粒の細かさ（テクスチャを立方体の中で繰り返す回数）
const TOOL_MARK_FREQ = 113;       // 溝・くぼみの刃物跡の細かさ（同心円の間隔の逆数、1 マスあたり）
const TOOL_MARK_STRENGTH = 0.1;   // 刃物跡の濃淡
const MILL_FREQ = 60;             // 上面の円弧状の刃跡の細かさ（1 マスあたり 60 / 2π 本）
const LATHE_FREQ = 90;            // 旋盤挽きの線の細かさ（高さ 1 マスあたり 90 / 2π 本）
const FEED_FREQ = 90;             // 側面の平行な筋の細かさ（同上）

// 石の玉（青・緑・橙・水色・紫・赤。ラピスラズリ・マラカイト・カーネリアン・アマゾナイト・アメジスト・ジャスパー）。縁が透けて見える玉は、縁を明るくする
const STONE_COLORS = ['#1c3f9e', '#1f8f52', '#d9642a', '#4fc3c0', '#8a52c8', '#b8302e'];
const STONE_GLOW = [2, 4];        // 縁を少し明るくする玉（カーネリアン、アメジスト）
const STONE_PALE = 0.55;          // マーブルの玉の地（石の色を白へ寄せる割合。大きいほど白い）
const STONE_DEEP = 0.55;          // 筋の色（石の色に掛ける倍率。小さいほど暗い）
const STONE_WARP = 1.2;           // 筋のうねり（ノイズでゆがめる量）
const STONE_STREAKS = 3.2;        // 筋の本数の目安（大きいほど細かい）
const STONE_STREAK_EDGE = [0.3, 0.7];   // 筋の太さ（等値線の値がこの範囲で、地から筋の色へ変わる）
const STONE_ROUGHNESS = 0.16;     // 磨いた石の玉の粗さ
const STONE_MARBLE_ENV = 0.7;     // 石の玉の映り込みの強さ
const METAL_MARBLE_ROUGHNESS = 0.34;   // アルマイトの玉の粗さ
const METAL_MARBLE_ENV = 1.14;    // 金属の玉の映り込みの強さ
const TITANIUM = ['#e0b030', '#8a3cb8', '#2f62e0'];   // 焼き色チタンの帯の色（金→紫→青）

// ビー玉
const MARBLE_RADIUS = 0.17;
const GRAVITY = 20;               // 重力の加速度（1 マス 5cm の実物の 1/10。時間を 3 倍ほどゆっくり見せる）
const SPEED_MIN = 1.5;            // 平らな溝で落ち着く速さ（マス/秒）
const SPEED_MAX = 2.8;            // 速さの上限（マス/秒）
const SPEED_DECAY = 0.8;          // 速さが SPEED_MIN へ戻る時定数（秒）
const FALL_GAIN = 0.04;           // 落ちた高さの位置エネルギーのうち、転がる速さに残る割合
const BOUNCE_HEIGHT = 0.045;      // 落ちた高さ 1 あたりの、受けで跳ねる高さ
const BOUNCE_MAX = 0.08;          // 跳ねる高さの上限
const CURVE_SHIFT = 0.004;        // 曲がりの溝で外へ寄る量（速さの 2 乗に掛ける）
const CURVE_SHIFT_MAX = 0.025;    // 外へ寄る量の上限
const RIBBON_CHANCE = 0.45;       // 羽根入りの玉の割合
const GLASS_COLORS = ['#1452ff', '#00b33c', '#ff7a00', '#00b8d4', '#8a2cff', '#ff1f3d'];   // 色ガラス（青・緑・橙・水色・紫・赤）
const GLASS_ATTENUATION = 0.4;    // 色ガラスの色の濃さ（光がこの距離で色の分だけ吸われる）
const GLASS_IOR = 1.52;           // ガラスの屈折率
const RIBBON_SIZE = 0.96;         // 羽根の大きさ（玉の半径に対する割合。ガラスで拡大されて見える分を見込む）
const CLEAR_GLASS_OPACITY = 0.22; // 羽根入りの玉の透明なガラスの不透明度（羽根の透け方）
const GLASS_BLUR = 0.05;          // 玉を通して見える環境のぼかし（粗さ 0..1）
const RIBBON_COLORS = [['#ff1a1a', '#ffc800', '#0a50ff'], ['#00b050', '#ff1a1a', '#00b050'], ['#ff6a00', '#ff6a00', '#ff6a00'],
  ['#0a50ff', '#00d0ff', '#0a50ff'], ['#b000ff', '#ffc800', '#b000ff']];   // 羽根入りの玉の羽根の色
const MARBLE_SHADOW_ALPHA = 0.55; // 玉の影の濃さ
const CAUSTIC = 0.9;              // 影の中の集光の明るさ
const SPAWN_GAP = [0.4, 1];       // 続けて玉を出すときの間隔（秒）。足りない数で割り、足りないほど早く出す

// 強度（画面の中のビー玉の数）
const BASE_COUNT = 8;
const MIN_COUNT = 4;
const MAX_COUNT = 20;
const COUNT_STEP = 1.25;          // ↑↓ 1 回あたりの倍率

// 明かり
const LIGHT_ELEVATION = 58;       // 平行光の高さ（度）
const LIGHT_BACK = 0.25;          // 光の向き。カメラから見て左から、この割合だけ奥へ寄せる
const LIGHT_COLOR = '#fff6ea';
const LIGHT_INTENSITY = 2.6;
const ENV_SKY = [0.95, 0.95, 0.96];   // 映り込みの環境の上半分（明るい部屋）
const ENV_GROUND = [0.55, 0.38, 0.24];  // 下半分（木の色）
const ENV_INTENSITY = 0.9;
const ENV_LIGHT = 14;             // 環境の中の、明かりの所の明るさ（ガラスの照り返しになる）

// 描画
const MAX_PIXEL_RATIO = { pc: 1.5, touch: 1 };  // 解像度の倍率の上限（pc: PC、touch: スマホなど）
const MAX_FPS = 60;               // 1 秒に描く回数の上限
const MSAA_SAMPLES = 4;           // シーンを描く描画先の MSAA
const SHADOW_MAP_SIZE = { pc: 4096, touch: 2048 };
const SHADOW_RADIUS = 2.5;        // 影の縁のぼかし（影の画素）
const SHADOW_SLACK = 2;           // 影は毎コマ描かず、見る点がここまで（マス）動くか、積み木を詰め直したときに描き直す
const MAX_RADIANCE = 64;          // 後段へ渡す明るさの上限（ガラスの鋭い照り返しが半精度の上限を超えないように）
const VIGNETTE = 0.35;            // 周辺減光の強さ（画面の隅で暗くする割合）
const EXPOSURE = 1.0;             // トーンマッピングの露出
const REBASE_STEP = 256;          // 座標の原点を戻す間隔（マス）

// シーン（積み木の材質）。起動時はランダムに選び、シーン切替のたびに、木材 → 石材 → 金属 の順に次へ進む。積み木のほか、飾りの木・マスコット（accent）、環境、玉の影も組で変わる
// shadowEnv: 太陽の影の中の映り込みの割合、reflectGrad: 面の中の反射のグラデーション、flat: 立方体ごとにテクスチャを回さない、shift: 繊維の向きにずらす、endGrain: 木口の暗さ、scale: テクスチャを繰り返す回数、tool: 刃物跡
// accent: 飾りの木とマスコットの共通の質感（invert: 白黒を反転する。黒大理石の白い脈）。tree・mascot: それぞれの色の倍率 tint（線形）と、上書きする値（lathe: 旋盤挽きの線、veinContrast: 模様の明暗差の倍率）。shadow: 玉の影（alpha: 濃さ、dark: 玉の色を暗くする割合、
//   caustic: 明るみの強さ、shift: 明るみを影の中心から光と反対へずらす量（負なら光の側）、size: 明るみの大きさ）
const SCENES = [
  { name: 'Wood', rgb: WOOD_RGB, makeTexture: buildWoodTexture, flat: false, shift: true, endGrain: END_GRAIN_DARK, scale: 1, tool: 0,
    roughness: WOOD_ROUGHNESS, metalness: 0, env: WOOD_ENV,

// ---- ユーティリティ ----
const DEG = Math.PI / 180;
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];   // 側面の向き（0: +x、1: +z、2: −x、3: −z）
const opposite = (s) => (s + 2) % 4;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const rowOf = (i, j) => i + j;
const baseHeight = (i, j) => -Math.floor((i + j) / 2);

// 整数の座標から 0〜1 の値（同じ座標なら毎回同じ）
function hash3(a, b, c) {
  let h = Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul(b | 0, 0x165667b1) ^ Math.imul(c | 0, 0x9e3779b1);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
// なめらかな 2 次元のノイズ（−1..1）。salt で別の模様になる
function noise2(x, y, salt = 0) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const fx = x - xi, fy = y - yi;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const h = (a, b) => hash3(a, b, salt) * 2 - 1;
  return lerp(lerp(h(xi, yi), h(xi + 1, yi), sx), lerp(h(xi, yi + 1), h(xi + 1, yi + 1), sx), sy);
}
// 点 (x, z) から線分までの距離
function segDist(x, z, x0, z0, x1, z1) {
  const dx = x1 - x0, dz = z1 - z0;
  const t = clamp(((x - x0) * dx + (z - z0) * dz) / (dx * dx + dz * dz), 0, 1);
  return Math.hypot(x - x0 - dx * t, z - z0 - dz * t);
}
// 重みに比例して選ぶ（[{ w, ... }]）。すべて 0 なら null
// ---- シェーダー ----
// シーンの描画先を composer へ写し、周辺を暗くする。明るさを MAX_RADIANCE で抑える（無限大も抑えられる）
const SCENE_COPY_SHADER = {
  uniforms: { tScene: { value: null }, maxRadiance: { value: MAX_RADIANCE }, vignette: { value: VIGNETTE } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: `
    uniform sampler2D tScene;
    uniform float maxRadiance;
    uniform float vignette;
    varying vec2 vUv;
    void main() {
      vec2 d = vUv - 0.5;
      vec3 c = min(texture2D(tScene, vUv).rgb, vec3(maxRadiance));
      gl_FragColor = vec4(c * (1.0 - vignette * smoothstep(0.1, 0.75, dot(d, d) * 2.0)), 1.0);
    }`,
};
// 積み木の素材（標準の素材）に、模様の 3 次元テクスチャ（木目・脈・粒）を足す。blockRot（四元数）で立方体の中の位置を
// テクスチャの向きへ回し、blockOff の小数部だけ x の向きにずらして引く（金属では、立方体ごとの値 vBlockSeed にも使う）。
// blockOff の整数部は橋の 2 個の別（奥が −1、手前が +1、橋でなければ 0）で、立方体の中の位置を x の向きに半個ずつずらし、
// 2 個で 1 つの部材の中の位置にする（金属の削り出しの跡と映り込みの明るさの流れが、つなぎ目で続く）。木口（繊維の向きに面した面）は少し暗くする
const BLOCK_VERTEX_PARS = `
attribute vec4 blockRot;
attribute float blockOff;
varying vec3 vBlockPos;
varying float vBlockSeed;
varying vec3 vObjPos;
varying vec3 vBlockNormal;
vec3 rotateByQuat(vec4 q, vec3 v) { return v + 2.0 * cross(q.xyz, cross(q.xyz, v) + q.w * v); }`;
const BLOCK_VERTEX = `
vBlockSeed = fract(blockOff);
vObjPos = position;
vBlockPos = rotateByQuat(blockRot, position) + 0.5 + vec3(vBlockSeed + 0.5 * floor(blockOff), 0.0, 0.0);
vBlockNormal = rotateByQuat(blockRot, objectNormal);`;
const BLOCK_FRAGMENT_PARS = `
uniform highp sampler3D blockTex;
uniform float endGrainDark;
uniform float texScale;
uniform float invertTex;
uniform float toolMark;
uniform float shadowEnv;
uniform float reflectGrad;
uniform float latheMark;
uniform float veinContrast;
uniform float texGround;
varying vec3 vObjPos;
varying vec3 vBlockPos;
varying float vBlockSeed;
varying vec3 vBlockNormal;`;
// 太陽の影の中では、環境の映り込みも暗くする（金属は拡散光が無く、映り込みは影に関係なく明るいままで、影が弱く見えるため）。
// shadowEnv は影の中の映り込みの割合（1 なら暗くしない）。光に背を向けた面は、影の判定が常に影になるので、対象にしない
const SUN_SHADOW_ENV = `
#if defined( USE_SHADOWMAP ) && NUM_DIR_LIGHT_SHADOWS > 0
if ( shadowEnv < 1.0 && receiveShadow ) {
  float sunShadow = getShadow( directionalShadowMap[ 0 ], directionalLightShadows[ 0 ].shadowMapSize, directionalLightShadows[ 0 ].shadowBias, directionalLightShadows[ 0 ].shadowRadius, vDirectionalShadowCoord[ 0 ] );
  reflectedLight.indirectSpecular *= mix( 1.0, mix( shadowEnv, 1.0, sunShadow ), smoothstep( 0.0, 0.15, dot( geometryNormal, directionalLights[ 0 ].direction ) ) );
}
#endif`;
// invertTex: 明るさを反転して濃くする（黒大理石では、白地が黒に、灰色の脈が明るい脈になる）。veinContrast: 模様の明暗差の倍率（1 ならそのまま、
// 0 なら texGround の一様な色。赤大理石の脈と地の明暗差を控えめにする）。latheMark: 旋盤挽きの、軸のまわりを回る細い線（飾りの木の真鍮）。
// toolMark: 金属の削り出しの跡。溝・くぼみの面（外面より下で、上を向く）には、立方体の中心か角を中心にした同心円の刃物跡、
// 外面の上面には、平面フライスの円弧状の刃跡（中心は立方体の外で、立方体ごとに変える）、側面には、送りの向きの平行な筋。
// 立方体ごとの値 vBlockSeed（0..1）で変える。映り込みの変化は、色と粗さの濃淡で近似する
const BLOCK_FRAGMENT = `
vec4 texel = texture(blockTex, vBlockPos * texScale);
if (invertTex > 0.0) texel.rgb = mix(texel.rgb, vec3(pow(1.0 - dot(texel.rgb, vec3(0.3333)), 2.0)), invertTex);
if (veinContrast < 1.0) texel.rgb = mix(vec3(texGround), texel.rgb, veinContrast);
vec3 blockN = normalize(vBlockNormal);
float endGrain = abs(blockN.x);
float toolWave = 0.0;
float reflectWave = 0.0;
if (toolMark > 0.0 || latheMark > 0.0 || reflectGrad != 0.0) {
  vec3 blockP = vBlockPos - 0.5 - vec3(vBlockSeed, 0.0, 0.0);
  float seedAngle = vBlockSeed * 6.2832;
  if (toolMark > 0.0) {
    float toolR = length(blockP.xz);
    float toolCut = smoothstep(0.455, 0.43, blockP.y) * step(0.3, blockN.y) * sin((toolR < 0.36 ? toolR : length(0.5 - abs(blockP.xz))) * TOOL_MARK_FREQ);
    float millArc = step(0.95, blockN.y) * step(0.495, blockP.y) * sin(length(blockP.xz - 1.6 * vec2(cos(seedAngle), sin(seedAngle))) * MILL_FREQ + vBlockSeed * 50.0);
    float feedLine = step(abs(blockN.y), 0.05) * sin((blockP.y + 0.02 * sin(9.0 * (blockP.x + blockP.z) + vBlockSeed * 30.0)) * FEED_FREQ);
    toolWave = toolMark * (toolCut + millArc + feedLine);
  }
  if (latheMark > 0.0) toolWave += latheMark * sin(vObjPos.y * LATHE_FREQ);
  // reflectGrad: 面の中の反射のグラデーション（金属で、ゆがみのある実物のように、面の中で映り込みの明るさが流れる。立方体ごとに向きを変える）
  if (reflectGrad != 0.0) {
    float reflectTop = step(0.95, blockN.y);
    reflectWave = reflectGrad * mix(blockP.y * 1.6 + (blockP.x + blockP.z) * 0.8, dot(blockP.xz, vec2(cos(seedAngle), sin(seedAngle))) * 1.8, reflectTop);
  }
}
diffuseColor.rgb *= texel.rgb * (1.0 - endGrainDark * endGrain * endGrain) * (1.0 + TOOL_MARK_STRENGTH * toolWave) * (1.0 + reflectWave);`;

// ---- three.js 初期化 ----
// シーンは別の描画先に描くので、画面側のアンチエイリアスは効かない。無駄なので切る
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, IS_TOUCH ? MAX_PIXEL_RATIO.touch : MAX_PIXEL_RATIO.pc));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = EXPOSURE;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.shadowMap.autoUpdate = false;   // 影は積み木と一緒にしか変わらないので、要るときだけ描く（updateShadow）
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(...WOOD_RGB.map((c) => (c / 255) ** 2.2 * 0.3));
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, CAM_DIST * 2);

// マルチサンプルにするのはシーンを描く描画先だけ。色の形式は compactHdrFormat（common.js）で選ぶ
const sceneTarget = new THREE.WebGLRenderTarget(1, 1,
  { type: THREE.HalfFloatType, ...compactHdrFormat(renderer, MSAA_SAMPLES), samples: MSAA_SAMPLES });
function updateSceneTargetSize() {

const composer = new EffectComposer(renderer,
  new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, ...compactHdrFormat(renderer), depthBuffer: false }));

// 明かり（カメラから見て左の、少し奥の上から）。上面がいちばん明るく、左の側面（+z）、右の側面（+x）の順に暗い
const LIGHT_DIR = (() => {
  const h = new THREE.Vector3(-1 - LIGHT_BACK, 0, 1 - LIGHT_BACK).normalize();
  const e = LIGHT_ELEVATION * DEG;
  return new THREE.Vector3(h.x * Math.cos(e), Math.sin(e), h.z * Math.cos(e));
})();
const sun = new THREE.DirectionalLight(LIGHT_COLOR, LIGHT_INTENSITY);
sun.castShadow = true;
const shadowMapSize = IS_TOUCH ? SHADOW_MAP_SIZE.touch : SHADOW_MAP_SIZE.pc;
sun.shadow.mapSize.set(shadowMapSize, shadowMapSize);
sun.shadow.bias = -0.0004;
sun.shadow.radius = SHADOW_RADIUS;
sun.shadow.normalBias = 0.015;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 80;

// 映り込みの環境。上半分が明るい部屋のような淡い灰色、下半分が積み木の材質の色で、明かりの所が明るい（まわりの積み木は映さない）。
// band: 地平の明るい帯（金属で、溝や面取りに光る筋を映す）。材質を替えるたびに作り直す
function buildEnvironment(sky, ground, band = 0) {
  const env = new THREE.Scene();
  const sphere = new THREE.SphereGeometry(50, 48, 24);
  const colors = [];
  const pos = sphere.attributes.position;
  for (let k = 0; k < pos.count; k++) {
    const t = smooth(-0.15, 0.25, pos.getY(k) / 50);
    colors.push(...ground.map((g, c) => lerp(g, sky[c], t) + band * Math.exp(-(((pos.getY(k) / 50 + 0.05) / 0.12) ** 2))));
  }
  sphere.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  env.add(new THREE.Mesh(sphere, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const lamp = new THREE.Mesh(new THREE.CircleGeometry(3.5, 32),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(LIGHT_COLOR).multiplyScalar(ENV_LIGHT) }));
  lamp.position.copy(LIGHT_DIR).multiplyScalar(40);
  lamp.lookAt(0, 0, 0);
  env.add(lamp);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment?.dispose();
  scene.environment = pmrem.fromScene(env, 0.02).texture;
  pmrem.dispose();
  env.traverse((o) => { if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); } });
}

// ---- 状態 ----
let time = 0;                // 経過秒
let marbleCount = BASE_COUNT;   // 画面の中のビー玉の数（強度。四捨五入して使う）
let camK = 0;                // 見る点の、格子の対角に沿った位置（マス。見る点は (camK, −camK, camK) の近く）
const origin = new THREE.Vector3();   // 描く座標の原点（世界の座標から引く）。ときどき REBASE_STEP ずつ進める
let bandQ = 0;               // 積み木を作る横の範囲（|q| ≤ bandQ）
let sceneIndex = 0;          // 今のシーン（SCENES の番号。積み木の材質）
let mat = SCENES[0];         // 今のシーン

// ---- 積み木の模様 ----
// 1 つの立方体ぶんの木目（線形の色と粗さ）。年輪の中心は立方体の外の遠くにあり、年輪は大きな弧の一部として見える。
// 繊維の向き（x）には周期的につながるので、立方体ごとに x へずらして貼れる
function buildWoodTexture() {
  const rnd = seededRandom(WOOD_SEED);
  const { nx, ny, nz } = WOOD_RES;
  const ray = new Float32Array(nx * ny * nz);
  const logAngle = rnd() * TAU, logDist = 3.5 + rnd() * 3;
  const cy = 0.5 + Math.cos(logAngle) * logDist, cz = 0.5 + Math.sin(logAngle) * logDist;
  // 放射組織: 年輪の中心から外へ向かう薄い板。繊維の向きには短く（1〜3mm）、半径の向きには長い
  const span = 0.8 / logDist;
  for (let k = 0; k < RAY_COUNT; k++) {
    const theta = logAngle + Math.PI + (rnd() - 0.5) * 2 * span;
    const rho0 = logDist + (rnd() - 0.5) * 1.6;
    const halfR = 0.03 + rnd() * 0.12, halfX = 0.012 + rnd() * 0.024;
    const x0 = rnd(), strength = 0.5 + rnd() * 0.5;
    const c = Math.cos(theta), s = Math.sin(theta);
    for (let t = -halfR; t <= halfR; t += 0.5 / ny) {
      const y = cy + c * (rho0 + t), z = cz + s * (rho0 + t);
      if (y < 0 || y >= 1 || z < 0 || z >= 1) continue;
      const iy = Math.floor(y * ny), iz = Math.floor(z * nz);
      const fade = Math.sqrt(1 - (t / halfR) ** 2) * strength;
      for (let ix = Math.floor((x0 - halfX) * nx); ix <= Math.ceil((x0 + halfX) * nx); ix++) {
        const w = Math.max(0, 1 - (((ix + 0.5) / nx - x0) / halfX) ** 2) * fade;
        const idx = ((ix % nx) + nx) % nx + nx * (iy + ny * iz);
        if (w > ray[idx]) ray[idx] = w;
      }
    }
  }
  const base = WOOD_RGB.map((c) => (c / 255) ** 2.2);
  const data = new Uint8Array(nx * ny * nz * 4);
  for (let iz = 0; iz < nz; iz++) {
    const z = (iz + 0.5) / nz;
    for (let iy = 0; iy < ny; iy++) {
      const y = (iy + 0.5) / ny;
      const r0 = Math.hypot(y - cy, z - cz);
      for (let ix = 0; ix < nx; ix++) {
        const x = (ix + 0.5) / nx;
        // 年輪は繊維に沿ってゆるくうねる（x に周期的）
        const wobble = 0.025 * Math.sin(TAU * x + 9 * y + 4 * z) + 0.012 * Math.sin(TAU * 2 * x + 17 * z + 1.3);
        const f = ((r0 + wobble) * RINGS_PER_UNIT) % 1;
        const late = smooth(0.62, 0.92, f) * (1 - smooth(0.92, 1, f));
        // 繊維に沿った細かな筋（断面の向きに細かく、繊維の向きにはゆっくり変わる）
        const streak = noise2((y + 0.015 * Math.sin(TAU * x)) * 60, (z + 0.015 * Math.cos(TAU * x)) * 60, 3);
        const broad = 0.025 * Math.sin(3.1 * y + 2.3 * z + 1.7) + 0.02 * Math.sin(TAU * x + 5 * y);
        const idx = ix + nx * (iy + ny * iz);
        const k = (1 - RING_DARK * late + STREAK * streak + broad) * (1 - RAY_DARK * ray[idx]);
        const o = idx * 4;
        data[o] = Math.min(255, Math.round(base[0] * k * 255));
        data[o + 1] = Math.min(255, Math.round(base[1] * k * (1 - 0.05 * ray[idx]) * 255));
        data[o + 2] = Math.min(255, Math.round(base[2] * k * (1 - 0.1 * ray[idx]) * 255));
        data[o + 3] = Math.round(128 * (1 - 0.3 * ray[idx]));   // 粗さの倍率 ×2（斑はわずかに艶がある）
      }
    }
  }
  return texture3D(data, nx, ny, nz, false);
}
// 3 次元テクスチャ（色と粗さ）。repeat なら 3 方向とも繰り返す（木は繊維の向き x だけ繰り返す）
function texture3D(data, nx, ny, nz, repeat) {
  const texture = new THREE.Data3DTexture(data, nx, ny, nz);
  texture.format = THREE.RGBAFormat;
  texture.type = THREE.UnsignedByteType;
  texture.minFilter = THREE.LinearMipmapLinearFilter;
  texture.magFilter = THREE.LinearFilter;
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = texture.wrapR = repeat ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
  texture.generateMipmaps = true;
  texture.needsUpdate = true;
  return texture;
}
// 3 次元のなめらかなノイズ（−1..1）。period が正なら、その周期で繰り返す
function noise3(x, y, z, salt = 0, period = 0) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const fx = x - xi, fy = y - yi, fz = z - zi;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy), sz = fz * fz * (3 - 2 * fz);
  const w = (v) => (period ? ((v % period) + period) % period : v);
  const h = (a, b, c) => hash3(w(a), w(b) * 3 + salt, w(c)) * 2 - 1;
  const at = (c) => lerp(lerp(h(xi, yi, c), h(xi + 1, yi, c), sx), lerp(h(xi, yi + 1, c), h(xi + 1, yi + 1, c), sx), sy);
  return lerp(at(zi), at(zi + 1), sz);
}
// 白大理石: 立方体ぶんの 3 次元テクスチャ。ある向きに並んだ細い灰色の脈を、乱れ（うねり）でゆがめる
function buildStoneTexture() {
  const rnd = seededRandom(STONE_SEED), n = STONE_RES;
  const d = [rnd() - 0.5, rnd() - 0.5, rnd() - 0.5], dl = Math.hypot(...d), phase = rnd() * 10;
  const base = STONE_RGB.map((c) => (c / 255) ** 2.2);
  const data = new Uint8Array(n ** 3 * 4);
  for (let iz = 0; iz < n; iz++) for (let iy = 0; iy < n; iy++) for (let ix = 0; ix < n; ix++) {
    const x = (ix + 0.5) / n, y = (iy + 0.5) / n, z = (iz + 0.5) / n;
    let turb = 0;
    for (let o = 0, f = 3, a = 1; o < 3; o++, f *= 2, a /= 2) turb += a * Math.abs(noise3(x * f, y * f, z * f, o));

    const nv = grid[0].length;

        if (dist2(positions, i00, i11) <= dist2(positions, i10, i01)) indices.push(i00, i10, i11, i00, i11, i01);

  if (archF >= 0) {

}

// 飾りの木（type: 0 円錐、1 段々、2 長球）。局所座標は柱の上面の中心が原点で、y が上。幹と葉の断面の輪郭を y 軸のまわりに回す。

  const top = type === 2 ? TREE_HEIGHT - Ry - Ry * Math.sqrt(1 - (rt / R) ** 2) : TREE_CONES[type][0][0];

      const cone = [[0, y, 0, -1, TREE_AO[1]], [rc - f, y, 0, -1, 1]];

// マスコット。ドット絵（tube.html と同じ形: 胴体・足 4 本・腕 2 本・目 2 つ）の箱を、辺を面取りして組む。
// 局所座標は柱の上面の中心が原点で、y が上。正面は +x +z の向き（カメラの方）から、dir（-1 か 1）の側へ MASCOT_YAW だけずらす

    const edge = (k, s, full) => (full || (flat && k === 1 && s < 0) ? half[k] : half[k] - b);

    for (let axis = 0; axis < 3; axis++) {

  const legH = sy + MASCOT_LEG, bodyH = 4 * sy * MASCOT_BODY_SCALE, top = legH + bodyH;

  const at = (f) => top - bodyH * f;

  // 足の上は、胴体の底（面取りしない）に接する
  for (const x of [4, 6, 11, 13]) box((x - 8.5) * sx, legH / 2, -2 * sx, sx, legH, 2 * sx, 1, 0);   // 足

  // 目は、胴体の高さの 3 / 8（ドット絵の 1 行目の中心）の所に、胴体の正面から少しだけ出す
  for (const x of [5, 12]) box((x - 8.5) * sx, at(1.5 / 4), -3 * sx, MASCOT_EYE_SIZE[0], MASCOT_EYE_SIZE[1], 0.4 * sx, MASCOT_EYE, 0);

}

// ---- 積み木と経路の生成 ----
// マス: { i, j, h（決まった高さ。経路のマスは最初から決まる）, lo, hi（高さの制約）, fixed（行が確定した）,
//         node（経路のマス）, piece（上面の模様 { top, rot }）, tun（トンネルが通る立方体の高さ）, open（出口 { level, side }） }
// 経路のマス（node）: { i, j, h, kind（'groove'・'catch'・'hole'）, inSide（入口の側面）, cell, path, seg（このマスを転がる区間の通し番号）,
//         landed（上から落ちてきた）, mergers（ここへ飛び降りて合流する経路） }
// 経路: { segs（玉が進む区間）, base（segs[0] の通し番号）, cur（出口がまだ決まっていない最後のマス）,
//         run・runLen（下りてから平らに進んだマス数と、その目安）, leg・legLen（まっすぐ進んだマス数と、その区切りの長さ）,
//         drift（左右どちらへ寄りやすいか）, lastBack（前のマスで奥へ戻った）, maxRow, active（まだ先を作る）, ended（終わりまで作った）,
//         merge（合流先 { path, seg, s }）, marbles }
// 区間: 転がり { type: 'roll', pts, cum, len, arc（曲がりの中心）, hidden, row } と、

const cells = new Map();
let paths = [];

let lastFillRow = -Infinity;

const cellKey = (i, j) => i * 1048576 + j;

}
const inBand = (i, j) => Math.abs(i - j) <= bandQ;
// 地形のゆらぎだけで決まる柱の高さ（経路の制約を入れない。丸める前）
const terrainLevel = (i, j) => baseHeight(i, j) + TERRAIN_NOISE * noise2(i * TERRAIN_NOISE_SCALE + j * 0.11, j * TERRAIN_NOISE_SCALE - i * 0.13, 1);

  let lo = c.lo, hi = c.hi;
  for (const [s, [dx, dz]] of DIRS.entries()) {
    const n = cells.get(cellKey(i + dx, j + dz));
    if (n?.h == null) continue;
    lo = Math.max(lo, n.h - (s <= 1 ? 0 : MAX_STEP));
    hi = Math.min(hi, n.h + MAX_STEP);
  }
  const h = Math.round(terrainLevel(i, j));

}
// 柱の高さ（作る範囲の外は、基準の高さ）

  if (c?.h != null) return c.h;
  return Math.round(baseHeight(i, j));

// 経路のマスを高さ h で置けるか。手前の 3 マス（+x・+z・+x+z）が h より高いと、溝が隠れるので置かない
function canPlace(i, j, h, p) {

  if (c.node || c.h != null || h < c.lo || h > c.hi) return false;

// 区間を作る

    }
    // 次の区間へ。合流して終わる経路の終わりでは、合流先の経路に乗り換える
    if (st.seg + 1 - st.path.base >= st.path.segs.length) {
      const merge = st.path.merge;
      if (merge && merge.seg != null && merge.seg >= merge.path.base && paths.includes(merge.path)) {
        Object.assign(st, { path: merge.path, seg: merge.seg, s: merge.s, t: 0 });
        continue;
      }
      if (st.path.ended) st.done = true;
      rest = 0;
      break;
    }
    st.seg++;
    st.s = 0;
    st.t = 0;
    if (st.path.segs[st.seg - st.path.base].type === 'fall') st.v0 = st.v;
  }
  return st;
}

const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3(), tmpQ = new THREE.Quaternion();
function updateMarbles(dt) {
  const transfers = [];
  for (const path of paths) {
    // 前の玉から順に進め、前の玉に追いついたら後ろに付く
    path.marbles.sort((a, b) => b.seg - a.seg || (b.s + b.t) - (a.s + a.t));
    let front = null;
    for (const m of path.marbles) {
      m.age += dt;
      const st = stepMarble(m, dt);
      const old = { path: m.path, seg: m.seg, s: m.s, t: m.t, v: m.v, v0: m.v0 };
      Object.assign(m, { path: st.path, seg: st.seg, s: st.s, t: st.t, v: st.v, v0: st.v0 });
      positionOf(m, tmpA);
      if (front && tmpA.distanceTo(front.pos) < MARBLE_RADIUS * 2.04) {
        Object.assign(m, old);
        m.v = Math.min(m.v, front.v);
        positionOf(m, tmpA);
      } else {
        if (st.landed > 0.3) m.bounce = { t: 0, a: Math.min(BOUNCE_MAX, BOUNCE_HEIGHT * st.landed) };
        if (st.done) m.done = true;
        if (m.path !== path) transfers.push([m, path]);
      }
      if (m.bounce && (m.bounce.t += dt) > 1) m.bounce = null;
      // 転がった分だけ回す（落ちている間は、それまでの回転を続ける）
      const dx = tmpA.x - m.pos.x, dz = tmpA.z - m.pos.z, d = Math.hypot(dx, dz);
      const seg = m.path.segs[m.seg - m.path.base];
      if (seg.type === 'roll' && d > 1e-6) { m.axis.set(dz / d, 0, -dx / d); m.spin = d / MARBLE_RADIUS / Math.max(dt, 1e-4); }
      if (m.spin > 0) m.group.quaternion.premultiply(tmpQ.setFromAxisAngle(m.axis, m.spin * dt));
      m.pos.copy(tmpA);
      front = m;
    }
  }
  for (const [m, from] of transfers) {
    from.marbles.splice(from.marbles.indexOf(m), 1);
    m.path.marbles.push(m);
  }
  for (const m of [...marbles]) {
    const on = onScreen(m.pos, -MARBLE_RADIUS);
    if (on) m.seen = true;
    if (m.done || (m.seen && !onScreen(m.pos, 0.6)) || (!m.seen && m.age > 20)) { removeMarble(m); continue; }
    m.group.position.copy(m.pos).sub(origin);
    placeMarbleShadow(m);
  }
}

// 玉の影と集光を、明かりの向きに沿って下の面へ映した所に置く
function placeMarbleShadow(m) {
  const seg = m.path.segs[m.seg - m.path.base];
  const visible = !seg.hidden;
  m.shadow.visible = visible;
  if (m.caustic) m.caustic.visible = visible;
  if (!visible) return;
  const gy = seg.type === 'roll' ? seg.pts[0][1] - MARBLE_RADIUS * 0.6 : seg.b[1] - MARBLE_RADIUS * 0.6;
  const lift = Math.max(0, m.pos.y - MARBLE_RADIUS * 0.4 - gy);
  const k = (m.pos.y - gy) / LIGHT_DIR.y;
  tmpB.set(m.pos.x - LIGHT_DIR.x * k, gy, m.pos.z - LIGHT_DIR.z * k).sub(origin);
  const spread = 1 + lift * 0.8, fade = 1 / (1 + lift * 2.5);
  m.shadow.position.copy(tmpB);
  m.shadow.scale.set(2.4 * MARBLE_RADIUS / LIGHT_DIR.y * spread, 1, 2.4 * MARBLE_RADIUS * spread);
  m.shadow.material.opacity = m.look.alpha * fade;
  if (!m.caustic) return;
  const { shift, size } = m.look;
  m.caustic.position.set(tmpB.x - LIGHT_FLAT.x * MARBLE_RADIUS * shift, tmpB.y + 0.001, tmpB.z - LIGHT_FLAT.y * MARBLE_RADIUS * shift);
  m.caustic.scale.set(MARBLE_RADIUS * 1.1 * size * spread, 1, MARBLE_RADIUS * 0.8 * size * spread);
  m.caustic.material.opacity = fade * fade;
}

// 玉を出す所: 経路の上で、画面の外から画面の中へ入る直前の点
function findEntry(path) {
  let last = null;
  for (let n = 0; n < path.segs.length && n < 60; n++) {
    const seg = path.segs[n];
    const samples = seg.type === 'roll' ? Math.max(1, Math.ceil(seg.len / 0.3)) : 1;
    for (let k = 0; k < samples; k++) {
      const s = seg.type === 'roll' ? seg.len * k / samples : 0;
      const p = seg.type === 'roll' ? rollPoint(seg, s) : seg.a;
      const inside = !seg.hidden && onScreen(tmpA.set(...p), -MARBLE_RADIUS * 2);
      if (inside) return last ? { ...last, at: [...p] } : null;
      last = { seg: path.base + n, s };
    }
  }
  return null;
}
// 転がりの区間で、始めから長さ s 進んだ点
function rollPoint(seg, s) {
  let k = 1;
  while (k < seg.pts.length - 1 && seg.cum[k] < s) k++;
  const a = seg.pts[k - 1], b = seg.pts[k], t = clamp((s - seg.cum[k - 1]) / ((seg.cum[k] - seg.cum[k - 1]) || 1), 0, 1);
  return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
}
function spawnMarble() {
  const options = [];
  for (const path of paths) {
    const e = findEntry(path);
    if (!e || path.marbles.some((m) => Math.abs(m.seg - e.seg) <= 2)) continue;
    // 画面にある玉から離れた経路を選びやすくする
    let d = 6;
    for (const m of marbles) d = Math.min(d, Math.hypot(m.pos.x - e.at[0], m.pos.z - e.at[2]));
    options.push({ e, path, w: (d + 0.5) ** 2 });
  }
  const o = pickWeighted(options);
  if (o) createMarble(o.path, o.e.seg, o.e.s);
  return !!o;
}
// 起動時と、シーン切替・作り直しのときは、画面の中の溝に散らして置く
function scatterMarbles(n) {
  const options = [];
  for (const path of paths) {
    path.segs.forEach((seg, k) => {
      if (seg.type === 'roll' && !seg.hidden && onScreen(tmpA.set(...rollPoint(seg, seg.len / 2)), 0)) options.push({ path, seg: path.base + k, s: seg.len / 2 });
    });
  }
  for (let k = 0; k < n && options.length; k++) {
    const o = options.splice(randInt(options.length), 1)[0];
    if (o.path.marbles.some((m) => Math.abs(m.seg - o.seg) <= 2)) { k--; continue; }
    createMarble(o.path, o.seg, o.s).seen = true;
  }
}
function controlCount() {
  const want = Math.round(marbleCount);
  const live = marbles.filter((m) => m.seen ? onScreen(m.pos, 0) : true).length;
  if (live < want && time >= nextSpawn && spawnMarble()) nextSpawn = time + rand(...SPAWN_GAP) / (want - live);
}

// ---- カメラ ----
const CAM_BACK = new THREE.Vector3(Math.cos(CAM_ELEVATION * DEG) * Math.SQRT1_2, Math.sin(CAM_ELEVATION * DEG), Math.cos(CAM_ELEVATION * DEG) * Math.SQRT1_2);
const SCREEN_RIGHT = new THREE.Vector3(Math.SQRT1_2, 0, -Math.SQRT1_2);
const SCREEN_UP = new THREE.Vector3().crossVectors(CAM_BACK, SCREEN_RIGHT).negate();
// 平均の地形（行 r のマスの上面）が画面を縦に動く量（1 行あたり）
const ROW_V = (Math.SQRT2 * Math.sin(CAM_ELEVATION * DEG) + Math.cos(CAM_ELEVATION * DEG)) / 2;
const CAM_SPEED = VIEW_SHORT / SCROLL_PERIOD / (2 * ROW_V);   // camK の速さ（マス/秒）
const camTarget = new THREE.Vector3();   // 見る点（世界の座標）
let viewW = 1, viewH = 1;

function updateView() {
  const aspect = innerWidth / innerHeight;
  [viewW, viewH] = aspect >= 1 ? [VIEW_SHORT * aspect, VIEW_SHORT] : [VIEW_SHORT, VIEW_SHORT / aspect];
  Object.assign(camera, { left: -viewW / 2, right: viewW / 2, top: viewH / 2, bottom: -viewH / 2 });
  camera.updateProjectionMatrix();
  // 影を描く範囲（見る点が SHADOW_SLACK だけ動いても、画面に見えている所と、影を落とす柱が収まる大きさ。3 は柱の高さの違いの分）
  const half = Math.hypot(viewW, viewH) / 2 + 3 + SHADOW_SLACK;
  Object.assign(sun.shadow.camera, { left: -half, right: half, top: half, bottom: -half });
  sun.shadow.camera.updateProjectionMatrix();
  shadowAt = null;
}
function updateCamera() {
  camTarget.set(camK + 0.5, -camK - 0.5, camK + 0.5);
  const t = tmpA.copy(camTarget).sub(origin);
  camera.position.copy(t).addScaledVector(CAM_BACK, CAM_DIST);
  camera.lookAt(t);
}
// 影を描き直す（見る点が SHADOW_SLACK より動いたときと、shadowAt を消したとき）。積み木を詰め直したら、そのコマのうちに呼ぶ
let shadowAt = null;   // 影を最後に描いたときの見る点（世界の座標）
function updateShadow() {
  if (shadowAt && camTarget.distanceTo(shadowAt) < SHADOW_SLACK) return;
  shadowAt = camTarget.clone();
  renderer.shadowMap.needsUpdate = true;
  // 影の範囲を見る点へ動かす。影の 1 画素ずつ刻み、描き直しても影の縁が動かないようにする
  const t = tmpA.copy(camTarget).sub(origin);
  const texel = (sun.shadow.camera.right - sun.shadow.camera.left) / shadowMapSize;
  const lx = tmpB.crossVectors(new THREE.Vector3(0, 1, 0), LIGHT_DIR).normalize();
  const ly = new THREE.Vector3().crossVectors(LIGHT_DIR, lx);
  const a = t.dot(lx), b = t.dot(ly);
  const st = t.clone().addScaledVector(lx, Math.round(a / texel) * texel - a).addScaledVector(ly, Math.round(b / texel) * texel - b);
  sun.target.position.copy(st);
  sun.position.copy(st).addScaledVector(LIGHT_DIR, 40);
}
// 点（世界の座標）が画面の中にあるか（margin だけ内側・外側に広げる）
function onScreen(p, margin) {
  const dx = p.x - camTarget.x, dy = p.y - camTarget.y, dz = p.z - camTarget.z;
  const u = dx * SCREEN_RIGHT.x + dz * SCREEN_RIGHT.z;
  const v = dx * SCREEN_UP.x + dy * SCREEN_UP.y + dz * SCREEN_UP.z;
  return Math.abs(u) < viewW / 2 + margin && Math.abs(v) < viewH / 2 + margin;
}
// 画面の上端・下端にかかる行
const rowTop = () => 2 * camK - viewH / 2 / ROW_V;
const rowBottom = () => 2 * camK + viewH / 2 / ROW_V;

// ---- 積み木の更新 ----
// 画面の下の先を作り足し、上の外へ出た所を捨てる
function updateWorld() {
  const bottom = Math.ceil(rowBottom()) + ROW_MARGIN_BOTTOM;
  generate(bottom + ROW_LOOKAHEAD);
  for (let index = Math.floor((rowTop() - ROW_MARGIN_TOP) / CHUNK_ROWS); index * CHUNK_ROWS <= bottom; index++) {
    if (!chunks.has(index) && finalRow > (index + 1) * CHUNK_ROWS + 1) buildChunk(index);
  }
  const discard = rowTop() - ROW_MARGIN_TOP - CHUNK_ROWS;
  if (mascot && rowOf(mascot.i, mascot.j) < rowTop() - MASCOT_EXIT_ROWS) { mascot = null; instancesDirty = true; }
  for (const index of chunks.keys()) {
    if ((index + 1) * CHUNK_ROWS < discard) { chunks.delete(index); instancesDirty = true; }
  }
  for (const [k, c] of cells) if (rowOf(c.i, c.j) < discard - 4) cells.delete(k);
  // 玉の通らない古い区間を捨てる
  for (const path of paths) {
    const first = path.marbles.length ? Math.min(...path.marbles.map((m) => m.seg)) : Infinity;
    while (path.segs.length > 1 && path.segs[0].row < discard && path.base < first) { path.segs.shift(); path.base++; }
  }
  paths = paths.filter((p) => p.active || p.marbles.length || p.segs.some((s) => s.row >= discard));
  if (instancesDirty) rebuildInstances();
}

// 積み木を作る横の範囲（|q|）。画面の幅に BAND_MARGIN を足す
const neededBand = () => Math.ceil((viewW / 2 + BAND_MARGIN) * Math.SQRT2);
// シーンの見た目に切り替える。積み木・飾りの木・マスコットの素材、環境、背景、柱の接する所の陰を、その材質のものにする
const sceneNameEl = document.getElementById('scene-name');
const matTextures = {};
function applyScene(index) {
  sceneIndex = (index + SCENES.length) % SCENES.length;
  mat = SCENES[sceneIndex];
  sceneNameEl.textContent = mat.name;
  const texture = (matTextures[mat.name] ??= mat.makeTexture());
  for (const [material, spec] of [[cubeMaterial, mat], [treeMaterial, { ...mat, ...mat.accent, ...mat.tree }], [mascotMaterial, { ...mat, ...mat.accent, ...mat.mascot }]]) {
    const u = material.userData.uniforms;
    u.blockTex.value = texture;
    u.endGrainDark.value = spec.endGrain;
    u.texScale.value = spec.scale;
    u.invertTex.value = spec.invert ?? 0;
    u.toolMark.value = spec.tool;
    u.shadowEnv.value = spec.shadowEnv ?? 1;
    u.reflectGrad.value = spec.reflectGrad ?? 0;
    u.latheMark.value = spec.lathe ?? 0;
    u.veinContrast.value = spec.veinContrast ?? 1;
    u.texGround.value = spec.texGround ?? 0;
    material.roughness = spec.roughness;
    material.metalness = spec.metalness;
    material.envMapIntensity = spec.env;
  }
  scene.background.setRGB(...mat.rgb.map((c) => (c / 255) ** 2.2 * 0.3));
  contactMaterial.color.setRGB(...mat.contact[0]);
  contactMaterial.opacity = mat.contact[1];
  buildEnvironment(mat.sky, mat.ground, mat.band);
}
// 作り直し: 積み木と経路を作り直し、ビー玉を画面の中の溝に散らして置く。カメラは進み続ける。
// 起動時と、画面が横に広がって作る範囲が足りなくなったとき（シーンはそのまま）にも呼ぶ
function rebuild() {
  for (const m of [...marbles]) removeMarble(m);
  mascot = null;
  cells.clear();
  chunks.clear();
  paths = [];
  bandQ = neededBand();
  const start = Math.floor(rowTop()) - ROW_MARGIN_TOP - CHUNK_ROWS * 2;
  finalRow = start - BACKTRACK - 4;
  lastFillRow = -Infinity;
  // 最初の経路は、画面の上の外の見えないトンネルから出てくる
  for (let q = -bandQ + PATH_SPACING / 2; q < bandQ; q += PATH_SPACING) startTunnelPath(Math.round(q + rand(-1, 1)), start);
  updateCamera();
  updateWorld();
  updateShadow();
  scatterMarbles(Math.round(marbleCount));
}

// シーン（積み木の材質）を替えて、作り直す
function setScene(index) {
  applyScene(index);
  rebuild();
}

function rebase() {
  if (camK - origin.x < REBASE_STEP) return;
  origin.add(new THREE.Vector3(REBASE_STEP, -REBASE_STEP, REBASE_STEP));
  instancesDirty = true;
}

// ---- 隠し要素（マスコット） ----
// 乱数は Math.random と別にする（DEVELOPMENT.md: 既存の乱数を引く順番を変えない）。置くときは、種を Math.random から取り直す。
// three.js も物を作るときに Math.random を引くので、マスコットの形は最初に置くときに作る（pieceMesh が作る）
const mascotRandom = sideRandom();
const mascotInterval = (spec) => randomInterval(spec, mascotRandom);

let mascot = null;                                    // 置いてあれば { key, i, k, j, quat, off, tint }、無ければ null
let mascotWait = mascotInterval(MASCOT_INTERVAL);     // 次に置くまでの秒数

// 画面のすぐ下の外にある、無地の柱の上に置く。積み木といっしょに下から流れ込み、上へ出たら消える
function startMascot() {
  if (mascot || isFading()) return;
  mascotRandom.reseed();
  // 画面の下端の外にある、置ける柱を、段（行）ごとに、横が画面の中央にいちばん近いものだけ集める。
  // 中央から ±1 の柱があれば、それがいちばん近いので第一候補になる。置けるのは、積み木を作ってある段で、横は画面の中に見えるもの
  const rows = new Map();   // 段 → { c, au }
  for (const c of cells.values()) {
    const r = rowOf(c.i, c.j);
    if (c.h == null || !treeAllowedBase(c) || treeAt(c) || !chunks.has(Math.floor(r / CHUNK_ROWS))) continue;
    const p = tmpA.set(c.i + 0.5, c.h, c.j + 0.5).sub(camTarget);
    const u = p.x * SCREEN_RIGHT.x + p.z * SCREEN_RIGHT.z, v = p.dot(SCREEN_UP);   // v は画面の下向きが正（SCREEN_UP は名前と逆に下を向く）
    if (v < viewH / 2 + MASCOT_BELOW || Math.abs(u) > viewW / 2 - MASCOT_SIDE_MARGIN) continue;
    if (!rows.has(r) || Math.abs(u) < rows.get(r).au) rows.set(r, { c, au: Math.abs(u) });
  }
  if (!rows.size) { mascotWait = 0.5; return; }   // 置ける柱が無ければ、少しあとにやり直す
  mascotWait = mascotInterval(MASCOT_INTERVAL);
  // 画面に近い段から順に見て、最初に候補のあった段（可能な限り早く見え始める）に置く
  const c = rows.get(Math.min(...rows.keys())).c;
  mascot = { key: `mascot:${mascotRandom() < 0.5 ? -1 : 1}`, i: c.i, k: c.h - 0.5, j: c.j, quat: blockQuats[8], off: mascotRandom(), tint: mat.mascot.tint };
  instancesDirty = true;
}

// ---- 強度 ----
function setCount(value) {
  marbleCount = clamp(value, MIN_COUNT, MAX_COUNT);
}

// ---- メインループ ----
function step(dt) {
  time += dt;
  camK += CAM_SPEED * dt;
  rebase();
  updateCamera();
  updateWorld();
  updateShadow();
  updateMarbles(dt);
  controlCount();
  if (!mascot) {
    mascotWait -= dt;
    if (mascotWait <= 0) startMascot();   // 暗転している間は出さない（startMascot が何もせず、次のコマにまた試す）
  }
}

let last = performance.now();
let nextDraw = 0;            // 次に描いてよい時刻 (ms)
function tick(now) {
  // MAX_FPS より速くは描かない。描いてよい時刻は一定の間隔で進め、画面の更新の間隔の揺れで 1 回飛ばさないよう少し余裕を持たせる
  if (now < nextDraw - 2) return;
  nextDraw = Math.max(nextDraw + 1000 / MAX_FPS, now);
  // rAF のタイムスタンプは初期の performance.now() より前のことがあるので負にしない
  const dt = Math.max(0, Math.min((now - last) / 1000, 0.1));
  last = now;
  step(dt);
  renderer.setRenderTarget(sceneTarget);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  composer.render();
}

// ---- 入力・UI ----
// 暗転・全画面・カーソルを隠す処理・画面を消さない処理・キーとスワイプ・強度のゲージは common.js
setupControls({
  keys: { KeyC: startMascot },   // 隠し要素のマスコット（操作ガイドには表示しない）
  // シーン切替（Space・左右スワイプ）。暗転している間に、次のシーン（材質）にして作り直す
  changeScene: () => fadeAndRun(() => setScene(sceneIndex + 1)),
  // 強度（↑↓・上下スワイプ）。画面の中のビー玉の数
  intensity: {
    up: () => setCount(marbleCount * COUNT_STEP),
    down: () => setCount(marbleCount / COUNT_STEP),
    level: () => logPosition(marbleCount, MIN_COUNT, MAX_COUNT),   // ゲージの位置（0..1）
  },
  onResize() {
    updateView();
    renderer.setSize(innerWidth, innerHeight);
    updateSceneTargetSize();
    composer.setSize(innerWidth, innerHeight);
    if (neededBand() > bandQ) rebuild();
  },
});

// ---- 開始 ----
updateView();
setScene(randInt(SCENES.length));
renderer.setAnimationLoop(tick);
</script>
</body>
</html>
